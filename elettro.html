xt": "Il coefficiente di accoppiamento k tra due bobine è definito come k=M/√(L1·L2), con 0≤k≤1. Esprime quanto efficacemente il flusso generato da una bobina si concatena con l'altra: k=0 per bobine magneticamente disaccoppiate, k=1 per accoppiamento perfetto (tutto il flusso di una bobina si concatena con l'altra, come idealmente nei trasformatori a nucleo di ferro).", "no_ans": false, "fig_img": null}, {"l": 54, "n": 1, "t": "IN UN TRASFORMATORE MONOFASE IL VALORE EFFICACE DELLA FORZA ELETTROMOTRICE INDOTTA SECONDARIA VALE", "fig": false, "o": ["E2=4,44 N1 f FIMAX", "E' SEMPRE PARI A V2", "E2=4,44 N2 f FIMAX", "E2=-4,44 N2 f FIMAX"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 54, "n": 2, "t": "LA CIFRA DI PERDITA DELLE LAMIERE A CRISTALLI ORIENTATI", "fig": false, "o": ["VALE INTORNO A 100 WATT/KG", "VALE INTORNO A 50 WATT/KG", "VALE INTORNO A 0,5 WATT/KG", "E' PRATICAMENTE PARI A ZERO WATT/KG"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 54, "n": 3, "t": "IN UN TRASFORMATORE IDEALE -1 (k=N1/N2)", "fig": false, "o": ["k=E1/E2", "k=1", "k=I1/I2", "k=E1/E2=I1/I2"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 54, "n": 4, "t": "IN UN TRASFORMATORE IDEALE", "fig": false, "o": ["A1=A2", "A1", "A1>A2", "A1=0"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 54, "n": 5, "t": "IN UN TRASFORMATORE IDEALE SOTTO CARICO", "fig": false, "o": ["IL RENDIMENTO MASSIMO SI HA IN CORRISPONDENZA DEL CARICO PARI AL 75% DEL CARICO NOMINALE", "IL RENDIMENTO NON E' QUANTIFICABILE", "IL RENDIMENTO E' PARI AD UNO", "IL RENDIMENTO E' MINORE DI UNO"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 54, "n": 6, "t": "Trasformatore ideale sotto carico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel trasformatore ideale sotto carico, collegando un'impedenza di carico al secondario, si stabilisce una corrente I2 che, per la legge di Ampere-Hopkinson (nessuna riluttanza, permeabilità infinita), deve essere esattamente compensata dalla corrente primaria secondo N1I1=N2I2. Non essendoci perdite né dispersioni, la potenza si trasferisce integralmente dal primario al secondario: V1I1=V2I2.", "no_ans": false, "fig_img": null}, {"l": 54, "n": 7, "t": "Trasformatore ideale a vuoto", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel trasformatore ideale a vuoto (secondario aperto, I2=0) la corrente primaria è nulla (essendo la riluttanza del nucleo nulla per ipotesi di idealità, non serve corrente magnetizzante), e la tensione secondaria a vuoto vale E2=k·E1 dove k=N2/N1 è il rapporto di trasformazione (o il suo reciproco a seconda della convenzione usata, k=N1/N2).", "no_ans": false, "fig_img": null}, {"l": 54, "n": 8, "t": "Uso del trasformatore negli impianti elettrici", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il trasformatore è largamente usato negli impianti elettrici per elevare la tensione in trasmissione (riducendo le perdite Joule sulle linee a parità di potenza trasmessa) e per abbassarla nei livelli di distribuzione fino agli utilizzatori finali (cabine MT/BT), oltre che per l'isolamento galvanico tra circuiti e per l'alimentazione di strumenti di misura (TA, TV).", "no_ans": false, "fig_img": null}, {"l": 54, "n": 9, "t": "Condizioni di idealità per un trasformatore", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Un trasformatore si considera ideale quando: il nucleo magnetico ha permeabilità infinita (riluttanza nulla, nessuna corrente magnetizzante necessaria), non vi sono perdite nel ferro (isteresi e correnti parassite nulle), non vi sono perdite nel rame (resistenza degli avvolgimenti nulla) e non vi sono flussi dispersi (accoppiamento perfetto, k=1, tutto il flusso è concatenato con entrambi gli avvolgimenti).", "no_ans": false, "fig_img": null}, {"l": 55, "n": 1, "t": "IL RAPPORTO DI TRASFORMAZIONE SI MISURA IN", "fig": false, "o": ["VOLT", "AMPERE", "ADIMENSIONALE", "SPIRE"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 55, "n": 2, "t": "IN UN TRASFORMATORE REALE SOTTO CARICO", "fig": false, "o": ["I1'=I0+I2 (VETTORI)", "I1=I0+I1' (VETTORI)", "I1=k*I0 (VETTORI)", "I1'=I0+I2 (MODULI)"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 55, "n": 3, "t": "IL BILANCIO ENERGETICO DEL TRASFORMATORE REALE SOTTO CARICO SI ESPRIME COME: (P1 POTENZA ASSORBITA, P2 POTENZA EROGATA, PJ PERDITE NEL RAME, PFE PERDITE NEL FERRO)", "fig": false, "o": ["TUTTE FALSE", "PFE+PJ=P2-P1", "P1=P2+PJ+PFE", "P1=0"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 55, "n": 4, "t": "IL RENDIMENTO SI MISURA IN", "fig": false, "o": ["WATT", "CICLI AL SECONDO", "VA", "ADIMENSIONALE"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 55, "n": 5, "t": "Circuito equivalente trasformatore reale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il circuito equivalente del trasformatore reale (ridotto tipicamente al primario) rappresenta: la resistenza R1 e la reattanza di dispersione X1 del primario in serie; il ramo derivato (parallelo) con la resistenza R0 (rappresentativa delle perdite nel ferro) e la reattanza di magnetizzazione X0, percorso dalla corrente a vuoto I0; quindi, tramite il trasformatore ideale di rapporto k, la resistenza R2' e reattanza X2' del secondario riportate al primario, in serie al carico.", "no_ans": false, "fig_img": null}, {"l": 55, "n": 6, "t": "Diagramma vettoriale trasformatore reale sotto carico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il diagramma vettoriale del trasformatore reale sotto carico rappresenta, nel piano complesso, i fasori di E1 (o V1), della corrente magnetizzante I0, della corrente di carico riportata I2', della corrente totale primaria I1=I0+I2', e delle cadute di tensione resistive e reattive sui due avvolgimenti, evidenziando lo sfasamento tra tensione e corrente introdotto dal carico e dalle impedenze interne della macchina.", "no_ans": false, "fig_img": null}, {"l": 55, "n": 7, "t": "Trasformatore ideale sotto carico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel trasformatore ideale sotto carico la corrente secondaria I2, imposta dal carico collegato, induce al primario una corrente I1 tale da mantenere l'equilibrio delle forze magnetomotrici (N1I1=N2I2); tutta la potenza assorbita dal primario viene trasferita al secondario senza perdite, essendo il rendimento unitario.", "no_ans": false, "fig_img": null}, {"l": 55, "n": 8, "t": "Trasformatore reale a vuoto", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il trasformatore reale a vuoto (secondario aperto) assorbe dalla rete una piccola corrente I0 (corrente a vuoto), necessaria a magnetizzare il nucleo e a sostenere le perdite nel ferro; questa corrente è tipicamente il 2-5% della corrente nominale ed è in ritardo di quasi 90° sulla tensione (prevalentemente reattiva/magnetizzante), con una piccola componente attiva a copertura delle perdite nel ferro.", "no_ans": false, "fig_img": null}, {"l": 55, "n": 9, "t": "Bilancio energetico trasformatore reale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il bilancio energetico del trasformatore reale sotto carico si esprime come P1=P2+PJ+PFE, dove P1 è la potenza attiva assorbita dal primario, P2 quella erogata al carico dal secondario, PJ le perdite nel rame (per effetto Joule negli avvolgimenti, variabili con il carico) e PFE le perdite nel ferro (isteresi e correnti parassite nel nucleo, praticamente costanti al variare del carico). Il rendimento è η=P2/P1=P2/(P2+PJ+PFE).", "no_ans": false, "fig_img": null}, {"l": 56, "n": 1, "t": "I TRASFORMATORI DI MISURA VOLTMETRICI", "fig": false, "o": ["NEL NORMALE FUNZIONAMENTO DEVONO AVERE CORRENTI ELEVATE PER AVERE ELEVATE CADUTE DI TENSIONE", "GENERALMENTE SONO ELEVATORI DI TENSIONE", "NEL NORMALE FUNZIONAMENTO DEVONO AVERE CORRENTI TRASCURABILI PER LIMITARE LE CADUTE DI TENSIONE", "DEVONO AVERE RAPPORTO DI TRASFORMAZIONE PARI AD UNO"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 56, "n": 2, "t": "LA TENSIONE DI CORTO CIRCUITO DEL TRASFORMATORE -1", "fig": false, "o": ["DIPENDE DALLA CORRENTE ASSORBITA DAL CARICO", "NON E' POSSIBILE QUANTIFICARLA", "E' DELL'ORDINE DEL 4%-7% DELLA TENSIONE NOMINALE", "E' DELL'ORDINE DEL 30% DELLA TENSIONE NOMINALE"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 56, "n": 3, "t": "DIREMO CHE DUE TRASFORMATORI FORMANO UN PARALLELO PERFETTO QUANDO:", "fig": false, "o": ["OGNUNO FORNISCE META' DELLA POTENZA ASSORBITA DAL CARICO", "NON E' POSSIBILE REALIZZARE UN PARALLELO PERFETTO", "OGNUNO FORNISCE AL CARICO UNA TENSIONE PROPORZIONALE ALLA SUA IMPEDENZA DI CORTO CIRCUITO", "OGNUNO FORNISCE AL CARICO UNA POTENZA PROPORZIONALE ALLA SUA POTENZA NOMINALE"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 56, "n": 4, "t": "LA TENSIONE DI CORTO CIRCUITO DEL TRASFORMATORE -2", "fig": false, "o": ["E' LA TENSIONE DA APPLICARE AL PRIMARIO IN CORTO CIRCUITO IN MODO DA FAR CIRCOLARE LE CORRENTI NOMINALI", "E' LA TENSIONE DA APPLICARE AD UN AVVOLGIMENTO, CON L'ALTRO AVVOLGIMENTO IN CORTO CIRCUITO, IN GRADO DI FAR CIRCOLARE LE CORRENTI NOMINALI", "E' LA TENSIONE NOMINALE DELLA MACCHINA CHE FA CIRCOLARE LE CORRENTI NOMINALI", "VALE SEMPRE ZERO"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 56, "n": 5, "t": "Funzionamento in corto circuito", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La prova in corto circuito di un trasformatore si esegue alimentando un avvolgimento (in genere il primario) a tensione ridotta, con l'altro avvolgimento in corto circuito, regolando la tensione applicata (tensione di corto circuito, tipicamente 4-7% della nominale) fino a far circolare le correnti nominali. Da questa prova si ricavano i parametri serie del circuito equivalente (R e X totali riportate a un avvolgimento) e le perdite nel rame nominali PJn.", "no_ans": false, "fig_img": null}, {"l": 56, "n": 6, "t": "Parallelo di trasformatori monofase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Due trasformatori monofase formano un parallelo perfetto quando hanno lo stesso rapporto di trasformazione e la stessa tensione di corto circuito percentuale (impedenza di corto circuito proporzionale alla potenza nominale): in queste condizioni ciascun trasformatore fornisce al carico comune una potenza esattamente proporzionale alla propria potenza nominale, senza correnti di circolazione parassite tra le macchine.", "no_ans": false, "fig_img": null}, {"l": 56, "n": 7, "t": "Trasformatori di misura voltmetrici", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I trasformatori di misura voltmetrici (TV, o trasformatori di tensione) riducono una tensione elevata a un valore standard (tipicamente 100V) misurabile con voltmetri ordinari, mantenendo l'isolamento galvanico. Nel normale funzionamento devono assorbire correnti trascurabili (funzionano quasi a vuoto) per limitare le cadute di tensione interne e garantire elevata precisione di misura.", "no_ans": false, "fig_img": null}, {"l": 56, "n": 8, "t": "Trasformatori di misura amperometrici", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I trasformatori di misura amperometrici (TA, o trasformatori di corrente) riducono una corrente elevata a un valore standard (tipicamente 5A o 1A) misurabile con amperometri ordinari. A differenza dei TV, funzionano normalmente quasi in corto circuito (bassa impedenza al secondario) e non vanno mai lasciati con secondario aperto sotto carico, per evitare sovratensioni pericolose.", "no_ans": false, "fig_img": null}, {"l": 57, "n": 1, "t": "LA PROVA A VUOTO DI UN TRASFORMATORE DEVE ESSERE ESEGUITA", "fig": false, "o": ["ALIMENTANDO DA ENTRAMBI I LATI ALLA TENSIONE NOMINALE", "ALIMENTANDO DA UN LATO ALLA TENSIONE NOMINALE E MANTENENDO APERTO L'ALTRO LATO", "ALIMENTANDO DA UN LATO ALLA TENSIONE NOMINALE E MANTENENDO IN CORTO CIRCUITO L'ALTRO LATO", "ALIMENTANDO DA UN LATO ALLA TENSIONE DI CORTO CIRCUITO E MANTENENDO APERTO L'ALTRO LATO"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 57, "n": 2, "t": "IN UN TRASFORMATORE TRIFASE CON LE FASI PRIMARIE A STELLA E LE FASI SECONDARIE A STELLA", "fig": false, "o": ["IL RAPPORTO DI TRASFORMAZIONE COINCIDE CON IL RAPPORTO SPIRE DIVISO RADICE QUADRATA DI TRE", "IL RAPPORTO DI TRASFORMAZIONE COINCIDE CON IL RAPPORTO SPIRE", "NON E' QUANTIFICABILE A PRIORI", "IL RAPPORTO DI TRASFORMAZIONE COINCIDE CON IL RAPPORTO SPIRE MOLTIPLICATO RADICE QUADRATA DI TRE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 57, "n": 3, "t": "L'APPARTENENZA AL GRUPPO DI UN TRASFORMATORE 12 SI OTTIENE:", "fig": false, "o": ["NEI COLLEGAMENTI STELLA-STELLA OPPURE TRIANGOLO-TRIANGOLO CON AVVOLGIMENTI AVVOLTI IN VERSO OPPOSTO", "IL GRUPPO 12 NON ESISTE", "NEI COLLEGAMENTI STELLA-TRIANGOLO OPPURE TRIANGOLO-STELLA CON AVVOLGIMENTI AVVOLTI IN VERSO OPPOSTO", "NEI COLLEGAMENTI STELLA-STELLA OPPURE TRIANGOLO-TRIANGOLO CON AVVOLGIMENTI AVVOLTI NELLO STESSO VERSO"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 57, "n": 4, "t": "L'APPARTENENZA DI UN TRASFORMATORE AL GRUPPO ZERO SIGNIFICA:", "fig": false, "o": ["LE TERNE DELLE TENSIONI PRIMARIA E SECONDARIA SONO IN FASE", "TENSIONE E CORRENTE SONO A 90 GRADI", "LE TERNE DELLE TENSIONI PRIMARIA E SECONDARIA SONO SFASATE DI 30'", "LE TERNE DELLE TENSIONI PRIMARIA E SECONDARIA SONO IN OPPOSIZIONE DI FASE"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 57, "n": 5, "t": "Prova in corto circuito di trasformatore trifase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La prova in corto circuito di un trasformatore trifase si esegue in modo analogo al caso monofase, alimentando un lato (a tensione concatenata ridotta) con l'altro lato in corto circuito, fino a far circolare le correnti di linea nominali; si ricavano così la tensione di corto circuito percentuale e le perdite nel rame nominali del trasformatore trifase.", "no_ans": false, "fig_img": null}, {"l": 57, "n": 6, "t": "Prova a vuoto di trasformatore trifase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La prova a vuoto di un trasformatore trifase si esegue alimentando un lato alla tensione nominale concatenata, con l'altro lato aperto; si misurano potenza assorbita a vuoto (pari alle perdite nel ferro, essendo trascurabili quelle nel rame a vuoto), corrente a vuoto e tensione secondaria a vuoto, da cui si ricava anche il rapporto di trasformazione.", "no_ans": false, "fig_img": null}, {"l": 57, "n": 7, "t": "Trasformatori trifase e rapporto di trasformazione", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nei trasformatori trifase il rapporto di trasformazione dipende non solo dal rapporto spire N1/N2 ma anche dal tipo di collegamento degli avvolgimenti (stella o triangolo) su ciascun lato: ad esempio, con collegamento stella-stella il rapporto tra le tensioni concatenate coincide con il rapporto spire; con collegamento stella-triangolo (o viceversa) compare un fattore aggiuntivo √3.", "no_ans": false, "fig_img": null}, {"l": 57, "n": 8, "t": "Gruppi dei trasformatori trifase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I trasformatori trifase si classificano in gruppi orari (0,1,5,6,11...) in base allo sfasamento tra le terne di tensione primaria e secondaria, espresso come multiplo di 30°: il gruppo 0 indica tensioni in fase (collegamenti stella-stella o triangolo-triangolo con avvolgimenti avvolti nello stesso verso), mentre altri gruppi derivano da collegamenti misti stella-triangolo o da diverso verso di avvolgimento.", "no_ans": false, "fig_img": null}, {"l": 60, "n": 1, "t": "I MOTORI ASINCRONI A ROTORE NON AVVOLTO", "fig": false, "o": ["POSSONO ESSERE O A GABBIA OPPURE A DOPPIA GABBIA", "POSSONO ESSERE A GABBIA MA NON A DOPPIA GABBIA", "NON POSSONO ESSERE A GABBIA MA SOLO A DOPPIA GABBIA", "NON ESISTONO"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 60, "n": 2, "t": "NEI MOTORI ASINCRONI CON ROTORE A DOPPIA GABBIA", "fig": false, "o": ["ESISTONO SOLO MOTORI A GABBIA SINGOLA MA NON A DOPPIA GABBIA", "LE DUE SBARRE HANNO SEMPRE LA STESSA SEZIONE", "LA SBARRA ESTERNA HA SEZIONE MINORE RISPETTO A QUELLA INTERNA", "LA SBARRA ESTERNA HA SEZIONE MAGGIORE RISPETTO A QUELLA INTERNA"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 60, "n": 3, "t": "LO SCORRIMENTO s", "fig": false, "o": ["E' LA FRAZIONE DI GIRO PERSA DAL ROTORE PER OGNI GIRO DEL CAMPO MAGNETICO ROTANTE", "E' LA FRAZIONE DI GIRO PERSA DALLO STATORE PER OGNI GIRO DEL ROTORE", "IN ITALIA VALE SEMPRE 3000 GIRI/MINUTO", "E' LA FRAZIONE DI GIRO PERSA DALLO STATORE PER OGNI GIRO DEL CAMPO MAGNETICO ROTANTE"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 60, "n": 4, "t": "IN UN MOTORE ASINCRONO LO SCORRIMENTO s PUO' ASSUMERE I SEGUENTI VALORI", "fig": false, "o": ["s<1 SEMPRE", "s>0 SEMPRE", "0<=s<=1", "-1<=s<=1 MAI"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 60, "n": 5, "t": "LA VELOCITA' DI ROTAZIONE DEL CAMPO MAGNETICO ROTANTE n1 VALE", "fig": false, "o": ["n1=costante=3.000 giri/min", "n1=60*f/scorrimento", "n1=60*f/p", "n1=60*scorrimento/p"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 60, "n": 6, "t": "FREQUENZA DI ALIMENTAZIONE f1 E FREQUENZA DELLE GRANDEZZE ROTORICHE f2", "fig": false, "o": ["f2(s) È INDIPENDENTE DA f1 (DIPENDE SOLO DALLA VELOCITA' DI ROTAZIONE DEL ROTORE)", "f2(s)=s f1", "f2(s)=s f2", "f1(s)=s f2"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 60, "n": 7, "t": "LO SCORRIMENTO SI MISURA IN", "fig": false, "o": ["RAD/SEC", "CICLI AL SECONDO", "ADIMENSIONALE", "GIRI/MIN"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 60, "n": 8, "t": "ALL'INTERNO DEL MOTORE ASINCRONO TRIFASE", "fig": false, "o": ["UN CAMPO MAGNETICO ALTERNATIVO PUO' ESSERE OTTENUTO SOVRAPPONENDO DUE CAMPI MAGNETICI ROTANTI", "ESISTE UN'UNICA RAPPRESENTAZIONE PER UN CAMPO MAGNETICO ALTERNATIVO", "CAMPI MAGNETICI ALTERNATIVI POSSONO ESSERE CREATI SOLO IN LABORATORIO", "TRE BOBINE DISPOSTE A 120 GRADI E ATTRAVERATE DA TRE CORRENTI SFASATE DI 120 GRADI PRODUCONO UN CAMPO MAGNETICO ALTERNATIVO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 60, "n": 9, "t": "LA FREQUENZA DELLE GRANDEZZE ROTORICHE", "fig": false, "o": ["NON COINCIDE MAI CON LA FREQUENZA DELLE GRANDEZZE STATORICHE", "NON DIPENDE DAL VALORE DELLO SCORRIMENTO", "COINCIDE SEMPRE CON LA FREQUENZA DELLE GRANDEZZE STATORICHE", "DIPENDE DAL VALORE DELLO SCORRIMENTO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 60, "n": 10, "t": "Scorrimento e grandezze rotoriche", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Lo scorrimento s è la frazione di giro persa dal rotore rispetto al campo magnetico rotante, s=(n1-n2)/n1, dove n1 è la velocità di sincronismo e n2 la velocità reale del rotore. Le grandezze rotoriche (f.e.m., correnti) hanno frequenza f2=s·f1, proporzionale allo scorrimento: a rotore bloccato (s=1) f2=f1, al sincronismo (s=0) f2=0.", "no_ans": false, "fig_img": null}, {"l": 60, "n": 11, "t": "Circuito equivalente della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il circuito equivalente della macchina asincrona (per fase, riportato allo statore) è analogo a quello del trasformatore: comprende la resistenza e reattanza di dispersione statoriche in serie, il ramo derivato di magnetizzazione (perdite nel ferro e magnetizzazione), e al secondario la resistenza rotorica riportata R2'/s (che include sia le perdite nel rame rotoriche sia la potenza meccanica resa) in serie alla reattanza di dispersione rotorica riportata X2'.", "no_ans": false, "fig_img": null}, {"l": 60, "n": 12, "t": "Principio di funzionamento della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il motore asincrono trifase funziona sulla base del campo magnetico rotante generato dalle correnti statoriche trifasi, che induce (per la legge di Faraday-Lenz) correnti nel circuito rotorico; l'interazione tra queste correnti indotte e il campo rotante produce una coppia motrice che trascina il rotore a una velocità inferiore a quella di sincronismo (da cui il termine 'asincrono'), poiché serve una velocità relativa (scorrimento) per indurre le correnti rotoriche.", "no_ans": false, "fig_img": null}, {"l": 60, "n": 13, "t": "Il campo magnetico rotante", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il campo magnetico rotante è generato da tre avvolgimenti statorici disposti a 120° geometrici, percorsi da correnti trifasi sfasate di 120° elettrici: la sovrapposizione dei tre campi pulsanti produce un campo magnetico risultante di ampiezza costante che ruota nello spazio alla velocità di sincronismo n1=60f/p (p=numero di coppie polari).", "no_ans": false, "fig_img": null}, {"l": 60, "n": 14, "t": "Macchina asincrona aspetti costruttivi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Dal punto di vista costruttivo, il motore asincrono trifase è composto da uno statore fisso, con avvolgimenti trifasi alloggiati in cave, e da un rotore, che può essere a gabbia di scoiattolo (sbarre conduttrici cortocircuitate alle estremità da anelli, robusto ed economico) oppure avvolto (con avvolgimenti trifasi collegati a anelli e spazzole, per consentire l'inserzione di reostati rotorici).", "no_ans": false, "fig_img": null}, {"l": 61, "n": 1, "t": "L'AVVIAMENTO REOSTATICO SI OTTIENE", "fig": false, "o": ["INSERENDO UN REOSTATO TRIFASE IN SERIE ALLE FASI STATORICHE", "INSERENDO UN REOSTATO TRIFASE IN PARALLELO ALLE FASI STATORICHE", "INSERENDO UN REOSTATO TRIFASE IN SERIE ALLE FASI ROTORICHE", "INSERENDO UN REOSTATO TRIFASE IN PARALLELO ALLE FASI ROTORICHE"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 61, "n": 2, "t": "L'AVVIAMENTO STELLA-TRIANGOLO E' UTILIZZATO PER", "fig": false, "o": ["AUMENTARE LA CORRENTE NECESSARIA ALLO SPUNTO", "AUMENTARE LA POTENZA NECESSARIA ALLO SPUNTO", "NON PUO' ESSERE REALIZZATO PRATICAMENTE", "RIDURRE LA CORRENTE ASSORBITA ALLO SPUNTO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 61, "n": 3, "t": "LA COPPIA MASSIMA", "fig": false, "o": ["SI HA QUANDO s=0", "SI HA QUANDO s=1", "NON PUO' ESSERE TRASLATA SULL'ASSE DELLO SCORRIMENTO TRAMITE USO DI RESISTENZE ROTORICHE", "PUO' ESSERE TRASLATA SULL'ASSE DELLO SCORRIMENTO TRAMITE L'USO DI RESISTENZE ROTORICHE"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 61, "n": 4, "t": "LA COPPIA MASSIMA", "fig": false, "o": ["SI HA SEMPRE AL SINCRONISMO ( s=0 )", "E' PROPORZIONALE AL QUADRATO DELLA TENSIONE DI ALIMENTAZIONE", "SI HA SEMPRE ALLO SPUNTO ( s=1 )", "E' INDIPENDENTE DAL VALORE DELLA TENSIONE DI ALIMENTAZIONE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 61, "n": 5, "t": "DEFINIAMO ZONA DI FUNZIONAMENTO STABILE QUELLA IN CUI", "fig": false, "o": ["PER I MOTORI ASINCRONI NON E' DEFINIBILE", "AD UN AUMENTO DELLA COPPIA RESISTENTE CORRISPONDE UN AUMENTO DELLA COPPIA MOTRICE ED UNA DIMINUZIONE DELLA VELOCITA'", "AD UN AUMENTO DELLA COPPIA RESISTENTE CORRISPONDE UN AUMENTO DELLA COPPIA MOTRICE ED UN AUMENTO DELLA VELOCITA'", "IL MOTORE FUNZIONERA' SEMPRE IN CONDIZIONI DI REGIME"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 61, "n": 6, "t": "IN CONDIZIONI NORMALI ALLO SPUNTO", "fig": false, "o": ["LA COPPIA MOTRICE E' MASSIMA", "LA COPPIA MOTRICE E' NULLA", "LA COPPIA MOTRICE NON PUO' ESSERE MODIFICATA", "LA COPPIA MOTRICE NON E' MASSIMA"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 61, "n": 7, "t": "BILANCIO ENERGETICO (PA=POTENZA ASSORBITA, PCU PERDITE NEL RAME, PFE=PERDITER NEL FERRO, PM PERDITE MECCANICHE,PR POTENZA ALL'ASSE)", "fig": false, "o": ["PA=PCU+PFE+PM", "PA=PCU+PFE+PM+PR", "PR=PCU+PFE+PM", "PA+ PR=PCU+PFE+PM"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 61, "n": 8, "t": "POTENZE", "fig": false, "o": ["IL MOTORE ASINCRONO RICEVE POTENZA MECCANICA E RESTITUISCE POTENZA MECCANICA", "IL MOTORE ASINCRONO RICEVE POTENZA ELETTRICA E RESTITUISCE POTENZA ELETTROMAGNETICA", "IL MOTORE ASINCRONO RICEVE POTENZA ELETTRICA E RESTITUISCE POTENZA ELETTRICA", "IL MOTORE ASINCRONO RICEVE POTENZA ELETTRICA E RESTITUISCE POTENZA MECCANICA"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 61, "n": 9, "t": "SINCRONISMO E ROTORE BLOCCATO (n1=VELOCITÀ DI ROTAZIONE c.m.r., n2=VELOCITÀ DI ROTAZIONE DEL ROTORE)", "fig": false, "o": ["n2=0 E n2= n1", "n2=n1 E n2=0", "PUO' ESSERE REALIZZATO SOLO IL SINCRONISMO", "SONO CONDIZIONI DI FUNZIONAMENTO IRREALIZZABILI"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 61, "n": 10, "t": "ROTORE BLOCCATO E FORZE ELETTROMOTRICI", "fig": false, "o": ["A ROTORE BLOCCATO LE FORZE ELETTROMOTRICI ROTORICHE SONO MASSIME", "LA CONDIZIONE DI FUNZIONAMENTO A ROTORE BLOCCATO NON SI REALIZZA MAI", "A ROTORE BLOCCATO IL ROTORE COMPIE 3000 GIRI/MINUTO (SE f=50 Hz)", "A ROTORE BLOCCATO LE FORZE ELETTROMOTRICI ROTORICHE SONO NULLE"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 61, "n": 11, "t": "Fuonzionamento a vuoto della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel funzionamento a vuoto della macchina asincrona (albero non caricato meccanicamente, scorrimento molto piccolo) il motore assorbe una corrente prevalentemente reattiva (magnetizzante) più una piccola componente attiva a copertura delle perdite nel ferro e meccaniche (attrito e ventilazione); la velocità è prossima al sincronismo.", "no_ans": false, "fig_img": null}, {"l": 61, "n": 12, "t": "Funzionamento a rotore bloccato della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel funzionamento a rotore bloccato (s=1, rotore fermo) la macchina asincrona si comporta come un trasformatore in corto circuito: le grandezze rotoriche hanno frequenza pari a quella statorica (f2=f1), e la corrente assorbita è elevata (corrente di spunto), tipicamente 5-7 volte la corrente nominale, motivo per cui si adottano sistemi di avviamento per limitarla.", "no_ans": false, "fig_img": null}, {"l": 61, "n": 13, "t": "Bilancio energetico della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il bilancio energetico della macchina asincrona è PA=PCU+PFE+PM+PR, dove PA è la potenza elettrica assorbita dalla rete, PCU le perdite per effetto Joule negli avvolgimenti (statorici e rotorici), PFE le perdite nel ferro, PM le perdite meccaniche (attrito e ventilazione) e PR la potenza meccanica resa disponibile all'albero. Il rendimento è η=PR/PA.", "no_ans": false, "fig_img": null}, {"l": 62, "n": 1, "t": "LA REGOLAZIONE DELLA VELOCITA' DI ROTAZIONE DEI MOTORI ASINCRONI TRIFASE", "fig": false, "o": ["PUO' ESSERE OTTENUTA SOLAMENTE VARIANDO LA FREQUENZA DI ALIMENTAZIONE", "NON E' POSSIBILE", "PUO' ESSERE OTTENUTA SOLAMENTE VARIANDO LE COPPIE POLARI", "PUO' ESSERE OTTENUTA VARIANDO LA FREQUENZA DI ALIMENTAZIONE E LE COPPIE POLARI"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 62, "n": 2, "t": "LA REGOLAZIONE DELLA VELOCITA' DI ROTAZIONE DEI MOTORI ASINCRONI TRIFASE OTTENUTA VARIANDO IL NUMERO DI COPPIE POLARI", "fig": false, "o": ["E' POSSIBILE SOLO PER LE MACCHINE CON ROTORE A GABBIA", "NON E' POSSIBILE", "SI OTTIENE INSERENDO UN REOSTATO SULLE FASI ROTORICHE", "E' POSSIBILE SOLO PER LE MACCHINE CON ROTORE AVVOLTO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 62, "n": 3, "t": "LA PERMEABILITA' MAGNETICA RELATIVA SI MISURA IN", "fig": false, "o": ["HENRY*METRO", "WEBER", "HENRY/METRO", "ADIMENSIONALE"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 62, "n": 4, "t": "Sistemi di avviamento della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I principali sistemi di avviamento del motore asincrono, adottati per ridurre l'elevata corrente di spunto, sono: l'avviamento diretto (solo per piccole potenze), l'avviamento stella-triangolo (riduce la tensione di fase, e quindi la corrente, di un fattore √3 in fase di spunto), l'avviamento con autotrasformatore, l'avviamento reostatico (per rotore avvolto, inserendo resistenze in serie alle fasi rotoriche) e, nei sistemi moderni, l'avviamento con inverter (soft starter o variatore di frequenza).", "no_ans": false, "fig_img": null}, {"l": 62, "n": 5, "t": "Caratteristica meccanica della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La caratteristica meccanica del motore asincrono è la curva coppia-velocità (o coppia-scorrimento) C=f(n) [o C=f(s)]: parte da un valore di coppia allo spunto (s=1), cresce fino a un massimo (coppia massima, in corrispondenza di uno scorrimento critico) per poi decrescere fino ad annullarsi al sincronismo (s=0). Il punto di funzionamento normale si trova nel tratto stabile della curva, tra la coppia massima e il sincronismo.", "no_ans": false, "fig_img": null}, {"l": 62, "n": 6, "t": "Regolazione della velocità della macchina asincrona", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La regolazione della velocità dei motori asincroni trifase si ottiene principalmente in due modi: variando la frequenza di alimentazione f1 (n1=60f1/p, tramite inverter, metodo oggi più diffuso perché consente regolazione continua ed efficiente) oppure variando il numero di coppie polari p (per motori a poli commutabili, con variazione a gradini discreti).", "no_ans": false, "fig_img": null}, {"l": 63, "n": 1, "t": "NEL SISTEMA TN", "fig": false, "o": ["IL NEUTRO E' MESSO A TERRA IN CABINA, LE MASSE NON SONO CONNESSE AL CONDUTTORE DI PROTEZIONE", "IL NEUTRO E' MESSO A TERRA IN CABINA, LE MASSE SONO CONNESSE AL CONDUTTORE DI PROTEZIONE", "IL NEUTRO E' MESSO A TERRA IN CABINA, LE MASSE SONO CONNESSE A TERRA PRESSO L'UTENZA", "IL NEUTRO NON E' MESSO A TERRA IN CABINA, LE MASSE SONO CONNESSE AL CONDUTTORE DI PROTEZIONE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 63, "n": 2, "t": "I GENERATORI SINCRONI DELLE CENTRALI DI GENERAZIONE GENERANO A TENSIONE", "fig": false, "o": ["DELL'ORDINE DEI 10-15 MV", "ALLA TENSIONE CONCATENATA DI 380 V", "DELL'ORDINE DEI 10-15 kV", "DELL'ORDINE DEL kV"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 63, "n": 3, "t": "LA CARATTERISTICA TENSIONE CORRENTE DI UNA CELLA FOTOVOLTAICA", "fig": false, "o": ["VARIA SOLO CON IL VARIARE DELL'IRRAGGIAMENTO", "VARIA CON LA TEMPERATURA E CON L'IRRAGGIAMENTO SOLARE", "VARIA SOLO CON IL VARIARE DELLA TEMPERATURA", "E' INDIPENDENTE DALLA TEMPERATURA E DALL'IRRAGGIAMENTO"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 63, "n": 4, "t": "PER UNA CELLA FOTOVOLTAICA ALL'AUMENTARE DELL'IRRAGGIAMENTO SOLARE", "fig": false, "o": ["NON SI HA ALCUNA CONSEGUENZA SULLA CARATTERISTICA TENSIONE CORRENTE DELLA CELLA", "LA CORRENTE Icc RIMANE COSTANTE", "LA TENSIONE A VUOTO V0 VARIA BRUSCAMENTE", "LA CORRENTE Icc AUMENTA"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 63, "n": 5, "t": "PER UNA CELLA FOTOVOLTAICA ALL'AUMENTARE DELLA TEMPERATURA", "fig": false, "o": ["LA TENSIONE NON DIPENDE DALLA TEMPERATURA", "LA TENSIONE A VUOTO V0 RIMANE COSTANTE", "DECRESCE LA TENSIONE A VUOTO V0", "CRESCE LA TENSIONE A VUOTO V0"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 63, "n": 6, "t": "NEL SISTEMA TT", "fig": false, "o": ["IL NEUTRO E' MESSO A TERRA IN CABINA, LE MASSE NON SONO MESSE A TERRA PRESSO L'UTENZA", "IL NEUTRO NON E' MESSO A TERRA IN CABINA, LE MASSE NON SONO MESSE A TERRA PRESSO L'UTENZA", "IL NEUTRO E' MESSO A TERRA IN CABINA, LE MASSE SONO MESSE A TERRA PRESSO L'UTENZA", "IL NEUTRO NON E' MESSO A TERRA IN CABINA, LE MASSE SONO MESSE A TERRA PRESSO L'UTENZA"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 63, "n": 7, "t": "IL DIAGRAMMA DI CARICO RAPPRESENTA PER UN DETERMINATO UTILIZZATORE", "fig": false, "o": ["LA POTENZA ASSORBITA DAL CARICO IN UN DATO ISTANTE", "LA CORRENTE ASSORBITA IN FUNZIONE DEL TEMPO", "LA POTENZA ASSORBITA IN FUNZIONE DELLA CORRENTE", "LA POTENZA ASSORBITA IN FUNZIONE DEL TEMPO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 63, "n": 8, "t": "Generatore sincrono", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il generatore sincrono (alternatore) è la macchina elettrica rotante che trasforma potenza meccanica in potenza elettrica nelle centrali di produzione: un rotore alimentato in corrente continua (eccitazione) genera un campo magnetico che, trascinato in rotazione da un motore primo (turbina), induce nello statore trifase una terna di f.e.m. sinusoidali con frequenza f=n·p/60, sincrona (a differenza del motore asincrono) con la velocità di rotazione.", "no_ans": false, "fig_img": null}, {"l": 63, "n": 9, "t": "La cella fotovoltaica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La cella fotovoltaica è un dispositivo a semiconduttore (tipicamente silicio) che converte direttamente l'energia della radiazione solare in energia elettrica per effetto fotovoltaico. La sua caratteristica tensione-corrente varia sia con l'irraggiamento solare (la corrente di corto circuito Icc cresce all'aumentare dell'irraggiamento) sia con la temperatura (la tensione a vuoto V0 decresce all'aumentare della temperatura).", "no_ans": false, "fig_img": null}, {"l": 63, "n": 10, "t": "Fonti energetiche", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le fonti energetiche si distinguono in fonti non rinnovabili (combustibili fossili come carbone, petrolio, gas naturale, e nucleare), destinate a esaurirsi e con impatto ambientale significativo, e fonti rinnovabili (solare, eolica, idroelettrica, geotermica, biomasse), che si rigenerano naturalmente e sono alla base della transizione energetica verso sistemi a minor impatto ambientale.", "no_ans": false, "fig_img": null}, {"l": 63, "n": 11, "t": "Impianti fotovoltaici moduli-stringhe-campi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Un impianto fotovoltaico è organizzato gerarchicamente: più celle fotovoltaiche collegate in serie formano un modulo (pannello); più moduli collegati in serie formano una stringa (per raggiungere la tensione desiderata); più stringhe collegate in parallelo formano un campo fotovoltaico (per raggiungere la potenza/corrente desiderata), che alimenta l'inverter di conversione DC/AC verso la rete.", "no_ans": false, "fig_img": null}, {"l": 63, "n": 12, "t": "Impianti eolici", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Gli impianti eolici convertono l'energia cinetica del vento in energia elettrica tramite aerogeneratori: le pale, mosse dal vento, azionano un generatore elettrico (spesso sincrono a magneti permanenti o asincrono) attraverso un rotore, tipicamente tramite un moltiplicatore di giri; la potenza estraibile dipende dal cubo della velocità del vento e dall'area spazzata dalle pale.", "no_ans": false, "fig_img": null}, {"l": 63, "n": 13, "t": "Classificazione dei sistemi elettrici n base alla tensione", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I sistemi elettrici si classificano in base alla tensione nominale in: bassissima tensione (BBT, ≤50V in c.a.), bassa tensione (BT, tra 50V e 1000V in c.a.), media tensione (MT, tra 1kV e 35kV) e alta tensione (AT, oltre 35kV), secondo la normativa CEI. Questa classificazione determina i criteri di progettazione e le misure di protezione da adottare.", "no_ans": false, "fig_img": null}, {"l": 63, "n": 14, "t": "Classificazione dei sistemi elettrici in base allo stato del neutro e delle masse", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I sistemi elettrici si classificano, in base allo stato del neutro e delle masse, nei sistemi TT (neutro a terra in cabina, masse dell'utenza a terra tramite un proprio impianto di terra locale), TN (neutro a terra in cabina, masse collegate al conduttore di protezione PE che fa capo alla stessa terra del neutro) e IT (neutro isolato o collegato a terra tramite un'impedenza elevata, masse a terra localmente).", "no_ans": false, "fig_img": null}, {"l": 64, "n": 1, "t": "AL CONDUTTORE DI PROTEZIONE (PE)", "fig": false, "o": ["VANNO COLLEGATE TUTTE LE PARTI METALLICHE DELL'IMPIANTO", "ORAMAI IN DISUSO E' SOSTITUITO DAL CONDUTTORE DI TERRA", "NON E' NECESSARIO COLLEGARE LE MASSE", "VANNO COLLEGATE TUTTE LE MASSE"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 64, "n": 2, "t": "LA PERICOLOSITA' DEL PASSAGGIO DI CORRENTE ALL'INTERNO DEL CORPO UMANO DIPENDE", "fig": false, "o": ["SOLO DAL PERCORSO SEGUITO ALL'INTERNO DEL CORPO", "SOLO DALLA FREQUENZA E DALLA TENSIONE", "SOLO DALLA FREQUENZA", "ANCHE DALLA FREQUENZA"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 64, "n": 3, "t": "DEFINIAMO MASSA DI UN UTILIZZATORE COME:", "fig": false, "o": ["PARTE CONDUTTRICE NORMALMENTE NON IN TENSIONE CHE POTREBBE DIVENTARLO A CAUSA DI UN DIFETTO DI ISOLAMENTO", "PARTE CONDUTTRICE NORMALMENTE IN TENSIONE CHE POTREBBE DIVENTARE PERICOLOSA A CAUSA DI UN DIFETTO DI ISOLAMENTO", "PARTE METALLICA CHE NON DEVE ESSERE MAI COLLEGATA ALL'IMPIANTO DI TERRA", "QUALSIASI PARTE METALLICA NELLE VICINANZE DELL'UTILIZZATORE"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 64, "n": 4, "t": "NEL RELE' DIFFERENZIALE", "fig": false, "o": ["QUANDO SI TOCCA LA MASSA IN TENSIONE UNA BOBINA APRE IL CIRCUITO", "UNA BOBINA APRE IL CIRCUITO DI ALIMENTAZIONE A SEGUITO DI UNA CORRENTE DI DISPERSIONE Id", "L'APERTURA DEL CIRCUITO SI HA A SEGUITO DI UNA SOVRACORRENTE", "UNA BOBINA APRE IL CIRCUITO DI ALIMENTAZIONE A SEGUITO DI UNA CORRENTE SULLA FASE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 64, "n": 5, "t": "Protezione per separazione elettrica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La protezione per separazione elettrica consiste nell'alimentare l'utilizzatore tramite un trasformatore di isolamento, che separa galvanicamente il circuito dalla rete e dal sistema di terra: in caso di guasto verso massa, non si richiude un percorso di corrente pericoloso verso terra, perché il circuito secondario è isolato (a patto di alimentare un solo utilizzatore per trasformatore).", "no_ans": false, "fig_img": null}, {"l": 64, "n": 6, "t": "Effetti fisiopatologici della corrente elettrica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il passaggio di corrente elettrica nel corpo umano può provocare diversi effetti fisiopatologici in funzione dell'intensità e della durata: percezione (soglia di qualche mA), tetanizzazione muscolare, arresto della respirazione, fibrillazione ventricolare (la più pericolosa, potenzialmente letale, per correnti dell'ordine delle decine di mA che attraversano il torace per tempi sufficienti) e ustioni. La pericolosità dipende anche dal percorso della corrente nel corpo e, in misura minore, dalla frequenza.", "no_ans": false, "fig_img": null}, {"l": 64, "n": 7, "t": "Contatti diretti e indiretti", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il contatto diretto si verifica quando una persona tocca una parte normalmente in tensione (ad esempio un conduttore attivo scoperto); il contatto indiretto si verifica quando una persona tocca una massa (parte metallica normalmente non in tensione) che è accidentalmente andata in tensione a causa di un guasto di isolamento. Le misure di protezione sono diverse per i due casi (isolamento e involucri per i contatti diretti; interruzione automatica del circuito, doppio isolamento o separazione elettrica per gli indiretti).", "no_ans": false, "fig_img": null}, {"l": 64, "n": 8, "t": "Protezione dai contatti inndiretti tramnità Relè differenziale e impianto di terra", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La protezione dai contatti indiretti si realizza tipicamente collegando le masse all'impianto di terra e installando un interruttore differenziale (relè differenziale): quest'ultimo rileva la corrente di dispersione verso terra Id (squilibrio tra corrente entrante e uscente nel circuito) e apre automaticamente il circuito quando Id supera la soglia di intervento, in un tempo sufficientemente breve da evitare la fibrillazione.", "no_ans": false, "fig_img": null}, {"l": 64, "n": 9, "t": "Componenti di classe II (doppio isolamento)", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I componenti di classe II (a doppio isolamento) sono dotati, oltre al normale isolamento funzionale, di un isolamento supplementare che rende praticamente impossibile un guasto verso le parti accessibili: non necessitano quindi del collegamento a terra come misura di protezione, poiché anche in caso di cedimento dell'isolamento principale resta l'isolamento supplementare a impedire che le parti accessibili vadano in tensione.", "no_ans": false, "fig_img": null}, {"l": 64, "n": 10, "t": "Impianto di terra", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "L'impianto di terra è l'insieme dei componenti (dispersore, conduttore di terra, collettore di terra, conduttori di protezione PE) che collegano elettricamente le masse dell'impianto al terreno, garantendo un basso valore di resistenza di terra. È un elemento fondamentale della protezione dai contatti indiretti, spesso in combinazione con l'interruttore differenziale, poiché limita la tensione di contatto in caso di guasto.", "no_ans": false, "fig_img": null}, {"l": 65, "n": 1, "t": "NELLE LINEE ELETTRICHE", "fig": false, "o": ["SI HANNO SOLO PERDITE DI POTENZA", "LA TENSIONE IN PARTENZA E LA TENSIONE IN ARRIVO SONO SEMPRE IN FASE", "SI HANNO SIA CADUTE DI TENSIONE SIA PERDITE DI POTENZA", "SI HANNO SOLO CADUTE DI TENSIONE"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 65, "n": 2, "t": "Trasmissione e distribuzione", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La trasmissione dell'energia elettrica avviene in alta/altissima tensione tramite linee aeree o in cavo dalle centrali di produzione alle stazioni primarie, per minimizzare le perdite Joule sulle lunghe distanze (a parità di potenza, minore corrente a tensione più alta); la distribuzione avviene poi a media e bassa tensione, tramite cabine di trasformazione MT/BT, fino agli utenti finali. Nelle linee si verificano sia cadute di tensione (dovute all'impedenza longitudinale) sia perdite di potenza per effetto Joule.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 1, "t": "NEL DIMENSIONAMENTO DI UNA LINEA DEVE ESSERE (Ib CARICO-In INTERRUTTORE- Iz LINEA)", "fig": false, "o": ["Ib<=In<=Iz", "Ib<=Iz<=In", "In<=Ib<=Iz", "Ib<=In>=Iz"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 66, "n": 2, "t": "IL RELE' TERMICO E' UTILIZZATO PER", "fig": false, "o": ["PROTEGGERE LE LINEE DAL SOVRACCARICO", "PROTEGGERE LE PERSONE DAI CONTATTI INDIRETTI", "NON SI USA MAI IN MEDIA TENSIONE", "PROTEGGERE LE LINEE DAL CORTO CIRCUITO"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 66, "n": 3, "t": "NELLA DETERMINAZIONE DEL CARICO CONVENZIONALE", "fig": false, "o": ["NON E' NECESSARIO CONSIDERARE I COEFFICIENTI DI UTILIZZAZIONE E DI CONTEMPORANEITA'", "E' NECESSARIO CONSIDERARE I COEFFICIENTI DI UTILIZZAZIONE E DI CONTEMPORANEITA'", "E' NECESSARIO CONSIDERARE SOLO IL COEFFICIENTE DI CONTEMPORANEITA'", "E' NECESSARIO CONSIDERARE SOLO IL COEFFICIENTE DI UTILIZZAZIONE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 66, "n": 4, "t": "PER PROTEGGERE UN CAVO DAL CORTO CIRCUITO", "fig": false, "o": ["L'ENERGIA PASSANTE DEVE ESSERE MINORE DELL'ENERGIA SOPPORTATA DAL CAVO (K2S2)", "E' NECESSARIO INSTALLARE UN INTERRUTTORE DIFFERENZIALE ALL'INIZIO DELLA LINEA", "NON E' NECESSARIO PROTEGGERE DAI CORTO CIRCUITI I CAVI", "L'ENERGIA PASSANTE DEVE ESSERE MAGGIORE DELL'ENERGIA SOPPORTATA DAL CAVO (K2S2)"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 66, "n": 5, "t": "LA PORTATA DEI CAVI (IZ)", "fig": false, "o": ["NON DIPENDE DALLA TEMPERATURA DI POSA", "IN ALCUNI CASI DIPENDE DAL MATERIALE ISOLANTE USATO", "DIPENDE, TRA LE ALTRE COSE, DALLA TEMPERATURA DI POSA", "NON DIPENDE DAL TIPO DI POSA"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 66, "n": 6, "t": "IL RELE' MAGNETICO E' UTILIZZATO PER", "fig": false, "o": ["PROTEGGERE LE LINEE DAL SOVRACCARICO", "PROTEGGERE LE PERSONE DAI CONTATTI INDIRETTI", "PROTEGGERE LE LINEE DAL CORTO CIRCUITO", "NON SI USA MAI IN BASSA TENSIONE"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 66, "n": 7, "t": "Fusibili", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il fusibile è un dispositivo di protezione contenente un elemento conduttore che fonde per effetto Joule quando la corrente supera un valore prefissato per un tempo sufficiente, interrompendo il circuito. È economico e affidabile per la protezione dal corto circuito, ma non rilevabile a distanza e non richiudibile (va sostituito dopo l'intervento).", "no_ans": false, "fig_img": null}, {"l": 66, "n": 8, "t": "Portata dei cavi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La portata di un cavo (Iz) è il massimo valore di corrente che il cavo può sopportare in servizio continuo senza superare la temperatura massima ammissibile per l'isolante. Dipende dalla sezione del conduttore, dal tipo di isolante, dal tipo di posa e dalla temperatura ambiente (con opportuni coefficienti di correzione).", "no_ans": false, "fig_img": null}, {"l": 66, "n": 9, "t": "Carico convenzionale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il carico convenzionale di un impianto è la potenza (o corrente) di progetto utilizzata per dimensionare la linea, ottenuta applicando alla somma delle potenze installate opportuni coefficienti di utilizzazione (che tengono conto che non tutti gli utilizzatori funzionano sempre alla potenza nominale) e di contemporaneità (che tengono conto che non tutti i carichi sono in funzione contemporaneamente).", "no_ans": false, "fig_img": null}, {"l": 66, "n": 10, "t": "Protezione dal corto circuito dei cavi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La protezione dal corto circuito dei cavi si realizza verificando che, per qualsiasi corrente di guasto tra la corrente nominale e quella di corto circuito presunta, l'energia specifica passante attraverso il dispositivo di protezione (I²t) sia minore dell'energia specifica sopportabile dal cavo (K²S²), dove K è una costante che dipende dal materiale e S la sezione del cavo.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 11, "t": "Relè magneto-termico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il relè magneto-termico è un dispositivo di protezione che combina due funzioni in un unico interruttore automatico: la protezione termica (bimetallo, per il sovraccarico, con intervento a tempo inverso) e la protezione magnetica (elettromagnete, per il corto circuito, con intervento istantaneo), garantendo così protezione sia dalle sovracorrenti moderate e prolungate sia dalle sovracorrenti elevate e improvvise.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 12, "t": "Relè magnetico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il relè magnetico è l'elemento di protezione, basato su un elettromagnete, che interviene istantaneamente (senza ritardo intenzionale) quando la corrente supera una soglia elevata prefissata, tipica delle correnti di corto circuito: la forza elettromagnetica generata dalla sovracorrente provoca l'apertura immediata del circuito.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 13, "t": "Relè termico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il relè termico è l'elemento di protezione, basato su una lamina bimetallica che si deforma per effetto Joule, che interviene con un ritardo inversamente proporzionale all'entità della sovracorrente (curva a tempo inverso), tipico delle protezioni dal sovraccarico prolungato ma moderato, riproducendo l'andamento del riscaldamento del cavo o del motore da proteggere.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 14, "t": "Sovracorrente e corto circuito", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La sovracorrente è qualsiasi corrente che superi il valore nominale di un componente dell'impianto, e si distingue in sovraccarico (sovracorrente moderata, dovuta a un eccesso di carico, in un circuito elettricamente integro) e corto circuito (sovracorrente elevata, dovuta a un guasto di isolamento tra conduttori a potenziale diverso, con impedenza di guasto molto bassa).", "no_ans": false, "fig_img": null}, {"l": 66, "n": 15, "t": "Classificazione dei cavi BT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I cavi in bassa tensione si classificano in base alla tensione nominale di isolamento (es. 450/750V o 0,6/1kV), al tipo di isolante (PVC, gomma etilenpropilenica EPR, ecc.), alla presenza o meno di guaina e schermatura, e al comportamento al fuoco (cavi non propaganti l'incendio, a ridotta emissione di gas tossici FG7, ecc.), secondo le norme CEI-UNEL.", "no_ans": false, "fig_img": null}, {"l": 66, "n": 16, "t": "Protezione dei cavi dal sovraccarico", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La protezione dei cavi dal sovraccarico si realizza scegliendo un dispositivo di protezione (interruttore magnetotermico) con corrente nominale In compresa tra la corrente di impiego del carico Ib e la portata del cavo Iz (Ib≤In≤Iz), e verificando che la corrente convenzionale di funzionamento If del dispositivo non superi 1,45 volte la portata Iz del cavo.", "no_ans": false, "fig_img": null}, {"l": 67, "n": 1, "t": "Schema elettrico di cabina MT/BT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Lo schema elettrico di una cabina MT/BT comprende, tipicamente: lo scomparto di arrivo/consegna in MT, lo scomparto con interruttore/sezionatore generale MT, il trasformatore MT/BT, e il quadro di distribuzione in BT verso le utenze; sono presenti inoltre gli impianti di terra, i sistemi di protezione (fusibili, relè) e le apparecchiature di manovra e sezionamento su entrambi i lati.", "no_ans": false, "fig_img": null}, {"l": 67, "n": 2, "t": "Quadri elettrici BT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I quadri elettrici in bassa tensione (BT) sono involucri contenenti le apparecchiature di manovra, comando, misura e protezione (interruttori automatici, sezionatori, strumenti di misura) necessarie per distribuire l'energia dal trasformatore alle varie utenze o linee, garantendo la selettività delle protezioni e la sicurezza degli operatori.", "no_ans": false, "fig_img": null}, {"l": 67, "n": 3, "t": "Quadri elettrici e apparecchiature MT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I quadri e le apparecchiature in media tensione (MT) comprendono scomparti con sezionatori, interruttori di manovra-sezionatore, interruttori automatici con protezioni dedicate (relè di massima corrente, protezione di terra) e trasformatori di misura (TA e TV), progettati per garantire la sicurezza di esercizio e manutenzione a tensioni più elevate rispetto alla BT.", "no_ans": false, "fig_img": null}, {"l": 67, "n": 4, "t": "Impianto di terra per cabine MT/BT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "L'impianto di terra di una cabina MT/BT deve garantire la sicurezza sia in condizioni di guasto MT (dispersione di correnti di guasto a terra elevate) sia BT, dimensionando il dispersore e la rete di terra in modo che le tensioni di passo e di contatto restino entro i limiti di sicurezza anche nelle condizioni di guasto più gravose.", "no_ans": false, "fig_img": null}, {"l": 67, "n": 5, "t": "Cabine MT/BT", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le cabine MT/BT sono gli impianti che effettuano la trasformazione dalla media alla bassa tensione per l'alimentazione delle utenze finali; possono essere di proprietà del distributore (cabine pubbliche) o dell'utente (cabine private/utente), e comprendono gli scomparti di consegna, misura, trasformazione e distribuzione BT, oltre agli impianti di terra e protezione.", "no_ans": false, "fig_img": null}, {"l": 68, "n": 1, "t": "IL RIFASAMENTO DEI TRASFORMATORI MT/BT", "fig": false, "o": ["NON E' NECESSARIO IN QUANTO I TRASFORMATORI NON ASSORBONO POTENZA REATTIVA", "E' NECESSARIO IN QUANTO I TRASFORMATORI ASSORBONO UNA POTENZA REATTIVA", "IL CONDENSATORE DI RIFASAMENTO DEVE ESSERE ALTERNATIVAMENTE COLLEGATO-SCOLLEGATO", "IL RIFASAMENTO E' DANNOSO IN QUANTO FA AUMENTARE LA POTENZA REATTIVA CAPACITIVA ASSORBITA"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 68, "n": 2, "t": "NELLE CENTRALINE DI RIFASAMENTO AUTOMATICO", "fig": false, "o": ["LA POTENZA REATTIVA RIMANE COSTANTE", "LA POTENZA ATTIVA COINCIDE CON QUELLA ASSORBITA DAL CARICO", "LA POTENZA REATTIVA VALE CIRCA ZERO", "LA POTENZA REATTIVA ?INSEGUE? QUELLA DEL CARICO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 68, "n": 3, "t": "Posa dei cavi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La posa dei cavi può avvenire in diversi modi (interrata, in tubazione, su passerella, in cunicolo, aerea) secondo le condizioni ambientali e impiantistiche: il tipo di posa influisce sulla portata del cavo (attraverso il coefficiente di smaltimento del calore) e deve rispettare le prescrizioni normative su distanze, protezione meccanica e raggi di curvatura minimi.", "no_ans": false, "fig_img": null}, {"l": 68, "n": 4, "t": "Blindosbarre", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le blindosbarre (o condotti sbarre) sono sistemi di distribuzione dell'energia elettrica in bassa tensione costituiti da conduttori (sbarre) racchiusi in un involucro metallico modulare, utilizzati in alternativa ai cavi per il trasporto di correnti elevate su brevi-medie distanze (ad esempio nei collegamenti trasformatore-quadro generale), offrendo maggiore portata, flessibilità di derivazione e minore ingombro rispetto a cavi paralleli multipli.", "no_ans": false, "fig_img": null}, {"l": 68, "n": 5, "t": "Rifasamento dei trasformatori", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il rifasamento dei trasformatori MT/BT è necessario perché anche a vuoto un trasformatore assorbe dalla rete una potenza reattiva di magnetizzazione (corrente magnetizzante in ritardo di quasi 90°); nelle centraline di rifasamento automatico, la batteria di condensatori inserita insegue dinamicamente la potenza reattiva richiesta dal carico (tramite regolatore automatico che inserisce/disinserisce gradini di condensatori), mantenendo il fattore di potenza entro i limiti desiderati indipendentemente dalle variazioni di carico.", "no_ans": false, "fig_img": null}];

var filter='all', lesson=null;
var lc={};
Q.forEach(function(q){ lc[q.l]=(lc[q.l]||0)+1; });

function buildSB(){
  var sb=document.getElementById('sb');
  var h='<button class="lb active" id="lb-all" onclick="setL(null)"><span class="ln">&#128218;</span><span class="lname">Tutte le lezioni</span><span class="lc">'+Q.length+'</span></button>';
  var ll=[];
  Q.forEach(function(q){if(ll.indexOf(q.l)<0)ll.push(q.l);});
  ll.sort(function(a,b){return a-b;});
  ll.forEach(function(l){
    var n=l<10?'00'+l:(l<100?'0'+l:''+l);
    h+='<button class="lb" id="lb-'+l+'" onclick="setL('+l+')"><span class="ln">L'+n+'</span><span class="lname">'+(LN[l]||'L'+l)+'</span><span class="lc">'+(lc[l]||0)+'</span></button>';
  });
  sb.innerHTML=h;
}

function setL(l){
  lesson=l;
  document.querySelectorAll('.lb').forEach(function(b){b.classList.remove('active');});
  var t=document.getElementById(l?'lb-'+l:'lb-all');
  if(t)t.classList.add('active');
  render();
}

function setF(f,btn){
  filter=f;
  document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function getFilt(){
  var t=document.getElementById('search').value.toLowerCase().trim();
  return Q.filter(function(q){
    if(lesson&&q.l!==lesson)return false;
    if(filter==='mc'&&q.is_open)return false;
    if(filter==='open'&&!q.is_open)return false;
    if(filter==='fig'&&!q.fig)return false;
    if(t){var h=(q.t+' '+(q.o||[]).join(' ')).toLowerCase();return t.split(/\s+/).filter(Boolean).every(function(w){return h.indexOf(w)>=0;});}
    return true;
  });
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildAns(q){
  if(q.no_ans)return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  var letters=['A','B','C','D','E'];
  var figBox = '';
  if(q.fig && q.fig_img){
    figBox = '<div class="fig-box"><span class="fig-label">&#128207; Circuito originale (dal PDF)</span><img src="data:image/png;base64,'+q.fig_img+'" alt="circuito"></div>'
           + '<div class="fig-note">Confronta lo schema con la spiegazione qui sotto: i nomi di nodi/rami (A, B, R1, R2...) fanno riferimento a questa figura.</div>';
  }
  if(q.is_open){
    if(q.ans_text){
      return figBox+'<div class="open-ans"><strong>&#9999; Risposta tipo</strong>'+esc(q.ans_text.replace(/\\n/g,'\n'))+'</div>';
    }
    return figBox+'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  }
  var h=figBox+'<div class="opts">';
  for(var i=0;i<q.o.length;i++){
    var cls=(q.ans_idx>=0&&i===q.ans_idx)?'opt correct':'opt';
    h+='<div class="'+cls+'"><b style="font-family:monospace;font-size:11px;margin-right:6px">'+letters[i]+')</b>'+esc(q.o[i])+'</div>';
  }
  h+='</div>';
  return h;
}

function render(){
  var f=getFilt();
  document.getElementById('vc').textContent=f.length;
  var c=document.getElementById('qc');
  if(!f.length){c.innerHTML='<div class="empty"><p style="font-size:2em">&#128269;</p>Nessuna domanda trovata</div>';return;}
  var h='',last=null;
  f.forEach(function(q){
    if(q.l!==last){var n=q.l<10?'00'+q.l:(q.l<100?'0'+q.l:''+q.l);h+='<div class="sec">L'+n+' &mdash; '+(LN[q.l]||'Lezione '+q.l)+'</div>';last=q.l;}
    var num=q.n<10?'0'+q.n:''+q.n;
    var badge=q.is_open?'<span class="qbadge op">APERTA</span>':'<span class="qbadge mc">CHIUSA</span>';
    var figBadge=q.fig?'<span class="qbadge fig" title="Domanda con figura/circuito">&#128207;</span>':'';
    h+='<div class="qcard" id="qcard-'+q.l+'-'+q.n+'"><div class="qhead">'+badge+figBadge+'<span class="qt"><b>Q'+num+'</b> &mdash; '+esc(q.t)+'</span><span class="qarrow">&#9660;</span></div><div class="qans">'+buildAns(q)+'</div></div>';
  });
  c.innerHTML=h;
  document.querySelectorAll('.qcard .qhead').forEach(function(h){
    h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
  });
}

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();var s=document.getElementById('search');s.focus();s.select();}
});

buildSB();render();
</script></body></html>
