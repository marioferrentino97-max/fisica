<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paniere Elettrotecnica eCampus</title>
<style>
:root{--bg:#0f0e0c;--surf:#1a1814;--surf2:#212019;--border:#2e2b24;--border2:#3d3a30;--accent:#c8a96e;--adim:rgba(200,169,110,0.12);--green:#27ae60;--gdim:rgba(39,174,96,0.1);--blue:#5dade2;--bdim:rgba(93,173,226,0.10);--purple:#a879e0;--pdim:rgba(168,121,224,0.12);--text:#e8e0d0;--muted:#9a9080;--dim:#5a5248;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh;line-height:1.65}
header{background:rgba(15,14,12,.97);border-bottom:1px solid var(--border);padding:14px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo{font-family:Palatino,serif;font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.logo span{font-size:10px;color:var(--dim);display:block;font-weight:normal;font-family:monospace;letter-spacing:1px}
.sw{flex:1;position:relative;min-width:180px}
#search{width:100%;background:var(--surf2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:Georgia,serif;padding:8px 12px 8px 36px;outline:none;transition:border-color .15s;}
#search:focus{border-color:var(--accent)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
.stats{font-family:monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.stats b{color:var(--accent)}
.layout{display:flex;min-height:calc(100vh - 59px)}
aside{width:230px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;position:sticky;top:59px;height:calc(100vh - 59px);}
.lb{display:flex;align-items:center;gap:7px;width:100%;padding:7px 14px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;font-family:monospace;text-align:left;transition:all .15s;border-left:3px solid transparent;}
.lb:hover{background:var(--surf2);color:var(--text)}
.lb.active{background:var(--adim);color:var(--accent);border-left-color:var(--accent)}
.lb .ln{font-size:12px;font-weight:700;min-width:28px}
.lb .lname{font-size:9px;opacity:.7;line-height:1.3}
.lb .lc{margin-left:auto;font-size:9px;background:var(--border);padding:1px 5px;border-radius:8px;flex-shrink:0}
main{flex:1;padding:22px;max-width:880px}
.filters{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.pill{font-family:monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 13px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--dim);transition:all .15s;}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--adim);border-color:var(--accent);color:var(--accent)}
.pill.mc-pill.active{background:var(--gdim);border-color:var(--green);color:var(--green)}
.pill.op-pill.active{background:var(--bdim);border-color:var(--blue);color:var(--blue)}
.pill.fig-pill.active{background:var(--pdim);border-color:var(--purple);color:var(--purple)}
.qcard{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden;cursor:pointer;}
.qhead{display:flex;align-items:flex-start;gap:11px;padding:13px 17px;}
.qhead:hover{background:rgba(255,255,255,.02)}
.qbadge{font-family:monospace;font-size:9px;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:3px;white-space:nowrap;}
.qbadge.mc{background:var(--gdim);color:var(--green);border:1px solid rgba(39,174,96,.2)}
.qbadge.op{background:var(--bdim);color:var(--blue);border:1px solid rgba(93,173,226,.2)}
.qbadge.fig{background:var(--pdim);color:var(--purple);border:1px solid rgba(168,121,224,.25);margin-top:3px}
.qt{font-size:13.5px;line-height:1.6;color:var(--text);flex:1}
.qarrow{color:var(--dim);font-size:10px;margin-top:4px;flex-shrink:0;transition:transform .2s}
.qcard.open .qarrow{transform:rotate(180deg);color:var(--accent)}
.qans{display:none;padding:0 17px 15px 48px}
.qcard.open .qans{display:block}
.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.opt{font-size:12.5px;padding:7px 11px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--surf2);}
.opt.correct{background:var(--gdim);border-color:rgba(39,174,96,.35);color:var(--green);font-weight:600;}
.opt.correct::before{content:"\2713  "}
.open-ans{background:var(--bdim);border:1px solid rgba(93,173,226,.2);border-radius:7px;padding:12px 16px;font-size:13px;color:#cde4f5;line-height:1.8;white-space:pre-wrap;}
.open-ans strong{display:block;font-family:monospace;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);margin-bottom:8px}
.fig-box{background:#f4f1ea;border:1px solid rgba(168,121,224,.35);border-radius:7px;padding:14px;margin-bottom:10px;text-align:center;}
.fig-box img{max-width:100%;max-height:280px;image-rendering:auto;}
.fig-box .fig-label{display:block;font-family:monospace;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple);margin-bottom:8px;text-align:left}
.fig-note{font-family:Georgia,serif;font-size:11px;color:var(--dim);margin:-2px 0 10px;font-style:italic}
.no-ans{font-family:monospace;font-size:11px;color:var(--dim);padding:7px 11px;border:1px dashed var(--border);border-radius:6px;}
.sec{font-family:monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:22px 0 11px;display:flex;align-items:center;gap:10px;}
.sec::after{content:"";flex:1;height:1px;background:var(--border)}
.empty{text-align:center;padding:60px 20px;color:var(--dim);font-family:monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:640px){aside{display:none}main{padding:12px}}
</style></head>

_text": "Il diodo ideale è un bipolo non lineare a due stati: si comporta come un corto circuito (V=0) quando è polarizzato direttamente e attraversato da corrente positiva, e come un circuito aperto (I=0) quando è polarizzato inversamente. La sua caratteristica V-I è quindi una spezzata che giace sugli assi (non passa per il I e III quadrante come un bipolo lineare).", "no_ans": false, "fig_img": null}, {"l": 3, "n": 15, "t": "Bipolo corto circuito e bipolo circuito aperto", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il bipolo corto circuito ha tensione ai morsetti sempre nulla (V=0) qualunque sia la corrente che lo attraversa, quindi resistenza equivalente nulla; il bipolo circuito aperto ha invece corrente sempre nulla (I=0) qualunque sia la tensione ai suoi capi, quindi resistenza equivalente infinita. Sono i due casi limite del resistore lineare.", "no_ans": false, "fig_img": null}, {"l": 3, "n": 16, "t": "Generatore di tensione", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il generatore di tensione indipendente impone ai suoi morsetti un valore di tensione V (costante o funzione nota del tempo) indipendentemente dalla corrente erogata; la sua caratteristica V-I è quindi una retta verticale nel piano I-V. È un componente attivo, in grado di erogare potenza al resto del circuito.", "no_ans": false, "fig_img": null}, {"l": 3, "n": 17, "t": "Diodo reale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il diodo reale, a differenza di quello ideale, presenta una caratteristica esponenziale continua (equazione di Shockley) anziché una spezzata netta: in polarizzazione diretta conduce con una piccola caduta di tensione di soglia (circa 0,6-0,7V per il silicio), in inversa lascia passare una corrente di saturazione trascurabile. Il suo comportamento dipende inoltre dalla temperatura di funzionamento.", "no_ans": false, "fig_img": null}, {"l": 4, "n": 1, "t": "LA CAPACITA' SI MISURA IN", "fig": false, "o": ["SECONDI", "OHM", "HENRY", "FARAD"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 4, "n": 2, "t": "L'INDUTTANZA SI MISURA IN", "fig": false, "o": ["HENRY", "SECONDI", "OHM", "FARAD"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 4, "n": 3, "t": "UN GENERATORE E' CONTROLLATO QUANDO.", "fig": false, "o": ["Il valore del generatore dipende solo dal valore di una tensione generata.", "Il valore del generatore dipende da un'altra tensione o corrente presente nel circuito e varia proporzionalmente ad essa.", "Il valore del generatore cambia al cambiare di una tensione generata da un altro generatore.", "Il valore del generatore dipende solo dal valore di una corrente generata"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 4, "n": 4, "t": "QUAL'E' LA RELAZIONE TRA TENSIONE E CORRENTE AI CAPI DI UNA INDUTTANZA", "fig": false, "o": ["In una induttanza la variazione della corrente è direttamente proporzionale alla tensione.", "In una induttanza la variazione della corrente è direttamente proporzionale alla tensione e inversamente proporzionale al valore dell'induttanza stessa.", "In una induttanza, la variazione della tensione è inversamente proporzionale al valore della corrente e all'induttanza.", "In una induttanza, la variazione della tensione è direttamente proporzionale al valore della corrente e all'induttanza."], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 4, "n": 5, "t": "QUAL'E' LA RELAZIONE TRA TENSIONE E CORRENTE AI CAPI DI UN CONDENSATORE", "fig": false, "o": ["In un condensatore, la variazione della corrente è direttamente proporzionale alla tensione", "In un condensatore, la variazione della corrente e inversamente proporzionale alla tensione.", "In un condensatore, la variazione della tensione ai capi delle due armature, è direttamente proporzionale alla corrente.", "In un condensatore, la variazione della tensione ai capi delle due armature, è direttamente proporzionale alla corrente e inversamente proporzionale al valore della capacità stessa."], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 4, "n": 6, "t": "COSA SI INTENDE PER GENERATORE INDIPENDENTE DI CORRENTE O DI TENSIONE", "fig": false, "o": ["Un generatore in cui il valore della corrente o della tensione non dipende da nessun'altra grandezza elettrica del circuito.", "Un generatore il cui valore di corrente o di tensione non dipende dalla temperatura", "Un generatore il cui valore di corrente o di tensione son fra di loro indipendenti.", "Un generatore il cui valore di corrente o di tensione non dipende dal tempo t."], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 4, "n": 7, "t": "Generatore di corrente", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il generatore di corrente indipendente impone ai suoi morsetti un valore di corrente J (costante o variabile nel tempo) indipendentemente dalla tensione ai suoi capi; la sua caratteristica nel piano I-V è quindi una retta orizzontale. È un elemento attivo del circuito.", "no_ans": false, "fig_img": null}, {"l": 4, "n": 8, "t": "Condensatore", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il condensatore è un componente dinamico a due morsetti che immagazzina energia nel campo elettrico. La relazione costitutiva è i(t)=C·dv(t)/dt: la corrente è proporzionale alla derivata della tensione ai suoi capi. A regime continuo (tensione costante) si comporta come un circuito aperto.", "no_ans": false, "fig_img": null}, {"l": 4, "n": 9, "t": "Induttore", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "L'induttore (induttanza) è un componente dinamico che immagazzina energia nel campo magnetico. La relazione costitutiva è v(t)=L·di(t)/dt: la tensione ai suoi capi è proporzionale alla derivata della corrente che lo attraversa. A regime continuo (corrente costante) si comporta come un corto circuito.", "no_ans": false, "fig_img": null}, {"l": 4, "n": 10, "t": "Generatori controllati", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "I generatori controllati (o dipendenti) sono generatori il cui valore di tensione o corrente non è fissato a priori, ma dipende linearmente da un'altra tensione o corrente presente altrove nel circuito. Se ne distinguono quattro tipi: VCVS (tensione controllata in tensione), CCVS (tensione controllata in corrente), VCCS (corrente controllata in tensione) e CCCS (corrente controllata in corrente).", "no_ans": false, "fig_img": null}, {"l": 5, "n": 1, "t": "APPLICANDO LA LEGGE DI KIRCHHOOFF DELLE TENSIONI", "fig": false, "o": ["TUTTI I TERMINI DELL'EQUAZIONE OTTENUTA DEVONO ESSERE TENSIONI", "TUTTI I TERMINI DELL'EQUAZIONE OTTENUTA POSSONO ESSERE TENSIONI", "TUTTI I TERMINI DELL'EQUAZIONE OTTENUTA POSSONO ESSERE CORRENTI", "TUTTI I TERMINI DELL'EQUAZIONE OTTENUTA DEVONO ESSERE CORRENTI"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 5, "n": 2, "t": "Nel circuito in figura la tensione VAB:", "fig": true, "o": ["E’ uguale a V-VR1-VR3", "È sempre positiva", "È uguale alla tensione VR ai morsetti della resistenza R", "Tutte vere"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAAQIAAACmCAIAAAC+1xZLAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAGWUlEQVR4nO2c27bbIAwF8/8/Tbt6Ls3FdsCWxN5h5qlNiKyAJhhwe2sAy3ObnQDAfNAAAA0A0ACgoQFAQwOAhgYADQ0AGhoANDQAaGgA0NAAoKFBOLctZicFb2CEgtksekwQh+EJBg0cYXgi2St3NBCH4YmEqcAURiiSt+tj1s2aMBiRvBZ9/19hIoxEJK+VfVDraKADIxHG6MIADXRgJMLo3CZibSAIgxHG6G4pJujASEwDDXRgJKaBBjowEnWwYSoLI1EKx2eaMBgAaACABgANDQAaGgA0NDhHzz5PVBsogGE4Axp8GAzDMF+1e1zBUW2gBsZgGDT4PFYfg9Ez3fuWPY+OXmljiuMxuVOu4Zz4T7XQ4JgTXapAfKK3j+b1y+a9Ak+cKcc+UjQIj5nE9V5+/VTeKxbkFS4aJHJ9wG7cJj2S9OONBrlcTBgNakCDXK4nfGMLNR80yAUNwsn4CmiQS0jCPUGi2uiDBn4DiQaxJM1paJCLXcLioMG/iG5VZZewOGjwL6JbVdklrEzeti8a5GKXsDJo8BPRrarsEpbltkVg8KhQG8HjI7pVlV3CsqQ+GYUGudglrEnPQyIZ8WOCx0dMeKwqFa9sZUGDrbg x": null, "ans_text": "Nel collegamento in parallelo di bipoli, tutti i bipoli sono sottoposti alla stessa tensione ai loro morsetti, mentre la corrente totale che entra nel parallelo si suddivide tra i vari rami in base al valore di ciascun bipolo (per le resistenze, in maniera inversamente proporzionale al loro valore).", "no_ans": false, "fig_img": null}, {"l": 5, "n": 44, "t": "Collegamento in serie di bipoli", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel collegamento in serie di bipoli, tutti i bipoli sono attraversati dalla stessa corrente, mentre la tensione totale ai capi della serie si suddivide tra i vari bipoli (per le resistenze, in maniera direttamente proporzionale al loro valore, secondo il partitore di tensione).", "no_ans": false, "fig_img": null}, {"l": 5, "n": 45, "t": "Legge di Kirchhoff delle tensioni", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La legge di Kirchhoff delle tensioni (LKT) afferma che, percorrendo una qualsiasi maglia (percorso chiuso) di un circuito in un verso prefissato, la somma algebrica delle tensioni ai capi di tutti i lati attraversati è nulla. È una conseguenza della conservatività del campo elettrico (il potenziale è una funzione di stato) e si applica indipendentemente dalla natura lineare o non lineare dei bipoli presenti.", "no_ans": false, "fig_img": null}, {"l": 6, "n": 1, "t": "Nel circuito in figura la tensione VAB vale:", "fig": true, "o": ["VAB=R4/J", "Tutte false", "VAB=R4*J", "VAB=0"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAATcAAACWCAIAAAA0d1iaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAIhElEQVR4nO2cwbKkOgxD+f+f5i24r4sBAg6xHcnorLq4dJBs1JDAzLIKIbBZZgsQQjyglAqBjlIqBDpKqRDoKKVCoKOUCoGOUioEOkqpEOgopUKgo5QKgY5SKgQ6SqkQ6CilGSzLc5299sHhm64j+Lr/BLaT7P5U89oHh2+6DuLT5nP45vn6TddBfNp8AvvTq3Wqee2Dwzddx/Fd5/cs/zM+zuXniH16hbkYbA1++TlinxFCi+B4IKX0guVfRsZJ29IrzMVga/C0LSOEFuFwoMvPHSOMKxA3nMsVtwWHb7q+4caCBc87ujK0Suw1+OXniH1uNMQZbB3x8nPEPnZJO  false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il principio di sovrapposizione degli effetti afferma che, in un circuito lineare con più generatori indipendenti, la risposta (tensione o corrente) in un qualsiasi ramo è pari alla somma algebrica delle risposte prodotte da ciascun generatore agente singolarmente, con tutti gli altri generatori indipendenti resi passivi (i generatori di tensione cortocircuitati, quelli di corrente aperti). Si applica solo a circuiti lineari.", "no_ans": false, "fig_img": null}, {"l": 7, "n": 1, "t": "QUANDO E' POSSIBILE CALCOLARE IL CIRCUITO EQUIVALENTE ALLA THEVENIN", "fig": false, "o": ["Dipende dal circuito che si vuole sostituire: deve avere solo generatori di uno stesso tipo", "Non ci sono limitazioni, occorre semplicemente poter calcolare la resistenza equivalente vista ai capi dei morsetti rispetto ai quali calcolare il circuito equivalente, una volta reso attivo il circuito su cui si lavora, e poi determinare la tensione misurata a vuoto ai capi degli stessi morsetti, una volta che si è reso passivo il circuito stesso.", "Quando la resistenza equivalente ai morsetti ai quali si vuole calcolare il circuito equivalente è finita.", "Non ci sono limitazioni, occorre semplicemente poter calcolare la resistenza equivalente vista ai capi dei morsetti rispetto ai quali calcolare il circuito equivalente, una volta reso passivo il circuito su cui si lavora, e poi determinare la corrente misurata in corto circuito ai capi degli stessi morsetti, una volta che si è reso attivo il circuito stesso."], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 7, "n": 2, "t": "Per il circuito in figura sono noti E=12 V, Ri=i Ω, J=2 A, calcolare il circuito equivalente di Thevenin ai morsetti AB.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con E=12V, Ri=iΩ, J=2A: la resistenza equivalente di Thevenin RTH si calcola rendendo passivo il circuito (cortocircuitando E) e valutando la resistenza vista dai morsetti AB, tipicamente RTH=Ri. La tensione equivalente ETH si ottiene come tensione a vuoto tra A e B con il circuito attivo, sommando (per sovrapposizione) il contributo di E e quello di J: ETH=E+J·Ri (o l'espressione dettata dalla topologia). Il circuito equivalente di Thevenin è quindi un generatore ETH in serie a RTH.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAATcAAACWCAIAAAA0d1iaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAIhElEQVR4nO2cwbKkOgxD+f+f5i24r4sBAg6xHcnorLq4dJBs1JDAzLIKIbBZZgsQQjyglAqBjlIqBDpKqRDoKKVCoKOUCoGOUioEOkqpEOgopUKgo5QKgY5SKgQ6SqkQ6CilGSzLc5299sHhm64j+Lr/BLaT7P5U89oHh2+6DuLT5nP45vn6TddBfNp8AvvTq3Wqee2Dwzddx/Fd5/cs/zM+zuXniH16hbkYbA1++TlinxFCi+B4IKX0guVfRsZJ29IrzMVga/C0LSOEFuFwoMvPHSOMKxA3nMsVtwWHb7q+4caCBc87ujK0Suw1+OXniH1uNMQZbB3x8nPEPnZJOUVQSqOIax7I+ZoZ0RXG9Xm0nCIMHkgpbRJnbcF4SpHcOxDXl6OBo5Q2UUp9AXF9ORo4SmmTtLlK9D4R3407YrTruKHiUEqbKKXuILiOGypuZKW0SWFrG+UNWggqgvNt+ej363a6sLWNzDVeWJRSbgpb2/PxrIY+bFNKw8lfAj2TfPTkw80ye1ASNyZQSqsGdcqDiukaco6IYDbooPsBUVL6N0rFrH4qpfnXUuPGKUpGRou4QfCX6DjgXKaftTka8rs20Wz0QQ+jIab0b8QqWZ2e0mgBszqFcyH1Pe55KMSUlsnnBtpqiu/5NLFTj2bd7xjvxUQfYhzNS5tMvJZeRtRFD0Kn7s0G3TQaxWCiNd4mc+9491sWj0fkOJ3quk1QSteRlOJ0PYg0d8Z5Wo1rae+kVCld36V0eqdzmJvS8/Ya81K7Wc1Lf/RJ/Eg+Nwqn9DegcczH9Z6ug7ps94LifNa1tAmaxyA9lm723qY6opSumpfegOYuVM99N5XSuWiNtwmar5xJmn3VKu7annCUtPFd0PPSJmiOZl1L8y+k47PfrmNFH2KcpHePHJcf0sBX6MJjLyy9460VhfKk93gnTmxeAy5vHONv5eMtKMVvbgsK5XnXUuNGHMDljdCVq/vf3MXjvaiJUCjPmJcmLz94AS7vHb3XPePPK2+tKJRnrPEyXkhXBoVdvLsvNf7C8taKQnnG81LS5QdASeO4XEvP23lrRaE8490j0uUHQEleuBect1YUyjPe4yVdfgCU5ItjVnlrhXmFOBB+LeVdfgCUFIHLacpeK/Cshs9LeSc2gJLiGDxNa9QKNqvha7xKKRGwp2kmgEVAeY8XrS4rZLfi+JTZFrBFSHr3yPJdRyWOwHbOi/IGLYAXIek9Xsu33JU4At7Fd5Q01QtFEVCupRSUMVjGyAhERUCZl4JTxmAZIyPQFSHjPV5qyhgsY2QE0iJkvMdLSkmDJU31QleEjPd46ZBBcJYr3g0SIc+djPd4iShvcA+v00vl7+xQdLyssV5KmrqH169jSn/fRa5GWWPveGHK5e5rCiw6D7Rkj9uB7d3X/zHEJV3dcv9dT4NC5JnoggNmVSltYuyWUpqM8eal0nqSUvrAfefi7r4SoBB55iC7FdEud7D53FBKTXT9YLPUhEXngbPsyy1Gd+D53FBKOzh3lHfpaOXsneVncbH9Hz1EzVJKTRivpa0fdcwTAl  "Il metodo delle correnti cicliche di maglia consiste nell'associare a ciascuna maglia indipendente del circuito una corrente fittizia (corrente di maglia), scrivere per ognuna l'equazione di Kirchhoff delle tensioni in funzione di tali correnti, e risolvere il sistema lineare risultante. Le correnti reali nei singoli rami si ottengono poi come somma algebrica delle correnti di maglia che li percorrono. È utile perché riduce il numero di equazioni al numero di maglie indipendenti (l = rami - nodi + 1).", "no_ans": false, "fig_img": null}, {"l": 13, "n": 1, "t": "Metodo del potenziale ai nodi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il metodo del potenziale ai nodi consiste nel fissare un nodo di riferimento a potenziale zero, esprimere tutte le correnti di ramo in funzione delle differenze di potenziale ai nodi tramite la legge di Ohm, e scrivere l'equazione di Kirchhoff delle correnti per ciascun nodo indipendente (diverso dal riferimento). Si ottiene così un sistema lineare nelle incognite potenziali di nodo, la cui soluzione permette di ricavare tutte le correnti di ramo.", "no_ans": false, "fig_img": null}, {"l": 13, "n": 2, "t": "Per il circuito in figura, in cui sono noti V1=50 V, J=60 A, R1=5 Ω, R2=40 Ω, R3=80 Ω, R4=120 Ω, determinare la tensione VBC.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con V1=50V, J=60A, R1=5Ω, R2=40Ω, R3=80Ω, R4=120Ω: si applica il metodo del potenziale ai nodi (o delle maglie) per determinare i potenziali dei nodi B e C rispetto al riferimento, quindi VBC=VB-VC.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAARYAAACiCAIAAAALA3XPAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAHxUlEQVR4nO2b0ZajOAxE8/8/zT7AyWaaxMiWLFXZdZ96aAOi5BvAnXkdQggHr+oChOBGCgnhQgoJ4UIKCeFCCgnhQgoJ4UIKCeFCCgnhQgoJ4UIKCeFCCgnhYnGFXq/FL7CW1wfVtZSx8pWffd25u7P5zHbbnFe+bCk0lT/Bbpvzspf97ui2rZ2NFDpZ9rKl0Gxe/1JdThlrXrme0RPQXehkwct+3aiuaE2k0MmClw3VWsvZo8Zkcq8HrcI0VrtsqNZalgSjxiSjW/2bfa88gYUVEm/UlVlYljSixohC9mpJ5lPHSgrpaa3B i.", "no_ans": false, "fig_img": null}, {"l": 21, "n": 9, "t": "Numeri complessi in forma esponenziale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Un numero complesso in forma esponenziale si scrive come Z=|Z|·e^(jφ), equivalente alla forma polare tramite la formula di Eulero e^(jφ)=cosφ+jsenφ. È la notazione più usata nel metodo simbolico per rappresentare fasori di tensioni e correnti sinusoidali.", "no_ans": false, "fig_img": null}, {"l": 22, "n": 1, "t": "X=Xej(fi) E' IL FASORE DELLA GRANDEZZA SINUSOIDALE", "fig": false, "o": ["x(t)=v2Xsen(omegat+fi)", "x(t)=v2Xsen(fi)", "x(t)=Xsen(omegat+fi)", "x(t)=Xsen(omegat)"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 22, "n": 2, "t": "Per il circuito riportato in figura, funzionante in regime sinusoidale, supponendo note tutte le grandezze disegnare il diagramma vettoriale qualitativo delle stesse (prendere IR a fase zero).", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Note tutte le grandezze del circuito (correnti e tensioni), si costruisce il diagramma vettoriale ponendo il fasore IR sull'asse reale (fase zero) come riferimento; gli altri fasori (tensioni, altre correnti) si disegnano con il modulo e la fase relativa corretta rispetto a IR, secondo le relazioni caratteristiche di ciascun bipolo (resistenza in fase, induttanza in quadratura in anticipo di tensione su corrente, capacità in quadratura in anticipo di corrente su tensione).", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAATAAAACmCAIAAADS0UROAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAHrklEQVR4nO3d0ZqiOhBFYd7/petcMMdxBCGESrKC67/sVthsUoi238wSkjCW0QEk/eVASiAOpATiQEogDqQE4kBKIA6kBOJASiAOpATiQEogDqQE4kBKIA6kBOJASiAOpATiQNZYFntTEy6sGg6kGnFh1XAg1YgL6zKnUe24ti5zINWOa+syB1LtuLYucyDVjmvrMgdS7bi2rnEa1ZTL6xoHUk25vK5Z9owOpedwMUkgDqQE4kBKIA6kBOJASiAO5L6ST1CzHiO9uFA+fczP7jhlPUb6MPESabG+v23zY7RSHvNIjz/A1iauL/015/TmM/ExT+WNwE247srfdKV/V2aWgSS/L/ULTDexWiu563t/QOJX2AovAd0ec/Bc8qLPPSk/iNXX9lOQni7Fu/kY ungono contemporaneamente i loro massimi e i loro zeri. L'impedenza è puramente reale, Z=R.", "no_ans": false, "fig_img": null}, {"l": 23, "n": 6, "t": "Circuito puramente induttivo", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel circuito puramente induttivo la tensione è in anticipo di 90° rispetto alla corrente (o, equivalentemente, la corrente è in ritardo di 90° sulla tensione). L'impedenza è puramente immaginaria, Z=jωL=jXL, con reattanza induttiva XL=ωL.", "no_ans": false, "fig_img": null}, {"l": 23, "n": 7, "t": "Circuito puramente capacitivo", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel circuito puramente capacitivo la corrente è in anticipo di 90° rispetto alla tensione (o la tensione è in ritardo di 90° sulla corrente). L'impedenza è puramente immaginaria, Z=1/(jωC)=-jXC, con reattanza capacitiva XC=1/(ωC).", "no_ans": false, "fig_img": null}, {"l": 24, "n": 1, "t": "I TRE PARAMETRI DI UN'IMPEDENZA (R,X,Z)", "fig": false, "o": ["NON POSSONO ESSERE RAPPRESENTATI TRAMITE UN TRIANGOLO RETTANGOLO", "POSSONO ESSERE RAPPRESENTATI SU UNA RETTA", "POSSONO ESSERE RAPPRESENTATI TRAMITE UN TRIANGOLO", "SI DEVONO RAPPRESENTARE TRAMITE UN TRIANGOLO RETTANGOLO"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 24, "n": 2, "t": "Per il circuito riportato in figura, supponendo note le grandezze V=230 V, R1=20 Ω, R2=10 Ω, R3=3 Ω, XL1=37,7 Ω, XC2=53,1 Ω, XL3=4 Ω Determinare la corrente I , la tensione VAB, le correnti IR ed IL", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con V=230V, R1=20Ω, R2=10Ω, R3=3Ω, XL1=37,7Ω, XC2=53,1Ω, XL3=4Ω: si scrivono le impedenze complesse dei vari rami (Z1=R1+jXL1 ecc.), si compongono secondo lo schema serie/parallelo del circuito per ottenere l'impedenza equivalente, si calcola la corrente totale I=V/Zeq e infine, tramite partitori di tensione/corrente in notazione complessa, si ricavano VAB, IR ed IL.", "no_ans": false, "fig_img": "iV nusoidale", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "In regime sinusoidale si definiscono tre potenze: la potenza attiva P=VIcosφ (Watt), effettivamente convertita in lavoro utile; la potenza reattiva Q=VIsenφ (VAR), scambiata con gli elementi reattivi (L,C) senza essere dissipata; la potenza apparente complessa A=P+jQ=VI* (VA), il cui modulo è |A|=VI. Le tre grandezze P, Q, |A| formano un triangolo rettangolo (triangolo delle potenze).", "no_ans": false, "fig_img": null}, {"l": 26, "n": 14, "t": "Per il circuito riportato in figura, funzionante in regime sinusoidale, in cui sono noti Ea =220+j0 V (efficace), R=1 Ω, X=1 Ω U: PU=2 kW, cosφU=0,95 (rit.) Determinare i tre costi relativi all’energia attiva per l’utilizzatore WU, la linea Wl e del generatore Wp; è noto che 1 kWh costa 0,12 €, il circuito funziona per 24 ore al giorno per 60 giorni.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con Ea=220+j0V, R=1Ω, X=1Ω, PU=2kW, cosφU=0,95(rit.): si calcola la corrente assorbita dall'utilizzatore IU=PU/(V·cosφU), quindi (nota l'impedenza di linea R+jX) si determinano le potenze attive dissipate in linea (Pl=R·I²) e generate (Pg=PU+Pl). Le energie mensili si ottengono moltiplicando ciascuna potenza per il numero di ore di funzionamento (24h×60gg=1440h): WU=PU·1440h, Wl=Pl·1440h, Wp=Pg·1440h; i relativi costi si ottengono moltiplicando ciascuna energia (in kWh) per la tariffa di 0,12 €/kWh.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAASYAAACeCAIAAAAQSDAhAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAFxklEQVR4nO3c22HbOBBAUfWUWtKC63AbbsG1+Nf1aDfSrqMHxYcADAfQOV+JDI9IBte05CSHIxDosPcBwGuRHISSHISSHISSHISSHISSHISSHISSHISSHISSHISSHISSHITqKbnDyd5HAUV62sGSYwB2MISS3LLDlL0Pil51s3V23OuTT9pvdY+OvN8z6ktPV3mvPTFYcsepg+/6dPrS04XOc4ubebwLNwff9bl0p5tr7RZX188pDHAufenmcu+Y3JDvnZzPYoxz6Us3VzzJXW6kPTrSuXSkm4ueJLkdj6Qud7m9dHPF87x3MsA29UJuR31c8Ty3uPnHuzDwt8pd6ONyS66WUb9P7kgHl3uk9wn3Nd5XkB651hBKctz42PsABic5CCU5CCU5CCU5CPXqya15f7zWmhhrfqZSaw1PePULOlJy ea hanno lo stesso modulo e sono sfasate di 120° tra loro, e la loro somma istantanea è sempre nulla; se è presente il conduttore di neutro, la corrente che vi circola è nulla.", "no_ans": false, "fig_img": null}, {"l": 31, "n": 7, "t": "Impedenze a stella e a triangolo", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le impedenze di un carico trifase possono essere collegate a stella (ciascuna tra una fase e il centro stella) o a triangolo (ciascuna tra due fasi). Le due configurazioni sono elettricamente equivalenti se legate dalle relazioni di trasformazione stella-triangolo (Ztriangolo=3·Zstella per impedenze equilibrate), e la scelta dipende dal tipo di utilizzatore e dalla tensione nominale disponibile.", "no_ans": false, "fig_img": null}, {"l": 31, "n": 8, "t": "Per il circuito trifase riportato in figura, in cui sono noti E1=220+j0 V (terna simmetrica alla sequenza diretta, valore efficace) ZY=10+j10 Ω Determinare le tre correnti di linea, e verificare che la loro somma è pari a zero.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con E1=220+j0V (terna diretta simmetrica), ZY=10+j10Ω: essendo il sistema equilibrato, si utilizza il circuito equivalente monofase (una fase con neutro): I1=E1/ZY. Le altre due correnti si ottengono ruotando I1 di -120° e +120° (I2, I3 hanno lo stesso modulo di I1). La somma vettoriale I1+I2+I3 risulta nulla per definizione di terna simmetrica ed equilibrata.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAASsAAADGCAIAAAAFazELAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAHbklEQVR4nO3c65LauBaA0X7/l2aq0qkM1bTF1nULea1fp4IlmeBvBIacrweQ5yv7BODWFAiZFAiZFAiZFAiZFAiZFAiZFAiZFAiZFAiZFAiZphf49cfsVeBDKRAyaQMyKRAyzSrw68Kk5eBDTSxw0sxwEgVCpimd9OQnXW5FgZCp+nKP3Flpuw3jng03lLYHFuodfTqwr5wCy/vnhDOCTY2/3CP5RQ6DO0gosOowONuUAiO3YRQIj8TfhSoQHgqEXAqETAqETDKATBML9CszeGtwGOWvH9QIP4yMIZ6WCOHbmBIadjabIStd/VCk2bATGzCFfw3I9sZeaRsV2H8qImSBMwscdR4iZDYFrpgHrhxY4LZPCV5te7k2TjQjGBEyT+Tqit/kVCDUOarAeamIkEmOeheqQD5O4dJq+MJ96wJ7 2", "fig": false, "o": ["P diversa da 0, Q diversa da 0, A=Q", "Q = sqrt(3)VIsenfi", "P diversa da 0, Q = 0, A=Q", "Q= sqrt(3)EIsenfi"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 34, "n": 3, "t": "PER UN SISTEMA TRIFASE SIMMETRICO ED EQUILIBRATO -1", "fig": false, "o": ["P = sqrt(3)VIcosfi", "P diversa da 0, Q diversa da 0, A=Q", "P = sqrt(3)EIcosfi", "P diversa da 0, Q = 0, A=Q"], "is_open": false, "ans_idx": 0, "no_ans": false, "fig_img": null}, {"l": 34, "n": 4, "t": "Potenze nei sistemi trifase simmetrici ed equilibrati", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Per un sistema trifase simmetrico ed equilibrato le potenze si esprimono come P=√3·V·I·cosφ (potenza attiva), Q=√3·V·I·senφ (potenza reattiva) e A=√3·V·I (potenza apparente), dove V è la tensione concatenata, I la corrente di linea e φ lo sfasamento tra tensione e corrente di fase. Tali espressioni derivano dalla somma delle potenze delle tre fasi, ciascuna pari a un terzo del totale.", "no_ans": false, "fig_img": null}, {"l": 34, "n": 5, "t": "Potenze nei sistemi trifase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "In un sistema trifase generico (anche squilibrato) la potenza attiva totale è la somma delle potenze attive delle tre fasi, P=ΣPi=ΣVi·Ii·cosφi, e analogamente per la potenza reattiva Q=ΣQi (teorema di Boucherot, sempre valido). Solo nel caso particolare di sistema simmetrico ed equilibrato le tre potenze di fase sono uguali e si ottiene la formula compatta P=√3·V·I·cosφ.", "no_ans": false, "fig_img": null}, {"l": 35, "n": 1, "t": "INSERZIONE ARON DI DUE WATTMETRI", "fig": false, "o": ["CONSENTE DI MISURARE LA POTENZA APPARENTE DI SISTEMI TRIFASE A TRE CONDUTTORI", "CONSENTE DI MISURARE LA POTENZA ATTIVA DI SISTEMI TRIFASE A QUATTRO CONDUTTORI", "NON CONSENTE DI MISURARE LA POTENZA ATTIVA DI SISTEMI TRIFASE A TRE CONDUTTORI", "CONSENTE DI MISURARE LA POTENZA ATTIVA DI SISTEMI TRIFASE A TRE CONDUTTORI"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 35, "n": 2, "t": "Misure elettriche e strumenti di misura", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le misure elettriche richiedono strumenti quali amperometri (in serie al ramo, bassa resistenza interna), voltmetri (in parallelo, alta resistenza interna) e wattmetri (bobina amperometrica in serie, bobina voltmetrica in parallelo, per misurare direttamente la potenza attiva come prodotto istantaneo v·i mediato).", "no_ans": false, "fig_img": null}, {"l": 35, "n": 3, "t": "Misure di potenza nei sistemi trifase", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nei sistemi trifase a tre conduttori la potenza attiva totale si può misurare con l'inserzione Aron, che utilizza due soli wattmetri (anziché tre) inseriti su due fasi qualsiasi, con i circuiti voltmetrici riferiti alla terza fase: la somma algebrica delle due letture fornisce sempre la potenza attiva totale assorbita, indipendentemente dall'equilibrio del carico.", "no_ans": false, "fig_img": null}, {"l": 36, "n": 1, "t": "PER RIFASARE A cos fi=1 UN CARICO OHMICO-CAPACITIVO TRIFASE CHE ASSORBE UNA POTENZA REATTIVA Q E' NECESSARIA UNA POTENZA REATTIVA QL", "fig": false, "o": ["QL=P", "QL=R+I", "TUTTE FALSE", "QL=Q"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 36, "n": 2, "t": "PER RIFASARE A cos fi=1 UN CARICO OHMICO INDUTTIVO TRIFASE CHE ASSORBE UNA POTENZA REATTIVA Q E' NECESSARIA UNA POTENZA REATTIVA QC", "fig": false, "o": ["QC=P", "QC=Q", "QC=R+I", "TUTTE FALSE"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 36, "n": 3, "t": "Nel circuito in figura, supponendo l’utilizzatore di natura ohmmico-induttiva:", "fig": true, "o": ["con il tasto T aperto si può rifasare il carico", "tutte false", "con il tasto T chiuso si può rifasare il carico", "con il tasto T chiuso non si può rifasare il carico"], "is_open": false, "ans_idx": 2, "no_an , "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 37, "n": 4, "t": "Terne alla sequenza diretta-inversa-omopolare", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Un sistema trifase generico e squilibrato può sempre essere scomposto nella somma di tre terne simmetriche: una alla sequenza diretta (stessa sequenza di rotazione del sistema originale, sfasate di 120° in ritardo), una alla sequenza inversa (sfasate di 120° ma con sequenza di rotazione opposta) e una alla sequenza omopolare (tre vettori uguali in modulo e fase, componente 'zero-sequence'). Questo metodo (componenti simmetriche) permette di analizzare sistemi squilibrati come sovrapposizione di tre sistemi equilibrati indipendenti.", "no_ans": false, "fig_img": null}, {"l": 37, "n": 5, "t": "Scomposizione alle sequenze di terne", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La scomposizione alle sequenze di una terna generica (Va, Vb, Vc) si effettua con le formule di Fortescue: V_diretta=(1/3)(Va+aVb+a²Vc), V_inversa=(1/3)(Va+a²Vb+aVc), V_omopolare=(1/3)(Va+Vb+Vc), dove a=e^(j120°) è l'operatore di rotazione. Le tre componenti sommate ricostruiscono la terna di partenza.", "no_ans": false, "fig_img": null}, {"l": 37, "n": 6, "t": "Per il circuito trifase riportato in figura, sono noti E1=220+j0 V (terna simmetrica alla sequenza diretta, valore efficace) ZL=0,1+j0,1 Ω, Z1=10+j10 Ω, Z2=20+j20 Ω, determinare il circuito equivalente di Thevenin trifase alla sezione S.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con E1=220+j0V (terna diretta simmetrica), ZL=0,1+j0,1Ω, Z1=10+j10Ω, Z2=20+j20Ω: essendo il sistema simmetrico ed equilibrato, si usa il circuito equivalente monofase. La resistenza/impedenza equivalente di Thevenin trifase alla sezione S si ottiene rendendo passivo il generatore e calcolando l'impedenza vista (ZL in serie al parallelo di Z1 e Z2, se questo è lo schema); la tensione equivalente di Thevenin coincide con la img": null}, {"l": 42, "n": 10, "t": "DURANTE LA FASE DI CARICA DI UN CONDENSATORE", "fig": false, "o": ["La tensione ai suoi morsetti decresce", "La corrente nel circuito vale zero", "La tensione ai suoi morsetti rimane costante", "La tensione ai suoi morsetti cresce"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 42, "n": 11, "t": "Circuito RC in scarica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel circuito RC in scarica, il condensatore inizialmente carico si scarica sulla resistenza; la tensione decresce esponenzialmente vC(t)=V0·e^(-t/τ), con costante di tempo τ=RC, partendo dal valore iniziale V0 e tendendo a zero. La corrente, anch'essa esponenziale, ha verso opposto a quello di carica.", "no_ans": false, "fig_img": null}, {"l": 42, "n": 12, "t": "Circuito RC in carica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Nel circuito RC in carica, il condensatore inizialmente scarico si carica tramite un generatore attraverso una resistenza; la tensione cresce secondo vC(t)=E·(1-e^(-t/τ)), con costante di tempo τ=RC, tendendo asintoticamente al valore a regime E. La corrente di carica decresce esponenzialmente da E/R a zero.", "no_ans": false, "fig_img": null}, {"l": 42, "n": 13, "t": "Per il circuito in figura, in cui sono noti R=1 Ω, R1=2 Ω, R2=4 Ω, V1=12 V, C= 1 F, determinare la tensione vC(t) per -∞<t<+∞ sapendo che il tasto T è aperto da moltissimo tempo e che all’istante t=0 viene chiuso.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con R=1Ω, R1=2Ω, R2=4Ω, V1=12V, C=1F, tasto T aperto da lungo tempo poi chiuso a t=0: per t<0 (regime, T aperto) si calcola la tensione iniziale vC(0⁻) risolvendo il circuito a condensatore aperto (nessuna corrente in C). Per t→∞ (nuovo regime, T chiuso) si calcola vC(∞) risolvendo il nuovo circuito resistivo a regime. La costante di tempo τ=Req·C si ottiene dalla resistenza equivalente vista dal condensatore a T chiuso (  false, "fig_img": null}, {"l": 48, "n": 10, "t": "L'INDUZIONE MAGNETICA B SI MISURA IN", "fig": false, "o": ["WEBER*M", "TESLA", "WEBER", "WATT"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 48, "n": 11, "t": "LE PERDITE PER CORRENTI PARASSITE IN UN MATERIALE FERROMAGNETICO -2", "fig": false, "o": ["Sono proporzionali al quadrato dello spessore", "Variano linearmente con lo spessore", "Sono indipendenti dallo spessore", "Dipendono solo dalla frequenza"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 48, "n": 12, "t": "LE PERDITE PER CORRENTI PARASSITE IN UN MATERIALE FERROMAGNETICO -1", "fig": false, "o": ["Sono proporzionali al quadrato della frequenza", "Variano linearmente con la frequenza", "Dipendono solo dallo spessore", "Sono indipendenti dalla frequenza"], "is_open": false, "ans_idx": 1, "no_ans": false, "fig_img": null}, {"l": 48, "n": 13, "t": "NEI MATERIALI FERROMAGNETICI CONSIDERANDO LA CURVA DI MAGNETIZZAZIONE B=f(H) NOTIAMO CHE:", "fig": false, "o": ["Non esiste alcun legame tra B ed H", "La permeabilità magnetica dei materiali è costante", "Per i materiali ferromagnetici non è possibile determinare la curva di magnetizzazione", "La permeabilità magnetica dei materiali non è costante"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 48, "n": 14, "t": "L'INDUZIONE MAGNETICA B E'", "fig": false, "o": ["Il flusso magnetico per la sezione", "Indipendente dall'intensità del campo magnetico", "Una grandezza adimensionale", "La densità del flusso magnetico"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": null}, {"l": 48, "n": 15, "t": "Perdite per isteresi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le perdite per isteresi sono l'energia dissipata in calore in un materiale ferromagnetico ad ogni ciclo di magnetizzazione-smagnetizzazione, proporzionale all'area del ciclo di isteresi B-H e alla frequenza di lavoro (Ph=kh·f·Bmax^n, con n≈1,6-2). Dipendono dal tipo di materiale: i materiali 'dolci' (usati nei trasformatori) hanno cicli stretti per minimizzare queste perdite.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 16, "t": "Perdite per correnti parassite", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Le perdite per correnti parassite (o correnti di Foucault) sono dovute alle correnti indotte all'interno della massa del materiale ferromagnetico da un flusso variabile nel tempo, che si dissipano per effetto Joule. Sono proporzionali al quadrato della frequenza e al quadrato dello spessore delle lamiere; per ridurle i nuclei magnetici si costruiscono laminati (lamierini isolati tra loro) anziché massicci.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 17, "t": "Permeabilità magnetica", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La permeabilità magnetica μ=μ0·μr esprime l'attitudine di un materiale a magnetizzarsi in presenza di un campo magnetico esterno, legando induzione B e campo H tramite B=μH. μ0=4π·10⁻⁷ H/m è la permeabilità del vuoto; μr (adimensionale) è la permeabilità relativa, molto maggiore di 1 per i materiali ferromagnetici e non costante (dipende dal punto di lavoro sulla curva di magnetizzazione).", "no_ans": false, "fig_img": null}, {"l": 48, "n": 18, "t": "Ciclo di isteresi", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Il ciclo di isteresi è la curva chiusa B=f(H) percorsa da un materiale ferromagnetico sottoposto a un campo magnetico H variabile ciclicamente: B non ripercorre lo stesso cammino in salita e discesa, ma 'ritarda' rispetto ad H (isteresi). L'area racchiusa dal ciclo rappresenta l'energia dissipata per isteresi in un ciclo, per unità di volume.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 19, "t": "Regola della mano sinistra", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La regola della mano sinistra si utilizza per determinare il verso della forza di Lorentz F=IL×B su un conduttore percorso da corrente immerso in un campo magnetico: disponendo indice (campo B), medio (corrente I) e pollice perpendicolari tra loro, il pollice indica il verso della forza F.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 20, "t": "Regola della mano destra", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La regola della mano destra si utilizza per determinare il verso del campo magnetico generato da un conduttore percorso da corrente: avvolgendo la mano destra attorno al conduttore con il pollice nel verso della corrente, le altre dita indicano il verso delle linee di campo magnetico (linee concentriche attorno al filo).", "no_ans": false, "fig_img": null}, {"l": 48, "n": 21, "t": "Forze agenti su conduttori paralleli", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Due conduttori paralleli percorsi da corrente si scambiano una forza per unità di lunghezza F/l=μ0·I1·I2/(2πd), dove d è la distanza tra i conduttori: la forza è attrattiva se le correnti hanno lo stesso verso, repulsiva se hanno verso opposto. Questo fenomeno è alla base della definizione storica dell'Ampere.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 22, "t": "Legge di Faraday-Lenz", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "La legge di Faraday-Lenz descrive l'induzione elettromagnetica: la forza elettromotrice indotta in un circuito è pari, in modulo, alla derivata nel tempo del flusso concatenato, e=-dΦ/dt. Il segno meno (legge di Lenz) esprime il fatto che la f.e.m. indotta si oppone sempre alla causa che l'ha generata (variazione di flusso), secondo il principio di conservazione dell'energia.", "no_ans": false, "fig_img": null}, {"l": 48, "n": 23, "t": "Forze agenti su una spira", "fig": false, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Su una spira percorsa da corrente e immersa in un campo magnetico agisce una coppia di forze (momento torcente) che tende a ruotarla fino ad allineare il suo momento magnetico con il campo esterno: M=IS×B, dove S è il vettore area della spira. Questo principio è alla base del funzionamento dei motori elettrici e degli strumenti di misura a bobina mobile.", "no_ans": false, "fig_img": null}, {"l": 49, "n": 1, "t": "NELLA DUALITA' TRA CIRCUITI ELETTRICI E CIRCUITI MAGNETICI", "fig": false, "o": ["La resistenza coincide con il flusso", "Non ci sono corrispondenze tra grandezze elettriche e grandezze magnetiche", "La tensione coincide con N*I (forza magneto-motrice)", "La corrente coincide con la forza magneto-motrice"], "is_open": false, "ans_idx": 2, "no_ans": false, "fig_img": null}, {"l": 49, "n": 2, "t": "Nel circuito in figura il flusso fi2 (quello sul tronco di destra)", "fig": true, "o": ["Tutte vere", "Dipende dalla corrente I2", "Dipende dal materiale con cui è realizzato il circuito magnetico", "Dipende dalla corrente I1"], "is_open": false, "ans_idx": 3, "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAANsAAACvCAIAAAD7UjzAAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAGzklEQVR4nO2Z0ZKsIAwF5/9/2vtwa7dcYTRAEg7Y/TTl4iGaXgeZzwGgxGd2AQB/wEjQAiNBC4wELTAStMBI0AIjQQuMBC0wErTASNACI0ELjAQtMBK0wEjQAiNBC4xcic8P7oN1WKzcN3N269GzpsFSrFTry8FI0AIjQQ7WkSBHk2HVweKmipYF3xg3sjUkGd3KoApGghYYCVrYZbpZL2IkuNH6ol2VEiPBDYtMnxo3IVKv3ip1gBH3deTvZxEpJYqARx4fe9/OuomyDM5Hogiw0Krj4fRATUaiCDDS+nNLxMhoVOoAIxGPvf/DRKSUKALsuBvZuhKIRqIIsLPi0rCJ9Sp+OZeNm/udRYyEcMrtQ8uHhViv4peDkbVzAHqJMrLjLHChvPmWIyJg5Hzc7xVGdubOxfgFkQBGnsHI+WUc3rcLIztzJxLhgU4lGNmZOxGpB2T52THWfkSENxop9YBs2vWwx3YcEeGlRiqUF2dJvpGh/06VMUG5sxCpbTMj44qvjAnKncLvvZv7pCy/qR2/u2cZGVR8ZUxQ7vgp3WTqmH9dZz8sR5oyHxm/hOcxQbmX8ROfWKEkX5rl6ev4SLsEbmKk+w2SoipE9IwdRwZn9OrgfCNbvxSW5kj59yvDLUcGZ/QKtOTwjByivLroK51iZGYU68gh8i8t30hHVIzsO2UJ8m0QMbLvq0/IyJew5TrSXonLKRjpRvmiEzRLxxHfAqpvdcZzn8f01dRx1t6M9Kl1oo4jEbN3vM9h5AT2Xkdi5HpgpPH0r2MGy4ILext53K5PHtcqGDmB7Y38NsvZS+Mp9THjpcCZlxh58/aGkVq8xMgbMFKLlxu5zzqyul6Wwv3mzL6gZzqaeH8HLJlCRrpnOmIvL2Jk9aymDyMT2cc/qoyRbmCkCxjpBka6gJFu6Bh51DaiLUc6Zhk5vTsTI01I , "no_ans": false, "fig_img": null}, {"l": 49, "n": 5, "t": "Del circuito magnetico riportato in figura sono noti N1= 500 spire, I1= 4 A S = 0,5 m2 (sezione ortogonale alle linee di flusso) N2= 400 spire, I2= 8 A, l= 1,2 m, µr= 2.000. Tutti i tronchi hanno uguale sezione S e uguale lunghezza l µ0= 1,257∙10-6 H/m Determinare il valore dell’induzione magnetica B nel tronco AB.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con N1=500 spire, I1=4A, N2=400 spire, I2=8A, S=0,5m², l=1,2m, μr=2000, μ0=1,257·10⁻⁶H/m: si applica la legge di Hopkinson (analoga a Ohm per i circuiti magnetici) al circuito magnetico, calcolando le riluttanze dei vari tronchi (R=l/(μ0·μr·S)) e le forze magnetomotrici (N1I1, N2I2), risolvendo il circuito magnetico equivalente (nodi=flussi, analoghi a correnti; f.m.m.=tensioni) per ottenere il flusso nel tronco AB, quindi B=Φ/S.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAANsAAACvCAIAAAD7UjzAAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAGzklEQVR4nO2Z0ZKsIAwF5/9/2vtwa7dcYTRAEg7Y/TTl4iGaXgeZzwGgxGd2AQB/wEjQAiNBC4wELTAStMBI0AIjQQuMBC0wErTASNACI0ELjAQtMBK0wEjQAiNBC4xcic8P7oN1WKzcN3N269GzpsFSrFTry8FI0AIjQQ7WkSBHk2HVweKmipYF3xg3sjUkGd3KoApGghYYCVrYZbpZL2IkuNH6ol2VEiPBDYtMnxo3IVKv3ip1gBH3deTvZxEpJYqARx4fe9/OuomyDM5Hogiw0Krj4fRATUaiCDDS+nNLxMhoVOoAIxGPvf/DRKSUKALsuBvZuhKIRqIIsLPi0rCJ9Sp+OZeNm/udRYyEcMrtQ8uHhViv4peDkbVzAHqJMrLjLHChvPmWIyJg5Hzc7xVGdubOxfgFkQBGnsHI+WUc3rcLIztzJxLhgU4lGNmZOxGpB2T52THWfkSENxop9YBs2vWwx3YcEeGlRiqUF2dJvpGh/06VMUG5sxCpbTMj44qvjAnKncLvvZv7pCy/qR2/u2cZGVR8ZUxQ7vgp3WTqmH9dZz8sR5oyHxm/hOcxQbmX8ROfWKEkX5rl6ev4SLsEbmKk+w2SoipE9IwdRwZn9OrgfCNbvxSW5kj59yvDLUcGZ/QKtOTwjByivLroK51iZGYU68gh8i8t30hHVIzsO2UJ8m0QMbLvq0/IyJew5TrSXonLKRjpRvmiEzRLxxHfAqpvdcZzn8f01dRx1t6M9Kl1oo4jEbN3vM9h5AT2Xkdi5HpgpPH0r2MGy4ILext53K5PHtcqGDmB7Y38NsvZS+Mp9THjpcCZlxh58/aGkVq8xMgbMFKLlxu5zzqyul6Wwv3mzL6gZzqaeH8HLJlCRrpnOmIvL2Jk9aymDyMT2cc/qoyRbmCkCxjpBka6gJFu6Bh51DaiLUc6Zhk5vTsTI01IGZkDRm7SHowczMRIExiZlomRJjAyLRMjTagZWb7HdEcZp0jLxEgTgkaeT1+lIxjphq i e circuiti magnetici esiste una dualità formale: la forza magnetomotrice N·I corrisponde alla forza elettromotrice E, il flusso magnetico Φ corrisponde alla corrente I, e la riluttanza R corrisponde alla resistenza elettrica. Valgono leggi analoghe a quelle di Ohm (Φ=N·I/R, legge di Hopkinson) e di Kirchhoff (somma dei flussi nulla ad ogni nodo, somma delle f.m.m. nulla in ogni maglia magnetica).", "no_ans": false, "fig_img": null}, {"l": 49, "n": 8, "t": "La spira mostrata in figura ha tre lati fissi ed un lato mobile a velocità costante v(t). Al suo interno si ha un campo magnetico di induzione B(t) costante (ortogonale al piano del foglio, entrante nel foglio); sono noti v(t) = 0,3 m/sec, y = 1 m, B(t)= 2 T, R= 1 Ω, determinare la corrente circolante nella spira ed il verso di circolazione.", "fig": true, "o": [], "is_open": true, "ans_idx": null, "ans_text": "Con v(t)=0,3m/s, y=1m, B(t)=2T (costante), R=1Ω: la f.e.m. indotta è dovuta al moto del lato mobile (f.e.m. mozionale), e=B·y·v(t)=2·1·0,3=0,6V. La corrente circolante è i=e/R=0,6/1=0,6A. Il verso si determina con la legge di Lenz: la corrente indotta deve opporsi all'aumento del flusso concatenato (dovuto all'aumento dell'area della spira), quindi circola in modo da generare un campo magnetico che si oppone a B(t) entrante, cioè in verso antiorario vista dal lato da cui B entra.", "no_ans": false, "fig_img": "iVBORw0KGgoAAAANSUhEUgAAANsAAACvCAIAAAD7UjzAAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAFJElEQVR4nO2c0XLbIBQF8/8/7T5kxm0qRQLEhXOOd5/axEZo2SA5HufrBaDE1+4JAPyAIkELigQtKBK0oEjQgiJBC4oELSgStKBI0IIiQQuKBC0oErSgSNCCIkELigQtKNKPr5/sns5k0s7nc8hr8ZvMs/oEKHJodIimpJmKQf+OHvpzrECqW4p0JdUtRfqx4NK5EYp0JdUtRbqS6pYiXUl1S5GupLqlSFdS3VKkK6luKdKVVLcU6UqqW4p0JdUtRbqS6pYiXUl1S5GupLqlSFdS3VKkK6luKdKVVLcUqUiLtwq3CuslWuRGNRKrQpFVo1Nk2Rwocmh0iiybA0UOjU6RnYdu/wTqxHku++Rr02RqR+88sY1qtFaFPbJqdPbIsjlQ5NDoFFk2B4ocGp0iy+ZAkUOjU2QZLvPsRbRIuCXVLUW6kuqWIl1JdUuRrqS6pUhXUt1SpCupbinSlVS3FOlKqluKdCXVLUW6kuqWIl1JdUuRrqS6pUhXUt1SpCupbsuLTBW3nVSxK86KLi
