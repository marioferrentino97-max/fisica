.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--adim);border-color:var(--accent);color:var(--accent)}
.pill.mc-pill.active{background:var(--gdim);border-color:var(--green);color:var(--green)}
.pill.op-pill.active{background:var(--bdim);border-color:var(--blue);color:var(--blue)}

.qhead{display:flex;align-items:flex-start;gap:11px;padding:13px 17px;}
.qhead:hover{background:rgba(255,255,255,.02)}

.qbadge.mc{background:var(--gdim);color:var(--green);border:1px solid rgba(39,174,96,.2)}
.qbadge.op{background:var(--bdim);color:var(--blue);border:1px solid rgba(93,173,226,.2)}
.qt{font-size:13.5px;line-height:1.6;color:var(--text);flex:1}
.qarrow{color:var(--dim);font-size:10px;margin-top:4px;flex-shrink:0;transition:transform .2s}
.qcard.open .qarrow{transform:rotate(180deg);color:var(--accent)}
.qans{display:none;padding:0 17px 15px 48px}
.qcard.open .qans{display:block}
.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.opt{font-size:12.5px;padding:7px 11px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--surf2);}
.opt.correct{background:var(--gdim);border-color:rgba(39,174,96,.35);color:var(--green);font-weight:600;}
.opt.correct::before{content:"\2713  "}
.open-ans{background:var(--bdim);border:1px solid rgba(93,173,226,.2);border-radius:7px;padding:12px 16px;font-size:13px;color:#cde4f5;line-height:1.8;}

.no-ans{font-family:monospace;font-size:11px;color:var(--dim);padding:7px 11px;border:1px dashed var(--border);border-radius:6px;}
.sec{font-family:monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:22px 0 11px;display:flex;align-items:center;gap:10px;}
.sec::after{content:"";flex:1;height:1px;background:var(--border)}
.empty{text-align:center;padding:60px 20px;color:var(--dim);font-family:monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:640px){aside{display:none}main{padding:12px}}

{l:21,n:9,t:"Descrivere le principali differenze tra le istruzioni if-else e switch-case ed illustrarle con degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"Le due istruzioni servono entrambe a fare scelte, ma funzionano in modo diverso.\n\nL'if-else è più generale: la condizione può essere qualsiasi espressione booleana, come confronti tra variabili, chiamate a metodi, combinazioni logiche. Puoi annidarne quanti vuoi e gestire casi complessi.\n\nLo switch-case invece lavora su un singolo valore (int, char, String, enum) e lo confronta con delle costanti fisse. È più leggibile quando hai molti rami tutti uguali in struttura — tipo \"se vale 1 fai questo, se vale 2 fai quello\".\n\nDifferenza importante: nello switch senza break, l'esecuzione continua nel case successivo (fall-through). Questo può essere un bug o una scelta voluta, ma nell'if-else non succede mai.\n\nIn pratica si preferisce switch-case quando i casi sono numerosi e discreti, if-else quando le condizioni sono più articolate.",no_ans:false},

{l:22,n:10,t:"Descrivere gli operatori booleani e le loro precedenze.",o:[],is_open:true,ans_idx:null,ans_text:"Gli operatori booleani combinano espressioni logiche e restituiscono un booleano.\n\nI principali in Java sono:\n- && (AND logico): true solo se entrambi gli operandi sono true\n- || (OR logico): true se almeno uno è true  \n- ! (NOT): inverte il valore\n\nPoi ci sono le versioni bitwise & e | che valutano sempre entrambi gli operandi, mentre && e || usano il cortocircuito: se il primo operando basta a determinare il risultato, il secondo non viene valutato.\n\nPrecedenza: ! ha la precedenza più alta, poi && e infine ||. Con parentesi si controlla l'ordine esplicitamente.",no_ans:false},

{l:23,n:8,t:"Quale fra le seguenti frasi è falsa se riferita all'operatore assegnamento?",o:["E' un operatore binario","A sinistra dell'assegnamento può esserci soltanto una variabile","\"boolean b = 4 <3\" da errore di \"incompatible types\" in fase di compilazione","La parte destra dell'assegnamento deve essere dello stesso tipo della parte sinistra"],is_open:false,ans_idx:2,no_ans:false},
{l:23,n:9,t:"Descrivere l'operazione di assegnamento di una variabile.",o:[],is_open:true,ans_idx:null,ans_text:"L'assegnamento copia il valore dell'espressione a destra nella variabile a sinistra. L'operatore è =.\n\nEsempio: int x = 5; assegna 5 a x. Poi x = x + 1; calcola x+1 e sovrascrive x con 6.\n\nA sinistra dell'= ci deve stare sempre una variabile (una \"lvalue\"), non un'espressione. A destra invece può esserci qualsiasi espressione compatibile con il tipo della variabile.\n\nJava è strongly typed, quindi il tipo a destra deve essere compatibile con quello a sinistra — altrimenti il compilatore genera errore. L'assegnamento restituisce anche un valore, per questo si può scrivere a = b = 0 (assegna 0 a b e poi a a).",no_ans:false},
{l:23,n:10,t:"Descrivere l'operazione di inizializzazione di una variabile.",o:[],is_open:true,ans_idx:null,ans_text:"Inizializzare una variabile significa assegnarle un valore al momento della dichiarazione, prima di usarla.\n\nEsempio: int contatore = 0; — qui si dichiara e si inizializza in una sola riga.\n\nIn Java le variabili locali (dentro un metodo) non hanno un valore di default: se provi a usarle senza inizializzarle il compilatore dà errore. Le variabili di istanza invece hanno valori default (0 per i numerici, false per i boolean, null per gli oggetti).\n\nÈ buona pratica inizializzare sempre le variabili per evitare comportamenti imprevedibili e rendere il codice più leggibile.",no_ans:false},

{l:24,n:1,t:"Quali tra le seguenti non è una classe di operatori?",o:["boolean","logici","aritmetici","relazionali"],is_open:false,ans_idx:0,no_ans:false},
{l:24,n:2,t:"La negazione è un operatore:",o:["quaternario","unario","binario","ternario"],is_open:false,ans_idx:1,no_ans:false},
{l:24,n:3,t:"L'assegnazione in Java si rappresenta con:",o:[],is_open:true,ans_idx:null,ans_text:"L'assegnazione in Java si rappresenta con il simbolo =.\n\nEsempio: int x = 10; oppure x = x + 5;\n\nÈ un operatore binario: a sinistra c'è la variabile che riceve il valore, a destra l'espressione da valutare. Non va confuso con == che è il confronto di uguaglianza.",no_ans:false},
{l:24,n:4,t:"L'operatore autoincremento è:",o:[],is_open:true,ans_idx:null,ans_text:"L'operatore autoincremento è ++ e aggiunge 1 alla variabile su cui opera.\n\nHa due forme:\n- Prefissa: ++x — incrementa prima, poi restituisce il nuovo valore\n- Postfissa: x++ — restituisce il valore attuale, poi incrementa\n\nEsempio: se x = 5, allora y = ++x dà y=6 e x=6; mentre y = x++ dà y=5 e x=6.",no_ans:false},
{l:24,n:5,t:"Se x vale 14, l'espressione \"3 * -(x - 12)\" quanto vale?",o:[],is_open:true,ans_idx:null,ans_text:"Se x vale 14, l'espressione \"3 * -(x - 12)\" si calcola così:\n\n1. x - 12 = 14 - 12 = 2\n2. -(2) = -2\n3. 3 * (-2) = -6\n\nIl risultato è -6.",no_ans:false},
{l:24,n:6,t:"L'espressione \"a ^ b\", che usa l'operatore XOR, restituisce true se:",o:["se a e b sono false","se entrambi sono false","se a oppure b vale true","se a e b sono true"],is_open:false,ans_idx:2,no_ans:false},
{l:24,n:7,t:"L'espressione \"10 <100 == 5 > 3\" quanto vale?",o:[],is_open:true,ans_idx:null,ans_text:"L'espressione \"10 < 100 == 5 > 3\" si valuta così:\n\nPrima i confronti (< e > hanno precedenza su ==):\n- 10 < 100 → true\n- 5 > 3 → true\n\nPoi il confronto tra booleani:\n- true == true → true\n\nIl risultato è true.",no_ans:false},
{l:24,n:8,t:"L'espressione \"10 % 5\" quanto vale?",o:[],is_open:true,ans_idx:null,ans_text:"L'espressione \"10 % 5\" vale 0.\n\nL'operatore % (modulo) restituisce il resto della divisione intera. 10 diviso 5 fa 2 con resto 0, quindi 10 % 5 = 0.",no_ans:false},
{l:24,n:9,t:"Descrivere che cosa sono e come funzionano gli operatori con associatività a sinistra e fare almeno 3 esempi di espressoni che li utilizzano.",o:[],is_open:true,ans_idx:null,ans_text:"Gli operatori con associatività a sinistra vengono valutati da sinistra a destra quando hanno la stessa precedenza.\n\nEsempio: 10 - 3 - 2 si legge come (10 - 3) - 2 = 5, non come 10 - (3 - 2) = 9. La sottrazione è associativa a sinistra.\n\nLa maggior parte degli operatori Java è associativa a sinistra. L'eccezione principale è l'assegnamento (=) che è associativo a destra: a = b = 0 si legge come a = (b = 0).",no_ans:false},
{l:24,n:10,t:"Scrivere almeno 3 esempi di espressioni logiche e descrivere come possono essere utilizzate nei programmi Java.",o:[],is_open:true,ans_idx:null,ans_text:"Tre esempi di espressioni logiche:\n\n1. (x > 0) && (x < 100) — vera se x è compreso tra 0 e 100 (esclusi)\n2. (nome.equals(\"Mario\")) || (nome.equals(\"Luigi\")) — vera se il nome è Mario o Luigi\n3. !(lista.isEmpty()) — vera se la lista non è vuota\n\nQueste espressioni si usano nelle condizioni di if e cicli. Si possono combinare con && (AND), || (OR) e ! (NOT), rispettando le precedenze: ! prima, poi &&, poi ||. Con le parentesi si può forzare l'ordine di valutazione.",no_ans:false},
{l:24,n:11,t:"Utilizzando il codice Java scrivere un esempio di uso dell'operatore modulo per testare se una variabile intera è pari o dispari.",o:[],is_open:true,ans_idx:null,ans_text:"L'operatore modulo % restituisce il resto della divisione. Si usa classicamente per verificare se un numero è pari o dispari:\n\nint n = 7;\nif (n % 2 == 0) {\n    System.out.println(n + \" è pari\");\n} else {\n    System.out.println(n + \" è dispari\");\n}\n\nSe n % 2 == 0 il numero è pari, altrimenti è dispari. Con n=7 stampa \"7 è dispari\".",no_ans:false},

{l:26,n:9,t:"Scrivere un programma Java che inverta con un ciclo for l'array di caratteri \"char[] a = {'p', 'i', 'p', 'p', 'o', '.'}\" e che lo stampi a video.",o:[],is_open:true,ans_idx:null,ans_text:"char[] ch = {'J','a','v','a'};\nint left = 0;\nint right = ch.length - 1;\n\nfor (; left < right; left++, right--) {\n    char temp = ch[left];\n    ch[left] = ch[right];\n    ch[right] = temp;\n}\n\nSystem.out.println(new String(ch)); // stampa \"avaJ\"\n\nSi usano due indici che partono dai due estremi e si avvicinano al centro, scambiando gli elementi a ogni passo.",no_ans:false},

{l:33,n:9,t:"Scrivere il codice Java del prodotto di una matrice per uno scalare.",o:[],is_open:true,ans_idx:null,ans_text:"double[][] matrice = {{1,2,3},{4,5,6},{7,8,9}};\ndouble scalare = 3.0;\n\nfor (int i = 0; i < matrice.length; i++) {\n    for (int j = 0; j < matrice[i].length; j++) {\n        matrice[i][j] *= scalare;\n    }\n}\n\nIl doppio ciclo for scorre tutte le righe e tutte le colonne, moltiplicando ogni elemento per lo scalare. L'operatore *= è una forma compatta di matrice[i][j] = matrice[i][j] * scalare.",no_ans:false},
// === L034 ===
{l:34,n:1,t:"Descrivere i tipi di passaggio di parametri nelle funzioni del linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"In Java esiste solo il passaggio per valore (pass by value), ma si comporta diversamente a seconda del tipo.\n\nPer i tipi primitivi (int, double, boolean, ecc.) viene copiato il valore: le modifiche al parametro dentro il metodo non influenzano la variabile originale.\n\nPer gli oggetti e gli array viene copiato il riferimento: il parametro punta allo stesso oggetto in memoria dell'originale. Quindi le modifiche ai contenuti dell'oggetto si riflettono fuori, ma se si riassegna il riferimento dentro il metodo (tipo param = new ...) l'originale non cambia.\n\nIn sostanza: Java è sempre pass by value, ma per gli oggetti il valore passato è l'indirizzo di memoria, non una copia dell'oggetto.",no_ans:false},

{l:35,n:9,t:"Scrivere il codice Java di una funzione ricorsiva che calcoli il fattoriale di un numero intero.",o:[],is_open:true,ans_idx:null,ans_text:"public static long fattoriale(int n) {\n    // caso base: il fattoriale di 0 e 1 è 1\n    if (n <= 1) {\n        return 1;\n    }\n    // caso ricorsivo: n! = n * (n-1)!\n    return n * fattoriale(n - 1);\n}\n\nLa funzione si chiama da sola con n-1 ad ogni passo. Il caso base (n<=1) ferma la ricorsione. Per n=5 ad esempio: 5 * 4 * 3 * 2 * 1 = 120.",no_ans:false},

{l:36,n:9,t:"Descrivere la differenza tra la classe String e un array di char.",o:[],is_open:true,ans_idx:null,ans_text:"La differenza principale è nella mutabilità.\n\nUn array di char è mutabile: puoi modificare i singoli caratteri in qualsiasi momento con ch[i] = 'x'. Devi gestire tu la lunghezza e le operazioni sulle stringhe (concatenazione, ricerca, ecc.) a mano.\n\nLa classe String è immutabile: una volta creata, non puoi modificarla. Ogni operazione che sembra modificarla (come concat o replace) crea in realtà un nuovo oggetto String. Questo la rende thread-safe ma potenzialmente inefficiente in loop con molte concatenazioni.\n\nString offre inoltre una ricca libreria di metodi (length, charAt, substring, indexOf, ecc.) che con un array devi implementare da zero.",no_ans:false},
{l:36,n:10,t:"Descrivere la differenza tra la classe String e la classe StringBuffer.",o:[],is_open:true,ans_idx:null,ans_text:"La differenza fondamentale è la mutabilità.\n\nString è immutabile: ogni modifica genera un nuovo oggetto. Questo va bene per stringhe che non cambiano, ma in un ciclo con molte concatenazioni crea tanti oggetti in memoria inutilmente.\n\nStringBuffer è mutabile: le modifiche avvengono sull'oggetto stesso senza crearne di nuovi. Ha metodi come append(), insert(), delete() e reverse() che agiscono direttamente sul buffer. È anche thread-safe (i metodi sono sincronizzati).\n\nIn pratica si usa String per valori fissi e StringBuffer (o StringBuilder, versione non sincronizzata e più veloce) quando si costruisce una stringa pezzo per pezzo.",no_ans:false},

{l:37,n:9,t:"Descrivere il funzionamento dei metodi toUpperCase() e toLowerCase() della classe String e fare degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"toUpperCase() converte tutti i caratteri della stringa in maiuscolo, toLowerCase() in minuscolo. Entrambi restituiscono una nuova String (ricorda che String è immutabile).\n\nEsempi:\nString s = \"Hello World\";\nSystem.out.println(s.toUpperCase()); // \"HELLO WORLD\"\nSystem.out.println(s.toLowerCase()); // \"hello world\"\n\nLa variabile s originale non cambia. Si usano spesso per confronti case-insensitive: s1.toLowerCase().equals(s2.toLowerCase()).",no_ans:false},

{l:38,n:9,t:"Descrivere che cos'è una keyword di Java e fare degli esempi di keyword.",o:[],is_open:true,ans_idx:null,ans_text:"Le keyword (parole chiave o parole riservate) sono identificatori con significato speciale in Java: il compilatore le interpreta in modo prestabilito e non puoi usarle come nomi di variabili, metodi o classi.\n\nEsempi principali:\n- Tipi: int, double, boolean, char, void\n- Controllo del flusso: if, else, for, while, do, switch, break, continue, return\n- OOP: class, extends, implements, interface, new, this, super\n- Modificatori: public, private, protected, static, final, abstract\n- Gestione errori: try, catch, throw, throws, finally\n\nCe ne sono 50 circa in Java. Usarne una come nome di variabile causa errore di compilazione.",no_ans:false},

{l:39,n:9,t:"Descrivere che cos'è un Abstract Data Type e quale relazione ha con il concetto di classe Java.",o:[],is_open:true,ans_idx:null,ans_text:"Un Abstract Data Type (ADT) è una specifica astratta di un tipo di dato: definisce cosa può fare (le operazioni disponibili) senza specificare come è implementato internamente.\n\nAd esempio, una Pila (Stack) come ADT ha le operazioni push, pop e isEmpty — ma non dice nulla su come i dati sono memorizzati (array, lista, ecc.).\n\nIn Java il concetto di ADT si realizza tramite le interfacce: un'interfaccia definisce il contratto (i metodi) e la classe concreta fornisce l'implementazione. In questo modo si separa l'interfaccia pubblica dai dettagli interni, rendendo il codice più modulare e sostituibile.",no_ans:false},
{l:39,n:10,t:"Descrivere la relazione tra classe ed oggetto Java e fare degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"La classe è il progetto, l'oggetto è l'istanza concreta creata da quel progetto.\n\nLa classe definisce struttura (attributi) e comportamento (metodi). L'oggetto è un'entità in memoria con i propri valori per quegli attributi.\n\nEsempio:\nclass Persona {\n    String nome;\n    int eta;\n}\n\nPersona p1 = new Persona(); // p1 è un oggetto\np1.nome = \"Mario\";\np1.eta = 22;\n\nPersona p2 = new Persona(); // p2 è un altro oggetto diverso\np2.nome = \"Luigi\";\n\nDalla stessa classe si possono creare quanti oggetti si vuole, ognuno con il proprio stato indipendente.",no_ans:false},

{l:40,n:9,t:"Scrivere la definizione di metodo statico e le implicazioni di avere dei metodi statici per una classe.",o:[],is_open:true,ans_idx:null,ans_text:"Un metodo statico appartiene alla classe, non a una specifica istanza. Si dichiara con la parola chiave static e si chiama tramite il nome della classe, senza creare un oggetto.\n\nEsempio:\npublic class Utility {\n    public static int somma(int a, int b) {\n        return a + b;\n    }\n}\n// si chiama così:\nint risultato = Utility.somma(3, 5);\n\nImplicazioni: un metodo statico non può accedere agli attributi di istanza (non c'è un this) né chiamare metodi non statici direttamente. È utile per funzioni di utilità generali che non dipendono dallo stato di un oggetto, come i metodi della classe Math.",no_ans:false},
{l:40,n:10,t:"Descrivere che cos'è l'istanza di una classe e come si crea una nuova istanza, riportando degli esempi di codice.",o:[],is_open:true,ans_idx:null,ans_text:"Un'istanza è un oggetto concreto creato a partire da una classe. Si crea con l'operatore new, che alloca memoria nell'heap e chiama il costruttore.\n\nEsempio:\nPersona p = new Persona(\"Mario\", 22);\n\nQui p è un riferimento che punta all'istanza appena creata. Ogni istanza ha i propri valori per gli attributi, indipendenti dalle altre istanze della stessa classe.\n\nLa new è necessaria per le classi non statiche: senza di essa non si può accedere ai metodi e attributi di istanza. Dopo la creazione si interagisce con l'oggetto tramite il riferimento usando il punto (p.nome, p.stampa()).",no_ans:false},

{l:43,n:9,t:"Descrivere che cos'è l'incapsulamento e come si può implementare nel linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"L'incapsulamento è il principio per cui i dettagli interni di una classe vengono nascosti all'esterno. L'idea è che chi usa la classe non deve sapere come è implementata — deve solo sapere cosa fa.\n\nIn Java si implementa dichiarando gli attributi come private e fornendo metodi pubblici getter e setter per accedervi in modo controllato:\n\npublic class ContoBancario {\n    private double saldo; // nascosto\n\n    public double getSaldo() { return saldo; }\n\n    public void deposita(double importo) {\n        if (importo > 0) saldo += importo;\n    }\n}\n\nCosì si protegge lo stato interno da modifiche non valide e si può cambiare l'implementazione interna senza rompere il codice che usa la classe.",no_ans:false},
{l:43,n:10,t:"Descrivere cosa si intende per scopo di una variabile.",o:[],is_open:true,ans_idx:null,ans_text:"Lo scope (visibilità) di una variabile è la porzione di codice in cui quella variabile è accessibile.\n\nIn Java:\n- Variabile locale a un metodo: visibile dal punto in cui è dichiarata fino alla fine del metodo (o del blocco {} in cui si trova)\n- Variabile di blocco (es. dentro un for): visibile solo dentro quel blocco\n- Attributo di istanza: visibile in tutta la classe tramite this\n- Attributo static: visibile in tutta la classe e, se public, anche dall'esterno\n\nEsempio:\nvoid metodo() {\n    int x = 5; // x visibile da qui in poi\n    for (int i = 0; i < 3; i++) {\n        // i visibile solo qui dentro\n    }\n    // i non esiste più qui\n}",no_ans:false},

// === L045 ===
{l:45,n:1,t:"Descrivere cosa si intende per ereditarietà ed illustrarlo con un esempio in codice Java.",o:[],is_open:true,ans_idx:null,ans_text:"L'ereditarietà permette a una classe (sottoclasse) di ereditare attributi e metodi da un'altra classe (superclasse), estendendola o specializzandola. In Java si usa la parola chiave extends.\n\nEsempio:\nclass Animale {\n    String nome;\n    void mangia() { System.out.println(nome + \" mangia\"); }\n}\n\nclass Cane extends Animale {\n    void abbaia() { System.out.println(nome + \" abbaia!\"); }\n}\n\nCane c = new Cane();\nc.nome = \"Rex\";\nc.mangia();  // ereditato da Animale\nc.abbaia();  // proprio di Cane\n\nLa sottoclasse può anche sovrascrivere (override) i metodi della superclasse per cambiarne il comportamento. Java supporta solo ereditarietà singola tra classi (ma multipla tramite interfacce).",no_ans:false},
// === L046 ===
{l:46,n:1,t:"Descrivere cosa si intende per polimorfismo ed illustrarlo con un esempio in codice Java.",o:[],is_open:true,ans_idx:null,ans_text:"Il polimorfismo permette di trattare oggetti di classi diverse in modo uniforme, quando condividono una superclasse o un'interfaccia comune. Il metodo giusto viene scelto a runtime in base al tipo reale dell'oggetto.\n\nEsempio:\nclass Animale {\n    void verso() { System.out.println(\"...\"); }\n}\nclass Cane extends Animale {\n    @Override\n    void verso() { System.out.println(\"Bau!\"); }\n}\nclass Gatto extends Animale {\n    @Override\n    void verso() { System.out.println(\"Miao!\"); }\n}\n\nAnimale[] animali = {new Cane(), new Gatto()};\nfor (Animale a : animali) {\n    a.verso(); // chiama il metodo giusto per ogni oggetto\n}\n\nStampa \"Bau!\" e \"Miao!\" — pur lavorando con riferimenti di tipo Animale, viene eseguito il metodo della classe concreta. Questo si chiama dynamic dispatch o late binding.",no_ans:false},
// === L047 ===
{l:47,n:1,t:"Descrivere che cos'è l'overloading degli operatori e fare un esempio in codice Java.",o:[],is_open:true,ans_idx:null,ans_text:"L'overloading permette di definire più metodi con lo stesso nome ma firma diversa (numero o tipo dei parametri). Il compilatore sceglie quale versione chiamare in base agli argomenti.\n\nEsempio:\nclass Calcolatore {\n    int somma(int a, int b) { return a + b; }\n    double somma(double a, double b) { return a + b; }\n    int somma(int a, int b, int c) { return a + b + c; }\n}\n\nCalcolatore c = new Calcolatore();\nc.somma(2, 3);        // chiama la prima\nc.somma(2.5, 1.5);    // chiama la seconda\nc.somma(1, 2, 3);     // chiama la terza\n\nIl tipo di ritorno da solo non basta a distinguere due metodi — i parametri devono differire.",no_ans:false},
{l:47,n:2,t:"Scrivere una classe Somma che dimostri l’overloading degli operatori in Java.",o:[],is_open:true,ans_idx:null,ans_text:"class Somma {\n    // overloading: stesso nome, parametri diversi\n\n    int somma(int a, int b) {\n        return a + b;\n    }\n\n    double somma(double a, double b) {\n        return a + b;\n    }\n\n    int somma(int a, int b, int c) {\n        return a + b + c;\n    }\n\n    String somma(String a, String b) {\n        return a + b; // concatenazione\n    }\n\n    public static void main(String[] args) {\n        Somma s = new Somma();\n        System.out.println(s.somma(2, 3));         // 5\n        System.out.println(s.somma(1.5, 2.5));     // 4.0\n        System.out.println(s.somma(1, 2, 3));      // 6\n        System.out.println(s.somma(\"Ciao\", \"!\"));  // Ciao!\n    }\n}",no_ans:false},

{l:48,n:8,t:"Tutti i metodi di una interfaccia:",o:["Devono essere privati","Devono essere pubblici","Devono essere implementati","Devono essere liberi"],is_open:false,ans_idx:1,no_ans:false},
{l:48,n:9,t:"Descrivere il problema del diamante nell'ereditarietà multipla e mostrare un esempio.",o:[],is_open:true,ans_idx:null,ans_text:"Il problema del diamante si presenta quando una classe eredita da due classi che a loro volta ereditano dalla stessa classe base: quale versione del metodo ereditato usare?\n\nEsempio ipotetico (non valido in Java con classi):\nclasse A con metodo stampa()\nclasse B extends A, sovrascrive stampa()\nclasse C extends A, sovrascrive stampa()\nclasse D extends B, C → quale stampa() chiama D?\n\nQuesto crea ambiguità. In linguaggi come C++ si gestisce con l'ereditarietà virtuale, ma rimane complesso.",no_ans:false},
{l:48,n:10,t:"Si descriva come il problema dell'ereditarietà multipla viene risolto nel linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"Java risolve il problema non permettendo l'ereditarietà multipla tra classi: una classe può estendere solo una superclasse.\n\nL'ereditarietà multipla è però consentita tramite le interfacce: una classe può implementare quante interfacce vuole. Poiché le interfacce (prima di Java 8) non hanno implementazioni, non c'è ambiguità su quale codice eseguire.\n\nEsempio:\ninterface Cantante { void canta(); }\ninterface Attore { void recita(); }\n\nclass Artista implements Cantante, Attore {\n    public void canta() { System.out.println(\"La la la\"); }\n    public void recita() { System.out.println(\"Che scena!\"); }\n}\n\nCon Java 8+ i metodi default nelle interfacce possono creare ambiguità, che si risolve sovrascrivendo esplicitamente il metodo nella classe che le implementa entrambe.",no_ans:false},
{l:48,n:11,t:"Descrivere la differenza tra ereditarietà normale ed ereditarietà multipla e mostrare degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"L'ereditarietà normale (singola) permette a una classe di ereditare da una sola superclasse. Si usa extends.\n\nEsempio:\nclass Veicolo { int velocita; }\nclass Auto extends Veicolo { int porte; }\n\nL'ereditarietà multipla permetterebbe di ereditare da più classi contemporaneamente, ma Java non la supporta tra classi per evitare il problema del diamante.\n\nLa soluzione Java è usare le interfacce per simulare l'ereditarietà multipla:\ninterface Volante { void vola(); }\ninterface Nuotante { void nuota(); }\nclass Anatra implements Volante, Nuotante {\n    public void vola() { ... }\n    public void nuota() { ... }\n}\n\nCosì si ottiene la flessibilità dell'ereditarietà multipla senza le ambiguità.",no_ans:false},

{l:49,n:3,t:"L'errore \"java.lang.NullPointerException\" si genera:",o:["Se un oggetto contiene troppi dati","Se i puntatori degli oggetti si incrociano","Quando un oggetto è stato allocato ma gli attributi sono vuoti","Se si cerca di accedere ad una variabile che è stata associata a null"],is_open:false,ans_idx:3,no_ans:false},
{l:49,n:4,t:"Le seguenti istruzioni in Java: Persona p=null; p.nome=\"Mario\"; provocano:",o:["Un errore perchè p non punta ad alcuna locazione di memoria","Nessun effetto perchè p non esiste in memoria","La memorizzazione della stringa \"Mario\" alla variabile nome di p","L'associazione di null alla variabile nome di p"],is_open:false,ans_idx:0,no_ans:false},

{l:49,n:6,t:"In Java, quando si assegna il valore null ad un oggetto:",o:["Esso non esiste in memoria","Viene salvato come valore zero","Viene salvato come valore -1","Viene salvato come valore speciale e memorizzato nella locazione di memoria dell'oggetto"],is_open:false,ans_idx:3,no_ans:false},
{l:49,n:7,t:"Una stringa String s che non è inizializzata:",o:["Contiene un valore nullo memorizzato in memoria","Non esiste come variabile e non può essere usata","Contiene un valore nullo ovvero non esiste in memoria","Non si può usare perchè vuota"],is_open:false,ans_idx:1,no_ans:false},
{l:49,n:8,t:"In Java, relativamente ai valori nulli, le variabili definite come tipi complessi:",o:["Possono contenere valori nulli","Non possono contenere valori nulli","Possono contenere esclusivamente valori nulli","Possono contenere solo valori nulli"],is_open:false,ans_idx:1,no_ans:false},
{l:49,n:9,t:"Definire che cos'è il valore null in java, cosa significa e come si usa. Fornire inoltre un esempio di codice che controlli se una variabile contiene il valore nullo.",o:[],is_open:true,ans_idx:null,ans_text:"null in Java è un valore speciale che indica che un riferimento non punta ad alcun oggetto in memoria.\n\nSi usa per dichiarare che una variabile oggetto non è ancora inizializzata:\nString s = null;\n\nImplicazioni:\n- Assegnare null non libera subito la memoria: ci pensa il Garbage Collector quando non ci sono più riferimenti all'oggetto\n- Accedere a un membro di una variabile null causa NullPointerException a runtime\n- Si può verificare con: if (s != null) prima di usarla\n\nEsempio:\nPersona p = null;\np.nome = \"Mario\"; // NullPointerException!\n\np = new Persona();\np.nome = \"Mario\"; // OK",no_ans:false},
// === L050 ===
{l:50,n:1,t:"Descrivere che cos'è e a che cosa serve un metodo astratto in Java e fornire un esempio di codice.",o:[],is_open:true,ans_idx:null,ans_text:"Un metodo astratto è un metodo dichiarato senza corpo (senza implementazione), usando la parola chiave abstract. Chi lo dichiara dice \"questo metodo esiste, ma l'implementazione la fornirà la sottoclasse\".\n\nServe per definire un'interfaccia comune a tutte le sottoclassi, garantendo che ciascuna implementi quel metodo.\n\nEsempio:\nabstract class Forma {\n    abstract double area(); // nessun corpo\n}\n\nclass Cerchio extends Forma {\n    double raggio;\n    @Override\n    double area() { return Math.PI * raggio * raggio; }\n}\n\nclass Rettangolo extends Forma {\n    double base, altezza;\n    @Override\n    double area() { return base * altezza; }\n}\n\nNon si può chiamare direttamente area() su un oggetto Forma, ma si può lavorare con riferimenti di tipo Forma che puntano a sottoclassi concrete.",no_ans:false},
{l:50,n:2,t:"Descrivere che cos'è e a che cosa serve una classe astratta in Java e fornire un esempio di codice.",o:[],is_open:true,ans_idx:null,ans_text:"Una classe astratta è una classe che non può essere istanziata direttamente — non si può fare new ClasseAstratta(). Serve come \"template\" per le sottoclassi.\n\nSi dichiara con abstract davanti a class e può contenere sia metodi astratti (senza implementazione) che metodi concreti (con implementazione).\n\nEsempio:\nabstract class Animale {\n    String nome;\n\n    abstract void verso(); // da implementare nelle sottoclassi\n\n    void respira() { // metodo concreto condiviso\n        System.out.println(nome + \" respira\");\n    }\n}\n\nclass Cane extends Animale {\n    @Override\n    void verso() { System.out.println(\"Bau!\"); }\n}\n\n// Animale a = new Animale(); // ERRORE\nAnimale a = new Cane();       // OK — riferimento astratto, oggetto concreto\na.verso();    // \"Bau!\"\na.respira();  // ereditato",no_ans:false},

{l:51,n:7,t:"Per importare tutte le classi al package \"miopackage\" si usa:",o:["import All miopackage","import miopackage.*","import miopackage","import All class in miopackage"],is_open:false,ans_idx:1,no_ans:false},
{l:51,n:8,t:"In relazione ai package, un programmatore può:",o:["Importare solo package che non siano i suoi","Definire ma non includere un proprio package","Definire ma non usare un proprio package","Definire ed usare un proprio package"],is_open:false,ans_idx:3,no_ans:false},
{l:51,n:9,t:"Che cos'è e a che cosa serve un package nel linguaggio Java? Fornire un esempio di codice Java che dichiari una classe \"Analisi\" appartenente al package",o:[],is_open:true,ans_idx:null,ans_text:"Un package in Java è un modo per raggruppare classi correlate in un unico \"contenitore\" logico, evitando conflitti di nomi e organizzando il codice in modo gerarchico.\n\nSi dichiara all'inizio del file con package nomepackage; e si usa nei propri file con import.\n\nEsempio:\n// file: animali/Cane.java\npackage animali;\n\npublic class Cane {\n    public void abbaia() { System.out.println(\"Bau!\"); }\n}\n\n// file: Main.java\nimport animali.Cane;\n\npublic class Main {\n    public static void main(String[] args) {\n        Cane c = new Cane();\n        c.abbaia();\n    }\n}\n\nI package standard di Java (java.lang, java.util, java.io, ecc.) seguono lo stesso schema. java.lang è importato automaticamente.",no_ans:false},

{l:52,n:1,t:"A cosa servono i modificatori di accesso?",o:["A stabilire la correttezza di un attributo o di un metodo","A stabilire le politiche di visibilità di un attributo o di un metodo","A modificare l'accesso di un attributo ma non di un metodo","A verificare le politiche di visibilità di un attributo o di un metodo"],is_open:false,ans_idx:1,no_ans:false},
{l:52,n:2,t:"Come si definisce in Java la politica di accesso di un metodo?",o:["Verificandone la correttezza formale","Con l'indice di livello del metodo","Con le politiche di programmazione","Con un modificatore di accesso"],is_open:false,ans_idx:3,no_ans:false},
{l:52,n:3,t:"A cosa serve la visibilità public?",o:["A inibire l'accesso di un metodo alle sottoclassi","A rendere accessibile il metodo main al Sistema Operativo","A pubblicare un metodo in un package","A inibire l'accesso di un metodo alla superclasse"],is_open:false,ans_idx:1,no_ans:false},
{l:52,n:4,t:"Per quale motivo si usa il livello di visibilità private?",o:["Per rendere metodi e attributi inaccessibili anche dalla classe che li contiene","Per rendere attributi accessibili solo dalle sottoclassi","Per rendere metodi inaccessibili e incapsulare attributi","Per rendere metodi accessibili solo da classi dello stesso package"],is_open:false,ans_idx:2,no_ans:false},
{l:52,n:5,t:"Per quale motivo si usa il livello di visibilità protected?",o:["Per permettere l'accesso ad attributi e metodi anche alle sottoclassi","Per permettere l'accesso solo da classi dello stesso package","Per proteggere l'accesso di metodi e attributi da parte di tutte le altre classi","Per rendere metodi accessibili solo da classi dello stesso package"],is_open:false,ans_idx:0,no_ans:false},
{l:52,n:6,t:"Per quale motivo si usa il livello di visibilità package?",o:["Per permettere l'accesso solo da classi dello stesso package","Per rendere metodi inaccessibili e incapsulare attributi","Per rendere package inaccessibili","Per permettere l'accesso ad attributi e metodi anche alle sottoclassi"],is_open:false,ans_idx:0,no_ans:false},
{l:52,n:7,t:"Nel linguaggio Java esiste la possibilità di rendere una risorsa non accessibile anche alla classe cui appartiene?",o:[],is_open:true,ans_idx:null,ans_text:"Sì, si usa il modificatore private. Un attributo o metodo dichiarato private è accessibile solo dall'interno della stessa classe — non dalle sottoclassi né da classi esterne.\n\nEsempio:\npublic class ContoBancario {\n    private double saldo; // nessuno può accedere direttamente\n\n    public double getSaldo() { return saldo; } // accesso controllato\n    public void deposita(double importo) {\n        if (importo > 0) saldo += importo;\n    }\n}\n\n// Dall'esterno:\nContoBancario c = new ContoBancario();\n// c.saldo = 1000; // ERRORE di compilazione\nc.deposita(1000);  // OK — tramite metodo pubblico",no_ans:false},
{l:52,n:8,t:"Quanti sono e con quale parola chiave si indicano i livelli di visibilità in Java?",o:["Sono 4, indicati con \"public\", \"private\", \"protected\" e \"\"","Sono 2, indicati con \"public\" e \"private\"","Sono 3, indicati con \"public\", \"private\" e \"protected\"","Sono 4, indicati con \"public\", \"private\", \"protected\" e \"package\""],is_open:false,ans_idx:0,no_ans:false},
{l:52,n:9,t:"Spiegare quali sono i modificatori di accesso, a cosa servono e come si indicano nel codice con degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"I modificatori di accesso controllano la visibilità di classi, metodi e attributi. In Java ce ne sono quattro livelli:\n\n1. public — accessibile da ovunque\n2. protected — accessibile dalla stessa classe, dallo stesso package e dalle sottoclassi\n3. (nessun modificatore, detto package-private) — accessibile solo all'interno dello stesso package\n4. private — accessibile solo all'interno della stessa classe\n\nSi indicano mettendo la parola chiave prima del tipo nella dichiarazione:\n\npublic int x;\nprivate String nome;\nprotected double stipendio;\nint valore; // package-private\n\nIl principio guida è il minimo privilegio: rendere ogni membro il meno visibile possibile, per proteggere l'implementazione interna.",no_ans:false},

{l:53,n:3,t:"La funzione \"public String toString()\" cosa fa?",o:["Ritorna una rappresentazione in formato float dell'oggetto","Ritorna una rappresentazione in formato stringa dell'oggetto","Ritorna una rappresentazione in formato intera dell'oggetto","Ritorna una rappresentazione in formato double dell'oggetto"],is_open:false,ans_idx:1,no_ans:false},

{l:53,n:5,t:"Per definire un ordinamento esiste l'interfaccia Comparable. Per usarla bisogna:",o:["Definire oggetti dell'interfaccia","Implementare i metodi dell'interfaccia","Istanziare oggetti dell'interfaccia","Usare i metodi dell'interfaccia"],is_open:false,ans_idx:1,no_ans:false},
{l:53,n:6,t:"La funzione \"protected Object clone()\" della classe Object:",o:["Crea e ritorna un puntatore all'oggetto","Crea e ritorna una copia degli oggetti in memoria","Crea e ritorna una copia di tutti gli Object","Crea e ritorna una copia di questo oggetto"],is_open:false,ans_idx:3,no_ans:false},
{l:53,n:7,t:"La funzione della classe oggetto \"int compareTo(Object o)\":",o:["Ritorna false se l'oggetto su cui si invoca il metodo non è uguale a \"o\"","Ritorna uno se l'oggetto su cui si invoca il metodo è uguale a \"o\"","Ritorna uno se l'oggetto su cui si invoca il metodo è maggiore di \"o\"","Ritorna true se l'oggetto su cui si invoca il metodo è uguale a \"o\""],is_open:false,ans_idx:2,no_ans:false},
{l:53,n:8,t:"Il metodo \"protected void finalize()\" è chiamato:",o:["dal Garbage Collector quando esso rileva che l'oggetto corrente non è più raggiungibile","dal compilatore quando esso rileva che l'oggetto corrente non è più raggiungibile","dal Sistema Operativo quando esso rileva che l'oggetto corrente non è più raggiungibile","dall'utente quando esso rileva che l'oggetto corrente non è più raggiungibile"],is_open:false,ans_idx:0,no_ans:false},
{l:53,n:9,t:"Descrivere quali sono i metodi più importanti ereditati dalla classe Object.",o:[],is_open:true,ans_idx:null,ans_text:"La classe Object è la superclasse di tutte le classi Java. I metodi più importanti che si ereditano da essa sono:\n\ntoString() — restituisce una rappresentazione stringa dell'oggetto. Di default mostra il nome della classe e l'hashcode, ma si fa quasi sempre l'override per avere qualcosa di utile.\n\nequals(Object o) — confronta l'oggetto con un altro. Di default confronta i riferimenti (come ==), ma si fa l'override per confrontare il contenuto.\n\nhashCode() — restituisce un intero che identifica l'oggetto. Se si fa override di equals, va fatto anche di hashCode per garantire la coerenza con le strutture come HashMap.\n\nclone() — crea una copia dell'oggetto (richiede l'implementazione di Cloneable).\n\ngetClass() — restituisce l'oggetto Class che rappresenta il tipo runtime dell'oggetto.\n\nfinalize() — chiamato dal Garbage Collector prima di liberare la memoria (deprecato nelle versioni recenti).",no_ans:false},
{l:53,n:10,t:"Spiegare a cosa serve e come funziona l'interfaccia Comparable, fornendo un esempio in codice Java di una classe che la implementi.",o:[],is_open:true,ans_idx:null,ans_text:"L'interfaccia Comparable serve per definire un ordinamento naturale sugli oggetti di una classe. Chi la implementa deve fornire il metodo compareTo(Object o).\n\nIl metodo restituisce:\n- un numero negativo se this viene prima di o\n- zero se sono uguali\n- un numero positivo se this viene dopo o\n\nEsempio:\nclass Persona implements Comparable<Persona> {\n    String nome;\n    int eta;\n\n    @Override\n    public int compareTo(Persona altra) {\n        return this.eta - altra.eta; // ordine per età crescente\n    }\n}\n\n// Una volta implementato, si può usare con Collections.sort():\nList<Persona> persone = new ArrayList<>();\npersone.add(new Persona(\"Mario\", 22));\npersone.add(new Persona(\"Luigi\", 19));\nCollections.sort(persone); // ordina per età",no_ans:false},
// === L055 ===
{l:55,n:1,t:"Usando i metodi della classe Math di Java per la conversione degli angoli espressi in gradi o in radianti, scrivere un esempio di codice che converta l'angolo pi",o:[],is_open:true,ans_idx:null,ans_text:"I metodi della classe Math lavorano in radianti. Per convertire da gradi a radianti si usa Math.toRadians(), e per il contrario Math.toDegrees().\n\nEsempio:\ndouble gradi = 90.0;\ndouble radianti = Math.toRadians(gradi); // π/2 ≈ 1.5708\n\ndouble sinVal = Math.sin(radianti);  // 1.0\ndouble cosVal = Math.cos(radianti);  // ≈ 0.0\ndouble tanVal = Math.tan(Math.toRadians(45)); // 1.0\n\ndouble angolo = Math.toDegrees(Math.asin(1.0)); // 90.0\n\nLe funzioni trigonometriche disponibili sono sin(), cos(), tan(), asin(), acos(), atan() e atan2().",no_ans:false},
{l:55,n:2,t:"Elencare e descrivere le funzioni per il calcolo dei logaritmi presenti nella classe Math di Java.",o:[],is_open:true,ans_idx:null,ans_text:"La classe Math offre due funzioni per i logaritmi:\n\nMath.log(double x) — calcola il logaritmo naturale (base e) di x.\nEsempio: Math.log(Math.E) → 1.0\n\nMath.log10(double x) — calcola il logaritmo in base 10 di x.\nEsempio: Math.log10(1000) → 3.0\n\nPer calcolare il logaritmo in una base arbitraria b si usa la formula del cambio di base:\nlogb(x) = Math.log(x) / Math.log(b)\n\nEsempio, log2(8):\ndouble log2 = Math.log(8) / Math.log(2); // → 3.0",no_ans:false},

{l:58,n:9,t:"Scrivere in codice Java e commentare il metodo toString() della classe Lista semplicemente linkata.",o:[],is_open:true,ans_idx:null,ans_text:"// Metodo toString() per una Lista semplicemente linkata\npublic String toString() {\n    String risultato = \"[\";\n    Nodo aux = head; // parto dalla testa\n\n    while (aux != null) {\n        risultato += aux.getInfo();\n        if (aux.getNext() != null) {\n            risultato += \" -> \";\n        }\n        aux = aux.getNext(); // avanzo al nodo successivo\n    }\n\n    risultato += \"]\";\n    return risultato;\n}\n\n// Esempio di output per una lista 1->2->3: \"[1 -> 2 -> 3]\"\n\nIl metodo scorre tutta la lista partendo dalla testa, aggiungendo il valore di ogni nodo alla stringa. La condizione aux != null termina il ciclo quando si raggiunge la fine della lista.",no_ans:false},
{l:58,n:10,t:"Descrivere il contenuto della classe Nodo e fare un esempio di implementazione della classe in codice Java.",o:[],is_open:true,ans_idx:null,ans_text:"La classe Nodo è l'elemento base della lista. Contiene l'informazione da memorizzare e un riferimento al nodo successivo.\n\nImplementazione:\npublic class Nodo {\n    private int info;     // il dato memorizzato\n    private Nodo next;    // riferimento al nodo successivo (null se è l'ultimo)\n\n    public Nodo(int info) {\n        this.info = info;\n        this.next = null;\n    }\n\n    public int getInfo() { return info; }\n    public void setInfo(int info) { this.info = info; }\n    public Nodo getNext() { return next; }\n    public void setNext(Nodo next) { this.next = next; }\n}\n\nLa definizione di next come Nodo rende la classe ricorsiva: ogni nodo contiene un riferimento al tipo stesso. Quando next è null, siamo all'ultimo nodo della lista.",no_ans:false},
// === L059 ===
{l:59,n:1,t:"Scrivere in codice Java e commentare un metodo che verifichi se una Lista semplicemente linkata è vuota oppure no (restituisce treu se vuota, false",o:[],is_open:true,ans_idx:null,ans_text:"// Verifica se la lista è vuota\npublic boolean isEmpty() {\n    return head == null;\n}\n\n// Oppure, con un metodo più esplicito:\npublic boolean isEmpty() {\n    if (head == null) {\n        return true;  // la lista non ha elementi\n    }\n    return false;\n}\n\nUna lista semplicemente linkata è vuota quando il riferimento alla testa (head) vale null, cioè non punta ad alcun nodo. È il caso iniziale subito dopo la creazione della lista.",no_ans:false},
{l:59,n:2,t:"Scrivere in codice Java e commentare il metodo di inserimento in testa della classe Lista semplicemente Linkata.",o:[],is_open:true,ans_idx:null,ans_text:"// Inserimento in testa: il nuovo nodo diventa la nuova testa\npublic void inserisciInTesta(int valore) {\n    Nodo nuovo = new Nodo(valore); // creo il nuovo nodo\n\n    nuovo.setNext(head); // il nuovo nodo punta alla vecchia testa\n    head = nuovo;        // la testa ora è il nuovo nodo\n}\n\n// Esempio: lista [2->3], inserisco 1\n// dopo: [1->2->3]\n\nL'ordine delle istruzioni è importante: prima collego il nuovo nodo al resto della lista (nuovo.setNext(head)), poi sposto la testa. Se facessimo prima head = nuovo, perderemmo il riferimento al resto della lista.",no_ans:false},

{l:60,n:4,t:"L'espressione \"(aux!=null && aux.getInfo()<key)\" con aux variabile ausiliaria Nodo di una Lista:",o:["Vale true se aux punta ad un nodo inesistente","Vale true se aux punta ad un nodo esistente (non nullo) o se il valore info contenuto nel nodo è minore di \"key\"","Vale true se aux punta ad un nodo esistente (non nullo) e se il valore info contenuto nel nodo è minore di \"key\"","Vale true se aux punta ad un nodo esistente (non nullo) e se l'attributo info contenuto nel nodo è maggiore di \"key\""],is_open:false,ans_idx:2,no_ans:false},
{l:60,n:5,t:"Nel caso di ricerca di un nodo avente \"info=3\" in una Lista ordinata di interi:",o:["La ricerca visita la lista e per ogni nodo se trova il valore 3 si ferma e ritorna il riferimento al nodo","La ricerca visita la lista e per ogni nodo se trova il valore 3 continua a visitare e ritorna il riferimento al nodo","La ricerca visita tutta la lista e se trova il valore 3 in una info ritorna true e continua a visitare la lista","La ricerca visita tutta la lista e se trova il valore 3 in una info cancella il resto della lista e ritorna il riferimento al nodo"],is_open:false,ans_idx:1,no_ans:false},
{l:60,n:6,t:"L'espressione \"(aux != null && aux.getInfo() == key)\" ritorna:",o:["True se il valore della variabile aux è null e se il contenuto dell'info nel nodo è diverso al valore key","True se il valore della variabile aux è non null e se il contenuto dell'info nel nodo è diverso al valore key","True se il valore della variabile aux è non null e se il contenuto dell'info nel nodo è pari al valore key","True se il valore della variabile aux è non null o se il contenuto dell'info nel nodo è diverso al valore key"],is_open:false,ans_idx:1,no_ans:false},

{l:60,n:8,t:"Per ricercare un valore in una lista:",o:["Si parte facendo assegnando null alla variabile temporanea aux di tipo Nodo","Si parte facendo puntare una variabile temporanea aux di tipo Nodo alla testa della lista","Si parte facendo puntare una variabile temporanea aux di tipo Nodo al centro della lista","Si parte facendo puntare una variabile temporanea aux di tipo Nodo alla coda della lista"],is_open:false,ans_idx:1,no_ans:false},
{l:60,n:9,t:"Scrivere in codice java e commentare un metodo di ricerca di un nodo in una Lista semplicemente linkata non ordinata.",o:[],is_open:true,ans_idx:null,ans_text:"// Ricerca di un nodo con valore key in una lista non ordinata\npublic boolean cerca(int key) {\n    Nodo aux = head; // parto dalla testa\n\n    while (aux != null) {\n        if (aux.getInfo() == key) {\n            return true; // trovato!\n        }\n        aux = aux.getNext(); // passo al nodo successivo\n    }\n\n    return false; // non trovato dopo aver scorso tutta la lista\n}\n\nIl metodo scorre la lista nodo per nodo. Se trova un nodo con il valore cercato restituisce true, altrimenti quando aux diventa null (fine lista) restituisce false. In una lista non ordinata non si può ottimizzare: nel caso peggiore si deve scorrere tutta la lista.",no_ans:false},

{l:61,n:4,t:"Dati due nodi Nodo1 e Nodo2 di una Lista, cosa fa l'istruzione \"Nodo1.setNext(Nodo2.getNext())\"?",o:["Fa sì che entrambi i nodi abbiano lo stesso nodo successivo","Fa sì che il secondo nodo sia sostituito dal primo","Elimina la testa della Lista","Elimina il primo e il secondo nodo"],is_open:false,ans_idx:0,no_ans:false},
{l:61,n:5,t:"Per eliminare l'ultimo nodo di una Lista semplicemente linkata:",o:["Basta partire dal nodo in coda","Basta eliminare il nodo di testa","Devo scorrere prima tutti i nodi della Lista partendo dalla coda","Devo scorrere prima tutti i nodi della Lista partendo dalla testa"],is_open:false,ans_idx:2,no_ans:false},

{l:61,n:8,t:"Per eliminare un nodo da una Lista:",o:["E' necessario manipolare gli attributi next dei nodi in modo da lasciare la struttura sempre concatenata","E' necessario manipolare solo la testa della lista","Non serve considerare la posizione del nodo","E' necessario manipolare gli attributi info dei nodi in modo da lasciare la struttura sempre concatenata"],is_open:false,ans_idx:0,no_ans:false},
{l:61,n:9,t:"Scrivere in codice Java e commentare un metodo che effettui l'eliminazione del nodo di testa di una Lista semplicemente linkata.",o:[],is_open:true,ans_idx:null,ans_text:"// Eliminazione del primo nodo della lista\npublic void eliminaTesta() {\n    if (head == null) {\n        return; // lista vuota, niente da eliminare\n    }\n\n    // caso: un solo nodo\n    if (head.getNext() == null) {\n        head = null; // la lista diventa vuota\n        return;\n    }\n\n    // caso generale: la testa diventa il secondo nodo\n    head = head.getNext();\n}\n\nSpostare head al nodo successivo è sufficiente: il vecchio primo nodo diventa irraggiungibile e verrà liberato dal Garbage Collector. Non serve azzerare esplicitamente il riferimento next del vecchio nodo.",no_ans:false},

{l:62,n:8,t:"Una lista doppiamente linkata:",o:["E' una lista in cui ogni nodo ha un puntatore al successivo ed uno al precedente","E' una lista doppia","E' una lista in cui ogni nodo può memorizzare due valori","E' l'unico tipo di lista in cui i nodi sono collegati fra loro"],is_open:false,ans_idx:0,no_ans:false},
{l:62,n:9,t:"Descrivere la struttura di una Lista doppiamente linkata e scrivere il codice della classe in linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"Una Lista doppiamente linkata ha ogni nodo collegato sia al successivo che al precedente, permettendo la navigazione in entrambe le direzioni.\n\nLa classe Lista doppia ha in genere due riferimenti: head (testa) e tail (coda).\n\nClasse Nodo per lista doppia:\npublic class NodoDoppio {\n    private int info;\n    private NodoDoppio next;\n    private NodoDoppio prev;\n\n    public NodoDoppio(int info) {\n        this.info = info;\n        this.next = null;\n        this.prev = null;\n    }\n    // getter e setter...\n}\n\nVantaggio rispetto alla lista semplice: si può scorrere in entrambe le direzioni e rimuovere un nodo in O(1) se si ha già il riferimento a quel nodo, senza dover scorrere dalla testa per trovare il precedente.",no_ans:false},
{l:62,n:10,t:"Descrivere la struttura di un Nodo per una Lista doppiamente linkata e scrivere il codice della classe in linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"Il Nodo di una lista doppiamente linkata contiene tre campi: il dato e due riferimenti, uno al nodo successivo e uno al precedente.\n\npublic class NodoDoppio {\n    private int info;\n    private NodoDoppio next; // punta al nodo successivo\n    private NodoDoppio prev; // punta al nodo precedente\n\n    public NodoDoppio(int info) {\n        this.info = info;\n        this.next = null;\n        this.prev = null;\n    }\n\n    public int getInfo() { return info; }\n    public NodoDoppio getNext() { return next; }\n    public NodoDoppio getPrev() { return prev; }\n    public void setNext(NodoDoppio n) { next = n; }\n    public void setPrev(NodoDoppio p) { prev = p; }\n}\n\nIl primo nodo ha prev == null, l'ultimo ha next == null. Questa struttura rende più semplice l'eliminazione di un nodo intermedio: si ha già il riferimento al precedente.",no_ans:false},

{l:64,n:9,t:"Descrivere la struttura del Nodo di un Albero Binario e scrivere il codice della lcasse in linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"Il nodo di un albero binario è simile a quello di una lista, ma con due riferimenti ai figli invece di uno.\n\npublic class NodoAlbero {\n    private int info;\n    private NodoAlbero sinistro; // figlio sinistro\n    private NodoAlbero destro;   // figlio destro\n\n    public NodoAlbero(int info) {\n        this.info = info;\n        this.sinistro = null;\n        this.destro = null;\n    }\n\n    public int getInfo() { return info; }\n    public NodoAlbero getSinistro() { return sinistro; }\n    public NodoAlbero getDestro() { return destro; }\n    public void setSinistro(NodoAlbero n) { sinistro = n; }\n    public void setDestro(NodoAlbero n) { destro = n; }\n}\n\nUn nodo è foglia quando sia sinistro che destro sono null. Le visite (preorder, inorder, postorder) si implementano ricorsivamente partendo dalla radice.",no_ans:false},
{l:64,n:10,t:"Descrivere la struttura di un Albero Binario e scrivere il codice della lcasse in linguaggio Java.",o:[],is_open:true,ans_idx:null,ans_text:"Un albero binario è una struttura in cui ogni nodo ha al più due figli: sinistro e destro. La radice è il nodo senza padre, le foglie sono i nodi senza figli.\n\npublic class AlberoBinario {\n    private NodoAlbero radice;\n\n    public AlberoBinario() {\n        this.radice = null; // albero vuoto\n    }\n\n    // Visita inorder (sinistro, radice, destro) — stampa in ordine crescente se è un BST\n    public void inorder(NodoAlbero nodo) {\n        if (nodo == null) return;\n        inorder(nodo.getSinistro());\n        System.out.print(nodo.getInfo() + \" \");\n        inorder(nodo.getDestro());\n    }\n\n    // Visita preorder (radice, sinistro, destro)\n    public void preorder(NodoAlbero nodo) {\n        if (nodo == null) return;\n        System.out.print(nodo.getInfo() + \" \");\n        preorder(nodo.getSinistro());\n        preorder(nodo.getDestro());\n    }\n\n    public void stampa() { inorder(radice); }\n}",no_ans:false},

{l:65,n:9,t:"Descrivere il ruolo di ciascuna delle interfacce Collection, List, Set e Queue e il rapporto che esiste fra di loro in termini di gerarchia.",o:[],is_open:true,ans_idx:null,ans_text:"Le interfacce principali del Collections Framework servono a modellare diversi tipi di strutture dati:\n\nCollection — interfaccia radice. Definisce le operazioni base: add, remove, contains, size, isEmpty, iterator.\n\nList — estende Collection. Sequenza ordinata con duplicati. Si accede agli elementi per indice. Implementazioni: ArrayList, LinkedList.\n\nSet — estende Collection. Non ammette duplicati. Non garantisce un ordine specifico (salvo SortedSet). Implementazioni: HashSet, TreeSet.\n\nQueue — estende Collection. Struttura FIFO (first in, first out). Operazioni principali: offer (aggiunge), poll (rimuove e restituisce la testa), peek (legge la testa senza rimuoverla). Implementazioni: LinkedList, PriorityQueue.\n\nMap — non estende Collection. Mappa chiavi su valori (coppie key-value). Implementazioni: HashMap, TreeMap.",no_ans:false},
{l:65,n:10,t:"Descrivere che cos'è il Collections Framework di Java ed elencare le interfacce principali.",o:[],is_open:true,ans_idx:null,ans_text:"Il Collections Framework è una libreria Java che fornisce strutture dati generiche pronte all'uso, contenuta nel package java.util. Evita di riscrivere da zero liste, code, insiemi ecc.\n\nLe interfacce principali sono:\n- Collection — base di tutto\n- List — sequenza ordinata (ArrayList, LinkedList)\n- Set — insieme senza duplicati (HashSet, TreeSet)\n- Queue — coda FIFO (LinkedList, PriorityQueue)\n- Map — mappa chiave-valore (HashMap, TreeMap) — non estende Collection\n\nOgni interfaccia definisce un contratto (i metodi disponibili) e le classi concrete forniscono l'implementazione. Si può quindi scrivere codice che lavora con List senza preoccuparsi se sotto c'è un ArrayList o una LinkedList — basta cambiare la creazione.",no_ans:false},

{l:66,n:5,t:"Come si scorrono gli elementi di una Collection?",o:["Dipende dalla sottoclasse concreta che si sta considerando","Con un oggetto di tipo Iterator","Iterando un oggetto wrapper numerico","Con un puntatore a Collection"],is_open:false,ans_idx:1,no_ans:false},
{l:66,n:6,t:"Qual è la differenza tra le classi ArrayList e LinkedList?",o:["ArrayList è implementata con un array, LinkedList con una lista","Sono identiche","ArrayList contiene solo oggetti di tipo array","ArrayList contiene array, LinkedList contiene liste"],is_open:false,ans_idx:0,no_ans:false},
{l:66,n:7,t:"Come vengono utilizzate le classi wrapper dei tipi numerici nelle Liste?",o:["A permettere alle sottoclassi del Collections Framework di contenere numeri","A permettere a un Iterator di manipolare numeri","A permettere alle sottoclassi dei Collection di leggere numeri dalla tastiera","A permettere a una Collection di wrappare oggetti"],is_open:false,ans_idx:0,no_ans:false},
{l:66,n:8,t:"Qual è lo scopo delle classi wrapper dei tipi numerici?",o:["A wrappare oggetti primitivi","A contenere tipi numerici primitivi","A contenere oggetti di tipo numerico","A manipolare oggetti numerici"],is_open:false,ans_idx:1,no_ans:false},
{l:66,n:9,t:"Descrivere le principali differenze tra ArrayList e LinkedList, fornendo degli esempi di codice.",o:[],is_open:true,ans_idx:null,ans_text:"Le differenze principali tra ArrayList e LinkedList stanno nell'implementazione interna:\n\nArrayList usa un array dinamico internamente. Accedere a un elemento per indice è O(1) (velocissimo). Inserire o rimuovere in mezzo è O(n) perché bisogna spostare gli elementi.\n\nLinkedList usa una lista doppiamente linkata. Inserire o rimuovere in testa o in coda è O(1). Accedere a un elemento per indice è O(n) perché bisogna scorrere la lista.\n\nEsempi:\nList<String> lista = new ArrayList<>();\nlista.add(\"Mario\"); lista.add(\"Luigi\");\nlista.get(0); // O(1) con ArrayList, O(n) con LinkedList\n\nList<String> lista2 = new LinkedList<>();\nlista2.add(0, \"primo\"); // O(1) con LinkedList, O(n) con ArrayList\n\nIn pratica: ArrayList per accesso casuale frequente, LinkedList per inserimenti/rimozioni frequenti alle estremità.",no_ans:false},
{l:66,n:10,t:"Descrivere le principali classi wrapper Java dei tipi numerici.",o:[],is_open:true,ans_idx:null,ans_text:"Le classi wrapper \"avvolgono\" un tipo primitivo in un oggetto, permettendo di usarli nelle Collections (che lavorano solo con oggetti).\n\nLe principali sono:\n- Integer (per int)\n- Double (per double)\n- Long (per long)\n- Float (per float)\n- Boolean (per boolean)\n- Character (per char)\n\nJava gestisce la conversione automaticamente tramite autoboxing (da primitivo a wrapper) e unboxing (da wrapper a primitivo):\n\nList<Integer> numeri = new ArrayList<>();\nnumeri.add(42);     // autoboxing: int → Integer\nint x = numeri.get(0); // unboxing: Integer → int\n\nOffrono anche metodi utili come Integer.parseInt(\"123\"), Integer.MAX_VALUE, Double.isNaN().",no_ans:false},

{l:67,n:1,t:"A cosa serve l'operatore diamond di Java?",o:["Permette di aggiungere tipi numerici in una Lista","Permette di restringere gli oggetti che si possono aggiungere a una Collection","A far funzionare il Collections Framework","Permette di utilizzare i tipi wrapper numerici"],is_open:false,ans_idx:1,no_ans:false},
{l:67,n:2,t:"Cosa è falso se riferito all'operatore diamond di Java?",o:["Permette di definire metodi generici","Funziona con tutti le classi Java","Permette di definire classi generiche","Funziona solo con le classi wrapper numeriche"],is_open:false,ans_idx:3,no_ans:false},
{l:67,n:3,t:"L'operatore diamond di Java:",o:["Permette di specificare vincoli sui tipi che si possono passare ad un metodo","Permette di evitare cast impliciti","Permette di restringere i tipi utilizzabili","Permette di evitare cast espliciti"],is_open:false,ans_idx:3,no_ans:false},
{l:67,n:4,t:"La correttezza delle operazioni vincolate con l'operatore diamond:",o:["Viene controllata dal compilatore","Viene controllata a tempo di esecuzione","Deve essere controllata dall'utente","Viene controllata dalla Java Virtual Machine"],is_open:false,ans_idx:0,no_ans:false},
{l:67,n:5,t:"Cosa è falso se riferito alla definizione \"LinkedList list = new LinkedList<>();\":",o:["Demandiamo il controllo al compilatore circa gli oggetti inseriti in list","Se nella lista inseriamo un Double, a tempo di esecuzione verrà lanciata una eccezione","Restringiamo gli oggetti che si possono inserire in list alla classe Integer","Definiamo una Lista che accetta solo istanze della classe Integer"],is_open:false,ans_idx:1,no_ans:false},
{l:67,n:6,t:"Come possiamo limitare gli oggetti generici di un metodo o di una classe?",o:["In nessun modo","Possiamo restringerli alle classi di un certo package","Possiamo restringerli ai tipi base","Possiamo restringerli ad una certa gerarchia di classi"],is_open:false,ans_idx:3,no_ans:false},
{l:67,n:7,t:"Il metodo \"public Collection operazione(T[] a)\":",o:["Ritorna una istanza della classe generica T","Per farlo funzionare dobbiamo definire la classe T nel file T.java","Ritorna un oggetto del tipo base T","Ritorna una istanza di Collection contenente oggetti di tipo T"],is_open:false,ans_idx:3,no_ans:false},
{l:67,n:8,t:"Il metodo definito come \"public T metodo()\":",o:["Restringe il tipo T alla interfaccia Comparable ed estende Number","Dice che il tipo T può estendere sia Number che Comparable","Restringe il tipo T alla classe Number o alla interfaccia Comparable","Dice che il tipo T deve estendere Number ed implementare Comparable"],is_open:false,ans_idx:3,no_ans:false},
{l:67,n:9,t:"Descrivere che cos'è e a che cosa serve l'operatore diamond in Java e fornire degli esempi di codice.",o:[],is_open:true,ans_idx:null,ans_text:"L'operatore diamond (<>) serve per specificare il tipo degli oggetti che una struttura dati generica può contenere. Si mette dopo il nome della classe/interfaccia.\n\nSenza diamond si lavora con Object e bisogna fare cast manualmente, con rischio di ClassCastException. Con diamond il compilatore verifica i tipi a compile-time.\n\nEsempi:\nList<String> nomi = new ArrayList<>(); // solo String\nnomi.add(\"Mario\");\n// nomi.add(42); // errore di compilazione\n\nMap<String, Integer> punteggi = new HashMap<>();\npunteggi.put(\"Mario\", 100);\nint p = punteggi.get(\"Mario\"); // nessun cast necessario\n\nSe si inserisce un tipo sbagliato il compilatore lo segnala subito, invece di far crashare il programma a runtime. È uno degli strumenti principali per scrivere codice type-safe.",no_ans:false},
{l:67,n:10,t:"Descrivere che cos'è un metodo generico in Java e fornire un esempio utilizzando il codice Java.",o:[],is_open:true,ans_idx:null,ans_text:"Un metodo generico può lavorare con un tipo specificato dal chiamante, senza essere legato a un tipo fisso. Si dichiara con <T> prima del tipo di ritorno.\n\nEsempio:\npublic <T> void stampa(T[] array) {\n    for (T elemento : array) {\n        System.out.print(elemento + \" \");\n    }\n}\n\n// funziona con qualsiasi tipo:\nstampa(new Integer[]{1, 2, 3});\nstampa(new String[]{\"a\", \"b\", \"c\"});\n\nSi può anche vincolare il tipo generico con extends:\npublic <T extends Comparable<T>> T massimo(T a, T b) {\n    return a.compareTo(b) >= 0 ? a : b;\n}\n\nQui T deve implementare Comparable, quindi si può usare compareTo. Funziona con Integer, String, Double ecc. — tutti i tipi che hanno un ordinamento naturale.",no_ans:false},

// === L070 ===
{l:70,n:1,t:"Descrivere che cos'è la notazione O-grande e fornire degli esempi.",o:[],is_open:true,ans_idx:null,ans_text:"La notazione O-grande (O-grande, Big-O) descrive come cresce il tempo di esecuzione di un algoritmo al crescere della dimensione dell'input n. Si concentra sul termine dominante, ignorando costanti e termini di ordine inferiore.\n\nLe complessità più comuni, dalla più efficiente alla meno:\n- O(1) — costante: il tempo non dipende da n. Es: accesso a un elemento di array per indice.\n- O(log n) — logaritmica: raddoppiare n aggiunge solo un passo. Es: ricerca binaria.\n- O(n) — lineare: il tempo cresce proporzionalmente a n. Es: scorrere una lista.\n- O(n log n) — es: merge sort, quicksort nel caso medio.\n- O(n²) — quadratica: un doppio ciclo for. Es: bubble sort.\n- O(n³) — cubica: un triplo ciclo for.\n- O(2^n) — esponenziale: problemi combinatori.\n\nEsempio: T(n) = 3n² + 5n + 2 → O(n²), perché per n grande domina il termine n².",no_ans:false},

{l:72,n:9,t:"Dato un certo problema P e due algoritmi A e B che lo risolvono esntrambi ma in modo diverso, come faccio a scegliere il migliore fra i due? Discutere la",o:[],is_open:true,ans_idx:null,ans_text:"Se A e B risolvono lo stesso problema ma con complessità diverse, si sceglie quello con complessità asintotica inferiore, perché per input grandi la differenza diventa enorme.\n\nEsempio: A ha complessità O(n²), B ha complessità O(n log n).\nPer n=1000: A esegue ~1.000.000 operazioni, B esegue ~10.000. B è circa 100 volte più veloce.\nPer n=1.000.000: la differenza diventa miliardi contro decine di milioni.\n\nIl tempo di esecuzione reale dipende anche dall'hardware e dalle costanti, ma asintoticamente un O(n log n) batte sempre un O(n²) per n sufficientemente grande.\n\nQuindi: a parità di correttezza, si preferisce l'algoritmo con la complessità asintotica più bassa. Se le complessità sono uguali, si guardano le costanti e i casi particolari (caso medio vs caso peggiore).",no_ans:false},
{l:72,n:10,t:"Dato l'array \"int[][] a = new int[n][n];\" scrivere il codice per inizializzare i suoi elementi tutti al valore 5 e poi calcolarne la funzione di complessità",o:[],is_open:true,ans_idx:null,ans_text:"// Inizializzare tutti gli elementi di una matrice n×n a zero\nint[][] a = new int[n][n];\n\nfor (int i = 0; i < n; i++) {\n    for (int j = 0; j < n; j++) {\n        a[i][j] = 0;\n    }\n}\n\n// In realtà new int[n][n] in Java inizializza già tutto a 0,\n// ma il codice esplicito mostra la logica.\n\n// Per inizializzare con i valori i+j:\nfor (int i = 0; i < n; i++) {\n    for (int j = 0; j < n; j++) {\n        a[i][j] = i + j;\n    }\n}\n\nLa complessità di questo doppio ciclo è O(n²): si visitano n×n = n² celle.",no_ans:false},
];


var filter='all', lesson=null;
var lc={};
Q.forEach(function(q){ lc[q.l]=(lc[q.l]||0)+1; });

function buildSB(){
  var sb=document.getElementById('sb');
  var h='<button class="lb active" id="lb-all" onclick="setL(null)"><span class="ln">&#128218;</span><span class="lname">Tutte le lezioni</span><span class="lc">'+Q.length+'</span></button>';
  var ll=[];
  Q.forEach(function(q){if(ll.indexOf(q.l)<0)ll.push(q.l);});
  ll.sort(function(a,b){return a-b;});
  ll.forEach(function(l){
    var n=l<10?'00'+l:(l<100?'0'+l:''+l);
    h+='<button class="lb" id="lb-'+l+'" onclick="setL('+l+')"><span class="ln">L'+n+'</span><span class="lname">'+(LN[l]||'L'+l)+'</span><span class="lc">'+(lc[l]||0)+'</span></button>';
  });
  sb.innerHTML=h;
}

function setL(l){
  lesson=l;
  document.querySelectorAll('.lb').forEach(function(b){b.classList.remove('active');});
  var t=document.getElementById(l?'lb-'+l:'lb-all');
  if(t)t.classList.add('active');
  render();
}

function setF(f,btn){
  filter=f;
  document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function getFilt(){
  var t=document.getElementById('search').value.toLowerCase().trim();
  return Q.filter(function(q){
    if(lesson&&q.l!==lesson)return false;
    if(filter==='mc'&&q.is_open)return false;
    if(filter==='open'&&!q.is_open)return false;
    if(t){var h=(q.t+' '+(q.o||[]).join(' ')).toLowerCase();return t.split(/\s+/).filter(Boolean).every(function(w){return h.indexOf(w)>=0;});}
    return true;
  });
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildAns(q){
  if(q.no_ans)return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  var letters=['A','B','C','D','E'];
  if(q.is_open){
    if(q.ans_text){
      return'<div class="open-ans"><strong>&#9999; Risposta tipo</strong>'+esc(q.ans_text.replace(/\\n/g,'\n'))+'</div>';
    }
    return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  }
  var h='<div class="opts">';
  for(var i=0;i<q.o.length;i++){
    var cls=(q.ans_idx>=0&&i===q.ans_idx)?'opt correct':'opt';
    h+='<div class="'+cls+'"><b style="font-family:monospace;font-size:11px;margin-right:6px">'+letters[i]+')</b>'+esc(q.o[i])+'</div>';
  }
  h+='</div>';
  return h;
}

function render(){
  var f=getFilt();
  document.getElementById('vc').textContent=f.length;
  var c=document.getElementById('qc');
  if(!f.length){c.innerHTML='<div class="empty"><p style="font-size:2em">&#128269;</p>Nessuna domanda trovata</div>';return;}
  var h='',last=null;
  f.forEach(function(q){
    if(q.l!==last){h+='<div class="sec">L'+q.l+' &mdash; '+(LN[q.l]||'Lezione '+q.l)+'</div>';last=q.l;}
    var num=q.n<10?'0'+q.n:''+q.n;
    var badge=q.is_open?'<span class="qbadge op">APERTA</span>':'<span class="qbadge mc">CHIUSA</span>';
    h+='<div class="qcard" id="qcard-'+q.l+'-'+q.n+'"><div class="qhead">'+badge+'<span class="qt"><b>Q'+num+'</b> &mdash; '+esc(q.t)+'</span><span class="qarrow">&#9660;</span></div><div class="qans">'+buildAns(q)+'</div></div>';
  });
  c.innerHTML=h;
  document.querySelectorAll('.qcard .qhead').forEach(function(h){
    h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
  });
}

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();var s=document.getElementById('search');s.focus();s.select();}
});

buildSB();render();
</script></body></html>
