{l:37,n:1,t:"Nell'equazione logistica, y'=KLy(L-y), quali sono gli integrali singolari?",o:["y=0","y=0 e y=L","y=0 e y=KL","Nessuno"],is_open:false,ans_idx:1,no_ans:false},
{l:37,n:2,t:"Quale tra le seguenti è un'equazione differenziale ordinaria omogenea?",o:["y'=y+x","y'=y/x","y'=y","y'=0"],is_open:false,ans_idx:1,no_ans:false},
{l:37,n:3,t:"Nell'equazione y'=xy, quale metodo viene applicato per la soluzione?",o:["Metodo di Newton","Metodo di Eulero","Metodo dell'integrante","Metodo della separazione delle variabili"],is_open:false,ans_idx:3,no_ans:false},
{l:37,n:4,t:"Le isocline di una EDO omogenea del primo ordine sono:",o:["Le rette parallele all'asse y","Le rette passanti per l'origine","Le rette parallele a y = x","Le rette parallele all'asse x"],is_open:false,ans_idx:1,no_ans:false},
{l:37,n:5,t:"Qual è la forma generale di una equazione differenziale a variabili separabili?",o:["y'(x)=Q(x)*R(y)","y'(x)=Q(x)/R(y)","y'(x)=Q(x)+R(y)","y'(x)=f(x,y)"],is_open:false,ans_idx:0,no_ans:false},
{l:37,n:6,t:"Risolvi il problema di Cauchy: y′(x)=(y+x)/(y-x), y(1)=2.",o:[],is_open:true,ans_idx:null,ans_text:"È un'equazione omogenea. Pongo v=y/x, da cui y=vx e y'=v+xv'.\n\nSostituendo: v+xv' = (vx+x)/(vx-x) = (v+1)/(v-1).\n\nQuindi xv' = (v+1)/(v-1) - v = (-v²+2v+1)/(v-1).\n\nSepara le variabili: (v-1)/(-v²+2v+1) dv = dx/x. Osservando che la derivata di (v²-2v-1) è 2(v-1), si ottiene:\n\n-½ ln|v²-2v-1| = ln|x| + C₁, cioè v²-2v-1 = C₃/x².\n\nSostituendo v=y/x e moltiplicando per x²: y²-2xy-x² = C.\n\nApplico la condizione iniziale y(1)=2: 4-4-1 = -1 = C.\n\nQuindi y²-2xy-x²=-1, che risolta rispetto a y (scegliendo il ramo compatibile con y(1)=2) dà:\n\ny(x) = x + √(2x²-1).\n\n(Verifica: a x=1, y=1+1=2 ✓)",no_ans:false},
{l:37,n:7,t:"Risolvi l'equazione differenziale omogenea: y′(x)=(y+x)/(y-x). Suggerimento: usa la sostituzione v=y/x",o:[],is_open:true,ans_idx:null,ans_text:"Con la sostituzione v=y/x (y=vx, y'=v+xv') si ottiene, come nell'esercizio precedente:\n\nxv' = (-v²+2v+1)/(v-1).\n\nSeparando le variabili e integrando (sfruttando che il numeratore (v-1) è metà della derivata del denominatore v²-2v-1):\n\n-½ ln|v²-2v-1| = ln|x| + C₁.\n\nRitornando alla variabile originale v=y/x e riorganizzando i termini, si ottiene la relazione implicita generale:\n\ny² - 2xy - x² = C, con C costante arbitraria.\n\nQuesta relazione può essere esplicitata rispetto a y risolvendo l'equazione di secondo grado: y(x) = x ± √(2x²+C), a seconda del ramo scelto in base alla condizione iniziale.",no_ans:false},

{l:39,n:1,t:"Il metodo delle isocline è:",o:["Un approccio grafico per trasformare EDO in equazioni algebriche","Un metodo qualitativo per studiare l'andamento delle soluzioni di una EDO","Un metodo numerico per calcolare soluzioni esatte di una EDO","Un algoritmo iterativo per EDO"],is_open:false,ans_idx:1,no_ans:false},
{l:39,n:2,t:"Nel metodo delle isocline, cosa si fa dopo aver tracciato un'isoclina per un certo valore costante c?",o:["Si calcola la retta tangente al primo e terzo quadrante","Si risolve l'EDO per i punti selezionati","Si tracciano segmenti con pendenza pari a c","Si disegna la curva integrale"],is_open:false,ans_idx:2,no_ans:false},
{l:39,n:3,t:"Nel metodo delle isocline, come si costruisce la curva integrale passante per un punto (x₀, y₀)?",o:["Risolvendo numericamente l'EDO","Calcolando la derivata prima nel punto (x₀, y₀)","Tracciando segmenti con pendenza f(x₀, y₀)","Graficare la soluzione approssimata"],is_open:false,ans_idx:2,no_ans:false},
{l:39,n:4,t:"Nel metodo delle isocline, maggiore è il numero di isocline graficate:",o:["Minore sarà l'accuratezza","Più facile sarà trovare la soluzione esatta","Maggiore sarà la precisione qualitativa","Più difficile sarà rappresentare il campo"],is_open:false,ans_idx:2,no_ans:false},

{l:41,n:1,t:"Qual è la prima fase di un metodo numerico per le EDO?",o:["Calcolare il dato iniziale","Approssimare la funzione f(x,y)","Discretizzare l'intervallo","Scegliere un metodo numerico per approssimare y'"],is_open:false,ans_idx:2,no_ans:false},
{l:41,n:2,t:"Qual è il ruolo del punto x0 nella discretizzazione delle EDO?",o:["È il punto con valore massimo della derivata y'","È il primo nodo e rappresenta il dato iniziale del problema","È un punto scelto all'interno del dominio I","È il punto in cui termina l'intervallo I"],is_open:false,ans_idx:1,no_ans:false},
{l:41,n:3,t:"Qual è l'obiettivo finale dell'approccio numerico alle EDO?",o:["Evitare del tutto il calcolo della EDO","Calcolare approssimazioni della soluzione su tutto il dominio","Calcolare approssimazioni nei nodi","Trovare una soluzione esatta"],is_open:false,ans_idx:2,no_ans:false},
{l:41,n:4,t:"A cosa serve la discretizzazione dell'intervallo nell'ambito della risoluzione numerica delle EDO?",o:["A suddividere il dominio dell'equazione in punti su cui approssimare la soluzione","A ottenere la soluzione esatta dell'equazione","Per approssimare la soluzione su tutto il dominio","A suddividere il dominio dell'equazione in punti su cui calcolare esattamente la soluzione"],is_open:false,ans_idx:0,no_ans:false},

{l:42,n:1,t:"Cosa significa discretizzare l'intervallo I nell'approssimazione delle EDO?",o:["Riscrivere I in termini lineari","Approssimare la funzione f(x,y)","Suddividere l'intervallo in un insieme di punti chiamati nodi","Sostituire le derivate con rapporti incrementali"],is_open:false,ans_idx:2,no_ans:false},
{l:42,n:2,t:"Qual è la caratteristica dei nodi equispaziati?",o:["Vengono scelti in base ai valori della funzione y","Hanno ordinata uguale","La distanza tra nodi consecutivi è costante","Hanno ascisse costanti"],is_open:false,ans_idx:2,no_ans:false},

{l:42,n:4,t:"Nel metodo delle differenze finite in avanti, quale tipo di errore si commette?",o:["Zero","Lineare","O(h)","O(h^2)"],is_open:false,ans_idx:2,no_ans:false},
{l:42,n:5,t:"Quale metodo numerico approssima la derivata prima usando y_{k+1}e y_{k}?",o:["Metodo di Eulero implicito","Differenze finite centrate","Differenze finite in avanti","Differenze finite all'indietro"],is_open:false,ans_idx:2,no_ans:false},
// === L043 Eulero in avanti e all'indietro ===
{l:43,n:1,t:"Quando si dice che un metodo per EDO è a un passo?",o:["Utilizza anche i valori precedenti per ogni nuovo calcolo","Non ha bisogno del valore iniziale","Calcola una sola iterazione per ogni nodo","Usa solo il valore corrente per calcolare il successivo"],is_open:false,ans_idx:3,no_ans:false},
{l:43,n:2,t:"Il passo h nei metodi numerici per EDO rappresenta:",o:["La distanza dal dato iniziale","L'ultimo passo dell'intervallo","Il pirmo passo dell'intervallo","La distanza costante tra due nodi"],is_open:false,ans_idx:3,no_ans:false},
{l:43,n:3,t:"Un metodo numerico per EDO è detto esplicito quando:",o:["Il valore al passo successivo dipende solo da dati già noti","Si basa su uno sviluppo di Taylor","Utilizza le differenze finite","Richiede la risoluzione di un sistema non lineare"],is_open:false,ans_idx:0,no_ans:false},
{l:43,n:4,t:"Il metodo di Eulero all'indietro si distingue perché:",o:["Usa valori futuri conosciuti","È esplicito","Non richiede condizioni inizial","È implicito"],is_open:false,ans_idx:3,no_ans:false},
{l:43,n:5,t:"Quale delle seguenti affermazioni è vera sul metodo di Eulero in avanti?",o:["Calcola il passo successivo in modo diretto dal valore corrente","Utilizza il valore incognito del passo successivo come dato","Richiede di conoscere due valori intermedi","È un metodo implicito"],is_open:false,ans_idx:0,no_ans:false},
{l:43,n:6,t:"Si consideri il problema di Cauchy: y′(x)=y − x^2 + 1, x∈(0,2], y(0)=0.5. Discretizzare l'intervallo I=[0,2] con passo h=0.2 e scrivere i nodi {x_k}. Applicare il metodo di Eulero in avanti scrivendo la formula iterativa. Calcolare u_k per ogni nodo x_k, riportare i valori in tabella.",o:[],is_open:true,ans_idx:null,ans_text:"Nodi: xₖ = 0, 0.2, 0.4, ..., 2.0 (11 nodi, k=0,...,10).\n\nFormula di Eulero in avanti: uₖ₊₁ = uₖ + h·f(xₖ,uₖ), con f(x,y)=y-x²+1.\n\nu₀=0,5000\nu₁ = 0,5+0,2·(0,5-0+1) = 0,8000\nu₂ = 0,8+0,2·(0,8-0,04+1) = 1,1520\nu₃ = 1,152+0,2·(1,152-0,16+1) = 1,5504\nu₄ = 1,5504+0,2·(1,5504-0,36+1) = 1,9885\nu₅ = 1,9885+0,2·(1,9885-0,64+1) = 2,4582\nu₆ = 2,4582+0,2·(2,4582-1+1) = 2,9498\nu₇ = 2,9498+0,2·(2,9498-1,44+1) = 3,4518\nu₈ = 3,4518+0,2·(3,4518-1,96+1) = 3,9501\nu₉ = 3,9501+0,2·(3,9501-2,56+1) = 4,4282\nu₁₀ = 4,4282+0,2·(4,4282-3,24+1) = 4,8658\n\nTabella (xₖ, uₖ): (0; 0,5), (0,2; 0,8), (0,4; 1,152), (0,6; 1,5504), (0,8; 1,9885), (1,0; 2,4582), (1,2; 2,9498), (1,4; 3,4518), (1,6; 3,9501), (1,8; 4,4282), (2,0; 4,8658).",no_ans:false},
{l:43,n:7,t:"Si consideri il problema: y′(x)=−2*y+3*cos(x), x∈(0,3], y(0)=1. Discretizzare l'intervallo I=[0,3] con h=0.25. Scrivere la formula iterativa di Eulero in avanti per l'EDO in esame. Calcolare i valori u_k, riportare i risultati in una tabella. (Facoltativo) Calcolare la soluzione esatta e commentare l'errore.",o:[],is_open:true,ans_idx:null,ans_text:"Formula: uₖ₊₁ = uₖ + h·(-2uₖ+3cos(xₖ)), con h=0,25.\n\nu₀=1,0000\nu₁=1,2500 (x=0,25)\nu₂=1,3517 (x=0,5)\nu₃=1,3340 (x=0,75)\nu₄=1,2158 (x=1,0)\nu₅=1,0131 (x=1,25)\nu₆=0,7431 (x=1,5)\nu₇=0,4246 (x=1,75)\nu₈=0,0786 (x=2,0)\nu₉=-0,2728 (x=2,25)\nu₁₀=-0,6075 (x=2,5)\nu₁₁=-0,9046 (x=2,75)\nu₁₂=-1,1455 (x=3,0)\n\nLa soluzione esatta (equazione lineare y'+2y=3cos(x)) è y(x)=e^(-2x)+(6cos(x)+3sin(x))/5, ottenuta con il metodo del fattore integrante. Confrontando i valori, l'errore commesso dal metodo di Eulero in avanti cresce man mano che ci si allontana dal dato iniziale, come atteso per un metodo del primo ordine con errore O(h): con h=0,25 l'errore resta contenuto ma non trascurabile, e si ridurrebbe dimezzando il passo.",no_ans:false},
{l:43,n:8,t:"Si consideri il problema di Cauchy: y′(x)=2*y*(1−y/5), x∈(0,3], y(0)=0.5. Discretizzare l'intervallo [0,3] con h=0.5 e trovare i valori {xk}. Applicare Eulero in avanti, specificando la formula per l'EDO in questione. Calcolare u_k e riportare in tabella u_k e x_k per ogni valore k. Calcolare l'errore assoluto e relativo rispetto alla soluzione esatta.",o:[],is_open:true,ans_idx:null,ans_text:"È l'equazione logistica con K=2, L=5. Formula: uₖ₊₁ = uₖ+h·2uₖ(1-uₖ/5), h=0,5.\n\nu₀=0,5000 (x=0)\nu₁=0,9500 (x=0,5)\nu₂=1,7195 (x=1,0)\nu₃=2,8477 (x=1,5)\nu₄=4,0735 (x=2,0)\nu₅=4,8283 (x=2,5)\nu₆=4,9941 (x=3,0)\n\nLa soluzione esatta della logistica è y(x)=L/(1+((L-y₀)/y₀)e^(-Kx)) = 5/(1+9e^(-2x)).\n\nConfronto (esatta vs numerica): x=0,5: 1,1598 vs 0,9500 (errore assoluto 0,21, relativo 18%); x=1,0: 3,4528 vs 1,7195 (errore grande, il metodo esplicito con h=0,5 fatica a seguire la rapida crescita della curva a S); x=2,0: 4,7141 vs 4,0735; x=3,0: 4,9852 vs 4,9941.\n\nSi osserva che l'errore è più marcato nella fase di crescita rapida (punto di flesso della logistica), dove la funzione cambia velocemente e il passo h=0,5 è troppo grande per seguirne fedelmente l'andamento.",no_ans:false},
{l:43,n:9,t:"Si consideri il problema di Cauchy: y′(x)=cos(x)−y, x∈(0,2π], y(0)=1. Discretizzare l'intervallo [0,2π] con h=π/4. Scrivere la formula iterativa del metodo di Eulero in avanti. Calcolare u_k e confrontare con la soluzione esatta, riportando gli errori ad ogni passo k.",o:[],is_open:true,ans_idx:null,ans_text:"Formula: uₖ₊₁=uₖ+h·(cos(xₖ)-uₖ), h=π/4≈0,7854.\n\nu₀=1,0000 (x=0), esatta=1,0000, errore=0\nu₁=1,0000 (x=0,785), esatta=0,9351, errore=0,065\nu₂=0,7700 (x=1,571), esatta=0,6039, errore=0,166\nu₃=0,1652 (x=2,356), esatta=0,0474, errore=0,118\nu₄=-0,5199 (x=3,142), esatta=-0,4784, errore=0,042\nu₅=-0,8970 (x=3,927), esatta=-0,6973, errore=0,200\nu₆=-0,7479 (x=4,712), esatta=-0,4955, errore=0,252\nu₇=-0,1605 (x=5,498), esatta=0,0021, errore=0,163\nu₈=0,5209 (x=6,283), esatta=0,5009, errore=0,020\n\nLa soluzione esatta è y(x)=0,5e^(-x)+0,5(sin(x)+cos(x)), ottenuta risolvendo l'EDO lineare y'+y=cos(x). Con un passo così grande (h≈0,785) l'errore di Eulero in avanti resta significativo per gran parte del percorso, in accordo con l'ordine di convergenza O(h) del metodo, ma la soluzione numerica torna comunque vicina a quella esatta dopo un giro completo.",no_ans:false},
{l:43,n:10,t:"Si consideri il problema di Cauchy: y′(x)=−y+e^{−x}, x∈(0,3], y(0)=0. Calcolare la soluzione esatta y(x). Discretizzare l'intervallo [0,3] con h=0.5. Applicare Eulero in avanti e riportare i risultati x_k, u_k a confronto con la soluzione esatta y(x).",o:[],is_open:true,ans_idx:null,ans_text:"L'EDO y'+y=e^(-x) è lineare; con fattore integrante e^x si ottiene (y·e^x)'=1, quindi y·e^x=x+C. Con y(0)=0: C=0, quindi la soluzione esatta è y(x) = x·e^(-x).\n\nFormula Eulero avanti: uₖ₊₁=uₖ+h·(-uₖ+e^(-xₖ)), h=0,5.\n\nx=0: u=0,0000, esatta=0,0000\nx=0,5: u=0,5000, esatta=0,3033\nx=1,0: u=0,5533, esatta=0,3679\nx=1,5: u=0,4606, esatta=0,3347\nx=2,0: u=0,3419, esatta=0,2707\nx=2,5: u=0,2386, esatta=0,2052\nx=3,0: u=0,1603, esatta=0,1494\n\nCon h=0,5 il metodo sovrastima sistematicamente la soluzione esatta nella fase iniziale, ma l'errore si riduce progressivamente man mano che ci si allontana dall'origine, coerentemente con la stabilità del problema (λ=-1<0).",no_ans:false},
{l:43,n:11,t:"Si consideri il problema di Cauchy: y′(x)=−4*y+4*x, x∈(0,1], y(0)=2. Calcolare la soluzione esatta y(x). Discretizzare [0,1] con h=0.2. Applicare Eulero in avanti e confrontare la soluzione numerica con quella esatta, analizzando l'andamento dell'errore.",o:[],is_open:true,ans_idx:null,ans_text:"Soluzione esatta: l'EDO è lineare y'+4y=4x. Una soluzione particolare è yₚ=x-1/4 e la soluzione omogenea è Ce^(-4x), quindi y(x)=Ce^(-4x)+x-0,25. Con y(0)=2: C=2,25. Soluzione esatta: y(x)=2,25e^(-4x)+x-0,25.\n\nFormula Eulero avanti: uₖ₊₁=uₖ+h·(-4uₖ+4xₖ), h=0,2.\n\nx=0: u=2,0000, esatta=2,0000\nx=0,2: u=0,4000, esatta=0,9610\nx=0,4: u=0,2400, esatta=0,6043\nx=0,6: u=0,3680, esatta=0,5541\nx=0,8: u=0,5536, esatta=0,6417\nx=1,0: u=0,7507, esatta=0,7912\n\nSi osserva un errore molto grande al primo passo: |hλ|=|0,2·(-4)|=0,8, vicino al limite di stabilità assoluta del metodo esplicito (|1+hλ|<1 richiede h<0,5, quindi qui è tecnicamente soddisfatto ma di poco, con 1+hλ=1-0,8=0,2). Questo spiega l'oscillazione iniziale marcata (u passa da 2 a 0,4) prima che la soluzione numerica si stabilizzi e si riavvicini a quella esatta.",no_ans:false},
{l:43,n:12,t:"Dato il problema di Cauchy: y′(x)=y^2 + 1, x∈(0,1], y(0)=0. Discretizzare I=[0,1] con h=0.2. Scrivere la formula implicita del metodo di Eulero all'indietro per l'EDO in esame. Risolvere l'equazione non lineare con il metodo di Newton (utilizzando due iterazioni di Newton) per u_k+1, con k=0. Riportare i valori ottenuti su una tabella. (Opzionale) Confrontare con EA e discutere le differenze.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Eulero all'indietro: uₖ₊₁ = uₖ + h·(uₖ₊₁²+1), da risolvere ad ogni passo come equazione non lineare in uₖ₊₁.\n\nPer k=0: g(u₁) = u₁ - u₀ - 0,2·(u₁²+1) = u₁ - 0,2u₁² - 0,2 = 0, con g'(u₁)=1-0,4u₁.\n\nParto da u₁⁽⁰⁾=u₀=0 e applico Newton: u₁⁽ᵐ⁺¹⁾ = u₁⁽ᵐ⁾ - g(u₁⁽ᵐ⁾)/g'(u₁⁽ᵐ⁾).\n\nIterazione 1: g(0)=-0,2, g'(0)=1 → u₁⁽¹⁾ = 0-(-0,2)/1 = 0,2000\nIterazione 2: g(0,2)=0,2-0,008-0,2=-0,008, g'(0,2)=1-0,08=0,92 → u₁⁽²⁾ = 0,2-(-0,008)/0,92 = 0,2087\n\nDopo due iterazioni di Newton: u₁ ≈ 0,2087, in ottimo accordo con la soluzione esatta y(x)=tan(x), che a x=0,2 vale tan(0,2)=0,2027.\n\nA differenza di Eulero in avanti (che userebbe direttamente u₁=u₀+h·f(x₀,u₀)=0+0,2·1=0,2, valore esplicito immediato), il metodo all'indietro richiede la risoluzione di un'equazione implicita a ogni passo, ma è generalmente più stabile, specialmente utile qui dato che y'=y²+1 può portare a rapide crescite (esplosione in tempo finito) che Eulero all'indietro gestisce meglio.",no_ans:false},
{l:43,n:13,t:"Dato il problema di Cauchy: y′(x)=e^{−y(x)}, x∈(0,2], y(0)=1. Discretizzare l'intervallo con h=0.5. Scrivere la formula del metodo di Eulero all'indietro utilizzando il metodo di Newton a ogni passo k.",o:[],is_open:true,ans_idx:null,ans_text:"Il metodo di Eulero all'indietro per questa EDO si scrive:\n\nuₖ₊₁ = uₖ + h·e^(-uₖ₊₁),\n\nche è un'equazione non lineare nell'incognita uₖ₊₁, dato che compare anche a esponente. Per risolverla ad ogni passo k si definisce:\n\ng(uₖ₊₁) = uₖ₊₁ - uₖ - h·e^(-uₖ₊₁) = 0,\n\ncon derivata g'(uₖ₊₁) = 1 + h·e^(-uₖ₊₁) (sempre positiva, quindi Newton converge bene).\n\nAd ogni passo k, partendo da un valore di tentativo (tipicamente uₖ₊₁⁽⁰⁾=uₖ), si applica l'iterazione di Newton:\n\nuₖ₊₁⁽ᵐ⁺¹⁾ = uₖ₊₁⁽ᵐ⁾ - g(uₖ₊₁⁽ᵐ⁾)/g'(uₖ₊₁⁽ᵐ⁾),\n\nfino a convergenza (o per un numero fissato di iterazioni), ottenendo così il valore di uₖ₊₁ da usare come punto di partenza per il passo successivo k+1.",no_ans:false},
{l:43,n:14,t:"Dato il problema di Cauchy: y′(x)=log(1+y^2), x∈(0,2], y(0)=1. Discretizzare con h=0.5. Applicare Eulero all'indietro con risoluzione tramite metodo di Newton.",o:[],is_open:true,ans_idx:null,ans_text:"Il metodo di Eulero all'indietro dà, ad ogni passo, l'equazione implicita:\n\nuₖ₊₁ = uₖ + h·log(1+uₖ₊₁²).\n\nDefinisco g(uₖ₊₁) = uₖ₊₁ - uₖ - h·log(1+uₖ₊₁²) = 0, con derivata g'(uₖ₊₁) = 1 - h·(2uₖ₊₁)/(1+uₖ₊₁²).\n\nPer k=0 (u₀=1, h=0,5): g(u₁)=u₁-1-0,5·log(1+u₁²). Partendo da u₁⁽⁰⁾=1:\n\ng(1) = 1-1-0,5·log(2) = -0,347; g'(1) = 1-0,5·(2/2) = 0,5.\nu₁⁽¹⁾ = 1-(-0,347)/0,5 = 1,693.\n\nRipetendo l'iterazione di Newton per raffinare la soluzione (e proseguendo analogamente ai passi successivi x=1,0; 1,5; 2,0, ricalcolando ad ogni passo la funzione g e la sua derivata con il nuovo uₖ), si ottiene la successione numerica u₀,u₁,u₂,u₃,u₄ che approssima la soluzione dell'EDO, la quale è crescente e concava data la natura di log(1+y²) sempre positiva per y≠0.",no_ans:false},
// === L044 Convergenza dei metodi di Eulero ===
{l:44,n:1,t:"A cosa serve il metodo di Newton nel metodo di Eulero all'Indietro:",o:["A risolvere l'equazione non lineare","Per calcolare la funzione nei nodi","A ridurre il numero di nodi","Per derivare numericamente l'EDO"],is_open:false,ans_idx:0,no_ans:false},
{l:44,n:2,t:"Per i metodi di Eulero, come si comporta l'errore di approssimazione quando si dimezza il passo h?",o:["Dipenda se è esplicito o implicito","Si dimezza","Rimane invariato","Si raddoppia"],is_open:false,ans_idx:1,no_ans:false},
{l:44,n:3,t:"Quale tra i seguenti metodi è implicito?",o:["Differenze finite centrate","Metodo dei trapezi","Eulero all'indietro","Eulero in avanti"],is_open:false,ans_idx:2,no_ans:false},
{l:44,n:4,t:"Qual è la principale caratteristica del metodo di Eulero all'indietro?",o:["Richiede la risoluzione di un'equazione non lineare per ogni passo","Utilizza la derivata calcolata nel punto iniziale","È sempre più veloce del metodo esplicito","Calcola una sola iterazione per ogni nodo"],is_open:false,ans_idx:0,no_ans:false},
{l:44,n:5,t:"Cosa accade se il passo h è troppo grande nel metodo Eulero in avanti?",o:["Si ottiene una soluzione costante","La funzione f diventa lineare","La soluzione numerica può divergere","Si ottiene la soluzione esatta"],is_open:false,ans_idx:2,no_ans:false},
{l:44,n:6,t:"Discutere le differenze tra i metodi di Eulero in avanti e all'indietro per la risoluzione numerica di equazioni differenziali ordinarie.",o:[],is_open:true,ans_idx:null,ans_text:"Entrambi i metodi sono a un passo, del primo ordine (errore O(h)), ma differiscono nel modo in cui approssimano la derivata e nella loro stabilità.\n\nEulero in avanti (esplicito) usa la differenza finita in avanti: uₖ₊₁=uₖ+h·f(xₖ,uₖ). Il nuovo valore si calcola direttamente, senza bisogno di risolvere equazioni, perché tutto ciò che serve (xₖ, uₖ) è già noto. È quindi computazionalmente semplice ed economico, ma è condizionatamente assolutamente stabile: per il problema modello y'=λy (λ<0), converge a zero solo se h<2/|λ|. Con passi troppo grandi la soluzione numerica può oscillare o addirittura divergere.\n\nEulero all'indietro (implicito) usa la differenza finita all'indietro: uₖ₊₁=uₖ+h·f(xₖ₊₁,uₖ₊₁). Qui uₖ₊₁ compare anche a destra dell'uguale, quindi ad ogni passo bisogna risolvere un'equazione (in generale non lineare, tramite il metodo di Newton se f non è lineare in y). Questo costa di più a livello computazionale, ma il metodo è incondizionatamente assolutamente stabile: converge indipendentemente dal valore di h, il che lo rende preferibile per problemi rigidi (stiff), dove il metodo esplicito richiederebbe passi eccessivamente piccoli per rimanere stabile.\n\nIn sintesi: stesso ordine di accuratezza, ma trade-off opposto tra costo computazionale per passo e robustezza rispetto alla scelta di h.",no_ans:false},
// === L045 Punto medio e Crank-Nicolson ===
{l:45,n:1,t:"Quale metodo può essere utilizzato per calcolare il valore iniziale u_1 per avviare il metodo del punto medio?",o:["Metodo dei trapezi","Metodo di Cranck-Nicholson","Metodo di Heun","Metodo di Eulero"],is_open:false,ans_idx:2,no_ans:false},
{l:45,n:2,t:"Qual è l'approccio alla base del metodo di Crank-Nicolson?",o:["Integrazione definita","Calcolo integrale e formula dei trapezi","Sviluppi di Taylor","Metodo delle differenze finite"],is_open:false,ans_idx:1,no_ans:false},
{l:45,n:3,t:"Quando il metodo del punto medio può fallire nel fornire buoni risultati?",o:["Se non è soddisfatta la condizione di stabilità","Se la funzione è non lineare","Se il passo è troppo piccolo","Se la funzione non è continua"],is_open:false,ans_idx:0,no_ans:false},
{l:45,n:4,t:"Qual è l'effetto dell'errore di integrazione nel metodo di Crank-Nicolson?",o:["O(h^2)","Lineare","O(h)","Trascurabile"],is_open:false,ans_idx:0,no_ans:false},
{l:45,n:5,t:"Qual è l'ordine di accuratezza del metodo del punto medio rispetto al passo h?",o:["Lineare","Primo ordine","Secondo ordine","Dipende dalla EDO"],is_open:false,ans_idx:2,no_ans:false},
{l:45,n:6,t:"Si consideri il problema di Cauchy: y′(x)=y^{2}+x^{2}, x∈(0,1], y(0)=0.5. Discretizzare l'intervallo [0,1] con passo h=0.5 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Cranck-Nicholson per il problema dato. Utilizzare il metodo di Newton (eseguendo 2 iterazioni di Newton) per calcolare u_k+1 ad ogni nodo.",o:[],is_open:true,ans_idx:null,ans_text:"Nodi: x₀=0, x₁=0,5, x₂=1,0.\n\nFormula di Crank-Nicolson: uₖ₊₁ = uₖ + (h/2)·[f(xₖ,uₖ)+f(xₖ₊₁,uₖ₊₁)], con f(x,y)=y²+x².\n\nPasso k=0 (u₀=0,5): g(u₁) = u₁-0,5-0,25·[(0,25+0)+(u₁²+0,25)] = u₁-0,25u₁²-0,625, g'(u₁)=1-0,5u₁.\n\nNewton da u₁⁽⁰⁾=0,5: \ng(0,5)=0,5-0,0625-0,625=-0,1875; g'(0,5)=0,75 → u₁⁽¹⁾=0,5+0,1875/0,75=0,750\ng(0,75)=0,75-0,1406-0,625=-0,0156; g'(0,75)=0,625 → u₁⁽²⁾=0,750+0,0156/0,625=0,775\n\nQuindi u₁≈0,775.\n\nPasso k=1 (u₁=0,775, x₁=0,5): g(u₂)=u₂-0,775-0,25·[(0,6006+0,25)+(u₂²+1)], g'(u₂)=1-0,5u₂.\n\nNewton da u₂⁽⁰⁾=0,775:\ng(0,775)=0,775-0,775-0,25·(0,8506+1,6006)=-0,6128; g'(0,775)=0,6125 → u₂⁽¹⁾=0,775+0,6128/0,6125=1,775\ng(1,775)=1,775-0,775-0,25·(0,8506+4,1506)=-0,25; g'(1,775)=0,1125 → u₂⁽²⁾=1,775+0,25/0,1125=4,00 (il valore diverge rapidamente per la crescita esplosiva di y²+x²)\n\nSi osserva che, essendo y'=y²+x² un'equazione con crescita molto rapida (tipo esplosione in tempo finito, simile a y'=1+y²), il passo h=0,5 è troppo grande e porta a valori numerici che si allontanano molto dalla soluzione reale già dal secondo nodo: un campanello d'allarme che richiederebbe di ridurre il passo.",no_ans:false},
{l:45,n:7,t:"Si consideri il problema di Cauchy: y′(x)=1+x^{2}*y, x∈(0,2], y(0)=1. Discretizzare l'intervallo [0,2] con passo h=0.25 e scrivere i nodi x_k. Scrivere la formula iterativa del punto medio per il problema dato. Confrontare i risultati ottenuti con il metodo di Eulero in avanti. Commentare i risultati ottenuti.",o:[],is_open:true,ans_idx:null,ans_text:"Formula del punto medio: uₖ₊₁=uₖ₋₁+2h·f(xₖ,uₖ), con f(x,y)=1+x²y. Serve un valore iniziale u₁ calcolato con Heun.\n\nCon Heun: u₁ = u₀+h/2·[f(x₀,u₀)+f(x₁,u₀+h·f(x₀,u₀))] = 1,2598 (a x=0,25).\n\nProseguendo con il punto medio: u₂=1,5394 (x=0,5), u₃=1,9522 (x=0,75), u₄=2,5884 (x=1,0), u₅=3,7464 (x=1,25), u₆=6,0153 (x=1,5), u₇=11,0136 (x=1,75), u₈=23,3799 (x=2,0).\n\nCon Eulero in avanti (stesso passo): u₁=1,25, u₂=1,5195, u₃=1,8645, u₄=2,3767, u₅=3,2209, u₆=4,729, u₇=7,6391 (x=1,75); si nota una crescita più lenta rispetto al punto medio.\n\nEntrambi i metodi mostrano una crescita molto rapida, coerente con il fatto che il coefficiente x²y cresce quadraticamente e amplifica la soluzione. Il punto medio, essendo del secondo ordine, tende a seguire più fedelmente la vera pendenza della curva rispetto a Eulero in avanti (primo ordine), ma proprio per questo con un passo relativamente grande (h=0,25) su un'equazione a crescita rapida i due metodi possono divergere sensibilmente tra loro, segno che servirebbe un passo più piccolo per un confronto affidabile con la soluzione esatta.",no_ans:false},
{l:45,n:8,t:"Si consideri il problema di Cauchy: y′(x)=x+sin(y), x∈(0,1], y(0)=0. Discretizzare l'intervallo [0,1] con passo h=0.5 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Cranck-Nicholson per il problema dato. Risolvere il primo passo (k=0) implicito con il metodo di Newton (usando un criterio di arresto sull'incremento con tollerenza di 10^-2). Riportare i valori ottenuti in una tabella.",o:[],is_open:true,ans_idx:null,ans_text:"Nodi: x₀=0, x₁=0,5, x₂=1,0.\n\nFormula di Crank-Nicolson: uₖ₊₁=uₖ+(h/2)[f(xₖ,uₖ)+f(xₖ₊₁,uₖ₊₁)], con f(x,y)=x+sin(y).\n\nPasso k=0 (u₀=0, x₁=0,5): g(u₁)=u₁-0-0,25·[(0+sin0)+(0,5+sin(u₁))] = u₁-0,125-0,25sin(u₁), g'(u₁)=1-0,25cos(u₁).\n\nNewton da u₁⁽⁰⁾=0:\ng(0)=-0,125; g'(0)=0,75 → u₁⁽¹⁾=0+0,125/0,75=0,500 (incremento 0,500)\ng(0,5)=0,5-0,125-0,25sin(0,5)=0,5-0,125-0,1199=0,2551; g'(0,5)=1-0,25cos(0,5)=0,7807 → u₁⁽²⁾=0,5-0,2551/0,7807=0,1817 (incremento 0,3183)\ng(0,1817)=0,1817-0,125-0,25sin(0,1817)=0,1817-0,125-0,0451=0,0116; g'(0,1817)≈0,7541 → u₁⁽³⁾=0,1817-0,0116/0,7541=0,1663 (incremento 0,0154)\ng(0,1663)≈0,0002; u₁⁽⁴⁾≈0,1660 (incremento 0,0007 < 10⁻²) → si arresta qui.\n\nDopo convergenza (tolleranza 10⁻² sull'incremento): u₁ ≈ 0,166.\n\nTabella parziale: x₀=0, u₀=0,000; x₁=0,5, u₁≈0,166 (il secondo passo, x₂=1,0, si calcolerebbe ripetendo lo stesso procedimento con u₁ come nuovo punto di partenza).",no_ans:false},
{l:45,n:9,t:"Si consideri il problema di Cauchy: y′(x)=e^{−x} − y, x∈(0,2], y(0)=1. Calcolare la soluzione esatta y(x). Discretizzare l'intervallo [0,2] con passo h=0.5. Applicare il metodo del punto medio e riportare la formula iterativa. Calcolare i valori numerici u_k e confrontare il risultato con la soluzione esatta riportando i valori dell'errore assoluto e relativo.",o:[],is_open:true,ans_idx:null,ans_text:"Soluzione esatta: l'EDO y'+y=e^(-x) ha, con fattore integrante e^x, soluzione y(x)=(x+1)e^(-x) (con y(0)=1).\n\nFormula del punto medio: uₖ₊₁=uₖ₋₁+2h·f(xₖ,uₖ), con f(x,y)=e^(-x)-y. Il valore u₁ si calcola con Heun: u₁≈0,9016 (x=0,5).\n\nProseguendo: u₂=0,7049 (x=1,0), u₃=0,5646 (x=1,5), u₄=0,3634 (x=2,0).\n\nConfronto con l'esatta:\nx=0: u=1,000, esatta=1,000, err.ass.=0\nx=0,5: u=0,9016, esatta=0,9098, err.ass.=0,0082 (0,90%)\nx=1,0: u=0,7049, esatta=0,7358, err.ass.=0,0309 (4,20%)\nx=1,5: u=0,5646, esatta=0,5578, err.ass.=0,0068 (1,22%)\nx=2,0: u=0,3634, esatta=0,4060, err.ass.=0,0426 (10,49%)\n\nSi nota un errore relativo crescente verso la fine dell'intervallo, tipico comportamento oscillante del metodo del punto medio (metodo esplicito a due passi), che tende ad accumulare piccole discrepanze ad ogni coppia di passi.",no_ans:false},
{l:45,n:10,t:"Si consideri il problema di Cauchy: y′(x)=y*cos(x), x∈(0,2], y(0)=1. Discretizzare l'intervallo [0,2] con passo h=0.5 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Cranck-Nicholson per il problema dato. Utilizzare il metodo di Newton (eseguendo 2 iterazioni di Newton) per calcolare u_k+1 al primo passo (k=0).",o:[],is_open:true,ans_idx:null,ans_text:"Nodi: x₀=0, x₁=0,5, x₂=1,0, x₃=1,5, x₄=2,0.\n\nFormula di Crank-Nicolson: uₖ₊₁=uₖ+(h/2)[f(xₖ,uₖ)+f(xₖ₊₁,uₖ₊₁)], con f(x,y)=y·cos(x).\n\nPasso k=0 (u₀=1, x₀=0, x₁=0,5): g(u₁)=u₁-1-0,25·[1·cos(0)+u₁·cos(0,5)] = u₁-1-0,25-0,25·0,8776·u₁ = u₁(1-0,2194)-1,25, g'(u₁)=1-0,2194=0,7806.\n\nNewton da u₁⁽⁰⁾=1:\ng(1)=0,7806-1,25=-0,4694 → u₁⁽¹⁾=1+0,4694/0,7806=1,6013\ng(1,6013)=0,7806·1,6013-1,25=1,2501-1,25=0,0001≈0 → u₁⁽²⁾=1,6013\n\nDopo due iterazioni di Newton il metodo converge già: u₁ ≈ 1,6013.\n\n(Questo è il valore al nodo x₁=0,5; il procedimento si ripete in modo analogo per calcolare u₂, u₃, u₄ ai nodi successivi.)",no_ans:false},
// === L046 Metodo di Heun e stabilità assoluta ===
{l:46,n:1,t:"Il metodo del punto medio è:",o:["Stabile per |1+hλ|>1","Stabile per |1+hλ|<1","Incondizionatamente instabile","Incondizionatamente stabile"],is_open:false,ans_idx:1,no_ans:false},
{l:46,n:2,t:"Qual è la differenza chiave tra Eulero in Avanti (EA) ed Eulero all'Indietro (EI) rispetto alla stabilità?",o:["EA è sempre stabile, EI è sempre instabile","EA è implicito, EI è esplicito","Entrambi sono di ordine due","EA è condizionatamente stabile, EI è incondizionatamente stabile"],is_open:false,ans_idx:3,no_ans:false},
{l:46,n:3,t:"Il metodo di Crank-Nicolson è stabile per:",o:["h>1","Nessun valore di h","Tutti i valori di h","|1+hλ|<1"],is_open:false,ans_idx:2,no_ans:false},
{l:46,n:4,t:"Dimezzando il passo h, l'errore nel metodo di Heun si riduce:",o:["si raddoppia","di un quarto","rimane uguale","della metà"],is_open:false,ans_idx:1,no_ans:false},
{l:46,n:5,t:"Il metodo di Heun è un metodo...",o:["esplicito del primo ordine","implicito del secondo ordine","esplicito del secondo ordine","implicito del primo ordine"],is_open:false,ans_idx:2,no_ans:false},
{l:46,n:6,t:"Il metodo di Heun viene anche utilizzato per:",o:["calcolare u_0","inizializzare un metodo iterativo di ordine due","inizializzare il metodo del punto medio","semplificare la formula di Crank-Nicolson"],is_open:false,ans_idx:1,no_ans:false},
{l:46,n:7,t:"Un metodo numerico per EDO è convergente se:",o:["Risulta stabile","dipende dal numero di passi","tende alla soluzione esatta per h→0","Risulta consistente"],is_open:false,ans_idx:2,no_ans:false},
{l:46,n:8,t:"Cosa indica la stabilità assoluta in un metodo numerico per EDO?",o:["Che la soluzione numerica è consistente","Che la soluzione numerica è convergente","Che la soluzione numerica in modulo è zero","Che la soluzione numerica tende a zero come quella esatta"],is_open:false,ans_idx:3,no_ans:false},
{l:46,n:9,t:"Quale tra i seguenti metodi è incondizionatamente assolutamente stabile?",o:["Metodo del punto medio","Metodo implicito di Eulero","Metodo di Heun","Eulero esplicito"],is_open:false,ans_idx:1,no_ans:false},
{l:46,n:10,t:"Quale dei seguenti metodi è a due passi?",o:["Punto medio","Eulero avanti","Heun","Crank-Nicolson"],is_open:false,ans_idx:0,no_ans:false},
{l:46,n:11,t:"Perché si utilizza il problema modello y′(x)=λy(x)?",o:["Per calcolare errori di troncamento","Per testare la convergenza dei metodi numerici","Per testare la consistenza dei metodi numerici","Per testare la stabilità dei metodi numerici"],is_open:false,ans_idx:3,no_ans:false},
{l:46,n:12,t:"Si consideri il problema di Cauchy: y′(x)=−y+cos(x),x∈(0,2],y(0)=1. Discretizzare l'intervallo [0,2] con passo h=0.5 e scrivere i nodi x_k. Scrivere, per il problema dato, la formula iterativa per i tre metodi: Eulero in avanti, Heun e punto medio. Riportare le tre soluzioni numeriche in una tabella. Facoltativo: calcolare la soluzione esatta e gli errori relativi per ognuno dei metodi. Discutere l'accuratezza dei vari metodi.",o:[],is_open:true,ans_idx:null,ans_text:"Nodi: x₀=0, 0,5, 1,0, 1,5, 2,0. f(x,y)=-y+cos(x).\n\nEulero avanti: uₖ₊₁=uₖ+h·f(xₖ,uₖ) → u: 1,000 / 1,000 / 0,9388 / 0,7395 / 0,4051\n\nHeun: uₖ₊₁=uₖ+h/2[f(xₖ,uₖ)+f(xₖ₊₁,uₖ+h·f(xₖ,uₖ))] → u: 1,000 / 0,9694 / 0,8506 / 0,6169 / 0,2904\n\nPunto medio (con u₁ da Heun): u: 1,000 / 0,9694 / 0,9082 / 0,6015 / 0,3774\n\nSoluzione esatta (da y'+y=cos(x)): y(x)=0,5e^(-x)+0,5(sin(x)+cos(x)):\nx=0: 1,0000; x=0,5: 0,9818; x=1,0: 0,8748; x=1,5: 0,6457; x=2,0: 0,3142\n\nConfrontando gli errori assoluti finali (a x=2): Eulero avanti |0,4051-0,3142|=0,091 (errore maggiore, essendo del primo ordine); Heun |0,2904-0,3142|=0,024; Punto medio |0,3774-0,3142|=0,063.\n\nCome atteso, Heun e punto medio (entrambi del secondo ordine) sono più accurati di Eulero in avanti (primo ordine), con Heun che in questo caso risulta il più preciso, mentre il punto medio mostra un comportamento leggermente meno regolare, coerente con la sua natura di metodo esplicito a due passi (soggetto, per problemi più rigidi, a comportamenti oscillanti).",no_ans:false},
{l:46,n:13,t:"Si consideri il problema di Cauchy: y′(x)=x+y^2, x∈(0,1], y(0)=0. Discretizzare l'intervallo [0,1] con passo h=0.25 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Heun per il problema dato. Riportare i valori x_k u_k per ogni passo k. Confrontare i risultati con quelli ottenuti con Eulero e punto medio.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Heun: uₖ₊₁=uₖ+h/2·[f(xₖ,uₖ)+f(xₖ₊₁, uₖ+h·f(xₖ,uₖ))], con f(x,y)=x+y².\n\nu₀=0,0000 (x=0)\nu₁=0,0312 (x=0,25)\nu₂=0,1262 (x=0,5)\nu₃=0,2926 (x=0,75)\nu₄=0,5535 (x=1,0)\n\nCon Eulero in avanti si otterrebbero valori leggermente più bassi ad ogni passo (essendo un metodo del primo ordine che sottostima la curvatura crescente di y'=x+y²), mentre con il punto medio (che richiede u₁ iniziale da Heun) si otterrebbero valori intermedi, generalmente più vicini a Heun che a Eulero.\n\nEssendo y'=x+y² un'equazione a crescita superlineare (simile a y'=1+y²), tutti i metodi tendono a sottostimare leggermente la vera crescita della soluzione, ma Heun, essendo del secondo ordine, offre un'approssimazione via via più accurata rispetto a Eulero in avanti al crescere di x.",no_ans:false},
{l:46,n:14,t:"Si consideri il problema di Cauchy: y′(x)=1+y^{2}, x∈(0,1], y(0)=0, x∈(0,2], y(0)=1. Discretizzare l'intervallo [0,2] con passo h=0.25 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Heun per il problema dato. Riportare i valori x_k u_k.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Heun: uₖ₊₁=uₖ+h/2·[f(xₖ,uₖ)+f(xₖ₊₁,uₖ+h·f(xₖ,uₖ))], con f(x,y)=1+y², partendo da y(0)=1.\n\nu₀=1,0000 (x=0)\nu₁=1,6563 (x=0,25)\nu₂=3,0890 (x=0,5)\nu₃=8,6278 (x=0,75), poi la soluzione diverge rapidamente (valori enormi già al passo successivo).\n\nQuesto comportamento non è un errore di calcolo, ma riflette una caratteristica intrinseca dell'equazione: la soluzione esatta è y(x)=tan(x+π/4), che ha un asintoto verticale in x=π/4≈0,785 (poiché y(0)=1=tan(π/4)). La soluzione quindi \"esplode\" a tempo finito, ben prima di raggiungere x=2: si tratta di un classico esempio di problema di Cauchy mal posto oltre un certo intervallo, dove nessun metodo numerico (indipendentemente dal passo) può seguire la soluzione oltre il punto di esplosione, e i valori numerici crescenti che si osservano sono proprio il segnale numerico di questo fenomeno.",no_ans:false},
{l:46,n:15,t:"Si consideri il problema di Cauchy: y′(x)=x^2+y^2, x∈(0,1.5], y(0)=0. Discretizzare l'intervallo [0,1.5] con passo h=0.25 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Heun per il problema dato. Confrontare i risultati ottenuti con il metodo di Eulero in avanti. Commentare il comportamento della soluzione.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Heun: uₖ₊₁=uₖ+h/2·[f(xₖ,uₖ)+f(xₖ₊₁,uₖ+h·f(xₖ,uₖ))], con f(x,y)=x²+y².\n\nHeun: u₀=0,0000; u₁=0,0078 (x=0,25); u₂=0,0470 (x=0,5); u₃=0,1503 (x=0,75); u₄=0,3594 (x=1,0); u₅=0,7474 (x=1,25); u₆=1,4978 (x=1,5).\n\nEulero avanti: u₀=0,0000; u₁=0,0000; u₂=0,0156 (x=0,5); u₃=0,0782 (x=0,75); u₄=0,2203 (x=1,0); u₅=0,4825 (x=1,25); u₆=0,9313 (x=1,5).\n\nSi osserva che Eulero in avanti sottostima sistematicamente la crescita della soluzione rispetto a Heun, con uno scarto che aumenta rapidamente verso la fine dell'intervallo (a x=1,5: 1,498 contro 0,931, quasi il 40% di differenza). Questo è tipico delle equazioni con termine quadratico y², dove la curvatura della soluzione è marcata e un metodo del primo ordine come Eulero fatica a seguirla; Heun, essendo del secondo ordine, cattura meglio questa curvatura grazie al passo predictor-corrector.",no_ans:false},
{l:46,n:16,t:"Si consideri il problema di Cauchy: y′(x)=−3y+2x, x∈(0,1], y(0)=1. Discretizzare l'intervallo [0,1] con passo h=0.2 e scrivere i nodi x_k. Scrivere la formula iterativa del metodo di Heun per il problema dato. Riportare i valori x_k u_k.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Heun: uₖ₊₁=uₖ+h/2·[f(xₖ,uₖ)+f(xₖ₊₁,uₖ+h·f(xₖ,uₖ))], con f(x,y)=-3y+2x, h=0,2.\n\nu₀=1,0000 (x=0)\nu₁=0,6200 (x=0,2)\nu₂=0,4556 (x=0,4)\nu₃=0,4162 (x=0,6)\nu₄=0,4494 (x=0,8)\nu₅=0,5247 (x=1,0)\n\nLa soluzione esatta di questa EDO lineare (y'+3y=2x) è y(x)=(1+2/9)e^(-3x)+2x/3-2/9, che decresce rapidamente all'inizio (per l'effetto dominante del termine -3y) per poi risalire linearmente seguendo il termine 2x: l'andamento calcolato con Heun (che scende da 1 fino a un minimo intorno a x=0,6 e poi risale) riproduce correttamente questo comportamento qualitativo.",no_ans:false},

{l:47,n:1,t:"Quale delle seguenti garantisce la convergenza?",o:["Stabilità più consistenza","Solo stabilità","Solo consistenza","Metodo implicito"],is_open:false,ans_idx:0,no_ans:false},
{l:47,n:2,t:"Un metodo non consistente può essere:",o:["Instabile ma convergente","Stabile ma non convergente","Convergente","Solo esplicito"],is_open:false,ans_idx:1,no_ans:false},
{l:47,n:3,t:"La consistenza misura:",o:["L'errore di troncamento","L'errore di approssimazione","Quanto lo schema numerico rappresenta correttamente il problema originale","La distanza tra soluzione numerica e quella esatta"],is_open:false,ans_idx:2,no_ans:false},
{l:47,n:4,t:"Quale proprietà non è sufficiente da sola per garantire la convergenza?",o:["Stabilità","Soluzione esatta nota","Passo costante","Soluzione esatta non nota"],is_open:false,ans_idx:0,no_ans:false},
{l:47,n:5,t:"In quale situazione si applica il concetto di zero stabilità?",o:["Quando il metodo è esatto","Quando la soluzione tende a zero","Quando il passo di integrazione tende a infinito","Quando il passo di integrazione tende a zero in un intervallo fissato"],is_open:false,ans_idx:3,no_ans:false},

  ll.forEach(function(l){
    var n=l<10?'00'+l:(l<100?'0'+l:''+l);
    h+='<button class="lb" id="lb-'+l+'" onclick="setL('+l+')"><span class="ln">L'+n+'</span><span class="lname">'+(LN[l]||'L'+l)+'</span><span class="lc">'+(lc[l]||0)+'</span></button>';
  });
  sb.innerHTML=h;
}

function setL(l){
  lesson=l;
  document.querySelectorAll('.lb').forEach(function(b){b.classList.remove('active');});
  var t=document.getElementById(l?'lb-'+l:'lb-all');
  if(t)t.classList.add('active');
  render();
}

function setF(f,btn){
  filter=f;
  document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function getFilt(){
  var t=document.getElementById('search').value.toLowerCase().trim();
  return Q.filter(function(q){
    if(lesson&&q.l!==lesson)return false;
    if(filter==='mc'&&q.is_open)return false;
    if(filter==='open'&&!q.is_open)return false;
    if(t){var h=(q.t+' '+(q.o||[]).join(' ')).toLowerCase();return t.split(/\s+/).filter(Boolean).every(function(w){return h.indexOf(w)>=0;});}
    return true;
  });
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildAns(q){
  if(q.no_ans)return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  var letters=['A','B','C','D','E'];
  if(q.is_open){
    if(q.ans_text){
      return'<div class="open-ans"><strong>&#9999; Risposta tipo</strong>'+esc(q.ans_text.replace(/\\n/g,'\n'))+'</div>';
    }
    return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  }
  var h='<div class="opts">';
  for(var i=0;i<q.o.length;i++){
    var cls=(q.ans_idx>=0&&i===q.ans_idx)?'opt correct':'opt';
    h+='<div class="'+cls+'"><b style="font-family:monospace;font-size:11px;margin-right:6px">'+letters[i]+')</b>'+esc(q.o[i])+'</div>';
  }
  h+='</div>';
  return h;
}

function render(){
  var f=getFilt();
  document.getElementById('vc').textContent=f.length;
  var c=document.getElementById('qc');
  if(!f.length){c.innerHTML='<div class="empty"><p style="font-size:2em">&#128269;</p>Nessuna domanda trovata</div>';return;}
  var h='',last=null;
  f.forEach(function(q){
    if(q.l!==last){var n=q.l<10?'00'+q.l:(q.l<100?'0'+q.l:''+q.l);h+='<div class="sec">L'+n+' &mdash; '+(LN[q.l]||'Lezione '+q.l)+'</div>';last=q.l;}
    var num=q.n<10?'0'+q.n:''+q.n;
    var badge=q.is_open?'<span class="qbadge op">APERTA</span>':'<span class="qbadge mc">CHIUSA</span>';
    h+='<div class="qcard" id="qcard-'+q.l+'-'+q.n+'"><div class="qhead">'+badge+'<span class="qt"><b>Q'+num+'</b> &mdash; '+esc(q.t)+'</span><span class="qarrow">&#9660;</span></div><div class="qans">'+buildAns(q)+'</div></div>';
  });
  c.innerHTML=h;
  document.querySelectorAll('.qcard .qhead').forEach(function(h){
    h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
  });
}

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();var s=document.getElementById('search');s.focus();s.select();}
});

buildSB();render();
</script></body></html>
