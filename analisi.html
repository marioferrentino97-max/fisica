<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paniere Analisi Numerica eCampus</title>
<style>
:root{--bg:#0f0e0c;--surf:#1a1814;--surf2:#212019;--border:#2e2b24;--border2:#3d3a30;--accent:#c8a96e;--adim:rgba(200,169,110,0.12);--green:#27ae60;--gdim:rgba(39,174,96,0.1);--blue:#5dade2;--bdim:rgba(93,173,226,0.10);--text:#e8e0d0;--muted:#9a9080;--dim:#5a5248;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh;line-height:1.65}
header{background:rgba(15,14,12,.97);border-bottom:1px solid var(--border);padding:14px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo{font-family:Palatino,serif;font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.logo span{font-size:10px;color:var(--dim);display:block;font-weight:normal;font-family:monospace;letter-spacing:1px}
.sw{flex:1;position:relative;min-width:180px}
#search{width:100%;background:var(--surf2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:Georgia,serif;padding:8px 12px 8px 36px;outline:none;transition:border-color .15s;}
#search:focus{border-color:var(--accent)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
.stats{font-family:monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.stats b{color:var(--accent)}
.layout{display:flex;min-height:calc(100vh - 59px)}
aside{width:230px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;position:sticky;top:59px;height:calc(100vh - 59px);}
.lb{display:flex;align-items:center;gap:7px;width:100%;padding:7px 14px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;font-family:monospace;text-align:left;transition:all .15s;border-left:3px solid transparent;}
.lb:hover{background:var(--surf2);color:var(--text)}
.lb.active{background:var(--adim);color:var(--accent);border-left-color:var(--accent)}
.lb .ln{font-size:12px;font-weight:700;min-width:28px}
.lb .lname{font-size:9px;opacity:.7;line-height:1.3}
.lb .lc{margin-left:auto;font-size:9px;background:var(--border);padding:1px 5px;border-radius:8px;flex-shrink:0}
main{flex:1;padding:22px;max-width:880px}
.filters{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.pill{font-family:monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 13px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--dim);transition:all .15s;}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--adim);border-color:var(--accent);color:var(--accent)}
.pill.mc-pill.active{background:var(--gdim);border-color:var(--green);color:var(--green)}
.pill.op-pill.active{background:var(--bdim);border-color:var(--blue);color:var(--blue)}
.qcard{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden;cursor:pointer;}
.qhead{display:flex;align-items:flex-start;gap:11px;padding:13px 17px;}
.qhead:hover{background:rgba(255,255,255,.02)}
.qbadge{font-family:monospace;font-size:9px;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:3px;white-space:nowrap;}
.qbadge.mc{background:var(--gdim);color:var(--green);border:1px solid rgba(39,174,96,.2)}
.qbadge.op{background:var(--bdim);color:var(--blue);border:1px solid rgba(93,173,226,.2)}
.qt{font-size:13.5px;line-height:1.6;color:var(--text);flex:1}
.qarrow{color:var(--dim);font-size:10px;margin-top:4px;flex-shrink:0;transition:transform .2s}
.qcard.open .qarrow{transform:rotate(180deg);color:var(--accent)}
.qans{display:none;padding:0 17px 15px 48px}
.qcard.open .qans{display:block}
.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.opt{font-size:12.5px;padding:7px 11px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--surf2);}
.opt.correct{background:var(--gdim);border-color:rgba(39,174,96,.35);color:var(--green);font-weight:600;}
.opt.correct::before{content:"\2713  "}
.open-ans{background:var(--bdim);border:1px solid rgba(93,173,226,.2);border-radius:7px;padding:12px 16px;font-size:13px;color:#cde4f5;line-height:1.8;white-space:pre-wrap;}
.open-ans strong{display:block;font-family:monospace;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);margin-bottom:8px}
.no-ans{font-family:monospace;font-size:11px;color:var(--dim);padding:7px 11px;border:1px dashed var(--border);border-radius:6px;}
.sec{font-family:monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:22px 0 11px;display:flex;align-items:center;gap:10px;}
.sec::after{content:"";flex:1;height:1px;background:var(--border)}
.empty{text-align:center;padding:60px 20px;color:var(--dim);font-family:monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:640px){aside{display:none}main{padding:12px}}
</style></head>

<script>
var LN={

  "36":"EDO lineari e a variabili separabili",
  "37":"Integrali singolari ed EDO omogenee",
  "38":"Condizioni di risolubilità di Cauchy",
  "39":"Il metodo delle isocline",
  "41":"Principi dei metodi numerici per EDO",
  "42":"Differenze finite avanti/indietro/centrate",
  "43":"Eulero in avanti e all'indietro",
  "44":"Convergenza dei metodi di Eulero",
  "45":"Punto medio e Crank-Nicolson",
  "46":"Metodo di Heun e stabilità assoluta",
  "47":"Stabilità, consistenza e convergenza",
};

var Q=[
// === L002 Bisezione ===
{l:2,n:1,t:"L'interpretazione geometrica della ricerca degli zeri di una funzione f(x) è:",o:["Trovare le intersezioni di f(x) con l'asse x","Trovare le derivate di f(x) uguali a zero","Trovare i punti fissi di f(x)","Trovare i punti di massimo di f(x)"],is_open:false,ans_idx:0,no_ans:false},
{l:2,n:2,t:"Nel metodo di Bisezione, dato l'intervallo [a,b], se il prodotto tra la funzione nel primo estremo f(a), e la funzione nel secondo estremo f(b), è maggiore di zero:",o:["La funzione ammette lo zero nell'intervallo [a,b]","La funzione ammette uno zero positivo in [a,b]","La funzione non ammette lo zero nell'intervallo [a,b]","La funzione non ammette zeri"],is_open:false,ans_idx:2,no_ans:false},
{l:2,n:3,t:"Data l'equazione non lineare f=[1, -2, -5] e l'intervallo [-1, 3] quanto vale il valore di tentativo alla prima iterazione del metodo di Bisezione?",o:["4","3","2","1"],is_open:false,ans_idx:3,no_ans:false},
{l:2,n:4,t:"Data l'equazione non lineare f=[1, -2, -5] e l'intervallo [-6, 2] quanto vale il valore di tentativo alla prima iterazione del metodo di Bisezione?",o:["-2","-1","-4","0"],is_open:false,ans_idx:0,no_ans:false},
{l:2,n:5,t:"Nel metodo di Bisezione, dato l'intervallo [a,b], se il prodotto tra la funzione nel primo estremo f(a), e la funzione nel secondo estremo f(b), è minore di zero:",o:["La funzione non ammette zeri","La funzione ammette lo zero nell'intervallo [a,b]","La funzione non ammette lo zero nell'intervallo [a,b]","La funzione ammette uno zero negativo in [a,b]"],is_open:false,ans_idx:1,no_ans:false},
{l:2,n:6,t:"Nel metodo di Bisezione, dato [a,b], dopo aver determinato il valore di tentativo c, nella prima iterazione come faccio a stabilire il nuovo intervallo della seconda iterazione?",o:["Si controlla se il prodotto tra la funzione in a e la funzione in c risulta positivo","Si controlla se il prodotto tra la funzione in a (o b) e la funzione in c risulta minore, maggiore o uguale a zero","Si controlla se il prodotto tra la funzione in a e la funzione in b risulta positivo","Si controlla se il prodotto tra la funzione in a e la funzione in b risulta negativo"],is_open:false,ans_idx:1,no_ans:false},
{l:2,n:7,t:"Dopo la prima iterazione del metodo di Bisezione, dato l'intervallo [a,b], se il prodotto tra la funzione nel secondo estremo f(b), e la funzione nel nuovo valore trovato f(c), è minore di zero, qual è il nuovo intervallo da utilizzare nella iterazione successiva?",o:["[c,b]","Non è possibile trovare lo zero","[a,c]","[a,b]"],is_open:false,ans_idx:0,no_ans:false},
{l:2,n:8,t:"Dopo la prima iterazione del metodo di Bisezione, dato l'intervallo [a,b], se il prodotto tra la funzione nel primo estremo f(a), e la funzione nel nuovo valore trovato f(c) è minore di zero, qual è il nuovo intervallo da utilizzare nella iterazione successiva?",o:["[a,b]","Non è possibile trovare lo zero","[a,c]","[c,b]"],is_open:false,ans_idx:2,no_ans:false},
{l:2,n:9,t:"Quale formula utilizza il metodo di bisezione per dividere l'intervallo [a,b] in due parti uguali?",o:["c=0.5(a-b)","c=0.5(a+a)","c=0.5(b+b)","c=0.5(a+b)"],is_open:false,ans_idx:3,no_ans:false},
{l:2,n:10,t:"In quale condizione è possibile calcolarne lo zero della funzione non lineare con il metodo di bisezione?",o:["Quando la funzione è continua e derivabile nell'intervallo iniziale","Quando la funzione è continua e assume stesso segno nell'intervallo iniziale","Quando la funzione è continua e assume valori di segno opposto nell'intervallo iniziale","Quando la funzione è continua nell'intervallo iniziale"],is_open:false,ans_idx:2,no_ans:false},
{l:2,n:11,t:"In quali casi il metodo di bisezione converge?",o:["Converge solo in casi particolari","Quando la funzione non lineare è crescente","Quando la derivata prima è positiva","Il metodo di bisezione converge sempre"],is_open:false,ans_idx:3,no_ans:false},
{l:2,n:12,t:"Cosa è necessario per poter inizializzare il metodo di bisezione?",o:["Sono necessari la funzione e la sua derivata","Sono necessari la funzione e un punto di partenza","Basta conoscere l'equazione non lineare di partenza","Sono necessari la funzione e due punti di partenza"],is_open:false,ans_idx:3,no_ans:false},
{l:2,n:13,t:"Data la seguente equazione non lineare f=[ 1, 0, -9, 1] Eseguire due iterazioni con il metodo di Bisezione utilizzando come valori di partenza x1=2,5 e x2=3.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x³ - 9x + 1. Verifico il cambio di segno: P(2,5) = 15,625 - 22,5 + 1 = -5,875; P(3) = 27 - 27 + 1 = 1. Segni opposti, quindi lo zero è nell'intervallo.\n\nIterazione 1: c₁ = (2,5+3)/2 = 2,75. P(2,75) = -2,9531.\nP(a)·P(c₁) = (-5,875)·(-2,9531) > 0, quindi lo zero è tra c₁ e b: nuovo intervallo [2,75; 3].\n\nIterazione 2: c₂ = (2,75+3)/2 = 2,875. P(2,875) = -1,1113.\nP(a)·P(c₂) > 0 (entrambi negativi), quindi il nuovo intervallo è [2,875; 3].\n\nDopo due iterazioni l'approssimazione della radice è x ≈ 2,875, con l'intervallo di ricerca ristretto a [2,875; 3].",no_ans:false},
{l:2,n:14,t:"Data la seguente equazione non lineare f=[ 1, -1, -2] Eseguire due iterazioni con il metodo della Bisezione utilizzando come valori di partenza x1=-10 e x2=1.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x² - x - 2 = (x-2)(x+1), con radici -1 e 2. Verifico: P(-10) = 100+10-2 = 108; P(1) = 1-1-2 = -2. Segni opposti.\n\nIterazione 1: c₁ = (-10+1)/2 = -4,5. P(-4,5) = 20,25+4,5-2 = 22,75.\nP(a)·P(c₁) > 0 (stesso segno di a), quindi il nuovo intervallo è [-4,5; 1].\n\nIterazione 2: c₂ = (-4,5+1)/2 = -1,75. P(-1,75) = 3,0625+1,75-2 = 2,8125.\nStesso segno di a, quindi il nuovo intervallo è [-1,75; 1].\n\nDopo due iterazioni l'approssimazione è x ≈ -1,75, e ci si sta avvicinando correttamente alla radice esatta -1.",no_ans:false},
{l:2,n:15,t:"Nel metodo di Bisezione, come viene fissato il numero di iterazioni per interrompere il metodo?",o:[],is_open:true,ans_idx:null,ans_text:"Il numero di iterazioni si può fissare a priori, prima ancora di iniziare i calcoli, perché il metodo di bisezione ha un comportamento prevedibile: ad ogni passo l'ampiezza dell'intervallo che contiene la radice si dimezza esattamente.\n\nPartendo da un intervallo iniziale [a,b] di ampiezza (b-a), dopo n iterazioni l'ampiezza è (b-a)/2ⁿ. Se voglio che l'errore sia minore di una tolleranza ε fissata, mi basta imporre\n\n(b-a)/2ⁿ < ε\n\nda cui, risolvendo rispetto a n:\n\nn > log₂((b-a)/ε)\n\nQuesto è il motivo per cui, a differenza di altri metodi iterativi (come Newton), nella bisezione posso decidere in anticipo esattamente quante iterazioni servono per raggiungere una precisione desiderata, senza bisogno di controllare il residuo o l'incremento ad ogni passo.",no_ans:false},
{l:2,n:16,t:"Data la seguente equazione non lineare f=[ 1, 0, -9, 1] Eseguire due iterazioni con il metodo di Bisezione utilizzando come valori di partenza x1=2 e x2=3.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x³ - 9x + 1. Verifico: P(2) = 8-18+1 = -9; P(3) = 27-27+1 = 1. Segni opposti.\n\nIterazione 1: c₁ = (2+3)/2 = 2,5. P(2,5) = 15,625-22,5+1 = -5,875.\nP(a)·P(c₁) > 0, quindi il nuovo intervallo è [2,5; 3].\n\nIterazione 2: c₂ = (2,5+3)/2 = 2,75. P(2,75) = -2,9531.\nStesso segno di a, quindi il nuovo intervallo è [2,75; 3].\n\nDopo due iterazioni l'approssimazione è x ≈ 2,75.",no_ans:false},
{l:2,n:17,t:"Data la seguente equazione non lineare f=[ 1, 0, 0, -2] Eseguire due iterazioni con il metodo della Bisezione utilizzando come valori di partenza x1=0 e x2=2.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x³ - 2. Verifico: P(0) = -2; P(2) = 8-2 = 6. Segni opposti.\n\nIterazione 1: c₁ = (0+2)/2 = 1. P(1) = 1-2 = -1.\nP(a)·P(c₁) > 0 (entrambi negativi), quindi il nuovo intervallo è [1; 2].\n\nIterazione 2: c₂ = (1+2)/2 = 1,5. P(1,5) = 3,375-2 = 1,375.\nP(a)·P(c₂) < 0 (segni opposti), quindi il nuovo intervallo è [1; 1,5].\n\nDopo due iterazioni l'approssimazione è x ≈ 1,5, e la radice esatta ∛2 ≈ 1,2599 è correttamente racchiusa nell'intervallo [1; 1,5].",no_ans:false},
{l:2,n:18,t:"Data la seguente equazione non lineare f=[ 1, 0, 0, -2] Eseguire due iterazioni con il metodo della Bisezione utilizzando come valori di partenza x1=1 e x2=2.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x³ - 2. Verifico: P(1) = -1; P(2) = 6. Segni opposti.\n\nIterazione 1: c₁ = (1+2)/2 = 1,5. P(1,5) = 1,375.\nP(a)·P(c₁) < 0, quindi il nuovo intervallo è [1; 1,5].\n\nIterazione 2: c₂ = (1+1,5)/2 = 1,25. P(1,25) = 1,9531-2 = -0,0469.\nP(a)·P(c₂) > 0 (entrambi negativi), quindi il nuovo intervallo è [1,25; 1,5].\n\nDopo due iterazioni l'approssimazione è x ≈ 1,25, molto vicina alla radice esatta ∛2 ≈ 1,2599.",no_ans:false},
{l:2,n:19,t:"Data la seguente equazione non lineare f=[ 46, 0, 3, 1] Eseguire due iterazioni con il metodo della Bisezione utilizzando come valori di partenza x1=-4 e x2=1.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = 46x³ + 3x + 1. Verifico: P(-4) = 46·(-64)+3·(-4)+1 = -2944-12+1 = -2955; P(1) = 46+3+1 = 50. Segni opposti.\n\nIterazione 1: c₁ = (-4+1)/2 = -1,5. P(-1,5) = 46·(-3,375)+3·(-1,5)+1 = -155,25-4,5+1 = -158,75.\nP(a)·P(c₁) > 0 (entrambi negativi), quindi il nuovo intervallo è [-1,5; 1].\n\nIterazione 2: c₂ = (-1,5+1)/2 = -0,25. P(-0,25) = 46·(-0,015625)-0,75+1 = -0,71875-0,75+1 = -0,4688.\nP(a)·P(c₂) > 0, quindi il nuovo intervallo è [-0,25; 1].\n\nDopo due iterazioni l'approssimazione è x ≈ -0,25.",no_ans:false},
// === L003 Corde, secanti, Newton ===
{l:3,n:1,t:"Dato l'intervallo [a,b] qual'è la formula per calcolare il coefficiente q, nel metodo delle corde?",o:["[f(b)f(a)]/(b+a)","[f(b)-f(a)]/(b-a)","[f(b)-f(a)]/(b+a)","[f(b)+f(a)]/(b-a)"],is_open:false,ans_idx:1,no_ans:false},
{l:3,n:2,t:"Cosa è necessario per poter inizializzare il metodo delle corde?",o:["L'intervallo [a,b]","Un punto iniziale qualsiasi e la derivata della funzione","L'intervallo [a,b] e un punto inziale","Il punto medio dell'intervallo contenente la radice"],is_open:false,ans_idx:2,no_ans:false},
{l:3,n:3,t:"Cosa è necessario per poter inizializzare il metodo di Newton?",o:["Un punto iniziale","Un punto iniziale e la derivata della funzione","Due punti iniziali","La derivata prima della funzione"],is_open:false,ans_idx:1,no_ans:false},
{l:3,n:4,t:"Cosa è necessario per poter inizializzare il metodo della secante?",o:["Due valori iniziali distinti","Un solo punto iniziale e la derivata della funzione","Un punto iniziale","Due valori positivi"],is_open:false,ans_idx:0,no_ans:false},
{l:3,n:5,t:"Data l'equazione non lineare f=[3, -5, -10], l'intervallo [0, 4] e il punto iniziale x0=0 quanto vale il valore di tentativo alla prima iterazione del metodo dele corde?",o:["circa -1.43","5","0","circa 1.43"],is_open:false,ans_idx:3,no_ans:false},
{l:3,n:6,t:"Data la seguente equazione non lineare f=[ 1, 0, 0, -2] Eseguire due iterazioni con il metodo della Secante utilizzando come valori di partenza x0=0 e x1=2.",o:[],is_open:true,ans_idx:null,ans_text:"Il polinomio è P(x) = x³ - 2. La formula iterativa della secante è xₙ₊₁ = xₙ - f(xₙ)·(xₙ-xₙ₋₁)/(f(xₙ)-f(xₙ₋₁)).\n\nDati iniziali: x₀=0 (f=-2), x₁=2 (f=6).\n\nIterazione 1: x₂ = 2 - 6·(2-0)/(6-(-2)) = 2 - 12/8 = 0,5.\nf(0,5) = 0,125-2 = -1,875.\n\nIterazione 2: il numeratore è (-1,875)·(0,5-2) = (-1,875)·(-1,5) = 2,8125; il denominatore è f(x₁)-f(x₀) = -1,875-6 = -7,875. La frazione vale quindi 2,8125/(-7,875) = -0,3571.\nx₃ = 0,5 - (-0,3571) = 0,5+0,3571 = 0,8571.\n\nDopo due iterazioni: x ≈ 0,857, in avvicinamento alla radice esatta ∛2 ≈ 1,26.",no_ans:false},
{l:3,n:7,t:"Determinare la radice negativa della seguente funzione f=[ 1, -1, -2] con il metodo di Newton utilizzando come valore iniziale x0=-0,7 e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x² - x - 2, P'(x) = 2x - 1. Formula: xₙ₊₁ = xₙ - P(xₙ)/P'(xₙ).\n\nx₀ = -0,7: P(-0,7) = 0,49+0,7-2 = -0,81; P'(-0,7) = -2,4.\nx₁ = -0,7 - (-0,81)/(-2,4) = -0,7 - 0,3375 = -1,0375.\n\nx₁ = -1,0375: P(-1,0375) = 0,1139; P'(-1,0375) = -3,075.\nx₂ = -1,0375 - 0,1139/(-3,075) = -1,0375+0,0370 = -1,0005.\n\nx₂ = -1,0005: P(-1,0005) = 0,0014; P'(-1,0005)=-3,0009.\nx₃ = -1,0005 - 0,0014/(-3,0009) = -1,0000.\n\nIl metodo converge in poche iterazioni alla radice negativa esatta x = -1,0000.",no_ans:false},
{l:3,n:8,t:"Data la seguente equazione non lineare f=[ 1, -1, -2] Eseguire due iterazioni con il metodo di Newton utilizzando come valore di partenza x0=3 e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x² - x - 2, P'(x) = 2x - 1.\n\nx₀ = 3: P(3) = 9-3-2 = 4; P'(3) = 5.\nx₁ = 3 - 4/5 = 2,20.\n\nx₁ = 2,20: P(2,20) = 4,84-2,20-2 = 0,64; P'(2,20) = 3,40.\nx₂ = 2,20 - 0,64/3,40 = 2,20 - 0,19 = 2,01.\n\nDopo due iterazioni: x ≈ 2,01, molto vicino alla radice esatta x=2.",no_ans:false},
{l:3,n:9,t:"Data la seguente equazione non lineare f=[ 1, -1, -2] Eseguire due iterazioni con il metodo di Newton utilizzando come valore di partenza x0= 2,33 e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x² - x - 2, P'(x) = 2x - 1.\n\nx₀ = 2,33: P(2,33) = 5,4289-2,33-2 = 1,10; P'(2,33) = 3,66.\nx₁ = 2,33 - 1,10/3,66 = 2,33-0,30 = 2,03.\n\nx₁ = 2,03: P(2,03) = 4,1209-2,03-2 = 0,09; P'(2,03) = 3,06.\nx₂ = 2,03 - 0,09/3,06 = 2,03-0,03 = 2,00.\n\nDopo due iterazioni si ottiene esattamente x ≈ 2,00, la radice positiva.",no_ans:false},
{l:3,n:10,t:"Determinare lo zero della seguente equazione non lineare f=[ 1, 0, -1, -2] con il metodo di Newton utilizzando come valore di partenza x0=2 e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x³ - x - 2, P'(x) = 3x² - 1.\n\nx₀ = 2: P(2) = 8-2-2 = 4; P'(2) = 11. x₁ = 2 - 4/11 = 1,64.\nx₁ = 1,64: P(1,64) = 0,7453; P'(1,64) = 7,03. x₂ = 1,64-0,7453/7,03 = 1,53.\nx₂ = 1,53: P(1,53) = 0,0539; P'(1,53) = 6,03. x₃ = 1,53-0,0539/6,03 = 1,52.\nx₃ = 1,52: P(1,52) ≈ 0,0004, praticamente nullo.\n\nLo zero della funzione, con due cifre decimali, è x ≈ 1,52.",no_ans:false},
{l:3,n:11,t:"Data la seguente equazione non lineare f=[ 1/6, 0, -1/6] Eseguire due iterazioni con il metodo della Secante utilizzando come valori di partenza x0=0 e x1=10.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x²/6 - 1/6, con f(0) = -0,1667 e f(10) = 16,5.\n\nIterazione 1: x₂ = 10 - 16,5·(10-0)/(16,5-(-0,1667)) = 10 - 165/16,6667 = 10-9,9 = 0,1.\nf(0,1) = 0,0017-0,1667 = -0,165.\n\nIterazione 2: x₃ = 0,1 - (-0,165)·(0,1-10)/(-0,165-16,5) = 0,1 - (-0,165)·(-9,9)/(-16,665) = 0,1+0,098 = 0,198.\n\nDopo due iterazioni: x ≈ 0,198, in avvicinamento alla radice esatta x=1.",no_ans:false},
{l:3,n:12,t:"Data la seguente equazione non lineare f=[ 1, 0, 0, -2] Eseguire tre iterazioni con il metodo della Secante utilizzando come valori di partenza x0=0,5 e x1=2.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x³ - 2. f(0,5) = -1,875, f(2) = 6.\n\nIterazione 1: x₂ = 2 - 6·(2-0,5)/(6-(-1,875)) = 2 - 9/7,875 = 0,8571. f(0,8571) = -1,3703.\n\nIterazione 2: x₃ = 0,8571 - (-1,3703)·(0,8571-2)/(-1,3703-6) = 0,8571 - (-1,3703)·(-1,1429)/(-7,3703) = 0,8571+0,2125 = 1,0696. f(1,0696) = -0,7763.\n\nIterazione 3: x₄ = 1,0696 - (-0,7763)·(1,0696-0,8571)/(-0,7763-(-1,3703)) = 1,0696 - (-0,7763)·0,2125/0,594 = 1,0696+0,2777 = 1,3473.\n\nDopo tre iterazioni: x ≈ 1,347, in progressivo avvicinamento alla radice esatta ∛2 ≈ 1,26.",no_ans:false},
{l:3,n:13,t:"Data la seguente equazione non lineare f=[ 1/6, 0, -1/6] Eseguire due iterazioni con il metodo della Secante utilizzando come valori di partenza x0=0,03 e x1=10.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x²/6 - 1/6. f(0,03) = -0,1665, f(10) = 16,5.\n\nIterazione 1: x₂ = 10 - 16,5·(10-0,03)/(16,5-(-0,1665)) = 10 - 164,55/16,6665 = 10-9,8704 = 0,1296.\nf(0,1296) = -0,1639.\n\nIterazione 2: x₃ = 10 - 16,5·(10-0,1296)... procedendo con gli ultimi due punti (10 e 0,1296): x₃ = 0,1296 - (-0,1639)·(0,1296-10)/(-0,1639-16,5) = 0,1296 - (-0,1639)·(-9,8704)/(-16,6639) = 0,1296+0,0971 = 0,2267.\n\nDopo due iterazioni: x ≈ 0,227, in avvicinamento alla radice esatta x=1.",no_ans:false},
{l:3,n:14,t:"Data la seguente funzione f=[ 2, -3, 0, -1] Eseguire due iterazioni con il metodo di Newton utilizzando come valore iniziale x0=2 e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = 2x³-3x²-1, P'(x) = 6x²-6x.\n\nx₀ = 2: P(2) = 16-12-1 = 3; P'(2) = 24-12 = 12.\nx₁ = 2 - 3/12 = 1,75.\n\nx₁ = 1,75: P(1,75) = 10,7188-9,1875-1 = 0,5312; P'(1,75) = 18,375-10,5 = 7,875.\nx₂ = 1,75 - 0,5312/7,875 = 1,75-0,0675 = 1,6825.\n\nDopo due iterazioni con quattro cifre decimali: x ≈ 1,6825.",no_ans:false},
{l:3,n:15,t:"Data la seguente equazione non lineare f=[ 1, -2, 3, 6] Eseguire tre iterazioni con il metodo di Newton utilizzando come valore di partenza x0=-5/4 e tre cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x³-2x²+3x+6, P'(x) = 3x²-4x+3.\n\nx₀ = -1,25: P(-1,25) = -1,953-3,125-3,75+6 = -2,828; P'(-1,25) = 4,6875+5+3 = 12,688.\nx₁ = -1,25 - (-2,828)/12,688 = -1,25+0,223 = -1,027.\n\nx₁ = -1,027: P(-1,027) = -0,275; P'(-1,027) = 10,273.\nx₂ = -1,027-(-0,275)/10,273 = -1,027+0,027 = -1,000.\n\nx₂ = -1,000: P(-1,000) = -0,004 ≈ 0; P'(-1,000) = 10,004.\nx₃ = -1,000-(-0,004)/10,004 = -1,000.\n\nDopo tre iterazioni il metodo converge alla radice x ≈ -1,000.",no_ans:false},
{l:3,n:16,t:"Data la seguente equazione non lineare f=[ 46, 0, 3, 1] Eseguire due iterazioni con il metodo della Secante, utilizzando come valori di partenza x0= -4 e x1=1.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = 46x³+3x+1. f(-4) = -2955, f(1) = 50.\n\nIterazione 1: x₂ = 1 - 50·(1-(-4))/(50-(-2955)) = 1 - 250/3005 = 1-0,0832 = 0,9168.\nf(0,9168) = 46·0,7707+3·0,9168+1 = 35,45+2,75+1 = 39,198.\n\nIterazione 2: x₃ = 0,9168 - 39,198·(0,9168-1)/(39,198-50) = 0,9168 - 39,198·(-0,0832)/(-10,802) = 0,9168-0,302 = 0,6149.\n\nDopo due iterazioni: x ≈ 0,615, in avvicinamento alla radice.",no_ans:false},
{l:3,n:17,t:"Data la seguente equazione non lineare f=[ 1, 0, -9, 1] Eseguire due iterazioni con il metodo della Secante utilizzando come valori di partenza x0=2,9 e x1=3.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x³-9x+1. f(2,9) = 24,389-26,1+1 = -0,711, f(3) = 1.\n\nIterazione 1: x₂ = 3 - 1·(3-2,9)/(1-(-0,711)) = 3 - 0,1/1,711 = 3-0,0584 = 2,9416.\nf(2,9416) = -0,0215.\n\nIterazione 2: x₃ = 2,9416 - (-0,0215)·(2,9416-3)/(-0,0215-1) = 2,9416 - (-0,0215)·(-0,0584)/(-1,0215) = 2,9416+0,00123 = 2,9428.\n\nDopo due iterazioni: x ≈ 2,943.",no_ans:false},
{l:3,n:18,t:"Data la seguente equazione non lineare f=[ 1, 0, -9, 1] Eseguire due iterazioni con il metodo della Secante utilizzando come valori di partenza x0=2 e x1=3.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x³-9x+1. f(2) = -9, f(3) = 1.\n\nIterazione 1: x₂ = 3 - 1·(3-2)/(1-(-9)) = 3 - 1/10 = 2,9.\nf(2,9) = -0,711.\n\nIterazione 2: x₃ = 2,9 - (-0,711)·(2,9-3)/(-0,711-1) = 2,9 - (-0,711)·(-0,1)/(-1,711) = 2,9+0,0416 = 2,9416.\n\nDopo due iterazioni: x ≈ 2,942.",no_ans:false},
{l:3,n:19,t:"Determinare la radice positiva della seguente funzione f=[ 1, -1, -2] con il metodo di Newton utilizzando come valore iniziale x0=2 e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"P(x) = x²-x-2 = (x-2)(x+1), P'(x) = 2x-1.\n\nx₀ = 2: P(2) = 4-2-2 = 0.\n\nSiccome x₀=2 è già esattamente la radice positiva della funzione, il metodo di Newton converge immediatamente: x₁ = 2 - 0/3 = 2,0000, e tutte le iterazioni successive restano invariate a 2,0000.",no_ans:false},
// === L004 Iterazioni di punto fisso ===
{l:4,n:1,t:"La formula iterativa per approssimare il punto fisso è:",o:["x_{n+1}=g(x_{n})","x_{n}=x_{n-1}-g(x_{n-1})","x_{n+1}=x_{n}+g(x_{n})","x_{n}=x_{n-1}-g(x_{n})"],is_open:false,ans_idx:0,no_ans:false},
{l:4,n:2,t:"Qual è lo scopo del metodo di iterazione di punto fisso?",o:["Approssimare la soluzione dell'equazione x=g(x)","Calcolare i massimi e minimi di g(x)","Calcolare gli zeri di g(x)","Approssimare la soluzione dell'equazione g(x)+x=0"],is_open:false,ans_idx:0,no_ans:false},
{l:4,n:3,t:"Cos'è un punto fisso di una funzione g(x)?",o:["Un valore x per cui g(x)=0","Un valore x per cui g'(x)=x","Un valore x per cui g(x)=x","Un valore x per cui g(x)+x=0"],is_open:false,ans_idx:2,no_ans:false},
{l:4,n:4,t:"Trovare i punti fissi di una funzione g(x) equivale a calcolare:",o:["Le ascisse dei punti in cui il grafico di g interseca la bisettrice del secondo e quarto quadrante","Le ordinate dei punti in cui il grafico di g interseca l'asse y","Le ordinate dei punti in cui il grafico di g interseca l'asse x","Le ascisse dei punti in cui il grafico di g interseca la bisettrice del primo e terzo quadrante"],is_open:false,ans_idx:3,no_ans:false},
// === L005 Punto fisso e sistemi non lineari ===
{l:5,n:1,t:"Nel metodo di Newton per sistemi, ad ogni iterazione si deve risolvere:",o:["Un equazione di punto fisso","Un sistema lineare con matrice Jacobiana","Un sistema quadratico","Un'equazione non lineare"],is_open:false,ans_idx:1,no_ans:false},
{l:5,n:2,t:"Data la relazione f(x)=x−g(x), i punti fissi di g(x) corrispondono all'equazione:",o:["f(x)=0","f(x)=x","g(x)=0","x=0"],is_open:false,ans_idx:0,no_ans:false},
{l:5,n:3,t:"Quale metodo tra i seguenti non può essere espresso come iterazione del punto fisso?",o:["Metodo di Newton","Metodo di bisezione","Metodo delle secanti","Metodo delle corde"],is_open:false,ans_idx:1,no_ans:false},
{l:5,n:4,t:"In generale, la convergenza del metodo di Newton è:",o:["Nessuna delle precedenti","Lineare","Quadratica","Semi-lineare"],is_open:false,ans_idx:2,no_ans:false},
{l:5,n:5,t:"In generale, le iterazioni di punto fisso hanno convergenza:",o:["Lineare","Quadratica","Esponenziale","Cubica"],is_open:false,ans_idx:0,no_ans:false},
{l:5,n:6,t:"Quando la derivata della funzione di iterazione g′(α)=0, la convergenza delle iterazioni di punto fisso è:",o:["Quadratica","Non convergente","Lineare","Quasi-lineare"],is_open:false,ans_idx:0,no_ans:false},
{l:5,n:7,t:"Per risolvere sistemi di equazioni non lineari, il metodo di Newton richiede la matrice:",o:["Dei termini noti","Dei coefficienti","Identità","Jacobiana"],is_open:false,ans_idx:3,no_ans:false},
{l:5,n:8,t:"Geometricamente, la soluzione di un sistema di due equazioni non lineari in due variabili corrisponde:",o:["Agli zeri di f1+f2=0","Ai punti fissi di f1 ed f2","Al punto di minimo di f1=0 ed f2=0","All'intersezione delle curve definite da f1(x1,x2)=0 e f2(x1,x2)=0"],is_open:false,ans_idx:3,no_ans:false},
// === L006 Convergenza metodo di Newton ===
{l:6,n:1,t:"In quali casi il metodo di Newton converge?",o:["Il metodo di Newton converge sempre","Quando la funzione è decrescente","Quando la funzione è continua e derivabile, e la derivata prima non si annulla vicino alla radice","Quando ci sia un flesso della funzione oppure una radice multipla"],is_open:false,ans_idx:2,no_ans:false},
{l:6,n:2,t:"Quando il metodo di Newton ha problemi di convergenza?",o:["Quando la derivata prima è nulla o si annulla vicino alla radice","Quando un punto di flesso si trova lontano della radice","Quando la funzione è crescente","Il metodo di Newton Raphson converge sempre"],is_open:false,ans_idx:0,no_ans:false},
{l:6,n:3,t:"Il metodo di Newton può incontrare problemi di convergenza quando la funzione di partenza presenta una zona con pendenza molto ridotta?",o:["No, il metodo di Newton-Raphson è sempre stabile","No, il metodo di Newton-Raphson converge sempre, indipendentemente dalla pendenza","Sì, il metodo di Newton può avere problemi di convergenza in presenza di una pendenza molto ridotta","Sì, ma solo se la funzione è crescente"],is_open:false,ans_idx:2,no_ans:false},
// === L007 Criteri di arresto ===
{l:7,n:1,t:"Calcolare l'errore relativo del metodo di Newton tra la prima iterazione x1= 3,0375, e la seconda iterazione x2= 3,0007.",o:["circa 1,23%","circa 3,14%","circa 5,45%","circa 2,00%"],is_open:false,ans_idx:0,no_ans:false},
{l:7,n:2,t:"Calcolare l'errore assoluto del metodo di Newton tra la prima iterazione x1= 5,25, e la seconda iterazione x2= 4,95.",o:["0.3","circa 3%","-0.3","1%"],is_open:false,ans_idx:0,no_ans:false},
{l:7,n:3,t:"Calcolare l'errore relativo del metodo di Newton tra la prima iterazione x1= -8,0725, e la seconda iterazione x2= -8,0005.",o:["circa 0,9%","circa -0,9%","0.072","-0.072"],is_open:false,ans_idx:0,no_ans:false},
{l:7,n:4,t:"Nel metodo della Secante, quando ed in che modo si decide di interrompere le iterazioni?",o:["Le iterazioni si interrompono quando l'errore relativo tra due iterazioni successive è inferiore ad una tolleranza predefinita","Le iterazioni si interrompono dopo un numero predefinito di iterazioni","Le iterazioni si interrompono quando il valore della funzione diventa negativo","Le iterazioni si interrompono quando la funzione raggiunge il valore zero"],is_open:false,ans_idx:0,no_ans:false},
{l:7,n:5,t:"Nel metodo delle corde, quando ed in che modo si decide di interrompere le iterazioni?",o:[],is_open:true,ans_idx:null,ans_text:"Nel metodo delle corde le iterazioni si fermano quando è soddisfatto un criterio di arresto, tipicamente basato sul residuo o sull'incremento.\n\nCon il controllo del residuo, ci si ferma quando |f(xₙ)| < ε, dove ε è una tolleranza fissata a priori (es. 10⁻⁴, 10⁻⁶).\n\nCon il controllo dell'incremento, ci si ferma quando |xₙ₊₁-xₙ| < ε.\n\nA differenza della bisezione, nel metodo delle corde non si può fissare a priori il numero di iterazioni necessarie, perché la velocità di convergenza dipende dalla funzione e dal punto iniziale scelto. Va però osservato che, essendo la pendenza q fissata una volta per tutte (calcolata sugli estremi iniziali dell'intervallo), se q è vicino a zero il test sul residuo può risultare poco affidabile, per le stesse ragioni viste in generale per i metodi basati sulla derivata: un residuo piccolo non garantisce sempre un errore piccolo.",no_ans:false},
{l:7,n:6,t:"Nel metodo di Newton, quando ed in che modo si decide di interrompere le iterazioni?",o:[],is_open:true,ans_idx:null,ans_text:"Anche per il metodo di Newton si utilizzano tipicamente due criteri di arresto: il controllo del residuo |f(xₙ)| < ε e il controllo dell'incremento |xₙ₊₁-xₙ| < ε, dove ε è una tolleranza scelta a priori.\n\nLa particolarità del metodo di Newton è che il test sull'incremento risulta sempre un buon test di arresto. Questo perché, vicino alla radice, l'incremento xₙ₊₁-xₙ è direttamente legato a f(xₙ)/f'(xₙ), e la relazione tra l'incremento e l'errore effettivo resta ben controllata grazie alla rapida convergenza (quadratica) del metodo.\n\nIn pratica, quindi, ci si ferma non appena la differenza tra due iterate successive risulta più piccola della tolleranza fissata, con la certezza che questo corrisponde anche a un errore contenuto rispetto alla soluzione esatta.",no_ans:false},
// === L009 Richiami su matrici e vettori ===
{l:9,n:1,t:"Che cosa rappresenta l'ordine di una matrice?",o:["Il numero di righe della matrice","Il numero di righe e colonne della matrice","Il numero totale di elementi nella matrice","Il numero di colonne della matrice"],is_open:false,ans_idx:1,no_ans:false},
{l:9,n:2,t:"Qual è il risultato della matrice A in cui tutti gli elementi sono elevati alla potenza zero?",o:["Una matrice che mantiene gli stessi valori originali di A","Una matrice di dimensioni identiche alla matrice originale, ma con tutti gli elementi uguali a 1","Una matrice con tutti gli elementi uguali a zero","Una matrice con tutti gli elementi uguali a uno, tranne la diagonale principale, che è uguale a due"],is_open:false,ans_idx:1,no_ans:false},
{l:9,n:3,t:"Come si calcola la matrice trasposta?",o:["La matrice trasposta di una matrice si ottiene scambiando le righe con le colonne","La matrice trasposta di una matrice si ottiene moltiplicando la matrice per se stessa","La matrice trasposta di una matrice si ottiene scambiando tra loro le righe","La matrice trasposta di una matrice si ottiene scambiando tra loro le colonne"],is_open:false,ans_idx:0,no_ans:false},
{l:9,n:4,t:"Data A=[3, 2, 8; 5, 1, 0; 0, 2, 9], calcolare la matrice trasposta.",o:["Non è possibile calcolare la trasposta di A","[3, 5, 0; 2, 2, 2; 8, 9, 0]","[3, 5, 0; 2, 1, 2; 8, 0, 9]","[3, 2, 8; 5, 1, 0; 0, 2, 9]"],is_open:false,ans_idx:2,no_ans:false},

{l:12,n:2,t:"Qual'è l'ultima operazione del metodo di eliminazione di Gauss?",o:["Ottenere la matrice in forma triangolare superiore e risolvere il sistema con sostituzione in avanti","Ottenere la matrice in forma triangolare inferiore e risolvere il sistema con sostituzione all'indietro","Ottenere la matrice in forma triangolare superiore e risolvere il sistema con sostituzione all'indietro","Ottenere la matrice in forma triangolare inferiore e risolvere il sistema con sostituzione in avanti"],is_open:false,ans_idx:2,no_ans:false},
{l:12,n:3,t:"Dato il sistema Ax=b dove A=[1 3 1; 3 -2 3; 2 -1 -3] e b=[3; -3; 2]. Risolverlo con il metodo di eliminazione di Gauss.",o:[],is_open:true,ans_idx:null,ans_text:"Applico il MEG in due passi.\n\nPasso 1 (elimino x₁ dalla riga 2 e 3): m₂₁=3/1=3, m₃₁=2/1=2.\nRiga2' = Riga2 - 3·Riga1 = [0,-11,0 | -12]\nRiga3' = Riga3 - 2·Riga1 = [0,-7,-5 | -4]\n\nPasso 2 (elimino x₂ dalla riga 3): m₃₂ = -7/-11 = 0,6364.\nRiga3'' = Riga3' - 0,6364·Riga2' = [0,0,-5 | 3,6364]\n\nSistema triangolare risultante:\nx₁+3x₂+x₃=3\n-11x₂=-12\n-5x₃=3,6364\n\nSostituzione all'indietro: x₃ = 3,6364/(-5) = -0,7273; x₂ = -12/-11 = 1,0909; x₁ = 3-3·1,0909-(-0,7273) = 3-3,2727+0,7273 = 0,4545.\n\nSoluzione: x ≈ [0,4545; 1,0909; -0,7273].",no_ans:false},
{l:12,n:4,t:"Dato il sistema Ax=b dove A=[-2 4 8; -4 1 -1; -6 2 -20] e b=[ 1; -2; 1] Risolverlo con il metodo di eliminazione di Gauss.",o:[],is_open:true,ans_idx:null,ans_text:"Passo 1: m₂₁=-4/-2=2, m₃₁=-6/-2=3.\nRiga2' = Riga2 - 2·Riga1 = [0,-7,-17 | -4]\nRiga3' = Riga3 - 3·Riga1 = [0,-10,-44 | -2]\n\nPasso 2: m₃₂ = -10/-7 = 1,4286.\nRiga3'' = Riga3' - 1,4286·Riga2' = [0,0,-19,7143 | 3,7143]\n\nSostituzione all'indietro: x₃ = 3,7143/(-19,7143) = -0,1884; x₂ = (-4-(-17)·(-0,1884))/(-7) = (-4-3,2028)/(-7) = 1,029; x₁ = (1-4·1,029-8·(-0,1884))/(-2) = (1-4,116+1,5072)/(-2) = -1,6088/-2=0,8043... calcolando con precisione: x₁≈0,8043.\n\nSoluzione: x ≈ [0,8043; 1,029; -0,1884].",no_ans:false},
{l:12,n:5,t:"Dato il sistema Ax=b dove A=[1 -1 3; -3 2 1; 3 1 0] e b=[ -1; 1; 1] Risolverlo con il metodo di eliminazione di Gauss.",o:[],is_open:true,ans_idx:null,ans_text:"Passo 1: m₂₁=-3/1=-3, m₃₁=3/1=3.\nRiga2' = Riga2-(-3)·Riga1 = [0,-1,10 | -2]\nRiga3' = Riga3-3·Riga1 = [0,4,-9 | 4]\n\nPasso 2: m₃₂ = 4/-1 = -4.\nRiga3'' = Riga3'-(-4)·Riga2' = [0,0,31 | -4]\n\nSostituzione all'indietro: x₃ = -4/31 = -0,129; x₂ = (-2-10·(-0,129))/(-1) = (-2+1,29)/(-1) = 0,7097; x₁ = (-1-(-1)·0,7097-3·(-0,129))/1 = -1+0,7097+0,3871 = 0,0968.\n\nSoluzione: x ≈ [0,0968; 0,7097; -0,129].",no_ans:false},
{l:12,n:6,t:"Dato il sistema Ax=b dove A=[0 2 3; 4 5 8; 7 8 1] e b=[1 5 4] Risolverlo con il metodo di eliminazione di Gauss.",o:[],is_open:true,ans_idx:null,ans_text:"Poiché l'elemento pivotale a₁₁=0, prima di procedere è necessario uno scambio di righe (pivotazione): scambio la riga 1 con la riga 2, ottenendo A'=[4,5,8; 0,2,3; 7,8,1], b'=[5;1;4].\n\nPasso 1: m₃₁=7/4=1,75. Riga3' = Riga3-1,75·Riga1 = [0,-0,75,-13 | -4,75]\n\nPasso 2: m₃₂ = -0,75/2 = -0,375. Riga3'' = Riga3'-(-0,375)·Riga2 = [0,0,-11,875 | -4,375]\n\nSostituzione all'indietro: x₃ = -4,375/-11,875 = 0,3684; x₂ = (1-3·0,3684)/2 = (1-1,1053)/2 = -0,0526; x₁ = (5-5·(-0,0526)-8·0,3684)/4 = (5+0,263-2,947)/4 = 0,5789.\n\nSoluzione: x ≈ [0,5789; -0,0526; 0,3684]. Nota: qui è stato indispensabile lo scambio di riga iniziale, altrimenti il MEG non sarebbe potuto partire (pivot nullo).",no_ans:false},
{l:12,n:7,t:"Dato il sistema Ax=b dove A=[2 -1 1 -2; 0 2 0 -1; 1 0 -2 1; 0 2 1 1] e b=[0 1 0 1] Eseguire il primo passo con il metodo di eliminazione di Gauss.",o:[],is_open:true,ans_idx:null,ans_text:"Il pivot del primo passo è a₁₁=2. Devo eliminare la prima incognita dalle righe 2, 3, 4.\n\nRiga2: il coefficiente è già 0, quindi m₂₁=0, nessuna modifica.\n\nRiga3: m₃₁ = 1/2 = 0,5. Riga3' = Riga3 - 0,5·Riga1 = [0, 0,5, -2,5 | 2].\n\nRiga4: il coefficiente è già 0, quindi m₄₁=0, nessuna modifica.\n\nDopo il primo passo la matrice diventa:\n[2, -1, 1, -2 | 0]\n[0, 2, 0, -1 | 1]\n[0, 0,5, -2,5, 2 | 0]\n[0, 2, 1, 1 | 1]\n\nSolo la terza riga è stata modificata, con moltiplicatore m₃₁=0,5.",no_ans:false},
// === L013 La Fattorizzazione LU ===
{l:13,n:1,t:"Quale metodo diretto per la risoluzione dei sistemi lineari permette di calcolare facilmente il determinante?",o:["Metodo di Jacobi","Metodo di Newton","Fattorizzazione LU","Metodo del gradiente"],is_open:false,ans_idx:2,no_ans:false},
{l:13,n:2,t:"Quale tra i seguenti metodi è adatto per risolvere più sistemi lineari con la stessa matrice dei coefficienti ma diversi vettori dei termini noti?",o:["Metodo di bisezione","Metodo di Jacobi","Metodo di Cholesky","Fattorizzazione LU"],is_open:false,ans_idx:3,no_ans:false},
{l:13,n:3,t:"Dato il sistema lineare Ax=b dove A=[1 -4 5; 8 5 -7; -5 2 5] e b=[1 1 1] Determinare le matrici L e U del metodo di Fattorizzazione LU.",o:[],is_open:true,ans_idx:null,ans_text:"Applico il MEG tenendo traccia dei moltiplicatori (che formano L).\n\nPasso 1: m₂₁=8/1=8, m₃₁=-5/1=-5.\nRiga2' = [0,37,-47]; Riga3' = [0,-18,30]\n\nPasso 2: m₃₂ = -18/37 = -0,4865.\nRiga3'' = [0,0,7,1351]\n\nQuindi:\nL = [1,0,0; 8,1,0; -5,-0,4865,1]\nU = [1,-4,5; 0,37,-47; 0,0,7,1351]\n\nSi verifica che A=LU, dove L raccoglie i moltiplicatori sotto la diagonale (con 1 sulla diagonale) e U è la matrice triangolare superiore finale del MEG.",no_ans:false},
{l:13,n:4,t:"Determinare i fattori triangolari L e U della seguente matrice dei coefficienti A=[7 1 9; 4 5 6; 0 2 3], tali che A=LU.",o:[],is_open:true,ans_idx:null,ans_text:"Passo 1: m₂₁=4/7=0,5714, m₃₁=0/7=0 (nessuna modifica in riga 3).\nRiga2' = Riga2-0,5714·Riga1 = [0, 4,4286, 0,8571]\n\nPasso 2: m₃₂ = 2/4,4286 = 0,4516.\nRiga3'' = Riga3-0,4516·Riga2' = [0,0,2,6129]\n\nQuindi:\nL = [1,0,0; 0,5714,1,0; 0,0,4516,1]\nU = [7,1,9; 0,4,4286,0,8571; 0,0,2,6129]",no_ans:false},
{l:13,n:5,t:"Dato il sistema lineare Ax=b dove A=[7 8 9; 4 5 6; 0 2 3] e b=[24 15 5], dopo aver determinato con il metodo di Fattorizzazione LU le seguenti matrici L=[1 0 0; 4/7 1 0; 0 14/3 1] e U=[7 8 9; 0 3/7 6/7; 0 0 -1], come si procede nella risoluzione del sistema lineare di partenza?",o:[],is_open:true,ans_idx:null,ans_text:"Una volta note L e U tali che A=LU, il sistema Ax=b diventa LUx=b. Ponendo y=Ux, si risolvono in sequenza due sistemi triangolari, entrambi economici (O(n²) operazioni):\n\n1) Ly=b (sistema triangolare inferiore), risolto per sostituzione in avanti: y₁=b₁/l₁₁, poi si ricavano y₂, y₃ scendendo riga per riga.\n\n2) Ux=y (sistema triangolare superiore), risolto per sostituzione all'indietro: si parte da x₃=y₃/u₃₃ e si risale fino a x₁.\n\nNel caso specifico: da Ly=[24;15;5] si ottiene y₁=24, poi 4/7·24+y₂=15 → y₂=15-13,714=1,286, poi 14/3·1,286+y₃=5 → y₃=5-6=−1.\nDa Ux=y: x₃ = -1/-1 = 1; 3/7 x₂+6/7·1=1,286 → x₂=(1,286-0,857)/(3/7)=1,0; 7x₁+8·1+9·1=24 → x₁=(24-17)/7=1.\n\nLa soluzione è x=[1;1;1].",no_ans:false},
{l:13,n:6,t:"Calcolare il determinante della matrice dei coefficienti A=[1 0 1; 1 0 2; 1 -3 -8] utilizzando il metodo di fattorizzazione LU.",o:[],is_open:true,ans_idx:null,ans_text:"Applico il MEG con pivot a₁₁=1: m₂₁=1, m₃₁=1.\nRiga2' = Riga2-Riga1 = [0,0,1]\nRiga3' = Riga3-Riga1 = [0,-3,-9]\n\nA questo punto il pivot naturale in posizione (2,2) è nullo (elemento 0), quindi è necessario uno scambio di righe tra Riga2' e Riga3' per proseguire il MEG. Questo scambio comporta un cambio di segno nel determinante finale.\n\nDopo lo scambio: Riga2''=[0,-3,-9], Riga3''=[0,0,1], che è già triangolare superiore:\nU = [1,0,1; 0,-3,-9; 0,0,1], con det(U) = 1·(-3)·1 = -3.\n\nPoiché è stato eseguito un solo scambio di righe, il determinante di A è l'opposto di det(U):\ndet(A) = -det(U) = -(-3) = 3.\n\n(Verifica diretta con la regola di Sarrus: det(A)=1·(0·(-8)-2·(-3))-0+1·(1·(-3)-0·1)=1·6+1·(-3)=6-3=3, confermando il risultato.)",no_ans:false},
{l:13,n:7,t:"Dato il sistema lineare Ax=b dove A=[6 -3 4; 12 5 -7; -5 2 6] e b=[1 1 1], dopo aver determinato, con il metodo di Fattorizzazione LU, la seguente matrice L=[1 0 0; 2 1 0; -0,830 -0,045 1], come si procede nella risoluzione del sistema lineare di partenza?",o:[],is_open:true,ans_idx:null,ans_text:"Nota la matrice L (e implicitamente U, ottenuta come ultima matrice del MEG), il sistema Ax=b si risolve in due passaggi triangolari, ponendo y=Ux:\n\n1) Si risolve Ly=b per sostituzione in avanti, usando i moltiplicatori di L per ricavare progressivamente y₁, y₂, y₃ (partendo dalla prima equazione, che nella prima riga è già immediata: y₁=b₁, poi si sostituisce nelle righe successive).\n\n2) Una volta noto y, si risolve Ux=y per sostituzione all'indietro, partendo dall'ultima componente x₃=y₃/u₃₃ e risalendo fino a x₁.\n\nQuesto procedimento evita di dover rifare l'intero MEG se in futuro cambia solo il termine noto b: la fattorizzazione L, U, calcolata una sola volta, può essere riutilizzata per risolvere rapidamente sistemi con la stessa matrice A ma termini noti diversi.",no_ans:false},
{l:13,n:8,t:"Determinare i fattori triangolari L e U della seguente matrice dei coefficienti A=[1 4 8; -4 15 16; -6 2 -20], tali che A=LU.",o:[],is_open:true,ans_idx:null,ans_text:"Passo 1: m₂₁=-4/1=-4, m₃₁=-6/1=-6.\nRiga2' = Riga2-(-4)·Riga1 = [0,31,48]\nRiga3' = Riga3-(-6)·Riga1 = [0,26,28]\n\nPasso 2: m₃₂ = 26/31 = 0,8387.\nRiga3'' = Riga3'-0,8387·Riga2' = [0,0,-12,2581]\n\nQuindi:\nL = [1,0,0; -4,1,0; -6,0,8387,1]\nU = [1,4,8; 0,31,48; 0,0,-12,2581]",no_ans:false},
{l:13,n:9,t:"Dato un sistema lineare Ax=b, dopo aver determinato le matrici L e U, con il metodo di Fattorizzazione LU, come si procede a calcolare il vettore delle incognite x del sistema lineare di partenza?",o:[],is_open:true,ans_idx:null,ans_text:"Poiché A=LU, il sistema Ax=b diventa LUx=b. Ponendo y=Ux come incognita ausiliaria, il problema si spezza in due sistemi triangolari:\n\nLy=b (sistema triangolare inferiore) → si risolve per sostituzione in avanti, ricavando prima y₁, poi y₂, e così via fino a yₙ.\n\nUx=y (sistema triangolare superiore) → si risolve per sostituzione all'indietro, ricavando prima xₙ, poi risalendo fino a x₁.\n\nEntrambi i passaggi richiedono solo O(n²) operazioni, molto più economico rispetto a rifare da capo l'eliminazione di Gauss (O(n³)). Questo è il vantaggio principale della fattorizzazione LU quando si devono risolvere più sistemi con la stessa matrice A ma termini noti diversi: la fattorizzazione si calcola una sola volta.",no_ans:false},
// === L014 Tecniche di Pivotazione ===
{l:14,n:1,t:"In cosa consiste la strategia di Pivoting totale nel metodo di eliminazione di Gauss?",o:["Consiste nel scegliere il massimo valore assoluto tra tutti gli elementi della matrice e scambiarlo con l'elemento del pivot, sia tra le righe che tra le colonne","Consiste nel scegliere il massimo valore assoluto solo tra le righe","Consiste nel scegliere il massimo valore assoluto solo tra le colonne","Consiste nel mantenere fisso il pivot e non eseguire alcun scambio di righe o colonne"],is_open:false,ans_idx:0,no_ans:false},
{l:14,n:2,t:"In cosa consiste la strategia di Pivoting parziale nel metodo di eliminazione di Gauss?",o:["Consiste nel scegliere il massimo valore assoluto tra gli elementi sotto il pivot e scambiarlo con la riga corrente","Consiste nel moltiplicare ogni riga per il valore del pivot","Consiste nel scambiare le righe solo quando il pivot è uguale a zero","Consiste nell'azzerare tutti gli elementi sopra il pivot"],is_open:false,ans_idx:0,no_ans:false},
{l:14,n:3,t:"Che succede nel metodo di eliminazione di Gauss se tutti i pivot sono non nulli?",o:["Il sistema ha una soluzione unica","Il sistema è incompatibile","Il determinante della matrice diventa zero","Il sistema ha infinite soluzioni"],is_open:false,ans_idx:0,no_ans:false},
{l:14,n:4,t:"Che succede nel metodo di eliminazione di Gauss se un pivot è nullo?",o:["Il determinante della matrice diventa infinito","Il sistema ha infinite soluzioni","Il sistema non può essere risolto senza modifiche al metodo di Gauss","Il sistema diventa immediatamente compatibile"],is_open:false,ans_idx:2,no_ans:false},
{l:14,n:5,t:"Come si calcola il minore di una matrice?",o:["Calcolando il determinante della sottomatrice ottenuta eliminando una riga e una colonna","Calcolando il determinante della matrice intera","Sommando tutti gli elementi della matrice","Moltiplicando la matrice per la sua trasposta"],is_open:false,ans_idx:0,no_ans:false},
// === L015 Fattorizzazioni di Cholesky e Thomas ===
{l:15,n:1,t:"Come si definisce una matrice tridiagonale?",o:["Una matrice in cui sono diversi da zero solo gli elementi della diagonale principale e delle due diagonali adiacenti","Una matrice in cui sono diversi da zero solo gli elementi della diagonale principale e della sotto-diagonale","Una matrice in cui sono diversi da zero solo gli elementi della diagonale principale e della sopra-diagonale","Una matrice in cui sono diversi da zero solo gli elementi della diagonale principale"],is_open:false,ans_idx:0,no_ans:false},
{l:15,n:2,t:"Che cos'è una matrice tridiagonale?",o:["Una matrice quadrata che ha gli elementi diagonali non nulli","Una matrice tre per tre che ha solo tre gruppi di elementi non nulli: la diagonale, la sotto-diagonale e la sopra-diagonale","Una matrice che ha solo tre gruppi di elementi nulli: la diagonale, la sotto-diagonale e la sopra-diagonale","Una matrice quadrata che ha solo tre gruppi di elementi non nulli: la diagonale, la sotto-diagonale e la sopra-diagonale"],is_open:false,ans_idx:3,no_ans:false},
{l:15,n:3,t:"Cos'è una matrice simmetrica?",o:["Una matrice che è uguale alla sua inversa","Una matrice che ha solo valori zero","Una matrice che è uguale alla sua trasposta","Una matrice che ha solo valori positivi sulla diagonale principale"],is_open:false,ans_idx:2,no_ans:false},
{l:15,n:4,t:"Tra tutti i metodi numerici diretti per la risoluzione di un sistema lineare presentati nel corso, qual'è quello che richiede meno operazioni?",o:["Il metodo di Gauss","Il metodo di Cholesky","Il metodo di Newton","Fattorizzazione LU"],is_open:false,ans_idx:1,no_ans:false},
{l:15,n:5,t:"Qual'è la condizione sulla matrice di partenza per poter applicare il metodo di Cholesky?",o:["La matrice deve essere tridiagonale","La matrice deve essere simmetrica e definita positiva","La matrice deve avere determinante non nullo","La matrice deve essere triangolare inferiore"],is_open:false,ans_idx:1,no_ans:false},
{l:15,n:6,t:"Metodo di Cholesky: dato un sistema lineare Ax=b, dopo aver trovato la matrice L di Cholesky, come si procede a calcolare il vettore delle incognite x del sistema lineare di partenza?",o:[],is_open:true,ans_idx:null,ans_text:"Con la fattorizzazione di Cholesky si ha A=LLᵀ, dove L è triangolare inferiore. Il sistema Ax=b diventa LLᵀx=b. Ponendo y=Lᵀx, si risolvono in sequenza due sistemi triangolari:\n\n1) Ly=b (triangolare inferiore) → sostituzione in avanti, ricavando y₁, y₂, ..., yₙ.\n\n2) Lᵀx=y (triangolare superiore, essendo Lᵀ la trasposta di L) → sostituzione all'indietro, ricavando xₙ, xₙ₋₁, ..., x₁.\n\nRispetto alla fattorizzazione LU generica, Cholesky sfrutta la simmetria di A: basta calcolare una sola matrice L (anziché L e U separatamente), dimezzando il numero di operazioni necessarie.",no_ans:false},
{l:15,n:7,t:"Dato il sistema lineare Ax=b dove A=[3 1 -1; 1 1 -1; -1 -1 2] e b=[2 0 0], verificare che il metodo di Cholesky sia applicabile.",o:[],is_open:true,ans_idx:null,ans_text:"Il metodo di Cholesky è applicabile se A è simmetrica e definita positiva.\n\nSimmetria: A è simmetrica, perché a₁₂=a₂₁=1, a₁₃=a₃₁=-1, a₂₃=a₃₂=-1. ✓\n\nDefinita positiva: verifico che tutti i minori principali abbiano determinante positivo.\nd₁ = det[3] = 3 > 0.\nd₂ = det[3,1;1,1] = 3-1 = 2 > 0.\nd₃ = det(A) = 3(1·2-(-1)(-1)) -1(1·2-(-1)(-1)) + (-1)(1·(-1)-1·(-1)) = 3(2-1)-1(2-1)+(-1)(-1+1) = 3-1+0 = 2 > 0.\n\nTutti i minori principali sono positivi, quindi A è simmetrica e definita positiva: il metodo di Cholesky è applicabile.",no_ans:false},
{l:15,n:8,t:"Dato il sistema lineare Ax=b dove A=[ 8 4 2; 4, 6, 0; 2, 0, 3] e b=[ 1 1 1] Determinare la matrice L di Cholesky.",o:[],is_open:true,ans_idx:null,ans_text:"Le formule di Cholesky sono: ℓₚₚ = √(aₚₚ - Σₖ ℓₚₖ²) e ℓᵢₚ = (aᵢₚ - Σₖ ℓᵢₖℓₚₖ)/ℓₚₚ.\n\nℓ₁₁ = √8 = 2,83.\nℓ₂₁ = a₂₁/ℓ₁₁ = 4/2,83 = 1,41.\nℓ₃₁ = a₃₁/ℓ₁₁ = 2/2,83 = 0,71.\n\nℓ₂₂ = √(6-ℓ₂₁²) = √(6-1,9881) = √4,0119 = 2,00.\nℓ₃₂ = (a₃₂-ℓ₃₁ℓ₂₁)/ℓ₂₂ = (0-0,71·1,41)/2,00 = -1,0011/2 = -0,50.\n\nℓ₃₃ = √(3-ℓ₃₁²-ℓ₃₂²) = √(3-0,5041-0,25) = √2,2459 = 1,50.\n\nLa matrice L di Cholesky risulta:\nL = [2,83, 0, 0; 1,41, 2, 0; 0,71, -0,50, 1,50]\n\n(verifica: L·Lᵀ restituisce esattamente A a meno di piccoli errori di arrotondamento).",no_ans:false},
// === L017 Matrici SDP e raggio spettrale ===
{l:17,n:1,t:"Qual è la definizione di matrice definita positiva?",o:["Una matrice che è uguale alla sua trasposta","Una matrice simmetrica con autovalori maggiori uguali a zero","Una matrice che è uguale alla sua trasposta e che soddisfa (x^T)Ax>0 per ogni vettore non nullo x","Una matrice con solo numeri positivi sopra la diagonale"],is_open:false,ans_idx:2,no_ans:false},
{l:17,n:2,t:"Dato il sistema lineare Ax=b dove A=[ 8 4 2; 4, 6, 0; 2, 0, 3] e b=[ 1 1 1], dopo aver determinato con il metodo di Cholesky la seguente matrice L=[ 2,83 0 0; 1,41 2 0; 0,71 -0,50 1,50], come si procede nella risoluzione del sistema lineare di partenza?",o:[],is_open:true,ans_idx:null,ans_text:"Nota L, con A=LLᵀ, il sistema Ax=b diventa LLᵀx=b. Pongo y=Lᵀx e risolvo prima Ly=b (sostituzione in avanti), poi Lᵀx=y (sostituzione all'indietro).\n\nDa Ly=b: y₁=1/2,83=0,3536; 1,41·0,3536+2y₂=1 → y₂=(1-0,4986)/2=0,2507≈0,25; 0,71·0,3536-0,50·0,25+1,50y₃=1 → y₃=(1-0,2511+0,125)/1,50=0,5826≈0,583.\n\nDa Lᵀx=y (con Lᵀ=[2,83,1,41,0,71; 0,2,-0,50; 0,0,1,50]): x₃=0,583/1,50=0,389; 2x₂-0,50·0,389=0,25 → x₂=(0,25+0,1944)/2=0,222; 2,83x₁+1,41·0,222+0,71·0,389=0,3536 → x₁=(0,3536-0,3132-0,2763)/2,83=-0,0833.\n\nSoluzione: x ≈ [-0,083; 0,222; 0,389].",no_ans:false},
// === L018 Il numero di condizionamento ===
{l:18,n:1,t:"Cosa rappresenta il numero di condizionamento di una matrice A?",o:["Il raggio spettrale di A","La divisione tra la norma di A e la norma della sua inversa","Il prodotto tra la norma di A e la norma della sua inversa","Il determinante di A"],is_open:false,ans_idx:2,no_ans:false},
{l:18,n:2,t:"Quale delle seguenti affermazioni descrive correttamente la sensibilità di un sistema lineare?",o:["È la misura della dimensione del determinante della matrice","È la misura di quanto i dati cambiano","È la misura di quanto la soluzione cambia in risposta a piccole variazioni nei dati","È la capacità della matrice di generare soluzioni uniche"],is_open:false,ans_idx:2,no_ans:false},
{l:18,n:3,t:"Se il numero di condizionamento di A è circa uguale a 1, allora la matrice A è:",o:["Ben condizionata","Triangolare","Tridiagonale","Mal condizionata"],is_open:false,ans_idx:0,no_ans:false},
{l:18,n:4,t:"Quale delle seguenti affermazioni è falsa?",o:["Un sistema mal condizionato è molto sensibile agli errori nei dati","Il numero di condizionamento dipende dalla norma scelta","Un alto valore di det(A) implica sempre buon condizionamento","Il numero di condizionamento è sempre maggiore uguale a 1"],is_open:false,ans_idx:2,no_ans:false},
{l:18,n:5,t:"Cosa rappresenta δx nella risoluzione del sistema perturbato?",o:["L'errore o perturbazione sulla soluzione","Il termine noto","Il determinante della soluzione","La perturbazione sui dati"],is_open:false,ans_idx:0,no_ans:false},
{l:18,n:6,t:"Quale proprietà è vera riguardo il numero di condizionamento?",o:["È sempre positivo","È sempre maggiore o uguale a uno","È sempre uguale a 1","Coincide con il determinante della matrice"],is_open:false,ans_idx:1,no_ans:false},
{l:18,n:7,t:"Qual è il valore minimo possibile del numero di condizionamento?",o:["Uno","Dipende dalla norma","Zero","Dipende dal termine noto"],is_open:false,ans_idx:0,no_ans:false},
// === L019 Residuo, errore e metodi iterativi ===
{l:19,n:1,t:"Per un sistema lineare Ax=b, il residuo può essere anche scritto come:",o:["La differenza tra la soluzione esatta e quella approssimata","Il termine noto meno la soluzione approssimata","La matrice A moltiplicata per l'errore","La differenza tra la soluzioni approssimate a due iterate successive"],is_open:false,ans_idx:1,no_ans:false},
{l:19,n:2,t:"Se il numero di condizionamento della matrice A è grande, allora la matrice A è:",o:["Invertibile","Mal condizionata","Ben condizionata","Singolare"],is_open:false,ans_idx:1,no_ans:false},
{l:19,n:3,t:"Qual è l'obiettivo pratico dei metodi iterativi?",o:["Fermarsi quando l'errore è sotto una soglia prefissata","Minimizzare la norma di A","Calcolare il numero di condizionamento","Calcolare il raggio spettrale di A"],is_open:false,ans_idx:0,no_ans:false},
{l:19,n:4,t:"Qual è la strategia base nella costruzione di un metodo iterativo per risolvere il sistema Ax=b?",o:["Calcolare l'inversa di A direttamente","Scrivere A come somma di due matrici","Scrivere A come differenza P - N","Trovare il determinante della matrice di iterazione"],is_open:false,ans_idx:2,no_ans:false},
{l:19,n:5,t:"Quale condizione assicura la convergenza del metodo iterativo per la risoluzione di sistemi lineari?",o:["Il raggio spettrale della matrice di iterazione deve essere maggiore di 1","Il precondizionatore deve essere singolare","Il raggio spettrale della matrice di iterazione deve essere minore di 1","La norma del termine noto deve essere minore di 1"],is_open:false,ans_idx:2,no_ans:false},
{l:19,n:6,t:"Se la soluzione approssimata coincide con quella esatta, il residuo è:",o:["Uguale al termine noto b","Nullo","Uguale al numero di condizionamento","Massimo"],is_open:false,ans_idx:1,no_ans:false},
{l:19,n:7,t:"Quando il residuo r*=Ax*-b risulta nullo?",o:["Quando il termine noto è nullo","Quando x* coincide con la soluzione esatta","Quando Ax*=0","Quando A è singolare"],is_open:false,ans_idx:1,no_ans:false},
{l:19,n:8,t:"Che cosa rappresenta il residuo di una soluzione approssimata di un sistema lineare Ax = b?",o:["La differenza tra la soluzione esatta e quella approssimata","La differenza tra la soluzioni approssimate a due iterate successive","Il vettore differenza tra b e A moltiplicato per la soluzione approssimata","Il prodotto tra A e la soluzione approssimata"],is_open:false,ans_idx:2,no_ans:false},
// === L020 Metodi di Jacobi e Gauss-Seidel ===
{l:20,n:1,t:"Quale tra i seguenti metodi è un metodo numerico iterativo per risolvere sistemi lineari?",o:["Metodo di Gauss Seidel","Metodo di Cramer","Metodo di Cholesky","Metodo di eliminazione di Gauss"],is_open:false,ans_idx:0,no_ans:false},
{l:20,n:2,t:"Dato il sistema lineare Ax=C dove A=[ -4, -1, 0, 1; 0, -2, 1, 0; 0, 1, 3, 1; 0, 0, 1, -2] e C=[1; 0; 1; 2] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0,17; -0,25; 0,25; -0,20] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Gauss-Seidel: xᵢ^(k+1) = (bᵢ - Σⱼ<ᵢ aᵢⱼxⱼ^(k+1) - Σⱼ>ᵢ aᵢⱼxⱼ^(k))/aᵢᵢ, applicata riga per riga aggiornando subito ogni componente.\n\nIterazione 1 (da x(0)=[0,17; -0,25; 0,25; -0,20]):\nx₁ = (1-(-1)(-0,25)-0·0,25-1·(-0,20))/(-4) = (1-0,25+0,20)/(-4) = 0,95/-4 = -0,24\nx₂ = (0-1·0,25-0·(-0,20))/(-2) = -0,25/-2 = 0,12\nx₃ = (1-1·0,12-1·(-0,20))/3 = (1-0,12+0,20)/3 = 1,08/3 = 0,36\nx₄ = (2-1·0,36)/(-2) = 1,64/-2 = -0,82\n\nIterazione 2 (da x(1)=[-0,24; 0,12; 0,36; -0,82]):\nx₁ = (1-(-1)(0,12)-1·(-0,82))/(-4) = (1+0,12+0,82)/(-4) = 1,94/-4 = -0,48\nx₂ = (0-1·0,36)/(-2) = 0,18\nx₃ = (1-1·0,18-1·(-0,82))/3 = (1-0,18+0,82)/3 = 1,64/3 = 0,55\nx₄ = (2-0,55)/(-2) = -0,73\n\nDopo due iterazioni: x ≈ [-0,48; 0,18; 0,55; -0,73], avvicinandosi alla soluzione esatta [-0,50; 0,25; 0,50; -0,75].",no_ans:false},
{l:20,n:3,t:"Dato il sistema lineare Ax=C dove A=[ -4, -1, 0, 1; 0, -2, 1, 0; 0, 1, 3, 1; 0, 0, 1, -2] e C=[1; 0; 1; 2] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ -0,250; 0,500; -0,170; -0,085] e tre cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Applico la formula di Gauss-Seidel componente per componente, con aggiornamento immediato.\n\nIterazione 1 (da x(0)=[-0,250; 0,500; -0,170; -0,085]):\nx₁ = (1-(-1)(0,500)-1·(-0,085))/(-4) = (1+0,500+0,085)/(-4) = 1,585/-4 = -0,396\nx₂ = (0-1·(-0,170))/(-2) = 0,170/-2 = -0,085\nx₃ = (1-1·(-0,085)-1·(-0,085))/3 = (1+0,085+0,085)/3 = 1,170/3 = 0,390\nx₄ = (2-1·0,390)/(-2) = 1,610/-2 = -0,805\n\nIterazione 2 (da x(1)=[-0,396; -0,085; 0,390; -0,805]):\nx₁ = (1-(-1)(-0,085)-1·(-0,805))/(-4) = (1-0,085+0,805)/(-4) = 1,720/-4 = -0,430\nx₂ = (0-1·0,390)/(-2) = 0,195\nx₃ = (1-1·0,195-1·(-0,805))/3 = (1-0,195+0,805)/3 = 1,610/3 = 0,537\nx₄ = (2-0,537)/(-2) = -0,732\n\nDopo due iterazioni: x ≈ [-0,430; 0,195; 0,537; -0,732].",no_ans:false},
{l:20,n:4,t:"Dato il sistema lineare Ax=C dove A=[ -4, -1, 0, 1; 0, -2, 1, 0; 0, 1, 3, 1; 0, 0, 1, -2] e C=[1; 0; 1; 2] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ -0,400; -0,085; 0,390; -0,800] e tre cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[-0,400; -0,085; 0,390; -0,800]):\nx₁ = (1-(-1)(-0,085)-1·(-0,800))/(-4) = (1-0,085+0,800)/(-4) = 1,715/-4 = -0,429\nx₂ = (0-1·0,390)/(-2) = 0,195\nx₃ = (1-0,195-(-0,800))/3 = (1-0,195+0,800)/3 = 1,605/3 = 0,535\nx₄ = (2-0,535)/(-2) = -0,732\n\nIterazione 2 (da x(1)=[-0,429; 0,195; 0,535; -0,732]):\nx₁ = (1-(-1)(0,195)-1·(-0,732))/(-4) = (1+0,195+0,732)/(-4) = 1,927/-4 = -0,482\nx₂ = (0-1·0,535)/(-2) = 0,268\nx₃ = (1-0,268-(-0,732))/3 = (1-0,268+0,732)/3 = 1,464/3 = 0,488\nx₄ = (2-0,488)/(-2) = -0,756\n\nDopo due iterazioni: x ≈ [-0,482; 0,268; 0,488; -0,756].",no_ans:false},
{l:20,n:5,t:"Dato il sistema lineare Ax=C dove A=[ -4, -1, 0, 1; 0, -2, 1, 0; 0, 1, 3, 1; 0, 0, 1, -2] e C=[1; 0; 1; 2] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0; 0; 0; 0] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0;0;0;0]):\nx₁ = (1-0-0)/(-4) = -0,25\nx₂ = (0-0)/(-2) = 0,00\nx₃ = (1-0-0)/3 = 0,33\nx₄ = (2-0,33)/(-2) = -0,83\n\nIterazione 2 (da x(1)=[-0,25; 0; 0,33; -0,83]):\nx₁ = (1-(-1)(0)-1·(-0,83))/(-4) = (1+0,83)/(-4) = 1,83/-4 = -0,46\nx₂ = (0-1·0,33)/(-2) = 0,16\nx₃ = (1-0,16-(-0,83))/3 = (1-0,16+0,83)/3 = 1,67/3 = 0,56\nx₄ = (2-0,56)/(-2) = -0,72\n\nDopo due iterazioni: x ≈ [-0,46; 0,16; 0,56; -0,72].",no_ans:false},
{l:20,n:6,t:"Dato il sistema lineare Ax=C dove A=[ 4, -1, 0, 0; -1, 4, -1, 0; 0, -1, 4, -1; -1, 0, -1, 4] e C=[-1; 2; 4; 10] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0,25; 0,44; 1,11; 2,72] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0,25; 0,44; 1,11; 2,72]):\nx₁ = (-1+1·0,44)/4 = -0,56/4 = -0,14\nx₂ = (2+1·(-0,14)+1·1,11)/4 = 2,97/4 = 0,74\nx₃ = (4+1·0,74+1·2,72)/4 = 7,46/4 = 1,87\nx₄ = (10+1·(-0,14)+1·1,87)/4 = 11,73/4 = 2,93\n\nIterazione 2 (da x(1)=[-0,14; 0,74; 1,87; 2,93]):\nx₁ = (-1+0,74)/4 = -0,065 ≈ -0,06\nx₂ = (2-0,06+1,87)/4 = 3,81/4 = 0,95\nx₃ = (4+0,95+2,93)/4 = 7,88/4 = 1,97\nx₄ = (10-0,06+1,97)/4 = 11,91/4 = 2,98\n\nDopo due iterazioni: x ≈ [-0,06; 0,95; 1,97; 2,98], molto vicina alla soluzione esatta [0;1;2;3].",no_ans:false},
{l:20,n:7,t:"Dato il sistema lineare Ax=C dove A=[4, 1, 0, 0; 1, 5, 1, 0; 0, 1, 6, 1; 1, 0, 1, 4] e C=[1; 7; 16; 14] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0; 0; 0; 0] e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0;0;0;0]):\nx₁ = (1-0)/4 = 0,2500\nx₂ = (7-1·0,25-0)/5 = 6,75/5 = 1,3500\nx₃ = (16-1,35-0)/6 = 14,65/6 = 2,4417\nx₄ = (14-0,25-2,4417)/4 = 11,3083/4 = 2,8271\n\nIterazione 2 (da x(1)=[0,25;1,35;2,4417;2,8271]):\nx₁ = (1-1,35)/4 = -0,0875\nx₂ = (7-(-0,0875)-2,4417)/5 = 4,6458/5 = 0,9292\nx₃ = (16-0,9292-2,8271)/6 = 12,2437/6 = 2,0406\nx₄ = (14-(-0,0875)-2,0406)/4 = 12,0469/4 = 3,0117\n\nDopo due iterazioni: x ≈ [-0,0875; 0,9292; 2,0406; 3,0117].",no_ans:false},
{l:20,n:8,t:"Dato il sistema lineare Ax=C dove A=[ 4, -1, 0, 0; -1, 4, -1, 0; 0, -1, 4, -1; -1, 0, -1, 4] e C=[-1; 2; 4; 10] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0; 0; 0; 0] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0;0;0;0]):\nx₁ = -1/4 = -0,25\nx₂ = (2+(-0,25))/4 = 1,75/4 = 0,44\nx₃ = (4+0,44)/4 = 4,44/4 = 1,11\nx₄ = (10+(-0,25)+1,11)/4 = 10,86/4 = 2,71\n\nIterazione 2 (da x(1)=[-0,25; 0,44; 1,11; 2,71]):\nx₁ = (-1+0,44)/4 = -0,14\nx₂ = (2-0,14+1,11)/4 = 2,97/4 = 0,74\nx₃ = (4+0,74+2,71)/4 = 7,45/4 = 1,86\nx₄ = (10-0,14+1,86)/4 = 11,72/4 = 2,93\n\nDopo due iterazioni: x ≈ [-0,14; 0,74; 1,86; 2,93].",no_ans:false},
{l:20,n:9,t:"Dato il sistema lineare Ax=C dove A=[ 4, -1, 0, 0; -1, 4, -1, 0; 0, -1, 4, -1; -1, 0, -1, 4] e C=[-1; 2; 4; 10] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ -0,25; 0,44; 1,11; 2,72] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[-0,25; 0,44; 1,11; 2,72]):\nx₁ = (-1+0,44)/4 = -0,14\nx₂ = (2-0,14+1,11)/4 = 2,97/4 = 0,74\nx₃ = (4+0,74+2,72)/4 = 7,46/4 = 1,87\nx₄ = (10-0,14+1,87)/4 = 11,73/4 = 2,93\n\nIterazione 2 (da x(1)=[-0,14; 0,74; 1,87; 2,93]):\nx₁ = (-1+0,74)/4 = -0,06\nx₂ = (2-0,06+1,87)/4 = 3,81/4 = 0,95\nx₃ = (4+0,95+2,93)/4 = 7,88/4 = 1,97\nx₄ = (10-0,06+1,97)/4 = 11,91/4 = 2,98\n\nDopo due iterazioni: x ≈ [-0,06; 0,95; 1,97; 2,98].",no_ans:false},
{l:20,n:10,t:"Dato il sistema lineare Ax=C dove A=[3, -2, 0; -2, 4, 2; 0, 2, 2] e C=[1; 4; 4] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0; 0; 0] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0;0;0]):\nx₁ = (1+0)/3 = 0,33\nx₂ = (4+2·0,33-0)/4 = 4,67/4 = 1,17\nx₃ = (4-2·1,17)/2 = 1,67/2 = 0,83\n\nIterazione 2 (da x(1)=[0,33; 1,17; 0,83]):\nx₁ = (1+2·1,17)/3 = 3,33/3 = 1,11\nx₂ = (4+2·1,11-2·0,83)/4 = (4+2,22-1,67)/4 = 4,56/4 = 1,14\nx₃ = (4-2·1,14)/2 = 1,72/2 = 0,86\n\nDopo due iterazioni: x ≈ [1,11; 1,14; 0,86], avvicinandosi alla soluzione esatta [1;1;1].",no_ans:false},
{l:20,n:11,t:"Dato il sistema lineare Ax=C dove A=[4, -1, 0, 0; -1, 4, -1, 0; 0, -1, 4, -1; -1, 0, -1, 4] e C=[-1; 2; 4; 10] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 0; 0; 0; 0] e due cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Il procedimento è identico a quello dell'esercizio con lo stesso sistema e stesso vettore iniziale nullo.\n\nIterazione 1: x₁=-0,25; x₂=(2-0,25)/4=0,44; x₃=(4+0,44)/4=1,11; x₄=(10-0,25+1,11)/4=2,71.\n\nIterazione 2: x₁=(-1+0,44)/4=-0,14; x₂=(2-0,14+1,11)/4=0,74; x₃=(4+0,74+2,71)/4=1,86; x₄=(10-0,14+1,86)/4=2,93.\n\nDopo due iterazioni: x ≈ [-0,14; 0,74; 1,86; 2,93].",no_ans:false},
{l:20,n:12,t:"Dato il sistema lineare Ax=C dove A=[ 4, 1, 0, 0; 1, 5, 1, 0; 0, 1, 6, 1; 1, 0, 1, 4] e C=[1; 7; 16; 14] Eseguire due iterazioni con il metodo di Jacobi, partendo da un vettore iniziale x(0)=[ 0,2500; 1,4000; 2,6667; 3,5000] e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Formula di Jacobi: xᵢ^(k+1) = (bᵢ - Σⱼ≠ᵢ aᵢⱼxⱼ^(k))/aᵢᵢ, dove a destra si usano SOLO i valori dell'iterazione precedente (mai quelli appena calcolati).\n\nIterazione 1 (da x(0)=[0,25;1,4;2,6667;3,5]):\nx₁ = (1-1·1,4)/4 = -0,4/4 = -0,1000\nx₂ = (7-1·0,25-1·2,6667)/5 = 4,0833/5 = 0,8167\nx₃ = (16-1·1,4-1·3,5)/6 = 11,1/6 = 1,8500\nx₄ = (14-1·0,25-1·2,6667)/4 = 11,0833/4 = 2,7708\n\nIterazione 2 (da x(1)=[-0,1;0,8167;1,85;2,7708]):\nx₁ = (1-0,8167)/4 = 0,1833/4 = 0,0458\nx₂ = (7-(-0,1)-1,85)/5 = 5,25/5 = 1,0500\nx₃ = (16-0,8167-2,7708)/6 = 12,4125/6 = 2,0688\nx₄ = (14-(-0,1)-1,85)/4 = 12,25/4 = 3,0625\n\nDopo due iterazioni: x ≈ [0,0458; 1,0500; 2,0688; 3,0625].",no_ans:false},
{l:20,n:13,t:"Dato il sistema lineare Ax=C dove A=[ 4, 1, 0, 0; 1, 5, 1, 0; 0, 1, 6, 1; 1, 0, 1, 4] e C=[ 1; 7; 16; 14] Eseguire due iterazioni con il metodo di Jacobi, partendo da un vettore iniziale x(0)=[ 0; 0; 0; 0] e quattro cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[0;0;0;0]):\nx₁ = 1/4 = 0,2500\nx₂ = 7/5 = 1,4000\nx₃ = 16/6 = 2,6667\nx₄ = 14/4 = 3,5000\n\nIterazione 2 (da x(1)=[0,25;1,4;2,6667;3,5]):\nx₁ = (1-1,4)/4 = -0,1000\nx₂ = (7-0,25-2,6667)/5 = 0,8167\nx₃ = (16-1,4-3,5)/6 = 1,8500\nx₄ = (14-0,25-2,6667)/4 = 2,7708\n\nDopo due iterazioni: x ≈ [-0,1000; 0,8167; 1,8500; 2,7708]. Si noti che, essendo il metodo di Jacobi, ogni componente della nuova iterata usa esclusivamente i valori della iterata precedente, mai quelli appena aggiornati (a differenza di Gauss-Seidel).",no_ans:false},
{l:20,n:14,t:"Dato il sistema lineare Ax=C dove A=[ -4, -1, 0, 1; 0, -2, 1, 0; 0, 1, 3, 1; 0, 0, 1, -2] e C=[1; 0; 1; 2] Eseguire due iterazioni con il metodo di Gauss Seidel, partendo da un vettore iniziale x(0)=[ 1; 1; 1; 1] e tre cifre decimali.",o:[],is_open:true,ans_idx:null,ans_text:"Iterazione 1 (da x(0)=[1;1;1;1]):\nx₁ = (1-(-1)(1)-1·1)/(-4) = (1+1-1)/(-4) = 1/-4 = -0,250\nx₂ = (0-1·1)/(-2) = 0,500\nx₃ = (1-1·0,5-1·1)/3 = -0,5/3 = -0,167\nx₄ = (2-1·(-0,167))/(-2) = 2,167/-2 = -1,083\n\nIterazione 2 (da x(1)=[-0,25;0,5;-0,167;-1,083]):\nx₁ = (1-(-1)(0,5)-1·(-1,083))/(-4) = (1+0,5+1,083)/(-4) = 2,583/-4 = -0,646\nx₂ = (0-1·(-0,167))/(-2) = 0,167/-2 = -0,084\nx₃ = (1-(-0,084)-(-1,083))/3 = (1+0,084+1,083)/3 = 2,167/3 = 0,722\nx₄ = (2-0,722)/(-2) = 1,278/-2 = -0,639\n\nDopo due iterazioni: x ≈ [-0,646; -0,084; 0,722; -0,639]. Partendo da un vettore iniziale più lontano dalla soluzione, la convergenza è più lenta ma il metodo si sta comunque avvicinando a [-0,5; 0,25; 0,5; -0,75].",no_ans:false},
// === L021 Il metodo di rilassamento SOR ===
{l:21,n:1,t:"Qual è la matrice di precondizionamento nel metodo di Jacobi?",o:["Una matrice tridiagonale","La matrice diagonale dei coefficienti","La matrice inversa di A","La matrice identità"],is_open:false,ans_idx:1,no_ans:false},
{l:21,n:2,t:"Cosa rappresenta la matrice P nei metodi iterativi?",o:["La matrice inversa di A","La matrice dei residui","La matrice di iterazione","La matrice di precondizionamento"],is_open:false,ans_idx:3,no_ans:false},
{l:21,n:3,t:"Che cosa rappresenta il raggio spettrale della matrice di iterazione?",o:["Il determinante della matrice dei coefficienti","Il massimo valore degli autovalori","La norma del termine noto","Il massimo valore assoluto degli autovalori"],is_open:false,ans_idx:3,no_ans:false},
{l:21,n:4,t:"Qual è il valore del parametro di rilassamento rende il metodo SOR equivalente al metodo di Gauss-Seidel?",o:["2","0","Nessun valore","1"],is_open:false,ans_idx:3,no_ans:false},
{l:21,n:5,t:"Che cosa rappresenta il metodo SOR?",o:["Una generalizzazione del metodo di Gauss-Seide","Un metodo per calcolare determinanti","Un metodo diretto per risolvere sistemi lineari","Una semplificazione del metodo di Jacobi"],is_open:false,ans_idx:0,no_ans:false},

{l:22,n:1,t:"Qual è il legame tra raggio spettrale ottimale e numero di condizionamento?",o:["Sono sempre uguali","Dipendono dal rapporto tra massimo e minimo autovalore","Non hanno relazione","Sono reciproci"],is_open:false,ans_idx:1,no_ans:false},
{l:22,n:2,t:"Il raggio spettrale della matrice di iterazione deve essere…",o:["Uguale a zero per assicurare la convergenza","Sempre minore di 2","Minore di uno per assicurare la convergenza","Maggiore di uno per assicurare la convergenza"],is_open:false,ans_idx:2,no_ans:false},
{l:22,n:3,t:"Perché è utile rendere dinamico il parametro α nel metodo di Richardson?",o:["Per costruire la matrice di iterazione","Per eliminare la necessità di calcoli ripetuti","Per costruire una matrice triangolare","Per adattarsi a ogni iterazione e migliorare la velocità di convergenza"],is_open:false,ans_idx:3,no_ans:false},
{l:22,n:4,t:"Cosa rappresenta il vettore z(k) nel metodo di Richardson?",o:["Il vettore degli errori","Il residuo","Il residuo precondizionato","Il nuovo vettore soluzione"],is_open:false,ans_idx:2,no_ans:false},
{l:22,n:5,t:"Il metodo di Richardson è una generalizzazione di quali metodi iterativi?",o:["Jacobi, Gauss-Seidel e SOR","Bisezione e secante","Newton, corde e SOR","QR e metodo delle potenze"],is_open:false,ans_idx:0,no_ans:false},
{l:22,n:6,t:"Cosa rappresenta il parametro α nel metodo di Richardson?",o:["Un parametro di accelerazione del metodo iterativo","Una variabile del metodo","Il temine noto","Il residuo moltiplicato per la matrice"],is_open:false,ans_idx:0,no_ans:false},

{l:30,n:4,t:"La propagazione degli errori in un metodo numerico: cos'è, quando si verifica e come si può intervenire.",o:[],is_open:true,ans_idx:null,ans_text:"La propagazione degli errori è il fenomeno per cui piccoli errori introdotti in una fase del calcolo (di rappresentazione, di arrotondamento, o di troncamento) si trasmettono e possono amplificarsi nelle fasi successive, fino a produrre un errore finale significativo sul risultato.\n\nSi verifica principalmente in tre situazioni:\n- quando si eseguono molte operazioni in sequenza, e ciascuna introduce un piccolo errore di arrotondamento che si accumula;\n- quando si sottraggono due numeri di valore molto simile (cancellazione di cifre significative), un'operazione intrinsecamente mal condizionata anche se i singoli numeri sono rappresentati con precisione;\n- quando il problema stesso è mal condizionato, cioè il suo numero di condizionamento K è molto maggiore di 1, per cui anche errori piccoli sui dati vengono amplificati sulla soluzione.\n\nPer intervenire si può: aumentare la precisione di macchina (più cifre significative, es. passando a doppia precisione), riformulare gli algoritmi per evitare sottrazioni tra quantità quasi uguali (ad esempio razionalizzando le espressioni), e scegliere metodi numerici ben condizionati anche quando il problema matematico di partenza lo è già, poiché un problema ben posto può comunque generare un algoritmo instabile se non progettato con attenzione.",no_ans:false},

{l:35,n:4,t:"In una EDO lineare omogenea del tipo y′ + P(x)y = 0, la funzione P(x):",o:["Può dipendere da y","Deve essere lineare","Può annullarsi","Dipende solo da x"],is_open:false,ans_idx:2,no_ans:false},
{l:35,n:5,t:"Risolvere la seguente equazione differenziale: y′(x)−(2/x)*y(x)=0, per x>0.",o:[],is_open:true,ans_idx:null,ans_text:"È un'EDO lineare omogenea del primo ordine. Separando le variabili: y'/y = 2/x.\n\nIntegrando entrambi i membri: ln|y| = 2 ln|x| + C.\n\nApplicando l'esponenziale: y(x) = C·x², con C costante arbitraria.\n\n(Verifica: se y=Cx², allora y'=2Cx, e y'-(2/x)y = 2Cx-(2/x)(Cx²) = 2Cx-2Cx = 0 ✓)",no_ans:false},
{l:35,n:6,t:"Trovare l'integrale generale dell'equazione differenziale lineare omogenea del primo ordine: y′(x)+4*y(x)=0.",o:[],is_open:true,ans_idx:null,ans_text:"È un'EDO lineare omogenea con P(x)=4 costante. Separando le variabili: y'/y = -4.\n\nIntegrando: ln|y| = -4x + C.\n\nQuindi l'integrale generale è: y(x) = C·e^(-4x), con C costante arbitraria.\n\nQuesto è il classico modello di decadimento esponenziale (come il decadimento radioattivo, o lo scarico di un condensatore).",no_ans:false},
{l:35,n:7,t:"Trova la soluzione generale della seguente EDO lineare omogenea: y′(x)+cot(x)*y(x)=0, dove cot(x)=cos(x)/sin(x).",o:[],is_open:true,ans_idx:null,ans_text:"Separando le variabili: y'/y = -cot(x) = -cos(x)/sin(x).\n\nIntegrando: ln|y| = -ln|sin(x)| + C (poiché la derivata di sin(x) è cos(x), l'integrale di cos(x)/sin(x) è ln|sin(x)|).\n\nApplicando l'esponenziale: y(x) = C/sin(x), con C costante arbitraria.",no_ans:false},
{l:35,n:8,t:"Trova soluzione dell'equazione differenziale omogenea: y′(x)−x/(1+x^2)*y(x)=0.",o:[],is_open:true,ans_idx:null,ans_text:"Separando le variabili: y'/y = x/(1+x²).\n\nIntegrando: ln|y| = (1/2)ln(1+x²) + C, dato che la derivata di (1+x²) è 2x, quindi l'integrale di x/(1+x²) è (1/2)ln(1+x²).\n\nApplicando l'esponenziale: y(x) = C·√(1+x²), con C costante arbitraria.",no_ans:false},
// === L036 EDO lineari e a variabili separabili ===
{l:36,n:1,t:"Un'EDO è a variabili separabili quando:",o:["Può essere scritta come quoziente di due funzioni","Le variabili possono essere messe da parti opposte dell'equazione","Può essere scritta come prodotto di due funzioni","Tutti i termini sono lineari"],is_open:false,ans_idx:1,no_ans:false},
{l:36,n:2,t:"Se Q(x)=0, allora la soluzione di un'EDO non omogenea:",o:["Coincide con quella del caso omogeneo","Risulta sempre nulla","È impossibile da trovare","Dipende da una costante arbitraria"],is_open:false,ans_idx:0,no_ans:false},
{l:36,n:3,t:"In un problema di Cauchy per EDO lineari, cosa viene fornito oltre all'equazione?",o:["Un valore inziale della derivata prima","Un valore iniziale della funzione","Una condizione al bordo","Una soluzione approssimata"],is_open:false,ans_idx:1,no_ans:false},
{l:36,n:4,t:"In un'EDO del tipo y′+P(x)y=Q(x), la parte non omogenea è rappresentata da:",o:["Q(x)","P(x)","yP(x)","Q(x)-yP(x)"],is_open:false,ans_idx:0,no_ans:false},
{l:36,n:5,t:"Cosa caratterizza un'equazione omogenea del primo ordine?",o:["P(x)=0","P(x) uguale a una costante","Q(x)=0","Q(x) uguale a una costante"],is_open:false,ans_idx:2,no_ans:false},
{l:36,n:6,t:"Risolvi il problema di Cauchy: y′(x)=(e^x)*(y−2), y(0)=1.",o:[],is_open:true,ans_idx:null,ans_text:"Riscrivo come y'-e^x·y = -2e^x, EDO lineare non omogenea con P(x)=-e^x, Q(x)=-2e^x.\n\nIl fattore integrante è μ(x)=e^(∫P dx)=e^(-e^x).\n\n(y·μ)' = Q·μ → y·e^(-e^x) = ∫(-2e^x)e^(-e^x)dx.\n\nCon la sostituzione u=e^x: ∫-2e^(-u)du = 2e^(-u)+C = 2e^(-e^x)+C.\n\nQuindi y·e^(-e^x) = 2e^(-e^x)+C, da cui y(x) = 2 + C·e^(e^x).\n\nApplico y(0)=1: 1 = 2+C·e → C = -1/e.\n\nSoluzione particolare: y(x) = 2 - e^(e^x - 1).",no_ans:false},
{l:36,n:7,t:"Trova la soluzione generale dell'EDO: y′(x)−3*y(x)=e^{2x}.",o:[],is_open:true,ans_idx:null,ans_text:"EDO lineare non omogenea con P(x)=-3, Q(x)=e^(2x).\n\nFattore integrante: μ(x)=e^(-3x).\n\n(y·e^(-3x))' = e^(2x)·e^(-3x) = e^(-x).\n\nIntegrando: y·e^(-3x) = -e^(-x)+C.\n\nSoluzione generale: y(x) = C·e^(3x) - e^(2x).",no_ans:false},
{l:36,n:8,t:"Risolvere la seguente equazione differenziale: y′(x)=y(x)/x, per x>0.",o:[],is_open:true,ans_idx:null,ans_text:"Equazione a variabili separabili: dy/y = dx/x.\n\nIntegrando: ln|y| = ln|x| + C.\n\nSoluzione generale: y(x) = C·x, una famiglia di rette passanti per l'origine.",no_ans:false},
{l:36,n:9,t:"Risolvi l'equazione differenziale lineare del primo ordine: y′(x)+(1/x)*y(x)=x^2, per x>0.",o:[],is_open:true,ans_idx:null,ans_text:"EDO lineare non omogenea con P(x)=1/x, Q(x)=x².\n\nFattore integrante: μ(x)=e^(∫1/x dx)=e^(ln x)=x.\n\n(y·x)' = x·x² = x³.\n\nIntegrando: y·x = x⁴/4 + C.\n\nSoluzione generale: y(x) = x³/4 + C/x.",no_ans:false},
{l:36,n:10,t:"Risolvere la seguente equazione differenziale: y′(x)=x/(1+(y(x))^2).",o:[],is_open:true,ans_idx:null,ans_text:"Equazione a variabili separabili: (1+y²)dy = x dx.\n\nIntegrando entrambi i membri: y + y³/3 = x²/2 + C.\n\nQuesta è la soluzione in forma implicita: non è possibile esplicitare y come funzione elementare di x (l'equazione cubica in y non ha una forma chiusa semplice), quindi la soluzione resta espressa nella relazione implicita y+y³/3 = x²/2+C.",no_ans:false},
{l:36,n:11,t:"Risolvere la seguente equazione differenziale: y′(x)=2*(y(x))^2.",o:[],is_open:true,ans_idx:null,ans_text:"Equazione a variabili separabili: dy/y² = 2dx.\n\nIntegrando: -1/y = 2x + C.\n\nSoluzione generale: y(x) = -1/(2x+C).\n\nSi noti che questa famiglia di soluzioni presenta un asintoto verticale in x=-C/2: è un tipico esempio di soluzione con tempo di esistenza limitato, tipica delle equazioni non lineari con termine quadratico.",no_ans:false},
{l:36,n:12,t:"Trova la soluzione dell'equazione: y′(x)+(e^x)*y(x)=e^x.",o:[],is_open:true,ans_idx:null,ans_text:"EDO lineare non omogenea con P(x)=e^x, Q(x)=e^x.\n\nFattore integrante: μ(x)=e^(∫e^x dx)=e^(e^x).\n\n(y·e^(e^x))' = e^x·e^(e^x).\n\nIntegrando (con sostituzione u=e^x): ∫e^x e^(e^x)dx = e^(e^x)+C.\n\nQuindi y·e^(e^x) = e^(e^x)+C, da cui y(x) = 1 + C·e^(-e^x).",no_ans:false},
{l:36,n:13,t:"Trova la soluzione generale dell'EDO: y′(x)+tan(x)*y(x)=sec(x), dove tan(x)=sin(x)/cos(x) ed sec(x)=1/cos(x).",o:[],is_open:true,ans_idx:null,ans_text:"EDO lineare non omogenea con P(x)=tan(x), Q(x)=sec(x).\n\nFattore integrante: μ(x)=e^(∫tan(x)dx)=e^(-ln|cos(x)|)=1/cos(x)=sec(x).\n\n(y·sec(x))' = sec(x)·sec(x) = sec²(x).\n\nIntegrando: y·sec(x) = tan(x)+C, dato che la primitiva di sec²(x) è tan(x).\n\nSoluzione generale: y(x) = sin(x) + C·cos(x) (moltiplicando entrambi i membri per cos(x)).",no_ans:false},
