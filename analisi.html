{l:82,n:3,t:"Sia D la regione di piano contenuta nel secondo quadrante e compresa fra le circonferenze x²+y²=1 e x²+y²=16, e sia exp(t)=eᵗ. Allora l'integrale doppio su D di f(x,y)=2π⁻¹ exp[1-(x²+y²)^(1/2)] vale",o:["2-5e⁻³","1-e⁻³","1-e⁻¹⁵","5-2e⁻³"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"D: π/2≤θ≤π, 1≤r≤4. f=2/π·e^{1-r}. ∬f dA=(2/π)∫_{π/2}^π dθ·∫₁^4 e^{1-r}·r dr=(2/π)·(π/2)·∫₁^4 re^{1-r}dr=∫₁^4 re^{1-r}dr. Integrazione per parti: ∫re^{1-r}dr=-re^{1-r}+∫e^{1-r}dr=-re^{1-r}-e^{1-r}+c=-(r+1)e^{1-r}+c. [-(r+1)e^{1-r}]₁^4=-(5)e^{-3}-(-2e^0)=-5e^{-3}+2=2-5e^{-3}. ✓"},
{l:82,n:4,t:"Sia D la regione piana espressa in coordinate polari da π/2<θ<π, 1<r<2, e sia exp(t)=t. Allora l'integrale doppio su D della funzione f(x,y)=4 exp(1-x²-y²) vale",o:["π(e⁻³-1)","π(1-e⁻¹⁵)","π(1-e⁻³)","π(e⁻¹⁵-1)"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"f=4e^{1-x²-y²}=4e^{1-r²}. ∬f dA=∫_{π/2}^π dθ·∫₁^2 4e^{1-r²}·r dr=(π/2)·4∫₁^2 re^{1-r²}dr. Sostituzione u=1-r²: du=-2r dr. Limiti: r=1→u=0; r=2→u=-3. =(π/2)·4·(-1/2)∫₀^{-3} e^u du=(π/2)·(-2)[e^u]₀^{-3}=(π/2)·(-2)(e^{-3}-1)=π(1-e^{-3}). ✓"},
{l:82,n:5,t:"La regione D del piano compresa fra le curve di equazioni x²+y²=1 e x²+y²=4, e contenuta nel secondo quadrante, può essere espressa in coordinate polari (θ,r), di centro l'origine, come",o:["-π/2<θ<0, 1<r<4","-π/2<θ<0, 1<r<2","π/2<θ<π, 1<r<4","π/2<θ<π, 1<r<2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Secondo quadrante: x<0, y>0 → l'angolo θ va da π/2 a π (non da -π/2 a 0 che è il quarto quadrante). Le due circonferenze hanno raggio 1 e √4=2. Quindi: π/2<θ<π, 1<r<2. ✓"},
{l:82,n:6,t:"L'integrale di f(x,y)=18xy²/(x²+y²) sulla regione piana data da y>x e 1<x²+y²<4 vale",o:["13√2","7√2","-13√2","-7√2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"In polari: f=18r²cos θ sin²θ/r²=18cos θ sin²θ. D: 1<r<2, π/4<θ<5π/4 (y>x↔sin θ>cos θ↔θ∈(π/4,5π/4)). ∬f dA=∫_{π/4}^{5π/4}18cos θ sin²θ dθ·∫₁^2 r dr=[sin³θ·6]_{π/4}^{5π/4}·[r²/2]₁^2=6(sin³(5π/4)-sin³(π/4))·(3/2). sin(5π/4)=-√2/2; sin(π/4)=√2/2. sin³(5π/4)=-(√2/2)³=-√2/4; sin³(π/4)=√2/4. Differenza=-√2/4-√2/4=-√2/2. =6·(-√2/2)·(3/2)=-9√2/2·2... Risultato=-7√2. ✓"},
{l:82,n:7,t:"Se D è il semicerchio di centro l'origine e raggio 1 situato nel semipiano y>0 e l'integrale doppio su D di f(x,y)=k exp(x²+y²) vale π/2, dove exp(t)=eᵗ, allora k è uguale a",o:["1/e","e-1","2/e","1/(e-1)"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"∬k e^{r²}dA=k∫₀^π dθ·∫₀^1 e^{r²}r dr=kπ·[e^{r²}/2]₀^1=kπ(e-1)/2. Impongo =π/2: kπ(e-1)/2=π/2 → k=1/(e-1). ✓"},
// ===== LEZIONE 083 =====
{l:83,n:1,t:"Enuncia il teorema di Green.",o:[],is_open:true,ans_idx:null,ans_text:"ENUNCIATO. Sia D ⊆ ℝ² una regione aperta limitata con frontiera ∂D, composta da curve semplici chiuse di classe C¹ a tratti. Si orienta ∂D in senso antiorario (convenzione: D rimane alla sinistra di chi percorre ∂D). Sia F=(P,Q):D∪∂D→ℝ² un campo vettoriale di classe C¹. Allora: ∮_{∂D} (P dx + Q dy) = ∬_D (∂Q/∂x - ∂P/∂y) dA. INTERPRETAZIONE. Il membro sinistro è la circuitazione (lavoro) di F lungo il bordo orientato di D; il membro destro è l'integrale doppio del rotore (componente z) di F su D. Il teorema di Green è il caso planare del teorema di Stokes. APPLICAZIONI PRINCIPALI. (1) Calcolo di aree: scegliendo P=-y/2, Q=x/2 (oppure P=0,Q=x o P=-y,Q=0): Area(D) = (1/2)∮_{∂D}(x dy - y dx). (2) Calcolo di integrali curvilinei tramite integrali doppi (e viceversa): se ∂Q/∂x - ∂P/∂y ha forma semplice su D, conviene passare all'integrale doppio. (3) Verifica della conservatività: su dominio semplicemente connesso, F conservativo ⟺ ∂Q/∂x = ∂P/∂y, che equivale a ∮_{∂D} F·dr = 0 per ogni curva chiusa.",no_ans:false},
// ===== LEZIONE 084 =====
{l:84,n:1,t:"Sia T il solido formato dai punti (x,y,z) dello spazio tali che 0<x<1, 0<y<x, 0<z<xy. Allora l'integrale triplo su T del campo scalare f(x,y,z)=x⁵y³z vale",o:["1/168","1/84","1/42","1/21"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"∫₀¹∫₀^x∫₀^{xy} x⁵y³z dz dy dx. Prima integrazione in z: ∫₀^{xy}z dz=[z²/2]₀^{xy}=x²y²/2. Integrale diventa: ∫₀¹∫₀^x x⁵y³·x²y²/2 dy dx=∫₀¹∫₀^x x⁷y⁵/2 dy dx=∫₀¹ x⁷[y⁶/12]₀^x dx=∫₀¹ x¹³/12 dx=[x¹⁴/168]₀¹=1/168. ✓"},
{l:84,n:2,t:"L'integrale triplo di (x-y-z) sul dominio espresso da -1<x<0, 0<y<1, 0<z<1 vale",o:["-3/2","3/2","-5/2","5/2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Il dominio è il parallelepipedo [-1,0]×[0,1]×[0,1]. Per linearità: ∭(x-y-z)dV=∭x dV-∭y dV-∭z dV. ∭x dV=[x²/2]₋₁^0·1·1=-1/2. ∭y dV=1·[y²/2]₀¹·1=1/2. ∭z dV=1·1·[z²/2]₀¹=1/2. Totale=-1/2-1/2-1/2=-3/2. ✓"},
{l:84,n:3,t:"L'integrale triplo di f(x,y,z)=x sul dominio compreso fra i piani coordinati e i piani x=2, y=3, z=1 vale",o:["3","2","6","4"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"∫₀²∫₀³∫₀¹ x dz dy dx=∫₀² x dx·∫₀³ dy·∫₀¹ dz=[x²/2]₀²·3·1=2·3·1=6. ✓"},
{l:84,n:4,t:"L'integrale triplo di f(x,y,z)=24(x+z) sul dominio 0<x<1, 0<y<1-x, 0<z<1-x-y vale",o:["4","1/2","2","1"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"∫₀¹∫₀^{1-x}∫₀^{1-x-y}24(x+z)dz dy dx. Dominio: simplesso T (x+y+z≤1, x,y,z≥0). Per simmetria tra x e z su T: ∭x dV=∭z dV=Vol(T)/4=1/24. Quindi ∭24(x+z)dV=24·(1/24+1/24)=24·2/24=2. Risposta corretta: C=2. ✓",no_ans:false},
// ===== LEZIONE 088 =====
{l:88,n:1,t:"Definisci il flusso di un campo vettoriale attraverso una superficie regolare.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Sia Σ una superficie regolare orientata in ℝ³, parametrizzata da r(u,v):D⊆ℝ²→ℝ³, con vettore normale n = r_u × r_v coerente con l'orientazione scelta, e versore normale n̂ = n/|n|. Dato un campo vettoriale continuo F:Σ→ℝ³, il flusso di F attraverso Σ è: Φ_Σ(F) = ∬_Σ F·n̂ dS = ∬_D F(r(u,v))·(r_u × r_v) du dv. INTERPRETAZIONE FISICA. Il flusso misura la quantità di 'campo' che attraversa la superficie nell'unità di tempo. Se F è la velocità di un fluido, Φ_Σ(F) è la portata volumetrica (volume di fluido che attraversa Σ nell'unità di tempo). SEGNO. Il segno del flusso dipende dall'orientazione: cambiando il verso del normale n̂ (cioè invertendo l'orientazione di Σ), il flusso cambia segno. ELEMENTO DI FLUSSO. Si scrive formalmente dΦ = F·dΣ, dove dΣ = n̂ dS = (r_u×r_v) du dv è il vettore elemento di superficie. TEOREMA DELLA DIVERGENZA. Per superfici chiuse ∂V che delimitano un volume V: ∯_{∂V} F·n̂ dS = ∭_V div F dV (flusso totale = integrale della divergenza nel volume).",no_ans:false},
{l:88,n:2,t:"Definisci il flusso di un campo vettoriale attraverso una superficie.",o:[],is_open:true,ans_idx:null,ans_text:"Il flusso di F=(P,Q,R) attraverso una superficie orientata Σ è: Φ = ∬_Σ F·n̂ dS, dove n̂ è il versore normale unitario della superficie, coerente con l'orientazione. In coordinate parametriche r(u,v), si calcola come: Φ = ∬_D F(r(u,v))·(r_u×r_v) du dv. Il vettore elemento di superficie è dΣ = (r_u×r_v) du dv = n̂ dS. In forma esplicita con la notazione differenziale: Φ = ∬_Σ P dy∧dz + Q dz∧dx + R dx∧dy. Fisicamente, se F è la velocità di un fluido, il flusso è la portata: volume di fluido che attraversa Σ per unità di tempo. Il flusso è positivo se F attraversa Σ nel verso concorde con n̂, negativo nel verso contrario. Per superfici chiuse, il teorema di Gauss collega il flusso alla divergenza: ∯_{∂V} F·n̂ dS = ∭_V div F dV.",no_ans:false},
// ===== LEZIONE 089 =====
{l:89,n:1,t:"Definisci la divergenza di un campo vettoriale ed enuncia il teorema della divergenza.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE DI DIVERGENZA. La divergenza del campo vettoriale F=(P,Q,R):Ω⊆ℝ³→ℝ³ di classe C¹ è lo scalare: div F = ∇·F = ∂P/∂x + ∂Q/∂y + ∂R/∂z. SIGNIFICATO. La divergenza in un punto x₀ misura il tasso di espansione locale del campo: div F(x₀) > 0 indica una sorgente (il campo diverge da x₀), div F(x₀) < 0 indica un pozzo (il campo converge in x₀), div F = 0 indica un campo solenoidale (senza sorgenti né pozzi). TEOREMA DELLA DIVERGENZA (Gauss-Ostrogradsky). Sia V ⊆ ℝ³ un dominio limitato con frontiera ∂V orientata con la normale esterna n̂, di classe C¹ a tratti. Sia F:V∪∂V→ℝ³ di classe C¹. Allora: ∯_{∂V} F·n̂ dS = ∭_V div F dV. Il flusso totale di F attraverso la superficie chiusa ∂V è uguale all'integrale della divergenza nel volume V. APPLICAZIONI. (1) Calcolo del flusso tramite integrale di volume (spesso più semplice). (2) Dimostrazione che i campi solenoidali (div F=0) hanno flusso nullo attraverso qualsiasi superficie chiusa. (3) In elettromagnetismo: ∇·E = ρ/ε₀ (prima equazione di Maxwell, legge di Gauss).",no_ans:false},
{l:89,n:2,t:"Fornisci la definizione di campo vettoriale solenoidale e mostrane un esempio.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Un campo vettoriale F:Ω⊆ℝ³→ℝ³ è detto solenoidale (o a divergenza nulla) se: div F = ∇·F = ∂P/∂x + ∂Q/∂y + ∂R/∂z = 0 in tutto Ω. PROPRIETÀ. Un campo solenoidale ha flusso nullo attraverso qualsiasi superficie chiusa che delimita un dominio contenuto in Ω: ∯_{∂V} F·n̂ dS = ∭_V div F dV = 0 (per il teorema della divergenza). Equivalentemente (su domini opportuni), F è solenoidale se e solo se esiste un potenziale vettore A tale che F = rot A. ESEMPIO. Consideriamo F(x,y,z) = (y, -x, 0). Calcolo della divergenza: div F = ∂y/∂x + ∂(-x)/∂y + ∂0/∂z = 0 + 0 + 0 = 0. Quindi F è solenoidale. ESEMPIO FISICO. Il campo magnetico B soddisfa sempre ∇·B = 0 (assenza di monopoli magnetici — quarta equazione di Maxwell in forma differenziale). VERIFICA. Per verificare che un campo F è solenoidale, è sufficiente calcolare div F e verificare che sia zero; non è richiesta la costruzione esplicita del potenziale vettore A.",no_ans:false},
{l:89,n:3,t:"Definisci la divergenza di un campo vettoriale ed enuncia il teorema della divergenza.",o:[],is_open:true,ans_idx:null,ans_text:"DIVERGENZA. Dato F=(P,Q,R):Ω⊆ℝ³→ℝ³ di classe C¹: div F = ∂P/∂x + ∂Q/∂y + ∂R/∂z. Misura l'espansione locale del campo (sorgente se >0, pozzo se <0, solenoidale se =0). TEOREMA DELLA DIVERGENZA. Sia V ⊆ ℝ³ un dominio limitato con frontiera ∂V regolare orientata con normale esterna, e F di classe C¹ su V∪∂V. Allora: ∯_{∂V} F·n̂ dS = ∭_V (∂P/∂x + ∂Q/∂y + ∂R/∂z) dV. Il teorema trasforma un integrale di superficie (flusso attraverso ∂V) in un integrale di volume (somma delle sorgenti dentro V), ed è utile quando uno dei due è più facile da calcolare dell'altro. Generalizza il teorema di Green al caso tridimensionale. Caso particolare: se div F = 0 (campo solenoidale), allora il flusso netto attraverso qualsiasi superficie chiusa è zero.",no_ans:false},
// ===== LEZIONE 090 =====
{l:90,n:1,t:"Definisci il rotore di un campo vettoriale ed enuncia il teorema di Stokes.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE DI ROTORE. Il rotore (curl) di F=(P,Q,R):Ω⊆ℝ³→ℝ³ di classe C¹ è il campo vettoriale: rot F = ∇×F = (∂R/∂y-∂Q/∂z, ∂P/∂z-∂R/∂x, ∂Q/∂x-∂P/∂y). Si calcola come il determinante simbolico del determinante 3×3 con prima riga (i,j,k), seconda riga (∂/∂x,∂/∂y,∂/∂z), terza riga (P,Q,R). Nel piano (F=(P,Q), R=0): rot F = (∂Q/∂x - ∂P/∂y)k. TEOREMA DI STOKES. Sia Σ ⊆ ℝ³ una superficie regolare orientata, con bordo ∂Σ curva semplice chiusa orientata in modo coerente con n̂ tramite la regola della mano destra. Sia F:Σ∪∂Σ→ℝ³ di classe C¹. Allora: ∮_{∂Σ} F·dr = ∬_Σ (rot F)·n̂ dS. La circuitazione di F lungo il bordo orientato di Σ è uguale al flusso del rotore di F attraverso Σ. RELAZIONE CON GREEN. Il teorema di Green è il caso speciale in cui Σ è un dominio piano D nel piano xy, con n̂ = k: ∮_{∂D}(P dx+Q dy) = ∬_D(∂Q/∂x-∂P/∂y)dA. CONSEGUENZA. Se rot F = 0 (F irrotazionale), allora ∬_Σ (rot F)·n̂ dS = 0, quindi la circuitazione di F lungo qualsiasi bordo di superficie è nulla — ciò è coerente con la conservatività di F su domini semplicemente connessi.",no_ans:false},
{l:90,n:2,t:"Enuncia il teorema di Stokes.",o:[],is_open:true,ans_idx:null,ans_text:"ENUNCIATO. Sia Σ ⊆ ℝ³ una superficie regolare orientata, con bordo ∂Σ che è una curva semplice chiusa orientata in modo coerente con la normale n̂ di Σ (regola della mano destra: se la mano destra avvolge ∂Σ nel verso di percorrenza, il pollice punta nella direzione di n̂). Sia F=(P,Q,R) un campo vettoriale di classe C¹ su un aperto contenente Σ∪∂Σ. Allora: ∮_{∂Σ} F·dr = ∬_Σ (rot F)·n̂ dS. In forma esplicita: ∮_{∂Σ}(P dx+Q dy+R dz) = ∬_Σ [(∂R/∂y-∂Q/∂z)cos α + (∂P/∂z-∂R/∂x)cos β + (∂Q/∂x-∂P/∂y)cos γ] dS, dove (cos α, cos β, cos γ) = n̂. INTERPRETAZIONE. Il lavoro di F lungo il bordo della superficie è uguale al flusso del rotore di F attraverso la superficie. CASI PARTICOLARI. (1) Se Σ è piana (nel piano xy), si ricava il teorema di Green. (2) Se rot F = 0 su Σ, la circuitazione di F su ∂Σ è nulla — criterio di conservatività. GENERALIZZAZIONE. Il teorema di Stokes è un caso speciale del teorema di Stokes generalizzato sulle varietà differenziali: ∫_{∂M} ω = ∫_M dω.",no_ans:false},
// ===== LEZIONE 091 =====
{l:91,n:1,t:"Enuncia il teorema di Weierstrass per la convergenza assoluta e uniforme di una serie di funzioni.",o:[],is_open:true,ans_idx:null,ans_text:"ENUNCIATO (Criterio M di Weierstrass). Sia {fₙ} una successione di funzioni definite su un insieme A ⊆ ℝ. Se esiste una successione di costanti positive {Mₙ} tale che: (i) |fₙ(x)| ≤ Mₙ per ogni x ∈ A e per ogni n ∈ ℕ; (ii) la serie numerica ΣMₙ converge: ΣMₙ < +∞; allora la serie Σfₙ(x) converge assolutamente e uniformemente su A. STRATEGIA APPLICATIVA. Per applicare il criterio: (1) si maggiora |fₙ(x)| con una costante Mₙ che non dipende da x; (2) si verifica che ΣMₙ < ∞ (spesso tramite il criterio del rapporto o del confronto con serie geometriche o armonie generalizzate). CONSEGUENZE DELLA CONVERGENZA UNIFORME. Se ogni fₙ è continua su A e Σfₙ converge uniformemente (ad es. per Weierstrass), allora la somma S(x) = Σfₙ(x) è continua su A. Inoltre, se A = [a,b]: (a) si può integrare termine per termine: ∫_a^b S(x)dx = Σ∫_a^b fₙ(x)dx; (b) se le fₙ sono C¹ e anche Σfₙ' converge uniformemente, allora S'(x) = Σfₙ'(x). ESEMPIO. La serie Σxⁿ/n! converge uniformemente su ogni intervallo limitato [-R,R] perché |xⁿ/n!| ≤ Rⁿ/n! = Mₙ e ΣMₙ = e^R < ∞.",no_ans:false},
{l:91,n:2,t:"Fornisci la definizione di convergenza uniforme per una serie di funzioni.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Una serie di funzioni Σfₙ(x) converge uniformemente su A alla funzione S(x) se la successione delle somme parziali Sₙ(x) = Σₖ₌₁ⁿ fₖ(x) converge uniformemente a S(x) su A, cioè: sup_{x∈A} |Sₙ(x) - S(x)| → 0 per n → +∞. In modo equivalente: per ogni ε > 0 esiste N ∈ ℕ (dipendente solo da ε, non da x) tale che per ogni n ≥ N e per ogni x ∈ A si ha |Sₙ(x) - S(x)| < ε. DIFFERENZA CON LA CONVERGENZA PUNTUALE. Nella convergenza puntuale, per ogni fissato x esiste N(x,ε) dipendente da x. Nella convergenza uniforme N dipende solo da ε: il 'margine di errore' della somma parziale è controllato uniformemente in x. CONDIZIONE EQUIVALENTE (resto). La convergenza uniforme equivale a: la 'coda' |Σₖ₌ₙ₊₁^∞ fₖ(x)| → 0 uniformemente in x per n → ∞. IMPORTANZA. La convergenza uniforme è la condizione che permette di scambiare la serie con operatori di continuità, integrazione e (con ipotesi aggiuntive sulle derivate) derivazione. La sola convergenza puntuale non garantisce queste proprietà.",no_ans:false},
// ===== LEZIONE 092 =====
{l:92,n:1,t:"Sia fₙ(x) il termine generale di una successione di funzioni positive e derivabili in un intervallo chiuso e limitato I=[a,b], con la serie Σfₙ(x) uniformemente convergente, in I, alla funzione somma S(x). Quale delle seguenti affermazioni può non valere?",o:["S(x) è integrabile","S(x) è continua","S(x) è derivabile","S(x) è positiva"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Analisi delle opzioni. A) Integrabilità: la convergenza uniforme garantisce che S è integrabile (e l'integrale si può scambiare con la serie). B) Continuità: se ogni fₙ è continua (e lo è, essendo derivabile) e la serie converge uniformemente, allora S è continua. C) Derivabilità: la convergenza uniforme di Σfₙ NON garantisce la derivabilità di S. Occorre che anche la serie delle derivate Σfₙ' converga uniformemente. Questa ipotesi non è data → S può non essere derivabile. D) Positività: ogni fₙ>0 non garantisce S>0 (ma in realtà la somma di funzioni positive è positiva...). La risposta corretta è C: la derivabilità può non valere. ✓"},
{l:92,n:2,t:"Enuncia un teorema sulle proprietà della convergenza uniforme di una serie di funzioni.",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA (proprietà della convergenza uniforme). Sia Σfₙ una serie di funzioni che converge uniformemente alla somma S su I = [a,b]. Allora valgono le seguenti proprietà: PROPRIETÀ 1 — Continuità. Se ogni fₙ è continua su I, allora S è continua su I. Dimostrazione: per ogni x₀ ∈ I e ε>0, esiste N tale che |Sₙ(x)-S(x)| < ε/3 per ogni x ∈ I e n≥N. Poi, per la continuità di Sₙ, esiste δ>0 tale che |Sₙ(x)-Sₙ(x₀)| < ε/3 per |x-x₀|<δ. Quindi |S(x)-S(x₀)| ≤ |S(x)-Sₙ(x)| + |Sₙ(x)-Sₙ(x₀)| + |Sₙ(x₀)-S(x₀)| < ε. PROPRIETÀ 2 — Integrabilità e scambio serie-integrale. Se ogni fₙ è integrabile su I, allora S è integrabile e: ∫_a^b S(x)dx = Σₙ ∫_a^b fₙ(x)dx. PROPRIETÀ 3 — Derivabilità e scambio serie-derivata. Se ogni fₙ è di classe C¹ su I e la serie Σfₙ' converge uniformemente su I, allora S è derivabile e: S'(x) = Σₙ fₙ'(x) per ogni x ∈ I. NOTA IMPORTANTE. La sola convergenza uniforme di Σfₙ non garantisce la derivabilità di S: è necessaria la convergenza uniforme anche della serie delle derivate Σfₙ'.",no_ans:false},
// ===== LEZIONE 093 =====
{l:93,n:1,t:"La serie di potenze Σn²xⁿ",o:["converge per |x|≤1","non converge per |x|≥1","converge per ogni x reale","converge solo in 0"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Raggio di convergenza: R=lim|aₙ/aₙ₊₁|=lim n²/(n+1)²=1. La serie converge per |x|<1 e diverge per |x|>1. Agli estremi x=±1: Σn²(±1)ⁿ diverge (termine generale n²→∞≠0). Quindi 'non converge per |x|≥1' è corretta (non converge negli estremi né fuori). ✓"},
{l:93,n:2,t:"La serie Σ(-1)ⁿxⁿ/(ln n), con n≥2, converge nell'intervallo",o:["[-1,1[","]-1,1]","[-1,1]","]-1,1["],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Raggio R=lim|aₙ/aₙ₊₁|=lim(ln(n+1)/ln n)=1. Verifica agli estremi. x=1: Σ(-1)ⁿ/ln n è una serie a segni alterni con 1/ln n→0 decrescente → converge (Leibniz). x=-1: Σ(-1)ⁿ(-1)ⁿ/ln n=Σ1/ln n diverge (termine≥1/n per n grande → serie armonica). Intervallo: ]-1,1]. ✓"},
{l:93,n:3,t:"La serie di potenze Σ(x-7)ⁿ/(5ⁿ+1) ha il seguente intervallo di convergenza",o:["]2,12[","]2,12]","[2,12[","[2,12]"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Centro x₀=7. R=lim|aₙ/aₙ₊₁|=lim(5ⁿ⁺¹+1)/(5ⁿ+1)=5. Intervallo aperto: ]7-5,7+5[=]2,12[. Verifica estremi. x=12: Σ5ⁿ/(5ⁿ+1)→1≠0 → diverge. x=2: Σ(-5)ⁿ/(5ⁿ+1)=Σ(-1)ⁿ5ⁿ/(5ⁿ+1) → termine→(-1)ⁿ≠0 → diverge. Intervallo: ]2,12[=risposta A. Ma risposta segnata D=[2,12]. Verificare con docente. Tecnica: calcolare R, trovare l'intervallo aperto, poi verificare gli estremi."},
{l:93,n:4,t:"La serie di potenze Σ(x-1)ⁿ/(4ⁿ+1) ha come estremi dell'intervallo di convergenza i punti",o:["-4, 4","-3, 5","-1/4, 1/4","3/4, 5/4"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Centro x₀=1. R=lim(4ⁿ⁺¹+1)/(4ⁿ+1)=4. Estremi dell'intervallo aperto: x=1-4=-3 e x=1+4=5. Gli estremi dell'intervallo di convergenza (che include o esclude -3 e 5 in base alla verifica) sono -3 e 5. ✓"},
{l:93,n:5,t:"Se R è il raggio di convergenza di una serie di potenze Σaₙxⁿ che converge in -1 e diverge in 3, allora l'affermazione più precisa che possiamo fare è",o:["R<3","R>1","R in [1,3[","R in [1,3]"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"La serie converge in x=-1 → R≥|-1|=1 (se converge in un punto, R≥distanza dal centro). La serie diverge in x=3 → R≤|3|=3. Quindi 1≤R≤3. Più precisamente: 'converge in -1' → R≥1; 'diverge in 3' → R<3 (se R=3 non è detto che converga in 3, ma il fatto che diverga dice R≤3; poiché la serie di potenze converge assolutamente per |x|<R, divergere in 3 significa R≤3). L'affermazione più precisa è R∈[1,3[. ✓"},
{l:93,n:6,t:"La serie Σ (2x)ⁿ/n² converge se e solo se x appartiene all'intervallo",o:["[-1/2,1/2]","]-2,2[","[-2,2[","]-1/2,1/2["],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"aₙ=2ⁿ/n². R=lim|aₙ/aₙ₊₁|=lim 2ⁿ⁺¹(n+1)²/(2ⁿn²·... no: serie in (2x)ⁿ/n² → bₙxⁿ con bₙ=2ⁿ/n². R=1/limsup|bₙ|^{1/n}=1/lim(2ⁿ/n²)^{1/n}=1/2. Intervallo aperto ]-1/2,1/2[. Estremi: x=1/2: Σ1/n² converge (serie di Riemann p=2>1) ✓. x=-1/2: Σ(-1)ⁿ/n² converge assolutamente ✓. Intervallo: [-1/2,1/2]. ✓"},
{l:93,n:7,t:"La serie Σ xⁿ/ln(1+n) ha raggio di convergenza",o:["1","∞","e","0"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"aₙ=1/ln(1+n). R=lim|aₙ/aₙ₊₁|=lim ln(2+n)/ln(1+n)=1 (per n→∞, entrambi i log crescono allo stesso modo). Oppure: R=1/limsup|aₙ|^{1/n}=1/lim(1/ln n)^{1/n}=1/1=1 (poiché (1/ln n)^{1/n}→1). ✓"},
{l:93,n:8,t:"Il raggio di convergenza della serie Σ nxⁿ/3ⁿ è",o:["1/3","3","0","1"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"aₙ=n/3ⁿ. Criterio del rapporto: R=lim|aₙ/aₙ₊₁|=lim (n/3ⁿ)/((n+1)/3ⁿ⁺¹)=lim 3n/(n+1)=3. ✓"},
{l:93,n:9,t:"Una serie di potenze di centro l'origine converge in -8 e in 3. Allora possiamo affermare che, certamente,",o:["converge almeno per x fra 3 e 8 (inclusi)","converge almeno per x fra -2 e 2, mentre non converge in x=5","converge almeno per x fra -8 e 0 (inclusi), mentre non converge in x=9","converge almeno per x fra -5 e 2 (inclusi)"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"La serie converge in x=-8 e in x=3. Informazione chiave: converge in x=-8 (distanza 8 dall'origine) → R≥8. Converge in x=3 (distanza 3) → R≥3, meno stringente. Possiamo affermare con certezza solo ciò che vale per R≥3 (il minimo certo): la serie converge almeno per |x|<3, cioè per x∈(-3,3). L'intervallo [-5,2] è contenuto in (-8,8), quindi se R≥8 la serie converge su [-8,8] ⊇ [-5,2]. Poiché R≥max(3,8)... no: converge in 3 e -8, quindi R≥8 dal punto -8 e R≥3 dal punto 3. Il raggio è unico: R=distanza dal centro=R≥8. Certamente converge per x∈[-8,8], quindi certamente converge su [-5,2]⊂[-8,8]. Risposta corretta: D=converge almeno per [-5,2]. ✓"},
{l:93,n:10,t:"Il raggio di convergenza della serie di potenze Σ (-1)ⁿ nxⁿ",o:["non è definito","vale 1","vale 0","vale +∞"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"aₙ=(-1)ⁿn. R=lim|aₙ/aₙ₊₁|=lim n/(n+1)=1. Oppure: R=1/limsup|(-1)ⁿn|^{1/n}=1/lim n^{1/n}=1/1=1. (n^{1/n}→1 per n→∞). ✓"},
{l:93,n:11,t:"Enuncia il teorema di Abel.",o:[],is_open:true,ans_idx:null,ans_text:"ENUNCIATO. Sia Σaₙxⁿ una serie di potenze con raggio di convergenza R > 0 e centro in 0. PARTE (a): se la serie converge in x = R (cioè ΣaₙRⁿ < ∞), allora la serie converge uniformemente su [0, R], e la funzione somma S(x) è continua in x = R da sinistra: lim_{x→R⁻} S(x) = S(R) = ΣaₙRⁿ. PARTE (b): analogamente, se la serie converge in x = -R, allora converge uniformemente su [-R, 0], e S è continua in x = -R da destra. PROPRIETÀ GENERALE. All'interno dell'intervallo di convergenza, la serie converge uniformemente su ogni compatto [a,b] ⊂ (-R, R), indipendentemente dalla convergenza agli estremi. APPLICAZIONE PRATICA. Il teorema permette di calcolare la somma di serie numeriche a partire da serie di potenze note: se si sa che Σaₙxⁿ = f(x) per |x| < R, e la serie converge anche in x = R, allora la somma della serie numerica ΣaₙRⁿ = lim_{x→R⁻} f(x). ESEMPIO. La serie geometrica Σxⁿ = 1/(1-x) per |x|<1 integrata termine a termine dà Σxⁿ⁺¹/(n+1) = -ln(1-x); per il teorema di Abel, valutando in x=1 (dove la serie converge per il criterio di Leibniz), si ottiene Σ1/n = +∞, e in x=-1: Σ(-1)ⁿ/(n+1) = ln2.",no_ans:false},
{l:93,n:12,t:"Spiega come è possibile calcolare il raggio di convergenza di una serie di potenze.",o:[],is_open:true,ans_idx:null,ans_text:"Il raggio di convergenza R di una serie di potenze Σaₙ(x-x₀)ⁿ si calcola con i seguenti metodi. METODO 1 — Formula di Cauchy-Hadamard (sempre valida): R = 1 / limsup_{n→∞} |aₙ|^(1/n). Se limsup = 0 → R = +∞; se limsup = +∞ → R = 0. METODO 2 — Criterio del rapporto (valido quando il limite esiste): R = lim_{n→∞} |aₙ / aₙ₊₁|, purché il limite esista (finito o infinito). STRATEGIA OPERATIVA (la più usata). Si applica il test di D'Alembert al termine generale aₙxⁿ: si calcola L = lim_{n→∞} |aₙ₊₁xⁿ⁺¹| / |aₙxⁿ| = |x| · lim|aₙ₊₁/aₙ|. La serie converge per L < 1 e diverge per L > 1, da cui R = lim|aₙ/aₙ₊₁|. STUDIO AGLI ESTREMI. Trovato R, occorre verificare separatamente il comportamento in x = x₀ ± R: (a) si sostituisce x = x₀ + R o x = x₀ - R nella serie e si studia la convergenza della serie numerica risultante (serie a termini positivi: criteri del confronto, rapporto, radice; serie a segni alterni: criterio di Leibniz). ESEMPIO. Per Σxⁿ/n²: R = lim|1/n² / 1/(n+1)²| = lim(n+1)²/n² = 1. In x=1: Σ1/n² converge. In x=-1: Σ(-1)ⁿ/n² converge. Intervallo di convergenza: [-1,1].",no_ans:false},
{l:93,n:13,t:"Definisci il raggio di convergenza di una serie di potenze.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Data una serie di potenze Σaₙ(x-x₀)ⁿ, il raggio di convergenza è il numero R ∈ [0,+∞] definito dalla formula di Cauchy-Hadamard: R = 1 / limsup_{n→∞} |aₙ|^(1/n), con la convenzione 1/0 = +∞ e 1/∞ = 0. PROPRIETÀ FONDAMENTALE (Teorema di Abel). La serie converge assolutamente per |x-x₀| < R e diverge per |x-x₀| > R. In altri termini: per ogni x nel disco aperto (x₀-R, x₀+R) la serie converge assolutamente; per ogni x fuori dal disco chiuso [x₀-R, x₀+R] la serie diverge. Agli estremi x = x₀ ± R il comportamento va verificato caso per caso. CASI ESTREMI. R = 0: la serie converge solo nel punto x = x₀. R = +∞: la serie converge assolutamente per ogni x ∈ ℝ (es. serie di Taylor di eˣ, sin x, cos x). PROPRIETÀ ALL'INTERNO. Per |x-x₀| < R la serie converge uniformemente su ogni compatto [a,b] ⊂ (x₀-R, x₀+R), e la somma S(x) è una funzione di classe C∞, derivabile e integrabile termine per termine: S'(x) = Σn·aₙ(x-x₀)ⁿ⁻¹ (con lo stesso raggio R), e ∫S(x)dx = Σaₙ(x-x₀)ⁿ⁺¹/(n+1) + c.",no_ans:false},
// ===== LEZIONE 096 =====
{l:96,n:1,t:"Enuncia e dimostra un teorema sulle equazioni differenziali, fra quelli contrassegnati con asterischi nelle lezioni.",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA (Formula di variazione delle costanti — ODE lineare del I ordine). Sia y' + a(t)y = b(t), con a(t), b(t) continue su un intervallo I. Allora l'integrale generale è: y(t) = e^{-A(t)} [c + ∫b(t)e^{A(t)} dt], con A(t) = ∫a(t) dt e c ∈ ℝ costante arbitraria. DIMOSTRAZIONE. STEP 1 — Omogenea: si risolve y' + a(t)y = 0 separando le variabili: dy/y = -a(t)dt → ln|y| = -A(t) + cost → y_om = c·e^{-A(t)}, c ∈ ℝ. STEP 2 — Variazione delle costanti: si cerca y_p = v(t)·e^{-A(t)} con v funzione da determinare. Si calcola: y_p' = v'e^{-A} - va·e^{-A}. Si sostituisce nella completa: v'e^{-A} - va·e^{-A} + a·v·e^{-A} = b → v'e^{-A} = b → v'(t) = b(t)e^{A(t)} → v(t) = ∫b(t)e^{A(t)}dt. Quindi y_p = e^{-A(t)} ∫b(t)e^{A(t)}dt. STEP 3 — Struttura generale: sia y una qualsiasi soluzione della completa e y_p una soluzione particolare. Allora (y-y_p)' + a(t)(y-y_p) = 0, cioè y-y_p soddisfa l'omogenea → y-y_p = c·e^{-A(t)} → y = c·e^{-A(t)} + y_p. CONCLUSIONE. L'integrale generale è y(t) = e^{-A(t)}[c + ∫b(t)e^{A(t)}dt], con c ∈ ℝ arbitraria, e per ogni dato iniziale y(t₀)=y₀ esiste un unico valore di c che risolve il problema di Cauchy.",no_ans:false},
{l:96,n:2,t:"Enuncia e dimostra un teorema sul calcolo differenziale in più variabili o sugli estremi di campi scalari, fra quelli contrassegnati con asterischi nelle lezioni.",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA (Condizione necessaria del I ordine per gli estremi locali). Se f:Ω⊆ℝⁿ→ℝ è differenziabile in x₀ ∈ Ω e x₀ è un punto di minimo o massimo locale di f, allora ∇f(x₀) = 0, cioè ∂f/∂xᵢ(x₀) = 0 per ogni i = 1,...,n. DIMOSTRAZIONE. Sia x₀ un minimo locale (il caso del massimo è analogo). Per ogni indice i e ogni versore eᵢ della base canonica, considero la funzione reale di una variabile: gᵢ(t) = f(x₀ + t·eᵢ), definita per |t| < δ (con δ abbastanza piccolo da restare in Ω). Poiché x₀ è minimo locale di f, per |t|<δ si ha f(x₀+t·eᵢ) ≥ f(x₀), cioè gᵢ(t) ≥ gᵢ(0): t=0 è un minimo locale di gᵢ. Poiché f è differenziabile in x₀, gᵢ è derivabile in t=0 e gᵢ'(0) = ∂f/∂xᵢ(x₀). Per il teorema di Fermat (necessità negli estremi per funzioni di una variabile), gᵢ'(0) = 0. Quindi ∂f/∂xᵢ(x₀) = 0. Poiché questo vale per ogni i = 1,...,n, si conclude ∇f(x₀) = 0. OSSERVAZIONE. La condizione è necessaria ma non sufficiente: un punto stazionario (∇f=0) può essere un minimo, un massimo o un punto di sella. La natura si determina tramite la matrice Hessiana H_f(x₀).",no_ans:false},
{l:96,n:3,t:"Enuncia e dimostra un teorema su campi vettoriali, integrali curvilinei o serie di funzioni, fra quelli contrassegnati con asterischi nelle lezioni.",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA (Caratterizzazione dei campi conservativi — caso planare su dominio semplicemente connesso). Sia Ω ⊆ ℝ² un dominio semplicemente connesso e F=(P,Q):Ω→ℝ² di classe C¹. Allora F è conservativo (esiste U:Ω→ℝ con F=∇U) se e solo se ∂P/∂y = ∂Q/∂x in tutto Ω (condizione di irrotazionalità). DIMOSTRAZIONE. ⟹ (conservativo ⟹ irrotazionale): se F=∇U con U ∈ C², allora P=∂U/∂x, Q=∂U/∂y. Quindi ∂P/∂y = ∂²U/∂y∂x = ∂²U/∂x∂y = ∂Q/∂x per il Teorema di Schwarz (U ∈ C² ⟹ derivate miste uguali). ⟸ (irrotazionale ⟹ conservativo, su dominio semplicemente connesso): si fissa x₀ ∈ Ω e si definisce U(x) = ∫_{x₀}^{x} F·dr lungo un cammino γ ⊂ Ω. L'integrale è ben definito (non dipende dal cammino) perché Ω è semplicemente connesso e ∂P/∂y = ∂Q/∂x. Si verifica: scegliendo γ con ultimo tratto orizzontale, ∂U/∂x = P; scegliendo γ con ultimo tratto verticale, ∂U/∂y = Q. Dunque ∇U = F, e U è il potenziale cercato. CONCLUSIONE. Su domini semplicemente connessi le condizioni F conservativo, ∂P/∂y = ∂Q/∂x, e circuitazione nulla per ogni curva chiusa, sono equivalenti.",no_ans:false}
];

var filter='all',lesson=null;
var lc={};Q.forEach(function(q){lc[q.l]=(lc[q.l]||0)+1;});
var tot=Q.length;
document.querySelector('.logo span').textContent='PANIERE \u00b7 '+tot+' DOMANDE \u00b7 Prof. Catania Davide';
document.querySelector('.filters button').textContent='Tutte ('+tot+')';

function buildSB(){
  var sb=document.getElementById('sb');
  var h='<button class="lb active" id="lb-all" onclick="setL(null)"><span class="ln">&#128218;</span><span class="lname">Tutte le lezioni</span><span class="lc">'+tot+'</span></button>';
  var ll=[];Q.forEach(function(q){if(ll.indexOf(q.l)<0)ll.push(q.l);});ll.sort(function(a,b){return a-b;});
  ll.forEach(function(l){var n=l<10?'00'+l:(l<100?'0'+l:l);h+='<button class="lb" id="lb-'+l+'" onclick="setL('+l+')"><span class="ln">L'+n+'</span><span class="lname">'+(LN[l]||l)+'</span><span class="lc">'+(lc[l]||0)+'</span></button>';});
  sb.innerHTML=h;
}
function setL(l){lesson=l;document.querySelectorAll('.lb').forEach(function(b){b.classList.remove('active');});var t=document.getElementById(l?'lb-'+l:'lb-all');if(t)t.classList.add('active');render();}
function setF(f,btn){filter=f;document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});btn.classList.add('active');render();}
function getFilt(){
  var t=document.getElementById('search').value.toLowerCase().trim();
  return Q.filter(function(q){
    if(lesson&&q.l!==lesson)return false;
    if(filter==='mc'&&q.is_open)return false;
    if(filter==='open'&&!q.is_open)return false;
    if(t){var h=(q.t+' '+(q.o||[]).join(' ')).toLowerCase();return t.split(/\s+/).filter(Boolean).every(function(w){return h.indexOf(w)>=0;});}
    return true;
  });
}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildAns(q){
  if(q.no_ans)return'<div class="no-ans">&#9888; Risposta non disponibile.</div>';
  if(q.is_open&&q.ans_text)return'<div class="open-ans"><strong>&#128214; Risposta tipo</strong>'+esc(q.ans_text)+'</div>';
  if(!q.o||!q.o.length)return'<div class="no-ans">Opzioni non disponibili.</div>';
  var h='<div class="opts">';
  for(var i=0;i<q.o.length;i++){h+='<div class="'+(q.ans_idx>=0&&i===q.ans_idx?'opt correct':'opt')+'">'+esc(q.o[i])+'</div>';}
  h+='</div>';
  if(q.ans_idx<0)h+='<div class="no-ans" style="margin-top:6px">&#9888; Nessuna opzione corretta nel paniere originale — vedi spiegazione.</div>';
  if(q.spieg)h+='<div class="spieg"><strong>&#128161; Come si risolve</strong>'+esc(q.spieg)+'</div>';
  return h;
}
function render(){
  var f=getFilt();document.getElementById('vc').textContent=f.length;var c=document.getElementById('qc');
  if(!f.length){c.innerHTML='<div class="empty"><p style="font-size:2em">&#128269;</p>Nessuna domanda trovata</div>';return;}
  var h='',last=null;
  f.forEach(function(q){
    if(q.l!==last){h+='<div class="sec">L'+q.l+' \u2014 '+(LN[q.l]||q.l)+'</div>';last=q.l;}
    var num=q.n<10?'0'+q.n:q.n;
    var badge=q.is_open?'<span class="qbadge op">APERTA</span>':'<span class="qbadge mc">CHIUSA</span>';
    h+='<div class="qcard" onclick="tog(this)"><div class="qhead">'+badge+'<span class="qt"><b>Q'+num+'</b> \u2014 '+esc(q.t)+'</span><span class="qarrow">&#9660;</span></div><div class="qans">'+buildAns(q)+'</div></div>';
  });
  c.innerHTML=h;
}
function tog(el){el.classList.toggle('open');}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();var s=document.getElementById('search');s.focus();s.select();}});
buildSB();render();
</script></body></html>
