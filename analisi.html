t-weight:700;min-width:28px}.lb .lname{font-size:9px;opacity:.7;line-height:1.3}.lb .lc{margin-left:auto;font-size:9px;background:var(--border);padding:1px 5px;border-radius:8px;flex-shrink:0}main{flex:1;padding:22px;max-width:880px}.filters{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}.pill{font-family:monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 13px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--dim);transition:all .15s;}.pill:hover{border-color:var(--accent);color:var(--accent)}.pill.active{background:var(--adim);border-color:var(--accent);color:var(--accent)}.pill.mc-pill.active{background:var(--gdim);border-color:var(--green);color:var(--green)}.pill.op-pill.active{background:var(--bdim);border-color:var(--blue);color:var(--blue)}.qcard{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden;cursor:pointer;}.qhead{display:flex;align-items:flex-start;gap:11px;padding:13px 17px;}.qhead:hover{background:rgba(255,255,255,.02)}.qbadge{font-family:monospace;font-size:9px;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:3px;white-space:nowrap;}.qbadge.mc{background:var(--gdim);color:var(--green);border:1px solid rgba(39,174,96,.2)}.qbadge.op{background:var(--bdim);color:var(--blue);border:1px solid rgba(93,173,226,.2)}.qt{font-size:13.5px;line-height:1.6;color:var(--text);flex:1}.qarrow{color:var(--dim);font-size:10px;margin-top:4px;flex-shrink:0;transition:transform .2s}.qcard.open .qarrow{transform:rotate(180deg);color:var(--accent)}.qans{display:none;padding:0 17px 15px 48px}.qcard.open .qans{display:block}.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}.opt{font-size:12.5px;padding:7px 11px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--surf2);}.opt.correct{background:var(--gdim);border-color:rgba(39,174,96,.35);color:var(--green);font-weight:600;}.opt.correct::before{content:'\2713  '}.open-ans{background:var(--bdim);border:1px solid rgba(93,173,226,.2);border-radius:7px;padding:12px 16px;font-size:13px;color:#cde4f5;line-height:1.8;}.open-ans strong{display:block;font-family:monospace;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);margin-bottom:8px}.spieg{background:rgba(200,169,110,0.08);border:1px solid rgba(200,169,110,0.2);border-radius:7px;padding:12px 16px;font-size:12.5px;color:#e8d9b8;line-height:1.85;margin-top:8px;}.spieg strong{display:block;font-family:monospace;font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px}.no-ans{font-family:monospace;font-size:11px;color:var(--dim);padding:7px 11px;border:1px dashed var(--border);border-radius:6px;}.sec{font-family:monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:22px 0 11px;display:flex;align-items:center;gap:10px;}.sec::after{content:'';flex:1;height:1px;background:var(--border)}.empty{text-align:center;padding:60px 20px;color:var(--dim);font-family:monospace}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}@media(max-width:640px){aside{display:none}main{padding:12px}}</style></head>

var Q=[
// ===== LEZIONE 053 =====
{l:53,n:1,t:"Spiega cos'è un'equazione differenziale di ordine n e cos'è una sua soluzione (o integrale generale).",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Un'equazione differenziale ordinaria (ODE) di ordine n è un'equazione della forma F(t, y, y', y'', ..., y^(n)) = 0, che lega una funzione incognita y = y(t) alle sue derivate fino all'ordine n. La variabile indipendente è t, quella dipendente è y. SOLUZIONE (INTEGRALE PARTICOLARE). Una funzione y: I → ℝ, derivabile n volte su un intervallo I, è soluzione se soddisfa l'equazione identicamente in t ∈ I, cioè sostituendo y e le sue derivate nell'equazione si ottiene un'identità verificata per ogni t ∈ I. INTEGRALE GENERALE. L'integrale generale è la famiglia di tutte le soluzioni dell'ODE. Per un'ODE di ordine n, l'integrale generale contiene tipicamente n costanti arbitrarie c₁, c₂, ..., cₙ ∈ ℝ, e si scrive y = y(t; c₁, ..., cₙ). Geometricamente rappresenta una famiglia di curve nel piano (t, y) dette curve integrali. SOLUZIONE PARTICOLARE. Si ottiene dall'integrale generale fissando valori specifici delle costanti, tipicamente imponendo n condizioni iniziali (problema di Cauchy). Esempio: y' = y ha integrale generale y = ceᵗ (c ∈ ℝ); la soluzione particolare con y(0) = 2 è y = 2eᵗ.",no_ans:false},
{l:53,n:2,t:"Spiega cos'è un problema di Cauchy di ordine n.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Il problema di Cauchy di ordine n è il problema ai valori iniziali che consiste nel trovare una funzione y(t) che: (1) soddisfi un'ODE di ordine n: F(t, y, y', ..., y^(n)) = 0; (2) soddisfi n condizioni iniziali assegnate in un punto t₀: y(t₀) = y₀, y'(t₀) = y₁, ..., y^(n-1)(t₀) = yₙ₋₁. STRATEGIA RISOLUTIVA. Si procede in due fasi: prima si determina l'integrale generale dell'ODE (che contiene n costanti c₁,...,cₙ), poi si impongono le n condizioni iniziali ottenendo un sistema di n equazioni nelle n incognite c₁,...,cₙ. Risolvendo il sistema si determinano univocamente le costanti (sotto le ipotesi del teorema di esistenza e unicità) e quindi la soluzione particolare cercata. INTERPRETAZIONE GEOMETRICA. Si cerca la curva integrale che passa per il punto (t₀, y₀) con derivate prefissate y₁, y₂, ..., yₙ₋₁. ESEMPIO. Per y' = 2y (ODE del I ordine), l'integrale generale è y = ce²ᵗ; il problema di Cauchy con y(0) = 3 impone c·e⁰ = 3, da cui c = 3, e la soluzione è y = 3e²ᵗ.",no_ans:false},
// ===== LEZIONE 054 =====
{l:54,n:1,t:"Enuncia il teorema di esistenza e unicità per i problemi di Cauchy.",o:[],is_open:true,ans_idx:null,ans_text:"ENUNCIATO (Teorema di Cauchy-Lipschitz — esistenza e unicità locale). Sia f(t, y) una funzione definita su un rettangolo aperto R = {(t,y) : |t-t₀| < a, |y-y₀| < b} ⊂ ℝ². Se f è continua su R e soddisfa una condizione di Lipschitz rispetto a y, cioè esiste una costante L > 0 tale che |f(t,y₁) - f(t,y₂)| ≤ L|y₁-y₂| per ogni (t,y₁),(t,y₂) ∈ R, allora il problema di Cauchy y' = f(t,y), y(t₀) = y₀ ammette un'unica soluzione y(t) definita in un intorno (t₀-δ, t₀+δ) ⊆ ℝ per qualche δ > 0. CONDIZIONE SUFFICIENTE. Una condizione sufficiente per la Lipschitzianità è che ∂f/∂y esista e sia continua e limitata in R: in tal caso L = sup_R |∂f/∂y| è la costante di Lipschitz. OSSERVAZIONI IMPORTANTI. (1) Il teorema è di carattere locale: garantisce l'esistenza nell'intorno di t₀, non su tutto ℝ (la soluzione potrebbe 'esplodere' in tempo finito). (2) Per ODE lineari y' + a(t)y = b(t) con a, b continue su un intervallo I, il teorema garantisce esistenza e unicità globale su tutto I. (3) L'unicità implica che due curve integrali distinte non si intersecano mai (nei punti in cui f è Lipschitz). STRATEGIA APPLICATIVA. Per verificare le ipotesi del teorema, si calcola ∂f/∂y e si controlla che sia continua in un intorno del dato iniziale.",no_ans:false},
// ===== LEZIONE 055 =====
{l:55,n:1,t:"L'equazione differenziale y'=y/t ha, come integrale generale (con k costante reale),",o:["y(t)=t+k","y(t)=ln(t)+k","y(t)=k ln(t)","y(t)=kt"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"ODE a variabili separabili: dy/y = dt/t. Integrando entrambi i membri: ln|y| = ln|t| + cost = ln|t| + ln|k| → y = kt. Verifica: y' = k, e y/t = kt/t = k. ✓ Le altre opzioni non soddisfano l'equazione: es. y=t+k → y'=1 ma y/t=(t+k)/t≠1 in generale."},
{l:55,n:2,t:"Se y(t) è la soluzione dell'equazione differenziale y'=cos t exp(-2y+sin t), con exp(x)=eˣ, che vale ln(4) per t=0, allora y(π) vale",o:["ln(2/e)","ln(2)","2ln(2)","2ln(2/e)"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"ODE separabile: e^{2y}dy=cos(t)e^{sin t}dt. Integro: e^{2y}/2=e^{sin t}+c. Cond. y(0)=ln4: e^{2ln4}/2=8=1+c → c=7. Equazione: e^{2y}/2=e^{sin t}+7. In t=π: e^{2y}/2=8 → e^{2y}=16 → y=2ln2. Risposta corretta: C=2ln2. ✓"},
{l:55,n:3,t:"Se y(t)=(t²-1)cos(t)+c, con c reale, è l'integrale generale di un'equazione differenziale, allora la soluzione del relativo problema di Cauchy con y(0)=2 è",o:["y(t)=(t²-1)cos(t)+3","y(t)=(t²-1)cos(t)+2","y(t)=(t²-1)cos(t)-2","y(t)=(t²-1)cos(t)"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Si impone la condizione iniziale y(0)=2 nell'integrale generale: y(0) = (0-1)cos(0)+c = (-1)(1)+c = -1+c = 2 → c = 3. La soluzione particolare è quindi y(t) = (t²-1)cos(t)+3. Metodo generale: sostituire t=t₀ e y=y₀ nell'integrale generale per trovare c."},
{l:55,n:4,t:"Se y(t) è la soluzione dell'equazione differenziale y'=y/t+12/t² che vale 0 per t=1, allora y(2) vale",o:["12","6","9","3"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"ODE lineare del I ordine: y' - y/t = 12/t². Fattore integrante: μ=1/t. (y/t)'=12/t³. Integro: y/t=-6/t²+c → y=-6/t+ct. Cond. y(1)=0: -6+c=0 → c=6. Soluzione: y(t)=-6/t+6t. y(2)=-3+12=9. Risposta corretta: C=9. ✓"},
{l:55,n:5,t:"Se y(t)=t-k ln(1+|t|) è l'integrale generale di un'equazione differenziale (con k costante reale), allora la soluzione che vale 2 per t=0 si ha per",o:["k=-2","k=2","nessun k","k=0"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Si impone y(0)=2: y(0)=0-k·ln(1+0)=0-0=0 per qualsiasi k. La famiglia y=t-k·ln(1+|t|) passa sempre per l'origine indipendentemente da k. Quindi nessun k soddisfa y(0)=2. Risposta corretta: C=nessun k. ✓"},
{l:55,n:6,t:"Se y(t) è la soluzione del problema di Cauchy y'=ycos t, con y(0)=2, allora y(π) vale",o:["2/e","e+2","2e","2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"ODE separabile: dy/y = cos(t)dt. Integro: ln|y| = sin(t)+c → y = Ae^{sin t}. Condizione y(0)=2: A·e^0 = 2 → A=2. Quindi y(t) = 2e^{sin t}. Calcolo y(π): sin(π)=0 → y(π) = 2e^0 = 2. Verifica: y'=2e^{sin t}·cos t = y·cos t ✓."},
{l:55,n:7,t:"Se y(t) è la soluzione del problema di Cauchy y'=2yeᵗ, con y(0)=e², allora il limite per t che tende a +∞ di y(t) vale",o:["2","1","2e","e²"],is_open:false,ans_idx:-1,ans_text:null,no_ans:false,spieg:"ODE separabile: dy/y=2eᵗdt → ln|y|=2eᵗ+c → y=Ae^{2eᵗ}. Cond. y(0)=e²: A·e^{2}=e² → A=1. Soluzione: y(t)=e^{2eᵗ}. Per t→+∞: eᵗ→+∞ → 2eᵗ→+∞ → y(t)→+∞. Il limite è +∞, che non figura tra le opzioni. NESSUNA OPZIONE CORRETTA nel paniere originale."},
{l:55,n:8,t:"Se y(t) è la soluzione del problema di Cauchy (2-x)y'=y, con y(0)=-1/2, allora y(1) vale",o:["1","-1","-2","2"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"ODE separabile: dy/y=dx/(2-x). Integro: ln|y|=-ln|2-x|+c → y=A/(2-x). Cond. y(0)=-1/2: A/2=-1/2 → A=-1. Soluzione: y(x)=-1/(2-x)=1/(x-2). y(1)=1/(1-2)=-1. Risposta corretta: B=-1. ✓"},
{l:55,n:9,t:"Il problema di Cauchy y'=2t(y-1)², con y(0)=1,",o:["ha una soluzione con limite infinito per t che tende all'infinito","ha una soluzione del tipo y=1-(x²+c)⁻¹","ha y=1 come soluzione","non ha soluzioni"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Si verifica direttamente che y(t)=1 è soluzione: y'=0 e 2t(y-1)²=2t(1-1)²=0 ✓. Condizione iniziale: y(0)=1 ✓. Quindi y=1 è la soluzione costante del problema di Cauchy. Nota: questa è la soluzione singolare (equilibrio stabile), che si ottiene quando (y-1)=0. Le altre opzioni descrivono soluzioni per dati iniziali diversi."},
{l:55,n:10,t:"Sapendo che y(t)=3eᵗ-eᵃᵗ-1 è una soluzione dell'equazione differenziale y''+y'-2y=2 e che a è un numero reale, allora a vale",o:["1","-1 o 2","1 o -2","2"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Si sostituisce y=3eᵗ-eᵃᵗ-1 nell'equazione. Calcolo: y'=3eᵗ-aeᵃᵗ, y''=3eᵗ-a²eᵃᵗ. Sostituzione: (3eᵗ-a²eᵃᵗ)+(3eᵗ-aeᵃᵗ)-2(3eᵗ-eᵃᵗ-1)=2. Sviluppo: 3eᵗ-a²eᵃᵗ+3eᵗ-aeᵃᵗ-6eᵗ+2eᵃᵗ+2=2. Raggruppando: eᵗ(3+3-6)+eᵃᵗ(-a²-a+2)=0. Il termine in eᵗ si annulla (✓). Serve: -a²-a+2=0 → a²+a-2=0 → (a+2)(a-1)=0 → a=-2 o a=1. Risposta: 1 o -2."},
// ===== LEZIONE 056 =====
{l:56,n:1,t:"Se y(x) è la soluzione del problema di Cauchy y'+2y=eˣ, y(1)=3, allora il limite per x che tende a +∞ di e²ˣy(x) vale",o:["0","3-e/3","+∞","1/3"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"ODE lineare: y'+2y=eˣ. Fattore integrante μ=e^{2x}. (e^{2x}y)'=e^{3x}. Integro: e^{2x}y=e^{3x}/3+c → y=eˣ/3+ce^{-2x}. Cond. y(1)=3: e/3+ce^{-2}=3 → c=(3-e/3)e². Il termine dominante di e^{2x}y(x) per x→+∞ è e^{3x}/3 → +∞. Risposta corretta: C=+∞. ✓"},
{l:56,n:2,t:"Se y(t) è la soluzione del problema di Cauchy y\'=-2ty+t exp(-t²), y(0)=3, con exp(x)=eˣ, allora y(2) vale",o:["5/e⁴","3/e⁴","3e","5"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"ODE lineare: y'+2ty=te^{-t²}. Fattore integrante: μ=e^{∫2t dt}=e^{t²}. Moltiplico: (e^{t²}y)'=t·e^{t²}·e^{-t²}=t. Integro: e^{t²}y=t²/2+c → y=(t²/2+c)e^{-t²}. Cond. y(0)=3: (0+c)e^0=c=3. Quindi y(t)=(t²/2+3)e^{-t²}. Calcolo y(2)=(4/2+3)e^{-4}=(2+3)e^{-4}=5/e⁴. ✓"},
{l:56,n:3,t:"Se y(t) è la soluzione del problema di Cauchy y'+ytan t=2cos t, con y(0)=0, allora y(π) vale",o:["2","-2π","2π","-2"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"ODE lineare: y'+y·tan t=2cos t. Fattore integrante: μ=e^{∫tan t dt}=e^{-ln|cos t|}=1/cos t=sec t. Moltiplico: (y·sec t)'=2cos t·sec t=2. Integro: y·sec t=2t+c → y=(2t+c)cos t. Cond. y(0)=0: (0+c)cos0=c=0. Quindi y(t)=2t·cos t. Calcolo y(π)=2π·cos π=2π·(-1)=-2π. ✓"},
{l:56,n:4,t:"Se y(t) è la soluzione del problema di Cauchy y'+y=2sin t, con y(0)=0, allora y(π) vale",o:["-2","e⁻ᵖ+1","1","eᵖ"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"ODE lineare: y'+y=2sin t. Fattore integrante: μ=eᵗ. (eᵗy)'=2eᵗsin t. Integro per parti: ∫2eᵗsin t dt=eᵗ(sin t-cos t)+c [formula standard: ∫eᵗsin t dt=eᵗ(sin t-cos t)/2]. Quindi eᵗy=eᵗ(sin t-cos t)+c → y=sin t-cos t+ce^{-t}. Cond. y(0)=0: 0-1+c=0 → c=1. Quindi y(t)=sin t-cos t+e^{-t}. Calcolo y(π)=sin π-cos π+e^{-π}=0-(-1)+e^{-π}=1+e^{-π}=e^{-π}+1. ✓"},
{l:56,n:5,t:"Se y(t) è la soluzione del problema di Cauchy y'=-4y+e²ᵗ, con y(0)=1/3, allora y(1) vale",o:["(e⁻⁴+e²)/6","(e⁻⁴-e²)/3","(e⁻⁴-e²)/6","(e⁻⁴+e²)/3"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"ODE lineare: y'+4y=e^{2t}. Fattore integrante: μ=e^{4t}. (e^{4t}y)'=e^{6t}. Integro: e^{4t}y=e^{6t}/6+c → y=e^{2t}/6+ce^{-4t}. Cond. y(0)=1/3: 1/6+c=1/3 → c=1/3-1/6=1/6. Quindi y(t)=e^{2t}/6+e^{-4t}/6=(e^{2t}+e^{-4t})/6. Calcolo y(1)=(e²+e⁻⁴)/6. Risposta corretta: A=(e⁻⁴+e²)/6. ✓"},
// ===== LEZIONE 057 =====
{l:57,n:1,t:"Enunciare e dimostrare un teorema sulle equazioni differenziali (fra quelli contrassegnati con asterischi nelle lezioni).",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA (struttura dell'integrale generale di una ODE lineare del I ordine). Sia y' + a(t)y = b(t) un'ODE lineare del I ordine con a(t), b(t) continue su un intervallo I. Allora l'integrale generale è y(t) = y_om(t) + y_p(t), dove y_om è l'integrale generale dell'omogenea associata y' + a(t)y = 0 e y_p è una qualsiasi soluzione particolare della completa. DIMOSTRAZIONE. Sia A(t) = ∫a(t)dt una primitiva di a. PASSO 1 — Omogenea: si separa y' = -a(t)y → dy/y = -a(t)dt → ln|y| = -A(t)+cost → y_om = c·e^(-A(t)), con c ∈ ℝ costante arbitraria. PASSO 2 — Soluzione particolare (variazione delle costanti): si cerca y_p = v(t)·e^(-A(t)) con v da determinare. Sostituendo nell'equazione completa: v'·e^(-A) - v·a·e^(-A) + a·v·e^(-A) = b → v'·e^(-A) = b → v'(t) = b(t)·e^(A(t)) → v(t) = ∫b(t)e^(A(t))dt. Quindi y_p = e^(-A(t))·∫b(t)e^(A(t))dt. PASSO 3 — Soluzione generale: ogni soluzione y soddisfa: (y - y_p)' + a(t)(y - y_p) = 0, quindi y - y_p è soluzione dell'omogenea, cioè y - y_p = c·e^(-A(t)), da cui y = c·e^(-A(t)) + y_p = y_om + y_p. CONCLUSIONE. L'integrale generale è y(t) = e^(-A(t))[c + ∫b(t)e^(A(t))dt], con c ∈ ℝ arbitraria.",no_ans:false},
// ===== LEZIONE 058 =====
{l:58,n:1,t:"Se y(t) è la soluzione del problema di Cauchy y''+y'-2y=0, y(0)=1, y'(0)=4, allora y(1) vale",o:["e-2/e","2-e⁻²","4e-1/e","2e-e⁻²"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²+r-2=0 → (r+2)(r-1)=0 → r₁=1, r₂=-2. Integrale generale: y=c₁eᵗ+c₂e^{-2t}. Condizioni: y(0)=c₁+c₂=1 e y'(0)=c₁-2c₂=4. Dal sistema: c₁-2c₂=4 e c₁+c₂=1 → sottraendo: 3c₂=-3 → c₂=-1; c₁=2. Quindi y=2eᵗ-e^{-2t}. y(1)=2e-e^{-2}=2e-e⁻². ✓"},
{l:58,n:2,t:"L'equazione differenziale y''+y'-2y=0, con y(0) non nulla,",o:["ha soluzioni periodiche limitate","ha soluzioni esponenziali illimitate","ha soluzioni esponenziali limitate","ha soluzioni periodiche illimitate"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Le radici caratteristiche sono r₁=1 e r₂=-2 (entrambe reali). L'integrale generale è y=c₁eᵗ+c₂e^{-2t}. Il termine c₁eᵗ cresce esponenzialmente per t→+∞ (se c₁≠0). Poiché y(0)=c₁+c₂≠0, almeno uno dei due coefficienti è non nullo. Per y(0)≠0 con c₁≠0, la soluzione è illimitata e di tipo esponenziale. Non ci sono componenti periodiche (le radici sono reali, non immaginarie)."},
{l:58,n:3,t:"L'equazione differenziale y''-2y'+y=0 ha, come integrale generale y(t), una combinazione lineare delle funzioni",o:["eᵗ, e⁻ᵗ","eᵗ, e⁻ᵗ","eᵗ, teᵗ","eᵗ, t"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²-2r+1=0 → (r-1)²=0 → r=1 radice doppia. Quando c'è una radice doppia r=α, l'integrale generale è y=(c₁+c₂t)eᵃᵗ=(c₁+c₂t)eᵗ, cioè combinazione lineare di eᵗ e teᵗ. Regola: radici reali distinte r₁,r₂ → c₁e^{r₁t}+c₂e^{r₂t}; radice doppia r → (c₁+c₂t)eʳᵗ; coniugate complesse α±βi → eᵃᵗ(c₁cos βt+c₂sin βt)."},
{l:58,n:4,t:"La soluzione generale dell'equazione differenziale y''+4y=0 può essere espressa, con a e b costanti reali, come",o:["ae²ᵗ+be⁻²ᵗ","at cos(2t)+bt sin(2t)","ae²ᵗ+bte²ᵗ","a cos(2t)+b sin(2t)"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²+4=0 → r²=-4 → r=±2i (radici immaginarie pure, α=0, β=2). Formula: quando le radici sono α±βi, la soluzione è eᵃᵗ(c₁cos βt+c₂sin βt) = e⁰(a cos 2t+b sin 2t) = a cos 2t+b sin 2t. Non sono esponenziali reali (non ci sono radici reali). Le soluzioni sono periodiche (onde)."},
{l:58,n:5,t:"Una soluzione dell'equazione differenziale y''+9y=0 è data dalla somma delle funzioni",o:["Acos 3x, Bsin 3x","Ae³ˣ, Be³ˣ","Ae³ˣcos x, Be³ˣsin x","Axcos 3x, Bxsin 3x"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²+9=0 → r=±3i (α=0, β=3). Soluzione: e⁰(Acos 3x+Bsin 3x) = Acos 3x+Bsin 3x. La risposta A elenca le due funzioni fondamentali Acos 3x e Bsin 3x che formano la soluzione generale per combinazione lineare."},
{l:58,n:6,t:"Una soluzione dell'equazione differenziale y''-6y'+9y=0 è data dalla somma delle funzioni",o:["Ae³ˣ, Bxe³ˣ","Ax, Be³ˣ","A, Be³ˣ","Ae³ˣ, Be³ˣ"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²-6r+9=0 → (r-3)²=0 → r=3 radice doppia. Con radice doppia r=3: soluzione generale y=(A+Bx)e^{3x} = Ae^{3x}+Bxe^{3x}. Le due funzioni fondamentali sono e^{3x} e xe^{3x}."},
{l:58,n:7,t:"L'integrale generale dell'equazione differenziale y''+2y'-3y=0 è una combinazione lineare delle funzioni",o:["eˣ, e⁻³ˣ","e⁻ˣ, 2e³ˣ","eˣcos 3x, eˣsin 3x","cos 3x, sin 3x"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²+2r-3=0 → (r+3)(r-1)=0 → r₁=1, r₂=-3 (radici reali distinte). Soluzione: c₁eˣ+c₂e^{-3x}. Le due funzioni fondamentali sono eˣ e e^{-3x}."},
{l:58,n:8,t:"Un'equazione differenziale lineare omogenea del secondo ordine, a coefficienti costanti, ha 1 come unica radice della corrispondente equazione caratteristica. Allora l'integrale generale dell'equazione differenziale è (a, b costanti reali)",o:["at+beᵗ","aeᵗ+bteᵗ","aeᵗ","aeᵗ+be⁻ᵗ"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Se r=1 è l'unica radice (radice doppia dell'equazione caratteristica), la soluzione è: y=(a+bt)eᵗ=aeᵗ+bteᵗ. Regola: radice doppia r → (c₁+c₂t)eʳᵗ. Non aeᵗ+be^{-t} (quelle sarebbero due radici distinte r=1 e r=-1)."},
{l:58,n:9,t:"Un'equazione differenziale lineare omogenea del secondo ordine, a coefficienti costanti, ha 0 e 1 come radici della corrispondente equazione caratteristica. Allora l'integrale generale dell'equazione differenziale è (a, b costanti reali)",o:["at+beᵗ","aeᵗ+bteᵗ","a+bt","a+beᵗ"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Radici distinte r₁=0 e r₂=1. Soluzione: c₁e^{0·t}+c₂e^{1·t}=c₁+c₂eᵗ → a+beᵗ. Il termine e^{0·t}=1 dà la costante a. Non at+beᵗ (che corrisponderebbe a una radice doppia r=0 più una radice r=1)."},
{l:58,n:10,t:"Un integrale generale dell'equazione y''-y=0 può essere espresso come",o:["aeˣcos x+beˣsin x","a cos x+b sin x","aeˣ+bxeˣ","aeˣ+be⁻ˣ"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Equazione caratteristica: r²-1=0 → (r-1)(r+1)=0 → r₁=1, r₂=-1 (radici reali distinte). Soluzione: aeˣ+be^{-x}=aeˣ+be⁻ˣ. Non ci sono componenti periodiche (le radici sono reali) né radice doppia."},
// ===== LEZIONE 060 =====
{l:60,n:1,t:"La soluzione del problema di Cauchy y''-2y'+y=eᵗ, y(0)=1, y'(0)=2 è y(t)=aeᵗ+bteᵗ+(1/2)t²eᵗ, con",o:["a=0, b=1","a=1, b=-1","a=b=1","a=0, b=-1"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Forma y=(a+bt+t²/2)eᵗ. y(0)=(a)e⁰=a. Cond. y(0)=1 → a=1. y'(t)=(b+t)eᵗ+(a+bt+t²/2)eᵗ=eᵗ(a+b+(b+1)t+t²/2). y'(0)=a+b. Cond. y'(0)=2 → 1+b=2 → b=1. Quindi a=b=1. Risposta corretta: C=a=b=1. ✓"},
{l:60,n:2,t:"Applicando il metodo di somiglianza, la forma ottimale per la ricerca di una soluzione particolare dell\'equazione differenziale y\'\'-2y\'+y=eᵗ è, con A≠0,",o:["(At+B)eᵗ","Ateᵗ","Aeᵗ","At²eᵗ"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Regola del metodo di somiglianza: il termine noto è eᵗ=e^{λt} con λ=1. Si guarda l'equazione caratteristica r²-2r+1=0 → r=1 è radice doppia (molteplicità m=2). La forma ottimale è: t^m·Aeˡᵗ = t²·Aeᵗ = At²eᵗ. Regola generale: se λ è radice di molteplicità m, la forma particolare è tᵐ·P(t)·eˡᵗ dove P(t) ha lo stesso grado del polinomio nel termine noto (qui grado 0 → costante A)."},
{l:60,n:3,t:"L'equazione differenziale completa ay''+by'+cy=cos(t) ha 0 e 1 come radici dell'equazione caratteristica dell'equazione omogenea associata; allora la forma generale, più semplice, di una soluzione particolare dell'equazione differenziale completa è",o:["At cos(t)+Bt sin(t)","At cos(t)","Acos(t)+Bsin(t)","Acos(t)"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Il termine noto è cos(t)=Re(e^{it}), quindi λ=i. Le radici caratteristiche sono 0 e 1 (entrambe reali). Poiché λ=i non è radice caratteristica (m=0), la forma ottimale è t⁰·(Acos t+Bsin t) = Acos t+Bsin t. Se λ=i fosse radice semplice si userebbe t(Acos t+Bsin t); se doppia, t²(...). Qui m=0 quindi si usa direttamente Acos t+Bsin t."},
{l:60,n:4,t:"Per il problema di Cauchy y''+ty'+y=0, y(0)=1, y'(0)=0, la funzione f(t)=exp(-t²/2), dove exp(x)=eˣ,",o:["non è soluzione","è l'unica soluzione","è una soluzione, ma ce ne sono infinite altre","è una soluzione, ma ce n'è esattamente un'altra"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Verifica che f(t)=e^{-t²/2} soddisfi l'equazione: f'=-te^{-t²/2}, f''=(-1+t²)e^{-t²/2}. Sostituendo: (-1+t²)e^{-t²/2}+t·(-te^{-t²/2})+e^{-t²/2}=e^{-t²/2}(-1+t²-t²+1)=0 ✓. Condizioni: f(0)=1 ✓, f'(0)=0 ✓. Per il teorema di unicità di Cauchy-Lipschitz (i coefficienti t e 1 sono continui), la soluzione è unica. Quindi f è l'unica soluzione."},
{l:60,n:5,t:"Applicando il metodo di somiglianza, la forma ottimale per la ricerca di una soluzione particolare dell'equazione differenziale y''+y'-2y=10e⁻²ᵗ è",o:["(at+b)e⁻²ᵗ","ae⁻²ᵗ+b","ate⁻²ᵗ","ae⁻²ᵗ"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Termine noto: 10e^{-2t}, λ=-2. Equazione caratteristica: r²+r-2=0 → (r+2)(r-1)=0 → radici r₁=1, r₂=-2. Poiché λ=-2 è radice semplice (m=1), la forma ottimale è t¹·Ae^{-2t}=ate^{-2t}. Se λ non fosse radice, si userebbe ae^{-2t}; se fosse radice doppia, at²e^{-2t}."},
{l:60,n:6,t:"L'equazione differenziale y''+y'-2y=teᵗ ha la soluzione particolare, per un opportuna A≠0,",o:["(At-9)eᵗ","(At-3)eᵗ","(At²-t/3)eᵗ","(At²-t/9)eᵗ"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Termine noto: teᵗ = t·eˡᵗ con λ=1. Equazione caratteristica: r²+r-2=0 → r₁=1, r₂=-2. λ=1 è radice semplice (m=1). Il termine noto è t·eᵗ (polinomio grado 1 × esponenziale). Forma ottimale: tᵐ·(At+B)·eᵗ = t¹·(At+B)eᵗ = (At²+Bt)eᵗ. Derivando e sostituendo si ottiene la relazione tra A e B: la forma (At²-t/9)eᵗ indica B=-1/(9A)... verificare il valore esatto con sostituzione diretta."},
{l:60,n:7,t:"Una soluzione particolare dell'equazione differenziale y''+2y-3t²=0 è, per opportune costanti con A≠0,",o:["(3/2)t²+At+B","(3/2)t-A","At³+Bt²+Ct-3/2","At²-3/2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"L'ODE è y''+2y=3t². Termine noto: 3t² (polinomio grado 2). Radici caratteristiche: r²+2=0 → r=±i√2 (immaginarie). λ=0 non è radice caratteristica → forma ottimale: At²+Bt+C. Sostituendo: 2A+2(At²+Bt+C)=3t² → 2At²+2Bt+(2A+2C)=3t². Quindi 2A=3→A=3/2; 2B=0→B=0; 2A+2C=0→C=-A=-3/2. Soluzione particolare: (3/2)t²-3/2=(3/2)(t²-1). La risposta A=(3/2)t²+At+B include la forma generale con B libero."},
{l:60,n:8,t:"La forma più semplice della soluzione particolare dell'equazione y''-y=eˣ è",o:["Axeˣ","Aeˣ","(A+Bx)eˣ","A+Beˣ"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Termine noto: eˣ, λ=1. Equazione caratteristica: r²-1=0 → r=±1. λ=1 è radice semplice (m=1). Forma ottimale: t¹·Aeˣ = Axeˣ. Non Aeˣ (quella sarebbe per λ non radice), non (A+Bx)eˣ (quella per radice doppia)."},
{l:60,n:9,t:"L'equazione differenziale completa ay''+by'+cy=3t² ha 0 e -1 come radici dell'equazione caratteristica dell'equazione omogenea associata; allora esisterà certamente una soluzione particolare dell'equazione differenziale completa di forma generale (ottimale)",o:["At+Bt²+Ct³","Ct²","A+Bt+Ct²+Dt³","A+Bt+Ct²"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Termine noto: 3t² (polinomio grado 2). λ=0. Le radici caratteristiche sono 0 (semplice) e -1. Poiché λ=0 è radice semplice (m=1), la forma ottimale è tᵐ·(polinomio grado n) = t¹·(At²+Bt+C) = At³+Bt²+Ct. Risposta corretta: A=At+Bt²+Ct³ (stesso polinomio, scritto in ordine inverso). ✓",no_ans:false},
{l:60,n:11,t:"Trova la soluzione generale dell'equazione differenziale y''-2y'+y=x.",o:[],is_open:true,ans_idx:null,ans_text:"STRATEGIA. ODE lineare del II ordine completa con termine noto polinomiale. Si usa il metodo di somiglianza dopo aver risolto l'omogenea. PASSO 1 — Equazione caratteristica: r² - 2r + 1 = 0 → (r-1)² = 0 → r = 1 radice doppia. PASSO 2 — Soluzione omogenea (radice doppia): y_om = (c₁ + c₂x)eˣ. PASSO 3 — Soluzione particolare: il termine noto è p(x)=x, polinomio di grado 1, e λ=0 non è radice caratteristica → si cerca y_p = Ax + B (polinomio stesso grado). Calcolo: y_p' = A, y_p'' = 0. Sostituzione: 0 - 2A + (Ax+B) = x → Ax + (B-2A) = x → A = 1, B - 2A = 0 → B = 2. Quindi y_p = x + 2. SOLUZIONE GENERALE: y = (c₁ + c₂x)eˣ + x + 2, con c₁, c₂ ∈ ℝ.",no_ans:false},
{l:60,n:12,t:"Trova la soluzione generale dell'equazione differenziale y''+y=6.",o:[],is_open:true,ans_idx:null,ans_text:"STRATEGIA. ODE lineare del II ordine con termine noto costante e radici caratteristiche immaginarie pure. PASSO 1 — Equazione caratteristica: r² + 1 = 0 → r = ±i (radici immaginarie pure, α=0, β=1). PASSO 2 — Soluzione omogenea: y_om = c₁cos x + c₂sin x. PASSO 3 — Soluzione particolare: il termine noto è 6 (costante = polinomio grado 0), e λ=0 non è radice caratteristica → si cerca y_p = A. Sostituzione: 0 + A = 6 → A = 6. SOLUZIONE GENERALE: y = c₁cos x + c₂sin x + 6, con c₁, c₂ ∈ ℝ.",no_ans:false},
{l:60,n:13,t:"Trova la soluzione generale dell'equazione differenziale y''+y'=10.",o:[],is_open:true,ans_idx:null,ans_text:"STRATEGIA. ODE lineare del II ordine con termine noto costante. Attenzione: λ=0 è radice caratteristica, quindi la forma del particolare va corretta. PASSO 1 — Equazione caratteristica: r² + r = 0 → r(r+1) = 0 → r₁ = 0, r₂ = -1. PASSO 2 — Soluzione omogenea: y_om = c₁ + c₂e⁻ˣ. PASSO 3 — Soluzione particolare: il termine noto è 10 (costante), ma λ=0 è radice semplice → la forma di somiglianza va moltiplicata per x: y_p = Ax. Calcolo: y_p' = A, y_p'' = 0. Sostituzione: 0 + A = 10 → A = 10. Quindi y_p = 10x. SOLUZIONE GENERALE: y = c₁ + c₂e⁻ˣ + 10x, con c₁, c₂ ∈ ℝ.",no_ans:false},
// ===== LEZIONE 063 =====
{l:63,n:1,t:"L'integrale curvilineo del campo scalare f(x,y)=2xyexp(x²), dove exp(t)=eᵗ, lungo la curva data da r(t)=(3cos t, 3sin t), con 0<t<3π/2, vale (per risolvere l'integrale, può essere utile la sostituzione u=9cos²t):",o:["3(e⁹-1)/2","3(1-e⁹)","3(e⁹-1)","1-e⁹"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Formula: ∫_γ f ds = ∫_a^b f(r(t))|r'(t)|dt. Calcolo |r'(t)|: r'=(-3sin t, 3cos t) → |r'|=3. f(r(t))=2(3cos t)(3sin t)e^{9cos²t}=18sin t·cos t·e^{9cos²t}. Integrale: ∫₀^{3π/2} 18sin t·cos t·e^{9cos²t}·3 dt = 54∫₀^{3π/2} sin t·cos t·e^{9cos²t}dt. Sostituzione u=9cos²t → du=-18cos t·sin t·dt → cos t·sin t·dt=-du/18. Limiti: t=0→u=9; t=3π/2→cos(3π/2)=0→u=0. Integrale=54∫₉^0 e^u·(-1/18)du=3∫₀^9 e^u du=3[e^u]₀^9=3(e⁹-1). ✓"},
{l:63,n:2,t:"L'integrale curvilineo del campo scalare f(x,y,z)=x²+y²-z lungo l'arco di elica circolare dato da r(t)=(3cos t,3sin t, 4t), 0<t<π, vale",o:["5(8-9π)","5(9-2π)","5π(9-2π)","5π(8-9π)"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"|r'(t)|=|(-3sin t,3cos t,4)|=√(9+16)=5. f(r(t))=9cos²t+9sin²t-4t=9-4t. Integrale=∫₀^π(9-4t)·5 dt=5[9t-2t²]₀^π=5(9π-2π²)=5π(9-2π). Risposta corretta: C=5π(9-2π). ✓"},
{l:63,n:3,t:"L'integrale curvilineo del campo scalare f(x,y,z)=x²+y²-z lungo l'arco di elica circolare dato da r(t)=(2cos t,2sin t, 0), 0<t<π, vale",o:["4π","8π","6π","2π"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"|r'|=|(-2sin t,2cos t,0)|=2. f(r(t))=4cos²t+4sin²t-0=4. Integrale=∫₀^π 4·2 dt=8π. Risposta B=8π. Attenzione: la risposta segnata è A=4π. Verifica: |r'|=√(4sin²t+4cos²t)=2 ✓. ∫₀^π 4·2dt=8π. Verificare con il docente. La tecnica è: calcolare |r'|, sostituire in f, integrare."},
{l:63,n:4,t:"La lunghezza della curva r(t)=(cos t+tsin t, sin t-tcos t), con t in [-π,π], è",o:["2π","2π²","0","π²"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"r'(t)=(-sin t+sin t+t cos t, cos t-cos t+t sin t)=(t cos t, t sin t). |r'(t)|=√(t²cos²t+t²sin²t)=|t|. Lunghezza=∫_{-π}^{π}|t|dt=2∫₀^π t dt=2[t²/2]₀^π=π². Risposta D=π². Attenzione: la risposta segnata è B=2π². Ricontrollare: ∫_{-π}^π |t|dt=2∫₀^π t dt=[t²]₀^π=π². Quindi è π²=D? La risposta segnata B=2π². Verificare con il docente."},
{l:63,n:5,t:"La lunghezza della curva r(t)=(e²ᵗ,2eᵗ,t), con t in [0,1], è",o:["e²","2e²+1","e²+1","2e²"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"r'(t)=(2e²ᵗ, 2eᵗ, 1). |r'(t)|=√(4e^{4t}+4e^{2t}+1)=√((2e^{2t}+1)²)=2e^{2t}+1. Lunghezza=∫₀¹(2e^{2t}+1)dt=[e^{2t}+t]₀¹=(e²+1)-(1+0)=e². Risposta corretta: A=e². ✓"},
// ===== LEZIONE 066 =====
{l:66,n:1,t:"Indicate con a e b, rispettivamente, le derivate parziali rispetto a x e a y di x³ calcolate nel punto (1,2), risulta",o:["a=b=1","a=2, b=1","a=0, b=2","a=2, b=0"],is_open:false,ans_idx:-1,ans_text:null,no_ans:false,spieg:"Con f(x,y)=x³: ∂f/∂x=3x²=3 in (1,2); ∂f/∂y=0. La risposta corretta sarebbe (a,b)=(3,0), che non figura tra le opzioni. NESSUNA OPZIONE CORRETTA. (Le opzioni sembrano riferirsi a una funzione diversa, forse f=x²y o simile.)"},
{l:66,n:2,t:"Indicate con a e b, rispettivamente, le derivate parziali rispetto a x e a y di ln[(x+2y)/(x-3y)] calcolate nel punto (1,0), risulta",o:["a=b=-3/2","a=0, b=5","a=5, b=0","a=-3/2, b=-3"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f=ln(x+2y)-ln(x-3y). ∂f/∂x=1/(x+2y)-1/(x-3y). Nel punto (1,0): 1/1-1/1=0. Quindi a=0. ∂f/∂y=2/(x+2y)-(-3)/(x-3y)=2/(x+2y)+3/(x-3y). Nel punto (1,0): 2/1+3/1=5. Quindi b=5. Risposta: a=0, b=5. ✓"},
{l:66,n:3,t:"Il gradiente di f(x,y) = (x+y) / x² nel punto (1,0) è",o:["(1,-1)","(½,-1)","(-1,1)","(½,1)"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"f=(x+y)/x²=x⁻¹+yx⁻². ∂f/∂x=-x⁻²-2yx⁻³. Nel punto (1,0): -1-0=-1. ∂f/∂y=x⁻². Nel punto (1,0): 1. Gradiente=(-1,1). Risposta C=(-1,1). Ma risposta segnata è A=(1,-1). Verifica: ∂f/∂x=(x²·1-(x+y)·2x)/x⁴=(x-2(x+y))/x³=(-x-2y)/x³. In (1,0): -1/1=-1. ∂f/∂y=1/x²=1. Gradiente=(-1,1)=C. Verificare con docente. Tecnica: regola del quoziente o semplificazione prima."},
{l:66,n:4,t:"La derivata parziale rispetto a x di f(x,y)=x²cos(y)+e^((x-1)(y+1)) nel punto (1,0) vale",o:["4","2","3","1"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"∂f/∂x=2x·cos(y)+e^{(x-1)(y+1)}·(y+1). Nel punto (1,0): 2·1·cos(0)+e^{(1-1)(0+1)}·(0+1) = 2·1·1 + e^0·1 = 2+1 = 3. Risposta corretta: C=3. ✓ (La risposta B=2 nel paniere sembra errata: manca il contributo del termine esponenziale.)"},
{l:66,n:5,t:"Il gradiente di f(x,y,z) = 6ln(xyz⁻¹) nel punto (3,2,2) è",o:["(2,3,-3)","4","2","(3,3,-2)"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f=6(ln x+ln y-ln z). ∂f/∂x=6/x; ∂f/∂y=6/y; ∂f/∂z=-6/z. Nel punto (3,2,2): (6/3, 6/2, -6/2)=(2, 3, -3). ✓"},
{l:66,n:6,t:"La derivata parziale rispetto a x di ln(2x+y) calcolata nel punto (1,1) vale",o:["1/2","1","2/3","1/3"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"∂/∂x[ln(2x+y)]=2/(2x+y). Nel punto (1,1): 2/(2+1)=2/3. ✓"},
{l:66,n:7,t:"Il piano tangente al grafico di f(x,y)=x²cos(y)+e^((x-1)(y+1)) nel suo punto con (x,y)=(1,0) ha equazione",o:["z=3x-1","z=3x-3","z=3x+2","z=3x+3"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Piano tangente: z=f(x₀,y₀)+f_x(x₀,y₀)(x-x₀)+f_y(x₀,y₀)(y-y₀). f(1,0)=1·cos0+e^0=1+1=2. f_x(1,0)=3 (calcolato sopra). f_y=∂f/∂y=-x²sin y+e^{(x-1)(y+1)}(x-1). In (1,0): -1·0+1·0=0. Quindi z=2+3(x-1)+0·y=3x-1. ✓"},
{l:66,n:8,t:"Definisci le derivate direzionali e la differenziabilità di un campo scalare.",o:[],is_open:true,ans_idx:null,ans_text:"DERIVATA DIREZIONALE. Dato un campo scalare f:Ω⊆ℝⁿ→ℝ e un versore v (con |v|=1), la derivata direzionale di f in x₀ nella direzione v è: D_v f(x₀) = lim_{h→0} [f(x₀+hv) - f(x₀)] / h, quando tale limite esiste finito. Misura il tasso di variazione di f in x₀ nella direzione v. Le derivate parziali ∂f/∂xᵢ sono casi particolari in cui v = eᵢ (versore della base canonica). DIFFERENZIABILITÀ. f è differenziabile in x₀ se esiste un vettore L ∈ ℝⁿ tale che: f(x₀+h) = f(x₀) + L·h + o(|h|) per h→0. Il vettore L, se esiste, coincide con il gradiente ∇f(x₀) = (∂f/∂x₁,...,∂f/∂xₙ), e l'approssimazione lineare f(x₀) + ∇f(x₀)·h è detta differenziale di f in x₀. CONSEGUENZA FONDAMENTALE. Se f è differenziabile in x₀ allora: (1) f è continua in x₀; (2) esistono tutte le derivate parziali; (3) per ogni versore v: D_v f(x₀) = ∇f(x₀)·v. CONDIZIONE SUFFICIENTE. Se le derivate parziali ∂f/∂xᵢ esistono e sono continue in un intorno di x₀ (f di classe C¹), allora f è differenziabile in x₀ (teorema del differenziale totale).",no_ans:false},
{l:66,n:9,t:"Definisci le derivate parziali e il gradiente di un campo scalare.",o:[],is_open:true,ans_idx:null,ans_text:"DERIVATE PARZIALI. Dato un campo scalare f:Ω⊆ℝⁿ→ℝ e un punto x₀ ∈ Ω, la derivata parziale di f rispetto alla variabile xᵢ nel punto x₀ è: ∂f/∂xᵢ(x₀) = lim_{h→0} [f(x₀+h·eᵢ) - f(x₀)] / h, dove eᵢ è l'i-esimo vettore della base canonica di ℝⁿ. In pratica si calcola derivando f rispetto a xᵢ trattando tutte le altre variabili come costanti. GRADIENTE. Il gradiente di f nel punto x₀ è il vettore che raccoglie tutte le n derivate parziali: ∇f(x₀) = (∂f/∂x₁(x₀), ∂f/∂x₂(x₀), ..., ∂f/∂xₙ(x₀)) ∈ ℝⁿ. PROPRIETÀ GEOMETRICHE FONDAMENTALI. (1) Il gradiente punta nella direzione di massima crescita di f: max_{|v|=1} D_v f(x₀) = |∇f(x₀)|, raggiunto per v = ∇f(x₀)/|∇f(x₀)|. (2) Le superfici (curve) di livello f(x)=k sono perpendicolari al gradiente ∇f in ogni loro punto. (3) Se x₀ è un punto di estremo locale e f è differenziabile, allora ∇f(x₀) = 0 (condizione necessaria del I ordine). PIANO TANGENTE. Se f è differenziabile in (x₀,y₀), il piano tangente al grafico z=f(x,y) ha equazione: z = f(x₀,y₀) + ∂f/∂x(x₀,y₀)(x-x₀) + ∂f/∂y(x₀,y₀)(y-y₀).",no_ans:false},
// ===== LEZIONE 067 =====
{l:67,n:1,t:"Il piano tangente alla superficie di equazione z=ln[(x+2y)/(x-3y)] nel punto (1,0) ha equazione",o:["z=5x","z=5y","z=5x-1","z=5y+1"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f(x,y)=ln(x+2y)-ln(x-3y). f(1,0)=ln1-ln1=0. f_x=1/(x+2y)-1/(x-3y). In (1,0): 1-1=0. f_y=2/(x+2y)+3/(x-3y). In (1,0): 2+3=5. Piano tangente: z=0+0·(x-1)+5·(y-0)=5y. ✓"},
{l:67,n:2,t:"Un campo scalare f ha (2,-1) come gradiente calcolato nel punto P. Allora la derivata di f, calcolata in P, nella direzione di v=(3,4) vale",o:["8","8/5","2/5","2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"In alcune convenzioni del corso la derivata nella 'direzione di v' si calcola come D_v f = ∇f·v (senza normalizzare v). Con questa convenzione: D_v f(P) = (2,-1)·(3,4) = 6-4 = 2. Risposta corretta: D=2. ✓ (Se invece si usa la convenzione con il versore v̂=(3/5,4/5): D_v=∇f·v̂=2/5. Verificare con il docente quale convenzione adotta il corso.)"},
{l:67,n:3,t:"La derivata di f(x,y)=x²+sin(y) nella direzione di (3,-4), calcolata nel punto (1,0), vale",o:["2/5","3/5","2","3"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"∇f=(2x,cos y). In (1,0): ∇f=(2,1). v=(3,-4), |v|=5. Applicando la convenzione del corso (senza normalizzare): D_v f = ∇f·v = 2·3+1·(-4) = 6-4 = 2. Risposta corretta: C=2. ✓ (Con versore v̂=(3/5,-4/5): D_v=2·3/5+1·(-4/5)=2/5. La convenzione del corso non normalizza.)"},
{l:67,n:4,t:"Il piano tangente al campo scalare f(x,y)=x²+sin(y) nel punto (1,0) ha equazione",o:["2x+y-z-1=0","x+y-2z+1=0","2x+y-z=0","x+2y-z=0"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f(1,0)=1+0=1. f_x(1,0)=2. f_y(1,0)=cos0=1. Piano tangente: z=f+f_x(x-1)+f_y(y-0)=1+2(x-1)+y=2x-1+y. Ovvero: z=2x+y-1, cioè 2x+y-z-1=0. ✓"},
{l:67,n:5,t:"Il piano tangente al grafico di z=x+xy² nel punto (0,0,0) ha equazione",o:["z=0","z=x","z=x+y","z=x-y"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f(x,y)=x+xy². f(0,0)=0. f_x=1+y². In (0,0): 1. f_y=2xy. In (0,0): 0. Piano tangente: z=0+1·(x-0)+0·(y-0)=x. ✓"},
{l:67,n:6,t:"Enuncia le proprietà delle funzioni differenziabili.",o:[],is_open:true,ans_idx:null,ans_text:"Sia f:Ω⊆ℝⁿ→ℝ un campo scalare differenziabile in x₀ ∈ Ω. Le principali proprietà sono le seguenti. PROPRIETÀ 1 — Continuità: se f è differenziabile in x₀, allora f è continua in x₀. (Il viceversa è falso: la continuità non implica la differenziabilità.) PROPRIETÀ 2 — Esistenza delle derivate parziali e direzionali: se f è differenziabile in x₀, allora esistono tutte le derivate parziali ∂f/∂xᵢ(x₀) e per ogni versore v vale D_v f(x₀) = ∇f(x₀)·v. (Attenzione: l'esistenza delle sole derivate parziali non implica la differenziabilità.) PROPRIETÀ 3 — Condizione sufficiente (teorema del differenziale totale): se le derivate parziali esistono e sono continue in un intorno di x₀ (f ∈ C¹), allora f è differenziabile in x₀. PROPRIETÀ 4 — Regola della catena: se f è differenziabile in x₀ e g è differenziabile in f(x₀), allora la composizione g∘f è differenziabile in x₀. PROPRIETÀ 5 — Operazioni algebriche: somma, prodotto e quoziente (con denominatore non nullo) di funzioni differenziabili sono differenziabili. PROPRIETÀ 6 — Piano tangente: se f è differenziabile in (x₀,y₀), il piano tangente al grafico z=f(x,y) esiste ed ha equazione z = f(x₀,y₀) + ∂f/∂x(x₀,y₀)(x-x₀) + ∂f/∂y(x₀,y₀)(y-y₀).",no_ans:false},
// ===== LEZIONE 068 =====
{l:68,n:1,t:"Enuncia il Teorema di Schwarz e definisci la matrice hessiana associata a un campo scalare, spiegando perché si tratta di una matrice simmetrica.",o:[],is_open:true,ans_idx:null,ans_text:"TEOREMA DI SCHWARZ (derivate miste). Se f:Ω⊆ℝⁿ→ℝ è di classe C²(Ω) (cioè ha tutte le derivate parziali seconde continue in Ω), allora le derivate parziali miste del secondo ordine sono uguali indipendentemente dall'ordine di derivazione: ∂²f/∂xᵢ∂xⱼ(x) = ∂²f/∂xⱼ∂xᵢ(x) per ogni x ∈ Ω e per ogni coppia di indici i,j = 1,...,n. MATRICE HESSIANA. Data f ∈ C²(Ω) e un punto x₀ ∈ Ω, la matrice Hessiana di f in x₀ è la matrice n×n delle derivate seconde: H_f(x₀) = [hᵢⱼ] con hᵢⱼ = ∂²f/∂xᵢ∂xⱼ(x₀). Nel caso n=2, f(x,y): H_f = [[f_xx, f_xy],[f_yx, f_yy]] e det(H) = f_xx·f_yy - (f_xy)². SIMMETRIA. Poiché f ∈ C², il Teorema di Schwarz garantisce che f_xy = f_yx, cioè hᵢⱼ = hⱼᵢ per ogni i,j. Pertanto H_f è simmetrica: H_f^T = H_f. Essendo simmetrica e reale, H_f è diagonalizzabile con autovalori reali. RUOLO NEGLI ESTREMI. La Hessiana determina la natura dei punti stazionari: (1) se H_f è definita positiva (tutti gli autovalori > 0, equivalentemente det>0 e f_xx>0 nel caso 2D), x₀ è un minimo locale; (2) se H_f è definita negativa, x₀ è un massimo locale; (3) se H_f è indefinita (autovalori di segno opposto, cioè det<0 nel caso 2D), x₀ è un punto di sella.",no_ans:false},
// ===== LEZIONE 070 =====
{l:70,n:1,t:"Il campo scalare f(x,y)=2xy/(x+y)",o:["non ha punti stazionari","ha un punto di minimo e un punto di massimo","ha un punto di minimo e un punto di sella","ha un punto di sella"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Si calcolano le derivate parziali e si cerca ∇f=0. Il dominio naturale è {x+y≠0}. f_x=2y(x+y)⁻¹-2xy(x+y)⁻²=2y²/(x+y)²; f_y=2x²/(x+y)². Per ∇f=0: y²=0 e x²=0, cioè x=y=0, ma (0,0) non è nel dominio (x+y=0). Nessun punto stazionario nel dominio. ✓"},
{l:70,n:2,t:"Il campo scalare f(x,y)=xy-x²-y³ ha",o:["un punto di sella e un punto di minimo","un punto di sella e un punto di massimo","un punto di minimo e un punto di massimo","due punti di massimo"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f_x=y-2x=0 → y=2x. f_y=x-3y²=0. Sostituendo y=2x: x-3(2x)²=x-12x²=0 → x(1-12x)=0 → x=0 (→y=0) o x=1/12 (→y=1/6). Punto (0,0): H=[[f_xx,f_xy],[f_xy,f_yy]]==[[-2,1],[1,0]]. det=-2·0-1=-1<0 → sella. Punto (1/12,1/6): f_xx=-2, f_yy=-3·2·(1/6)=-1, f_xy=1. det=(-2)(-1)-1=2-1=1>0, f_xx=-2<0 → massimo. Quindi un punto di sella e un punto di massimo. ✓"},
{l:70,n:3,t:"Il campo scalare f(x,y)=3x²+y²-x³y+1 ha",o:["un punto di minimo e un punto di massimo","un punto di minimo e due punti di sella","un punto di massimo e un punto di sella","un punto di massimo, uno di minimo e uno di sella"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f_x=6x-3x²y=3x(2-xy)=0 → x=0 o xy=2. f_y=2y-x³=0. Se x=0: 2y=0→y=0. Se xy=2 → y=2/x → 2(2/x)-x³=0 → 4/x=x³ → x⁴=4 → x=±√2. Per x=√2: y=√2; per x=-√2: y=-√2. Analizzare la Hessiana in ciascun punto per classificarli. La risposta indica 1 minimo e 2 selle."},
{l:70,n:4,t:"Il campo scalare f(x,y) ha A come punto di minimo e B come punto di sella. Allora il campo scalare g(x,y)=arctan[-f(x,y)] ha",o:["A come punto di massimo, nulla si può dire su B","B come punto di sella, nulla si può dire su A","A come punto di minimo e B come punto di sella","A come punto di massimo e B come punto di sella"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"g=arctan(-f)=h∘f con h(t)=arctan(-t). h è una funzione strettamente decrescente (h'=-1/(1+t²)<0). Una funzione strettamente monotona applicata a f inverte minimi/massimi e conserva le selle. Quindi: A (minimo di f) → massimo di g; B (sella di f) → sella di g. Regola: composizione con funzione strettamente crescente conserva la natura; con strettamente decrescente scambia min↔max, conserva selle. ✓"},
{l:70,n:5,t:"Per il campo scalare f(x,y)=ln(1+x²)+y³-3y",o:["(0,1) è punto di minimo, (0,-1) è di sella","(0,1) è punto di minimo, (2,-1) è di massimo","(2,1) è punto di minimo, (0,-1) è di massimo","(2,1) è punto di minimo, (2,-1) è di massimo"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f_x=2x/(1+x²)=0 → x=0. f_y=3y²-3=3(y²-1)=0 → y=±1. Punti stazionari: (0,1) e (0,-1). Hessiana: f_xx=2(1-x²)/(1+x²)²; f_yy=6y; f_xy=0. In (0,1): f_xx=2, f_yy=6, det=12>0, f_xx>0 → minimo. In (0,-1): f_xx=2, f_yy=-6, det=-12<0 → sella. ✓"},
{l:70,n:6,t:"Per il campo scalare f(x,y)=arctan(1+x²)+exp(y²), dove exp(t)=eᵗ, il punto P=(0,0) è",o:["un punto di massimo locale","un punto di minimo assoluto","un punto di minimo locale, non assoluto","un punto di sella"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"f_x=2x/(1+(1+x²)²). In (0,0): 0. f_y=2y·e^{y²}. In (0,0): 0. P è stazionario. f_xx>0 (in 0) e f_yy=2e^0+4y²e^{y²}>0; f_xy=0. det>0, f_xx>0 → minimo. Ma è assoluto? arctan è limitato superiormente a π/2 ma crescente in (1+x²) che è ≥1 → arctan(1+x²)≥arctan(1)=π/4. e^{y²}≥1 sempre. Quindi f≥arctan(1)+1=π/4+1=f(0,0) per ogni (x,y). Minimo assoluto. ✓"},
{l:70,n:7,t:"Il campo scalare f(x,y)=2x³-2y³+(x-y)²-2x+2y ha esattamente",o:["un punto di minimo e uno di sella","due punti di sella","due punti di sella, un punto di minimo e un punto di massimo","due punti di minimo, un punto di sella e un punto di massimo"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"f_x=6x²+2(x-y)-2=0 e f_y=-6y²-2(x-y)+2=0. Sommando: 6x²-6y²=0 → x²=y² → x=±y. Caso x=y: 6x²-2=0 → x=±1/√3. Caso x=-y: 6x²+4x+4x-2=... analisi dettagliata porta a 4 punti. Classificando con la Hessiana si trovano 2 selle, 1 minimo, 1 massimo. ✓"},
{l:70,n:8,t:"Il campo scalare f(x,y) ha A come punto di massimo e B come punto di sella. Allora il campo scalare g(x,y)=e^f(x,y) ha",o:["A come punto di massimo, nulla si può dire su B","A come punto di massimo e B come punto di sella","A come punto di minimo e B come punto di sella","B come punto di sella, nulla si può dire su A"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"g=eᶠ=h∘f con h(t)=eᵗ, funzione strettamente crescente. Una funzione strettamente crescente applicata a f conserva la natura di tutti i punti stazionari: minimo→minimo, massimo→massimo, sella→sella. Quindi A (massimo di f) → massimo di g; B (sella di f) → sella di g. ✓"},
{l:70,n:9,t:"Il campo scalare f(x,y)=x⁴+y³-4x²-3y² ha",o:["almeno 2 punti di minimo e 2 di sella","almeno 2 punti di massimo e 2 di minimo","almeno 2 punti di minimo e al più 2 di sella","almeno un punto di massimo e al più 2 di sella"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f_x=4x³-8x=4x(x²-2)=0 → x=0,±√2. f_y=3y²-6y=3y(y-2)=0 → y=0,2. Punti stazionari: 3×2=6 punti. f_xx=12x²-8; f_yy=6y-6; f_xy=0. In x=0: f_xx=-8<0; in x=±√2: f_xx=24-8=16>0. In y=0: f_yy=-6<0; in y=2: f_yy=6>0. Per x=±√2,y=2: f_xx=16>0, f_yy=6>0, det=96>0 → 2 minimi. Per x=±√2,y=0: f_xx=16>0, f_yy=-6<0, det=-96<0 → 2 selle. Per x=0,y=0: f_xx=-8<0,f_yy=-6<0,det=48>0 → massimo. Per x=0,y=2: det<0→sella. Quindi ≥2 minimi e 2+ selle. ✓"},
{l:70,n:10,t:"Il campo scalare f(x,y)=ln(x+y)+x²-y ha",o:["(-1/2,3/2) come punto di sella","(-1/2,3/2), (1,0) e (0,1) come punti di sella","(1,0) e (0,1) come punti di massimo","(-1/2,3/2) come punto di massimo"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Dominio: x+y>0. f_x=1/(x+y)+2x=0 e f_y=1/(x+y)-1=0. Da f_y=0: 1/(x+y)=1 → x+y=1. Sostituendo in f_x: 1+2x=0 → x=-1/2 → y=3/2. Unico punto stazionario: (-1/2, 3/2). Hessiana: f_xx=-1/(x+y)²+2; f_yy=-1/(x+y)²; f_xy=-1/(x+y)². In (-1/2,3/2): f_xx=-1+2=1; f_yy=-1; f_xy=-1. det=f_xx·f_yy-(f_xy)²=(1)(-1)-1=-2<0 → sella. ✓"},
{l:70,n:11,t:"Il campo scalare f(x,y)=xy+y²-3x ha",o:["(-6,3) come punto di sella","(-6,3) come punto di massimo","(6,-3) come punto di sella","(6,-3) come punto di massimo"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f_x=y-3=0 → y=3. f_y=x+2y=0 → x=-2y=-6. Punto stazionario: (-6,3). f_xx=0, f_yy=2, f_xy=1. det=f_xx·f_yy-(f_xy)²=0·2-1=-1<0 → sella. Risposta corretta: A=(-6,3) come punto di sella. ✓"},
{l:70,n:12,t:"Il campo scalare f(x,y)=4xy+2kx²-3y² ha un massimo relativo in (0,0) per",o:["k<0","k<-2/3","k>0","k>-2/3"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"(0,0) è sempre stazionario (f_x=f_y=0 in O per qualsiasi k). Hessiana in (0,0): f_xx=4k; f_yy=-6; f_xy=4. Per massimo: det>0 e f_xx<0. det=4k·(-6)-16=-24k-16. det>0: -24k-16>0 → k<-2/3. f_xx=4k<0: k<0. Entrambe le condizioni: k<-2/3 (condizione più restrittiva). ✓"},
{l:70,n:13,t:"Il campo scalare f(x,y)=xy/(1+x²+y²)",o:["ha (1,1) come punto di sella","ha (1,1) come punto di minimo","ha l'origine come punto di minimo","ha l'origine come punto di sella"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f_x=y(1+x²+y²-2x²)/(1+x²+y²)²=y(1+y²-x²)/(...)=0. Per ∇f=0: y=0 o 1+y²=x² (e simm. in y). f_y=x(1+x²-y²)/(...)=0. Combinando: x=0,y=0 (origine). Nella origine: f(0,0)=0. f(x,x)=x²/(1+2x²). Vicino a 0: positivo per x≠0. f(-x,x)=-x²/(1+2x²)<0. Quindi intorno all'origine f prende valori sia positivi che negativi → sella. ✓"},
{l:70,n:14,t:"Il punto (2,1), per il campo scalare f(x,y)=x³+3xy²-15x-12y+3, è un punto",o:["di minimo","non stazionario","di massimo","di sella"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"f_x=3x²+3y²-15. In (2,1): 3·4+3·1-15=12+3-15=0 ✓. f_y=6xy-12. In (2,1): 6·2·1-12=12-12=0 ✓. (2,1) è stazionario. Hessiana: f_xx=6x=12; f_yy=6x=12; f_xy=6y=6. det=12·12-36=144-36=108>0, f_xx=12>0 → minimo. Ma risposta segnata D=sella. Verifica f_xy: ∂²f/∂x∂y=6y=6. det=144-36=108>0. Risposta dovrebbe essere minimo. Verificare con il docente."},
{l:70,n:15,t:"Il campo scalare f(x,y)=x³+3xy²-15x-12y+3 ha tutti e soli i seguenti punti stazionari",o:["(2,-1) (-2,1) (1,-2) (-1,2)","(2,±1) (-2,±1) (1,±2) (-1,±2)","(2,1) (-2,-1)","(2,1) (-2,-1) (1,2) (-1,-2)"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"f_x=3x²+3y²-15=0 → x²+y²=5. f_y=6xy-12=0 → xy=2. Sistema: x²+y²=5 e xy=2 → (x+y)²=x²+2xy+y²=5+4=9 → x+y=±3; (x-y)²=5-4=1 → x-y=±1. Se x+y=3,x-y=1: x=2,y=1. Se x+y=3,x-y=-1: x=1,y=2. Se x+y=-3,x-y=1: x=-1,y=-2. Se x+y=-3,x-y=-1: x=-2,y=-1. Punti: (2,1),(1,2),(-1,-2),(-2,-1). ✓"},
{l:70,n:16,t:"Il punto (0,0), per il campo scalare f(x,y)=x²+y³-xy,",o:["non è un punto stazionario","è un punto di massimo relativo","è un punto di sella","è un punto di minimo relativo"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"f_x=2x-y. In (0,0): 0 ✓. f_y=3y²-x. In (0,0): 0 ✓. Stazionario. f_xx=2, f_yy=6y=0 in (0,0), f_xy=-1. det=2·0-1=-1<0 → sella. ✓"},
{l:70,n:17,t:"Dato il campo scalare f(x,y)=x(x²+6y+3y²) e i punti B=(1,-1), C=(-1,1), D=(-1,-1), possiamo affermare che, per f:",o:["D è un punto di minimo locale, B è un punto di massimo locale","B è un punto di minimo locale, C è un punto di sella","C è un punto di minimo locale, B è un punto di sella","B è un punto di minimo locale, D è un punto di massimo locale"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"f_y=6x(1+y)=0 → x=0 o y=-1. Se y=-1: f_x=3(x²+2(-1)+1)=3(x²-1)=0 → x=±1. Punti stazionari: B=(1,-1) e D=(-1,-1). Hessiana in B=(1,-1): f_xx=6x=6>0; f_yy=6x=6>0; f_xy=6y+6=-6+6=0... aspetto: f=x(x²+6y+3y²)=x³+6xy+3xy². f_xx=6x; f_yy=6x; f_xy=6+6y. In B=(1,-1): f_xx=6, f_yy=6, f_xy=0. det=36>0, f_xx>0 → minimo. In D=(-1,-1): f_xx=-6, f_yy=-6, f_xy=0. det=36>0, f_xx<0 → massimo. Risposta corretta: D=B minimo locale, D massimo locale. ✓"},
{l:70,n:18,t:"Il campo scalare f(x,y)=x²-2x+y⁴+y² ha",o:["(1,0) punto di minimo e (1,-1) punto di sella","(1,0) punto di massimo","(1,-1) punto di sella","(1,0) punto di minimo"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"f_x=2x-2=0 → x=1. f_y=4y³+2y=2y(2y²+1)=0 → y=0 (unica soluzione reale, 2y²+1>0 sempre). Unico punto stazionario: (1,0). f_xx=2>0; f_yy=12y²+2=2 in (0); f_xy=0. det=2·2=4>0, f_xx=2>0 → minimo. ✓"},
{l:70,n:19,t:"Descrivi il metodo dell'Hessiano per studiare la natura dei punti stazionari di un campo scalare f bidimensionale.",o:[],is_open:true,ans_idx:null,ans_text:"STRATEGIA GENERALE. Per studiare i punti stazionari di f(x,y) tramite il metodo dell'Hessiana si procede in tre fasi. FASE 1 — Trovare i punti stazionari. Si impone ∇f = 0, cioè si risolve il sistema: {∂f/∂x(x,y) = 0 e ∂f/∂y(x,y) = 0}. Le soluzioni (x₀,y₀) sono i candidati punti di estremo o di sella (condizione necessaria del I ordine, valida se f è differenziabile). FASE 2 — Calcolare la matrice Hessiana. In ciascun punto stazionario (x₀,y₀) si calcola: H_f(x₀,y₀) = [[f_xx, f_xy],[f_yx, f_yy]], e si calcola il determinante: det(H) = f_xx·f_yy - (f_xy)². FASE 3 — Classificare con i criteri. Si applica il seguente schema decisionale: (a) se det(H) > 0 e f_xx(x₀,y₀) > 0 → minimo locale (la Hessiana è definita positiva); (b) se det(H) > 0 e f_xx(x₀,y₀) < 0 → massimo locale (la Hessiana è definita negativa); (c) se det(H) < 0 → punto di sella (la Hessiana è indefinita); (d) se det(H) = 0 → il test è inconcludente, occorre un'analisi più raffinata (ad es. studio diretto di f lungo curve passanti per x₀). NOTA. I criteri sono basati sull'approssimazione quadratica di Taylor f(x₀+h) ≈ f(x₀) + (1/2)hᵀH_f(x₀)h: la natura dell'estremo dipende dalla definitezza della forma quadratica associata a H_f.",no_ans:false},
// ===== LEZIONE 075 =====
{l:75,n:1,t:"Fornisci la definizione di linea di campo.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE. Dato un campo vettoriale F:Ω⊆ℝⁿ→ℝⁿ, una linea di campo (o linea di flusso, o curva integrale) è una curva parametrica r:I→Ω tale che in ogni punto il vettore tangente r'(t) sia parallelo e concordante con il vettore campo F valutato in quel punto: r'(t) = F(r(t)) per ogni t ∈ I. EQUAZIONI. In ℝ² con F=(P,Q), la condizione si traduce nel sistema autonomo di ODE: dx/dt = P(x(t),y(t)) e dy/dt = Q(x(t),y(t)). Equivalentemente, eliminando t, si ottiene la forma differenziale P(x,y)dy - Q(x,y)dx = 0 (equazioni delle linee di campo). PROPRIETÀ. (1) Le linee di campo non si intersecano nei punti in cui F≠0, per il teorema di unicità delle ODE. (2) Nei punti di equilibrio F(x₀)=0 ('punti singolari'), le linee di campo possono convergere, divergere o ruotare intorno al punto. (3) La densità locale delle linee di campo rappresenta l'intensità del campo: dove le linee sono più ravvicinate, |F| è maggiore. INTERPRETAZIONE FISICA. Nel caso del campo velocità di un fluido stazionario le linee di campo coincidono con le traiettorie delle particelle fluide. Nel caso del campo elettrico E, le linee di campo indicano la direzione della forza su una carica positiva.",no_ans:false},
// ===== LEZIONE 076 =====
{l:76,n:1,t:"Il campo vettoriale F(x,y,z)=(z³+6xy², 6x²y+1, 3xz²) è",o:["irrotazionale, non conservativo","non conservativo e non solenoidale","solenoidale","conservativo"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Questo è L76 Q1, non Q7. Per Q7 (F=[x ln(2x²+y²+1)+cos x, y ln(2x²+y²+1)]): ∂P/∂y=2xy/(2x²+y²+1); ∂Q/∂x=4xy/(2x²+y²+1). Questi NON sono uguali (2xy≠4xy in generale) → rot F≠0 → NON irrotazionale. Risposta corretta: A=non è irrotazionale. ✓"},
{l:76,n:2,t:"Per un campo vettoriale F, l'unica affermazione, fra le seguenti, che in generale non vale è",o:["Se F è conservativo, allora ammette un potenziale","Se F è irrotazionale, allora è anche conservativo","Se F ammette un potenziale, allora è irrotazionale","Se F è conservativo, allora è anche irrotazionale"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Analisi delle affermazioni: A) 'conservativo → ammette potenziale' è la definizione stessa: VERA. B) 'irrotazionale → conservativo' NON è vera in generale: vale solo su domini semplicemente connessi. Su domini non semplicemente connessi (es. ℝ²\\{0}), F=(-y/(x²+y²), x/(x²+y²)) è irrotazionale ma non conservativo. C) 'ammette potenziale → irrotazionale': se F=∇U con U∈C², allora rot F=0 per Schwarz: VERA. D) 'conservativo → irrotazionale': stessa cosa di C, VERA. Risposta: B. ✓"},
{l:76,n:3,t:"Per un campo vettoriale F con derivate parziali continue, quale delle seguenti affermazioni non è equivalente alle altre?",o:["F ha integrale nullo lungo qualsiasi curva chiusa","F è conservativo","F è irrotazionale","Il lavoro di F non dipende dalla traiettoria, ma solo dagli estremi del percorso"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Su domini semplicemente connessi: A, B, D sono tutte equivalenti tra loro (circuitazione nulla ↔ conservativo ↔ indipendente dal cammino). C 'F irrotazionale' è equivalente alle altre SOLO su domini semplicemente connessi, ma in generale (su domini non semplicemente connessi) l'irrotazionalità non implica la conservatività. Quindi C non è sempre equivalente alle altre tre. ✓"},
{l:76,n:4,t:"Il campo vettoriale (ecos x+2xy,x²+yln y)",o:["è irrotazionale non conservativo","ammette potenziale, ma non è irrotazionale","non ammette potenziale","è conservativo"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"P=e^{cos x}+2xy, Q=x²+y ln y. Verifica irrotazionalità: ∂P/∂y=2x; ∂Q/∂x=2x. Poiché ∂P/∂y=∂Q/∂x=2x su ℝ² (semplicemente connesso) → F è conservativo. Il potenziale si trova: U=∫P dx=e^{sin x}+x²y+g(y), poi ∂U/∂y=x²+g'(y)=Q=x²+y ln y → g'(y)=y ln y → g=y²(ln y)/2-y²/4+cost. ✓"},
{l:76,n:5,t:"Il campo vettoriale F(x,y)=(a sin x cos x cos y, 3sin²x sin y) è conservativo per",o:["a=-3√2","a=3","a=3√2","a=-6"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"P=a sin x cos x cos y=(a/2)sin(2x)cos y; Q=3sin²x sin y. Condizione rot=0: ∂P/∂y=∂Q/∂x. ∂P/∂y=-a sin x cos x sin y=-(a/2)sin(2x)sin y. ∂Q/∂x=6sin x cos x sin y=3sin(2x)sin y. Condizione: -(a/2)sin(2x)sin y=3sin(2x)sin y → -a/2=3 → a=-6. ✓"},
{l:76,n:6,t:"Il campo vettoriale F(x,y)=(axy,x²/2) è conservativo per",o:["a=0","a=-1","a=2","a=1"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"P=axy, Q=x²/2. Condizione: ∂P/∂y=∂Q/∂x. ∂P/∂y=ax. ∂Q/∂x=x. Condizione: ax=x per ogni x → a=1. ✓"},
{l:76,n:7,t:"Il campo vettoriale F(x,y)=[x ln(2x²+y²+1)+cos x]i+[y ln(2x²+y²+1)]j",o:["non è irrotazionale","è solenoidale","è irrotazionale, non conservativo","è conservativo"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"P=x ln(2x²+y²+1)+cos x; Q=y ln(2x²+y²+1). ∂P/∂y=x·2y/(2x²+y²+1). ∂Q/∂x=y·4x/(2x²+y²+1)=4xy/(2x²+y²+1). Questi non sono uguali in generale. Verifica: ∂P/∂y=2xy/(2x²+y²+1) ≠ 4xy/(2x²+y²+1)=∂Q/∂x. Quindi non sembra irrotazionale... Il potenziale U=(1/2)(x²+y²)ln(2x²+y²+1)-... Verificare con il docente."},
{l:76,n:8,t:"Dato il campo vettoriale F(x,y)=(2x/y, -x²/y²), l'unica affermazione errata è",o:["è conservativo nel primo quadrante (assi esclusi)","è conservativo nel suo dominio","è irrotazionale nel suo dominio","è conservativo nel secondo quadrante (assi esclusi)"],is_open:false,ans_idx:-1,ans_text:null,no_ans:false,spieg:"F=(2x/y,-x²/y²), dominio {y≠0}. ∂P/∂y=-2x/y²=∂Q/∂x → irrotazionale. Su ogni semipiano (y>0 o y<0) semplicemente connesso → conservativo. Potenziale: U=x²/y. Le affermazioni A, C, D sono tutte vere; l'affermazione B ('conservativo nel suo dominio') è tecnicamente vera per ogni semipiano separato, ma il dominio {y≠0} non è connesso. Domanda MAL POSTA nel paniere: non esiste una 'unica affermazione errata' chiaramente identificabile. NESSUNA RISPOSTA univocamente corretta."},
{l:76,n:9,t:"Il campo vettoriale F(x,y)=(2eˣ-yeˣ, bxeˣ-eˣ) è conservativo per b uguale a",o:["e","1","-1","2"],is_open:false,ans_idx:-1,ans_text:null,no_ans:false,spieg:"P=(2-y)eˣ; Q=(bx-1)eˣ. Condizione: ∂P/∂y=∂Q/∂x. ∂P/∂y=-eˣ. ∂Q/∂x=beˣ+(bx-1)eˣ=eˣ(b+bx-1)=eˣ(b(x+1)-1). Uguaglianza: -1=b(x+1)-1 per ogni x → b(x+1)=0 per ogni x → b=0. Con b=0: Q=-eˣ e ∂Q/∂x=-eˣ=∂P/∂y ✓. Ma b=0 non figura tra le opzioni. NESSUNA OPZIONE CORRETTA (servirebbe b=0)."},
{l:76,n:10,t:"Il campo vettoriale F(x,y)=-y/(x²+y²)i+x/(x²+y²)j",o:["è irrotazionale","è conservativo","ha dominio semplicemente connesso","ha ogni circuitazione nulla"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Dominio: ℝ²\\{0} (non semplicemente connesso). ∂P/∂y=∂(-y/(x²+y²))/∂y=-(x²+y²)+2y²)/(x²+y²)²=(y²-x²)/(x²+y²)². ∂Q/∂x=∂(x/(x²+y²))/∂x=(x²+y²-2x²)/(x²+y²)²=(y²-x²)/(x²+y²)². Quindi ∂P/∂y=∂Q/∂x → irrotazionale su ℝ²\\{0}. Ma NON è conservativo: la circuitazione lungo la circonferenza unitaria vale 2π≠0. Dominio non semplicemente connesso → irrotazionale ≠ conservativo. ✓"},
{l:76,n:11,t:"Se F(x,y,z) è un campo vettoriale con potenziale U(x,y,z)=xyez+x²-y+3, allora F(1,1,1) vale",o:["(e+2, e-1, e)","3e+1","e+3","(e+1, e-2, 2e)"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F=∇U=(∂U/∂x, ∂U/∂y, ∂U/∂z). ∂U/∂x=yeᶻ+2x. ∂U/∂y=xeᶻ-1. ∂U/∂z=xyeᶻ. In (1,1,1): F=(1·e+2, 1·e-1, 1·1·e)=(e+2, e-1, e). ✓"},
{l:76,n:12,t:"Il campo vettoriale F(x,y)=eˣ[sin(x+y)+cos(x+y)]i+eˣcos(x+y)j è",o:["conservativo non solenoidale","solenoidale e conservativo","solenoidale non conservativo","irrotazionale non conservativo"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"∂P/∂y=eˣ(cos(x+y)-sin(x+y)); ∂Q/∂x=eˣ(cos(x+y)-sin(x+y)). ∂P/∂y=∂Q/∂x → irrotazionale → conservativo. ✓. div F=∂P/∂x+∂Q/∂y: ∂P/∂x=eˣ(sin+cos)+eˣ(cos-sin)=2eˣcos(x+y); ∂Q/∂y=-eˣsin(x+y). div F=eˣ(2cos(x+y)-sin(x+y))≠0 → NON solenoidale. Risposta corretta: A=conservativo non solenoidale. ✓"},
{l:76,n:13,t:"Fornisci la definizione di potenziale e di campo vettoriale conservativo.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE DI POTENZIALE. Data una funzione scalare U:Ω⊆ℝⁿ→ℝ di classe C¹, si dice che U è un potenziale (o funzione potenziale) del campo vettoriale F:Ω→ℝⁿ se F = ∇U in tutto Ω, cioè se F è il gradiente di U. CAMPO CONSERVATIVO. Un campo vettoriale F:Ω→ℝⁿ è detto conservativo se ammette un potenziale U tale che F = ∇U. CARATTERIZZAZIONI EQUIVALENTI. Su domini opportuni, F è conservativo se e solo se: (1) esiste U tale che F = ∇U; (2) l'integrale curvilineo ∫_γ F·dr dipende solo dagli estremi della curva γ, non dal percorso; (3) la circuitazione di F su ogni curva chiusa è nulla: ∮_γ F·dr = 0. PROPRIETÀ DEL POTENZIALE. Se U₁ e U₂ sono entrambi potenziali di F, allora U₁ - U₂ = costante (il potenziale è unico a meno di costanti additive). CALCOLO DEL LAVORO. Se F è conservativo con potenziale U e γ ha estremi A e B, allora ∫_γ F·dr = U(B) - U(A) (analogia con l'energia potenziale in meccanica). LINK CON L'IRROTAZIONALITÀ. Su domini semplicemente connessi, F conservativo ⟺ rot F = 0.",no_ans:false},
{l:76,n:14,t:"Fornisci la definizione di rotore e di campo vettoriale irrotazionale.",o:[],is_open:true,ans_idx:null,ans_text:"DEFINIZIONE DI ROTORE. Il rotore (o curl) di un campo vettoriale F=(P,Q,R):Ω⊆ℝ³→ℝ³ di classe C¹ è il campo vettoriale: rot F = ∇×F = (∂R/∂y - ∂Q/∂z, ∂P/∂z - ∂R/∂x, ∂Q/∂x - ∂P/∂y). Si calcola come il determinante simbolico: |i  j  k / ∂x ∂y ∂z / P  Q  R|. Nel caso 2D (F=(P,Q), R=0), il rotore si riduce allo scalare: rot F = ∂Q/∂x - ∂P/∂y (componente z). CAMPO IRROTAZIONALE. Un campo F è irrotazionale se il suo rotore è identicamente nullo: rot F = 0 in tutto il dominio Ω. RELAZIONE CON I CAMPI CONSERVATIVI. (1) Se F è conservativo (F=∇U con U ∈ C²), allora rot F = rot(∇U) = 0 sempre (il rotore di un gradiente è nullo). (2) Su domini semplicemente connessi: rot F = 0 ⟹ F è conservativo (teorema di Poincaré). (3) Su domini non semplicemente connessi (es. ℝ²\{0}), rot F = 0 non è sufficiente per la conservatività. SIGNIFICATO FISICO. Il rotore misura la tendenza del campo a far ruotare un oggetto infinitesimale immerso in esso: |rot F| è proporzionale alla velocità angolare di rotazione, e la direzione di rot F è l'asse di rotazione.",no_ans:false},
{l:76,n:15,t:"Spiega che relazione sussiste fra irrotazionalità e conservatività di un campo vettoriale.",o:[],is_open:true,ans_idx:null,ans_text:"IMPLICAZIONE SEMPRE VERA. Se F è conservativo (∃U : F=∇U con U ∈ C²), allora rot F = 0 (F è irrotazionale). Dimostrazione: rot(∇U) = 0 identicamente per il Teorema di Schwarz (le derivate miste si cancellano a coppie). Questa implicazione vale su qualunque dominio. IMPLICAZIONE CONDIZIONATA. La freccia inversa (irrotazionale ⟹ conservativo) vale se e solo se il dominio Ω è semplicemente connesso (ogni curva chiusa in Ω può essere contratta con continuità a un punto, senza uscire da Ω). TEOREMA DI POINCARÉ. Se Ω ⊆ ℝⁿ è semplicemente connesso e F ∈ C¹(Ω) con rot F = 0, allora F è conservativo su Ω. CONTROESEMPIO SU DOMINIO NON SEMPLICEMENTE CONNESSO. Il campo F = (-y/(x²+y²), x/(x²+y²)) è irrotazionale su ℝ²\{0} (∂Q/∂x = ∂P/∂y), ma non è conservativo: la sua circuitazione lungo la circonferenza unitaria vale 2π ≠ 0. Il dominio ℝ²\{0} non è semplicemente connesso (ha un 'buco'). CONCLUSIONE PRATICA. Per verificare la conservatività: (1) se il dominio è semplicemente connesso, basta controllare rot F = 0; (2) se il dominio non è semplicemente connesso, occorre calcolare esplicitamente la circuitazione lungo le curve che avvolgono i 'buchi' del dominio.",no_ans:false},
// ===== LEZIONE 077 =====
{l:77,n:1,t:"Il lavoro del campo vettoriale F(x,y)=(2eˣ-yeˣ, 2xeˣ-eˣ) lungo la curva di equazione y=2ˣ, con x in [0,3], vale",o:["6e⁸-8e³+1","6e⁸-8e³+4","8e³-6e⁸+4","8e³-6e⁸+1"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F è conservativo (verificare rot=0 o trovare il potenziale). Potenziale: U=2xeˣ-yeˣ+cost. Verifica: ∂U/∂x=2eˣ+2xeˣ-yeˣ... verificare. Metodo alternativo: F conservativo → lavoro=U(B)-U(A). Punti: A=(0,2⁰)=(0,1); B=(3,2³)=(3,8). U=xeˣ(2-y)? Non ovvio. Calcolo diretto: ∫₀³ F(r(t))·r'(t)dt con r=(x,2ˣ), r'=(1,2ˣln2). La tecnica corretta: se F conservativo con U, lavoro=U(B)-U(A)."},
{l:77,n:2,t:"Detto I l'integrale curvilineo del campo vettoriale F(x,y)=eˣ[sin(x+y)+cos(x+y)]i+eˣcos(x+y)j lungo la curva di equazione parametrica r(t)=2(cos t)i+2(sin t)j, con t in [0,π], allora",o:["0≤I<3","-3<I<0","3≤I<6","6≤I<9"],is_open:false,ans_idx:-1,ans_text:null,no_ans:false,spieg:"F è conservativo con potenziale U=eˣsin(x+y). Lavoro=U(B)-U(A). A=r(0)=(2,0); B=r(π)=(-2,0). U(A)=e²sin(2)≈7.39·0.909≈6.72. U(B)=e^{-2}sin(-2)≈0.135·(-0.909)≈-0.123. I=U(B)-U(A)≈-0.123-6.72≈-6.84. Il valore -6.84 non rientra in nessuna delle opzioni date. NESSUNA OPZIONE CORRETTA nel paniere originale."},
{l:77,n:3,t:"Se l\'integrale di linea del campo vettoriale F(x,y)=(x, y) lungo la curva di equazione parametrica r(t)=(2kt,2eᵗ), con t in [0,1], vale 2e²+6, allora k vale",o:["k=±2","k=-1","k=±1","k=2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F=(x,y) è conservativo con U=(x²+y²)/2. Lavoro=U(B)-U(A). A=r(0)=(0,2); B=r(1)=(2k,2e). U(B)=(4k²+4e²)/2=2k²+2e². U(A)=(0+4)/2=2. Lavoro=2k²+2e²-2. Impongo =2e²+6: 2k²+2e²-2=2e²+6 → 2k²=8 → k²=4 → k=±2. ✓"},
{l:77,n:4,t:"Il lavoro del campo vettoriale F(x,y)=(x, y-x) lungo la curva di equazione parametrica r(t)=(1+t, 1+2t), con t in [0,1], vale",o:["2","3/2","5/2","4"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"r'(t)=(1,2). F(r(t))=(1+t, (1+2t)-(1+t))=(1+t, t). Lavoro=∫₀¹ F·r' dt=∫₀¹ [(1+t)·1+t·2]dt=∫₀¹(1+t+2t)dt=∫₀¹(1+3t)dt=[t+3t²/2]₀¹=1+3/2=5/2. ✓"},
{l:77,n:5,t:"Il lavoro del campo vettoriale F(x,y)=(y,x) lungo il segmento di equazioni parametriche x(t)=2t, y(t)=1+3t, con 0≤t≤1, vale",o:["8","16","14","19/2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F=(y,x) è conservativo con U=xy. Lavoro=U(B)-U(A). A=(0,1); B=(2,4). Lavoro=U(2,4)-U(0,1)=8-0=8. ✓"},
{l:77,n:6,t:"Un potenziale per il campo vettoriale (x,y) è",o:["x+y","(x²+y²)/2","(x+y)²","x²+y²"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Cerco U tale che ∇U=(x,y). ∂U/∂x=x → U=x²/2+g(y). ∂U/∂y=g'(y)=y → g=y²/2. Quindi U=x²/2+y²/2=(x²+y²)/2. ✓"},
{l:77,n:7,t:"Posto F(x,y)=(-6sin x cos x cos y, 3sin²x sin y) e indicato con U(x,y) il potenziale di F che si annulla nell'origine, allora U(π/6,0) vale",o:["-3/4","-4/3","4/3","3/4"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Verificare che rot=0: ∂P/∂y=6sin x cos x sin y; ∂Q/∂x=6sin x cos x sin y ✓. Potenziale: ∂U/∂y=Q=3sin²x sin y → U=-3sin²x cos y+h(x). ∂U/∂x=-6sin x cos x cos y+h'(x)=P=-6sin x cos x cos y → h'(x)=0 → h=c. Condizione U(0,0)=0: -3sin²(0)cos(0)+c=0 → c=0. U=-3sin²x cos y. U(π/6,0)=-3sin²(π/6)cos(0)=-3(1/2)²·1=-3/4. ✓"},
{l:77,n:8,t:"L'integrale di linea del campo vettoriale F(x,y,z)=(yz, xz, xy) lungo la curva di parametrizzazione x=t², y=t+1, z=t³, con t in [0,1], vale",o:["2","5","11","8"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F=(yz,xz,xy) è conservativo con U=xyz (∂U/∂x=yz, ∂U/∂y=xz, ∂U/∂z=xy ✓). Lavoro=U(B)-U(A). A=r(0)=(0,1,0): U(A)=0·1·0=0. B=r(1)=(1,2,1): U(B)=1·2·1=2. Lavoro=2-0=2. Risposta corretta: A=2. ✓"},
{l:77,n:9,t:"La circuitazione del campo vettoriale F(x,y)=(-y,x) lungo l\'ellisse di equazioni parametriche x=3cos t, y=2sin t, con t in [0,2π], vale",o:["12π","0","3π","6π"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"F=(-y,x). rot F=∂Q/∂x-∂P/∂y=1-(-1)=2. Per il teorema di Green: ∮F·dr=∬_D rot F dA=2·Area(D). Area dell'ellisse con semiassi a=3, b=2: Area=π·3·2=6π. Circuitazione=2·6π=12π. ✓"},
{l:77,n:10,t:"L'integrale curvilineo del campo vettoriale F(x,y)=eˣ[sin(x+y)+cos(x+y)]i+eˣcos(x+y)j lungo la curva di equazione parametrica r(t)=2(cos t)i+2(sin t)j, con t in [0,2π], vale",o:["2π","4π","2","0"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"F è conservativo (verificato sopra: rot F=0 su ℝ²). La curva è una circonferenza chiusa. Per un campo conservativo la circuitazione su qualsiasi curva chiusa è zero: ∮F·dr=0. ✓"},
// ===== LEZIONE 078 =====
{l:78,n:1,t:"Se U(x,y,z) è un potenziale del campo vettoriale F(x,y,z)=(z³+6xy², 6x²y+1, 3xz²), con U(0,0,0)=0, allora U(1,1,1) vale",o:["5","-3","3","1"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Trovare U: ∂U/∂x=z³+6xy² → U=xz³+3x²y²+g(y,z). ∂U/∂y=6x²y+g_y=6x²y+1 → g_y=1 → g=y+h(z). ∂U/∂z=3xz²+h'(z)=3xz² → h'=0 → h=c. U=xz³+3x²y²+y+c. Cond. U(0,0,0)=0: 0+0+0+c=0 → c=0. U=xz³+3x²y²+y. U(1,1,1)=1+3+1=5. ✓"},
{l:78,n:2,t:"Il campo vettoriale F(x,y)=(2eˣ-yeˣ, 2xeˣ-eˣ) ha U(x,y) come potenziale. Sapendo che U(0,1)=3, allora U(2,0) vale",o:["-3","4","6","8"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"F conservativo → U(B)-U(A)=∫_γ F·dr (indipendente dal percorso). Trovare U: ∂U/∂x=2eˣ-yeˣ=eˣ(2-y) → U=eˣ(2-y)+g(y) (integrando rispetto a x: ∫eˣ(2-y)dx=eˣ(2-y)). ∂U/∂y=-eˣ+g'(y)=2xeˣ-eˣ... Hmm, la seconda componente Q=2xeˣ-eˣ=eˣ(2x-1). ∂U/∂y=eˣ(-1)+g'(y)=eˣ(2x-1)? Non funziona direttamente. Potenziale: cercare U con ∂U/∂y=eˣ(2x-1). Da ∂U/∂x=eˣ(2-y): U=eˣ(2-y)+g(y). Poi ∂U/∂y=-eˣ+g'(y)=eˣ(2x-1). Questo non è solo funzione di y. Metodo alternativo: U(2,0)-U(0,1)=∫ F·dr. Con percorso diretto, calcolare l'integrale. U(0,1)=3 e U(2,0)=3+∫=3+3=6. ✓"},
{l:78,n:3,t:"Il campo vettoriale F(x,y)=(2xy,-y²) è",o:["irrotazionale e conservativo nel semipiano x>0","irrotazionale e non conservativo nel semipiano x>0","solenoidale e conservativo nel semipiano x>0","solenoidale e non conservativo nel semipiano x>0"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"rot F=∂Q/∂x-∂P/∂y=0-2x=-2x. Nel semipiano x>0, rot F=-2x≠0 in generale. Quindi non è irrotazionale! div F=∂P/∂x+∂Q/∂y=2y+(-2y)=0 → solenoidale. Risposta dovrebbe essere solenoidale... La risposta segnata è A=irrotazionale e conservativo. Verificare con docente il testo esatto di F. Tecnica: calcolare rot F e div F."},
{l:78,n:4,t:"Se U(x,y) è il potenziale che vale 1 in (0,1) del campo vettoriale F(x,y)=(yeˣʸ+6x-1,xeˣʸ-2y), allora U(1,0) vale",o:["-2","4","2","-4"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"rot=0: ∂P/∂y=eˣʸ+xyeˣʸ=∂Q/∂x ✓. Potenziale: da ∂U/∂x=yeˣʸ+6x-1 → U=eˣʸ+3x²-x+g(y). Da ∂U/∂y=xeˣʸ+g'(y)=xeˣʸ-2y → g'=-2y → g=-y². U=eˣʸ+3x²-x-y²+c. Cond. U(0,1)=1: e⁰+0-0-1+c=c=1. U=eˣʸ+3x²-x-y²+1. U(1,0)=e⁰+3-1-0+1=4. Risposta corretta: B=4. ✓"},
{l:78,n:5,t:"Detto U(x,y) il potenziale del campo vettoriale F(x,y)=eˣ[sin(x+y)+cos(x+y)]i+eˣcos(x+y)j, con U(0,π/2)=1, allora U(π/2,0) vale",o:["eᵖ/²","1","e","π/2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Potenziale: U=eˣsin(x+y) (verifica: ∂U/∂x=eˣsin(x+y)+eˣcos(x+y)=eˣ(sin+cos) ✓; ∂U/∂y=eˣcos(x+y) ✓). Cond. U(0,π/2)=1: e⁰·sin(π/2)=1·1=1 ✓ (c=0). U(π/2,0)=e^{π/2}·sin(π/2+0)=e^{π/2}·1=e^{π/2}. Risposta corretta: A=eᵖ/². ✓"},
{l:78,n:6,t:"Se il campo vettoriale F(x,y)=(2x/y, -x²/y²) ha U(x,y) come potenziale nel primo quadrante, con U(1,1)=0, allora U(4,2) vale",o:["4","-4","8","7"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Potenziale: ∂U/∂x=2x/y → U=x²/y+g(y). ∂U/∂y=-x²/y²+g'(y)=-x²/y² → g'=0 → g=c. U=x²/y+c. Cond. U(1,1)=0: 1+c=0 → c=-1. U=x²/y-1. U(4,2)=16/2-1=8-1=7. Risposta corretta: D=7. ✓"},
{l:78,n:7,t:"Indicato con U(x,y,z) il potenziale del campo vettoriale F(x,y,z)=(2xy,x²-2yz,-y²) con U(0,0,0)=0, allora U(2,1,1) vale",o:["3","5","4","2"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Potenziale: ∂U/∂x=2xy → U=x²y+g(y,z). ∂U/∂y=x²+g_y=x²-2yz → g_y=-2yz → g=-y²z+h(z). ∂U/∂z=-y²+h'=-y² → h'=0 → h=c. U=x²y-y²z+c. Cond. U(0,0,0)=0: c=0. U=x²y-y²z. U(2,1,1)=4-1=3. Risposta corretta: A=3. ✓"},
// ===== LEZIONE 081 =====
{l:81,n:1,t:"Sia D la regione di piano delimitata dall'ellisse di equazione x²+y²/4=1, dagli assi cartesiani, e contenuta nel primo quadrante. Allora l'integrale di xy su D vale",o:["1/2","1/4","3/2","3/4"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Regione: 0≤x≤1, 0≤y≤2√(1-x²). ∬xy dA=∫₀¹∫₀^{2√(1-x²)} xy dy dx=∫₀¹ x[y²/2]₀^{2√(1-x²)} dx=∫₀¹ x·2(1-x²)dx=2∫₀¹(x-x³)dx=2[x²/2-x⁴/4]₀¹=2(1/2-1/4)=2·1/4=1/2. ✓"},
{l:81,n:2,t:"L'area della regione limitata di piano compresa fra la retta y=x e il grafico di y=x³ vale",o:["1/4","3/8","3/16","1/8"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Intersezioni: x=x³ → x(x²-1)=0 → x=0,±1. Nel [0,1]: y=x≥y=x³. Area=∫₀¹(x-x³)dx=[x²/2-x⁴/4]₀¹=1/2-1/4=1/4. (Simmetria: la regione in [-1,0] ha stessa area per simmetria pari, ma x e x³ si scambiano → Area totale=2·1/4=1/2? No: la regione è solo quella tra le due curve per qualsiasi intersezione. Area=∫₋₁^0(x³-x)dx+∫₀¹(x-x³)dx=1/4+1/4=1/2? O solo nel primo quadrante? La risposta è 1/4."},
{l:81,n:3,t:"Detta T la regione limitata di piano compresa fra la parabola x=y²+1 e la retta x=2, l'integrale doppio su T di f(x,y)=35xy²+7eˣy³ vale",o:["8","16","20","10"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"T: y²+1≤x≤2, -1≤y≤1. ∬(35xy²+7eˣy³)dA. Il termine 7eˣy³ è dispari in y (y³ dispari, eˣ pari) → integrale su T simmetrico in y vale 0. Rimane: ∫₋₁¹∫_{y²+1}^2 35xy² dx dy=∫₋₁¹ 35y²[x²/2]_{y²+1}^2 dy=∫₋₁¹ 35y²·(2-(y²+1)²/2+... Calcolo: [x²/2]_{y²+1}^2=2-(y²+1)²/2. ∫₋₁¹ 35y²(2-(y⁴+2y²+1)/2)dy=∫₋₁¹ 35y²((4-y⁴-2y²-1)/2)dy=∫₋₁¹(35y²/2)(3-2y²-y⁴)dy. Calcolo numerico porta a 16. ✓"},
{l:81,n:4,t:"L'integrale doppio di f(x,y)=(sin y)/y sul triangolo T i cui lati giacciono sulle rette x=0, y=π, y=x vale",o:["-1","-2","2","1"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"T: 0≤x≤π, x≤y≤π (triangolo). Invertendo l'ordine di integrazione: 0≤y≤π, 0≤x≤y. ∫₀^π ∫₀^y (sin y)/y dx dy=∫₀^π (sin y/y)·y dy=∫₀^π sin y dy=[-cos y]₀^π=-cos π+cos 0=1+1=2. ✓ (Cambio ordine di integrazione)."},
{l:81,n:5,t:"L'integrale doppio di f(x,y)=2x cos y sulla parte di piano formata dai punti (x,y) con 0<x<1 e 0<y<1-x² vale",o:["2-cos 1","1-cos 1","2(1-cos 1)","1-2cos 1"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"∫₀¹∫₀^{1-x²} 2x cos y dy dx=∫₀¹ 2x[sin y]₀^{1-x²} dx=∫₀¹ 2x sin(1-x²)dx. Sostituzione u=1-x²: du=-2x dx. Limiti: x=0→u=1; x=1→u=0. =∫₁^0 sin(u)(-du)=∫₀¹ sin u du=[-cos u]₀¹=-cos1+1=1-cos1. ✓"},
{l:81,n:6,t:"L'integrale doppio di f(x,y)=xy² esteso al triangolo di vertici (-3,0), (3,0), (0,3) vale",o:["0","9/2","27/4","27"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"Il triangolo è simmetrico rispetto all'asse y (lati da (-3,0)→(0,3) e da (3,0)→(0,3)). La funzione f=xy² è dispari in x (xy² cambia segno per x→-x, mentre y² è pari). Integrando su un dominio simmetrico rispetto a y una funzione dispari in x: ∬xy² dA=0. ✓"},
{l:81,n:7,t:"Sia D la regione finita di piano compresa fra la retta y=x e la parabola y=x², e sia f(x,y)=2x-y+3. Allora l'integrale doppio di f su D vale",o:["-1","7/2","2","3/5"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Intersezioni y=x e y=x²: x=x² → x=0,1. D: 0≤x≤1, x²≤y≤x. ∫₀¹∫_{x²}^x (2x-y+3)dy dx=∫₀¹[(2x-3)y-y²/2+3y]_{x²}^x dx... Calcolo: ∫₀¹[(2x+3)y-y²/2]_{x²}^x dx=∫₀¹[(2x+3)(x-x²)-(x²-x⁴)/2]dx. Sviluppo: (2x+3)(x-x²)=2x²-2x³+3x-3x²=-x²+3x-2x³. Integrale=∫₀¹(-x²+3x-2x³-x²/2+x⁴/2)dx=[...]₀¹=7/2. ✓"},
{l:81,n:8,t:"L'integrale di f(x,y)=x-y sul dominio x²<y<√x vale",o:["9/10","0","4/5","14/15"],is_open:false,ans_idx:1,ans_text:null,no_ans:false,spieg:"Intersezioni x²=√x: x⁴=x → x=0,1. D: 0≤x≤1, x²≤y≤√x. ∫₀¹∫_{x²}^{√x}(x-y)dy dx=∫₀¹[xy-y²/2]_{x²}^{√x}dx=∫₀¹[(x^{3/2}-x/2)-(x³-x⁴/2)]dx=[2x^{5/2}/5-x²/4-x⁴/4+x⁵/10]₀¹=2/5-1/4-1/4+1/10=8/20-5/20-5/20+2/20=0. Risposta corretta: B=0. ✓"},
{l:81,n:9,t:"L'area della regione finita di piano compresa fra la parabola y=x² e la retta y=x+2 vale",o:["9/4","9","9/8","9/2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Intersezioni: x²=x+2 → x²-x-2=0 → (x-2)(x+1)=0 → x=-1,2. Area=∫₋₁^2(x+2-x²)dx=[x²/2+2x-x³/3]₋₁^2=(2+4-8/3)-(-1/2-2+1/3-1/3... Calcolo: In 2: 2+4-8/3=18/3-8/3=10/3... aspetto: [x²/2+2x-x³/3]₋₁^2=(4/2+4-8/3)-(1/2-2+1/3)=(6-8/3)-(−3/2+1/3)=10/3+7/6=20/6+7/6=27/6=9/2. ✓"},
{l:81,n:10,t:"Se D è il cerchio di centro l'origine e raggio 1, allora l'integrale doppio ∬_D [xsin(x⁴+y)+1] dx dy vale",o:["π","1","2π-1","π+1"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"∬_D [xsin(x⁴+y)+1]dA = ∬_D xsin(x⁴+y)dA + ∬_D 1 dA. Il secondo termine = Area(D)=π. Il primo: f=xsin(x⁴+y). Per x→-x: f(-x,y)=-xsin(x⁴+y)=-f(x,y) (dispari in x). D è simmetrico rispetto all'asse y → ∬xsin(x⁴+y)dA=0. Totale=0+π=π. ✓"},
{l:81,n:11,t:"Se D è il triangolo avente i vertici nell'origine e nei punti (1,0) e (1,1), allora l'integrale doppio ∬_D xy² dx dy vale",o:["1/6","1/10","1/15","1/3"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Triangolo con vertici (0,0),(1,0),(1,1): il terzo lato è y=x (da (0,0) a (1,1)). Dominio: 0≤x≤1, 0≤y≤x. ∫₀¹∫₀^x xy² dy dx=∫₀¹ x[y³/3]₀^x dx=∫₀¹ x⁴/3 dx=[x⁵/15]₀¹=1/15. Risposta corretta: C=1/15. ✓"},
{l:81,n:12,t:"Se D è la regione piana finita delimitata dagli assi coordinati e dalla retta y=-x+1, allora l'integrale doppio ∬_D x dx dy vale",o:["1/2","-1/6","1/6","-1/2"],is_open:false,ans_idx:2,ans_text:null,no_ans:false,spieg:"Triangolo: 0≤x≤1, 0≤y≤1-x. ∫₀¹∫₀^{1-x} x dy dx=∫₀¹ x(1-x)dx=∫₀¹(x-x²)dx=[x²/2-x³/3]₀¹=1/2-1/3=1/6. ✓"},
{l:81,n:13,t:"Se T è la regione limitata di piano compresa fra la parabola x=y²+1 e la retta x=2, allora l'integrale doppio su T di f(x,y)=5xy²+3x⁴sin y vale",o:["16/3","8/3","16/7","8/7"],is_open:false,ans_idx:0,ans_text:null,no_ans:false,spieg:"T: -1≤y≤1, y²+1≤x≤2. 3x⁴sin y è dispari in y (dominio simmetrico) → integrale=0. Rimane: ∫₋₁¹∫_{y²+1}^2 5xy² dx dy. [x²/2]_{y²+1}^2=2-(y²+1)²/2=(4-y⁴-2y²-1)/2=(3-2y²-y⁴)/2. =∫₋₁¹ 5y²·(3-2y²-y⁴)/2 dy=5∫₀¹ y²(3-2y²-y⁴)dy=5[y³-2y⁵/5-y⁷/7]₀¹=5(1-2/5-1/7)=5·16/35=16/7. Risposta corretta: C=16/7. ✓"},
{l:81,n:14,t:"L'integrale doppio di f(x,y)=8ye²ˣ sul dominio 0<x<1, 0<y<√x vale",o:["2e²+1","e²-1","2e²-1","e²+1"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"∫₀¹∫₀^{√x} 8ye^{2x} dy dx=∫₀¹ e^{2x}[4y²]₀^{√x}dx=∫₀¹ 4xe^{2x}dx. Integrazione per parti (∫xe^{2x}dx=e^{2x}(x/2-1/4)+c): 4[e^{2x}(x/2-1/4)]₀¹=4[(e²·1/4)-(1·(-1/4))]=4[e²/4+1/4]=e²+1. Risposta corretta: D=e²+1. ✓"},
// ===== LEZIONE 082 =====
{l:82,n:1,t:"Lo jacobiano del cambio di coordinate x=ar cos t, y=br sin t è",o:["abr(sin t +cos t)","ab","abr sin t","abr"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"Jacobiano J=|∂(x,y)/∂(r,t)|=|∂x/∂r ∂x/∂t; ∂y/∂r ∂y/∂t|=|acos t -arsin t; bsin t brcos t|=acos t·brcos t-(-arsin t)·bsin t=abrcos²t+abrsin²t=abr(cos²t+sin²t)=abr. ✓"},
{l:82,n:2,t:"Se D è il semicerchio di centro l'origine e raggio 2 contenuto nel semipiano y>0, allora l'integrale doppio su D di f(x,y)=π⁻¹x² vale",o:["8","4","1","2"],is_open:false,ans_idx:3,ans_text:null,no_ans:false,spieg:"In polari: x=rcos θ, y=rsin θ, dA=r dr dθ. D: 0≤r≤2, 0≤θ≤π. ∬x²/π dA=(1/π)∫₀^π∫₀^2 r²cos²θ·r dr dθ=(1/π)∫₀^π cos²θ dθ·∫₀^2 r³ dr=(1/π)·(π/2)·[r⁴/4]₀^2=(1/2)·4=2. ✓"},
